AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Publication-only infrastructure for the JUNCA Social Ecosystem Chain
  technical reference. Creates no validator, mainnet, bridge, KMS/HSM,
  token, NFT, or asset-movement resources.

Parameters:
  DomainName:
    Type: String
    Default: docs.jaios-governance.org
    AllowedValues: [docs.jaios-governance.org]
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Read back the exact jaios-governance.org public hosted zone before deployment.
  Repository:
    Type: String
    Default: JAIOS-Governance/junca-social-ecosystem-chain
    AllowedPattern: "^JAIOS-Governance/junca-social-ecosystem-chain$"
  RepositoryOwnerId:
    Type: String
    Default: "308604370"
    AllowedPattern: "^308604370$"
    Description: Immutable GitHub organization ID read back from the production OIDC token.
  RepositoryId:
    Type: String
    Default: "1310568313"
    AllowedPattern: "^1310568313$"
    Description: Immutable GitHub repository ID read back from the production OIDC token.
  EnvironmentName:
    Type: String
    Default: junca-chain-docs-production
    AllowedValues: [junca-chain-docs-production]
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com OIDC provider ARN, if already present.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1b511abead59c6ce207077c0bf0e0043b1382612
      Tags:
        - Key: Purpose
          Value: junca-chain-docs-publication

  DocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub junca-chain-docs-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Chain
          Value: JUNCA Social Ecosystem Chain
        - Key: Governance
          Value: JAIOS Institutional Governance
        - Key: Network
          Value: !Join [" ", ["Public", "Testnet", "/", "No", "Monetary", "Value"]]
        - Key: Purpose
          Value: technical-reference-publication

  DocsCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Purpose
          Value: junca-chain-docs-publication

  DocsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3-oac
        Description: Private S3 access for the official technical reference.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ExtensionlessRouteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub junca-chain-docs-routes-${AWS::AccountId}
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve extensionless reference routes to directory index documents.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  DocsSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub junca-chain-docs-security-${AWS::AccountId}
        Comment: Security and publication headers for the official technical reference.
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection: {Protection: true, ModeBlock: true, Override: true}
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=()"
              Override: true
            - Header: X-Publication-Boundary
              Value: !Join [" ", ["Public", "Testnet", "/", "No", "Monetary", "Value"]]
              Override: true

  DocsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: [!Ref DomainName]
        Comment: JUNCA Social Ecosystem Chain official technical reference
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: private-docs-bucket
            DomainName: !GetAtt DocsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DocsOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: public-explorer-json
            DomainName: explorer.jaios-governance.org
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: private-docs-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ExtensionlessRouteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: explorer.json
            TargetOriginId: public-explorer-json
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 413f9f24-6f2d-4f42-9ded-2f3a5bc8cc50
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref DocsCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Chain
          Value: JUNCA Social Ecosystem Chain
        - Key: Governance
          Value: JAIOS Institutional Governance
        - Key: Network
          Value: !Join [" ", ["Public", "Testnet", "/", "No", "Monetary", "Value"]]
        - Key: Purpose
          Value: technical-reference-publication

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${DocsBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DocsDistribution}

  DocsAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DocsDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  DocsAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt DocsDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  GitHubDocsDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: JuncaChainDocsProductionDeployment
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:JAIOS-Governance@${RepositoryOwnerId}/junca-social-ecosystem-chain@${RepositoryId}:environment:${EnvironmentName}
      Policies:
        - PolicyName: PublishExactTechnicalReferenceArtifact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BucketReadback
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketVersioning, s3:ListBucket]
                Resource: !GetAtt DocsBucket.Arn
              - Sid: ExactArtifactPublication
                Effect: Allow
                Action: [s3:DeleteObject, s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub ${DocsBucket.Arn}/*
              - Sid: CloudFrontPublicationReadback
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetDistribution, cloudfront:GetInvalidation]
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DocsDistribution}
              - Sid: PublicationResourceDiscovery
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - cloudfront:ListDistributions
                  - iam:ListAccountAliases
                  - organizations:DescribeOrganization
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: "*"
              - Sid: SitesCustomDomainsDnsWrite
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - member.jaios-governance.org
                      - _openai-site-verification.member.jaios-governance.org
                      - _cf-custom-hostname.member.jaios-governance.org
                      - chain.jaios-governance.org
                      - _openai-site-verification.chain.jaios-governance.org
                      - _cf-custom-hostname.chain.jaios-governance.org
                    route53:ChangeResourceRecordSetsRecordTypes:
                      - CNAME
                      - TXT
                    route53:ChangeResourceRecordSetsActions:
                      - UPSERT
              - Sid: Route53ChangeReadback
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub arn:${AWS::Partition}:route53:::change/*
      Tags:
        - Key: Repository
          Value: !Ref Repository
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: junca-chain-docs-publication

Outputs:
  GitHubOidcProviderArn:
    Value: !If [CreateGitHubOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
  DeploymentRoleArn:
    Value: !GetAtt GitHubDocsDeploymentRole.Arn
  HostedZoneId:
    Value: !Ref HostedZoneId
  CertificateArn:
    Value: !Ref DocsCertificate
  BucketName:
    Value: !Ref DocsBucket
  DistributionId:
    Value: !Ref DocsDistribution
  DistributionDomainName:
    Value: !GetAtt DocsDistribution.DomainName
  PublicUrl:
    Value: !Sub https://${DomainName}
