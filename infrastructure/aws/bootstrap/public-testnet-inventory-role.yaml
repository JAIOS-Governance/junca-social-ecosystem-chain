AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  IAM-only recovery bootstrap for JUNCA Social Ecosystem Chain Public Testnet.
  Creates one read-only GitHub OIDC inventory role and no billable runtime,
  state, validator, RPC, explorer, mainnet, bridge, or asset resources.

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com
    AllowedPattern: "^arn:aws:iam::595710543956:oidc-provider/token\\.actions\\.githubusercontent\\.com$"
  RepositoryOwnerId:
    Type: String
    Default: "308604370"
    AllowedPattern: "^308604370$"
  RepositoryId:
    Type: String
    Default: "1310568313"
    AllowedPattern: "^1310568313$"
  EnvironmentName:
    Type: String
    Default: public-testnet
    AllowedValues:
      - public-testnet

Resources:
  PublicTestnetInventoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: JuncaChainPublicTestnetDeployment
      Description: Read-only canonical inventory role; infrastructure apply is not permitted.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubActionsPublicTestnetOIDC
            Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:JAIOS-Governance@${RepositoryOwnerId}/junca-social-ecosystem-chain@${RepositoryId}:environment:${EnvironmentName}
      Policies:
        - PolicyName: JuncaChainCanonicalInventoryReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CanonicalInventoryReadOnly
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeImages
                  - route53:ListHostedZonesByName
                  - kms:ListAliases
                  - ecr:DescribeRepositories
                  - s3:ListAllMyBuckets
                  - dynamodb:ListTables
                Resource: "*"
      Tags:
        - Key: Chain
          Value: JUNCA Social Ecosystem Chain
        - Key: Governance
          Value: JAIOS Institutional Governance
        - Key: Network
          Value: Public Testnet / No Monetary Value
        - Key: Purpose
          Value: Canonical Inventory Read Only
        - Key: MainnetChanged
          Value: "false"
        - Key: AssetsMoved
          Value: "false"
        - Key: BridgeActivated
          Value: "false"

Outputs:
  InventoryRoleArn:
    Value: !GetAtt PublicTestnetInventoryRole.Arn
  ExpectedSubject:
    Value: !Sub repo:JAIOS-Governance@${RepositoryOwnerId}/junca-social-ecosystem-chain@${RepositoryId}:environment:${EnvironmentName}
  DeploymentPerformed:
    Value: "false"
