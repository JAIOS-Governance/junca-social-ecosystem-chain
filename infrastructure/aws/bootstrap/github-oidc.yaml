AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time GitHub OIDC bootstrap for JUNCA Social Ecosystem Chain Public
  Testnet. Creates no validator, RPC, explorer, bridge, mainnet, or asset
  resources.

Parameters:
  Repository:
    Type: String
    Default: JAIOS-Governance/junca-social-ecosystem-chain
    AllowedPattern: "^JAIOS-Governance/junca-social-ecosystem-chain$"
  EnvironmentName:
    Type: String
    Default: public-testnet
    AllowedValues:
      - public-testnet

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1b511abead59c6ce207077c0bf0e0043b1382612
      Tags:
        - Key: Chain
          Value: JUNCA Social Ecosystem Chain
        - Key: Governance
          Value: JAIOS Institutional Governance
        - Key: Network
          Value: Public Testnet / No Monetary Value

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub junca-chain-tfstate-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Chain
          Value: JUNCA Social Ecosystem Chain
        - Key: Network
          Value: Public Testnet / No Monetary Value

  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: junca-chain-terraform-locks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Chain
          Value: JUNCA Social Ecosystem Chain
        - Key: Network
          Value: Public Testnet / No Monetary Value

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: JuncaChainPublicTestnetDeployment
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:${EnvironmentName}
      Policies:
        - PolicyName: JuncaChainPublicTestnetTerraform
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCanonicalIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - ec2:Describe*
                  - elasticloadbalancing:Describe*
                  - ecs:Describe*
                  - ecs:List*
                  - iam:Get*
                  - iam:List*
                  - route53:Get*
                  - route53:List*
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - wafv2:Get*
                  - wafv2:List*
                  - cloudwatch:Describe*
                  - cloudwatch:Get*
                  - cloudwatch:List*
                  - logs:Describe*
                  - backup:Get*
                  - backup:List*
                  - kms:DescribeKey
                  - kms:GetPublicKey
                Resource: "*"
              - Sid: ManagePublicTestnetInfrastructure
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:CreateSnapshot
                  - ec2:DeleteSnapshot
                  - elasticloadbalancing:Create*
                  - elasticloadbalancing:Delete*
                  - elasticloadbalancing:Modify*
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - ecs:Create*
                  - ecs:Delete*
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:UpdateService
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - route53:ChangeResourceRecordSets
                  - acm:RequestCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                  - wafv2:Create*
                  - wafv2:Delete*
                  - wafv2:Update*
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - backup:CreateBackupPlan
                  - backup:DeleteBackupPlan
                  - backup:CreateBackupSelection
                  - backup:DeleteBackupSelection
                  - backup:CreateBackupVault
                  - backup:DeleteBackupVault
                Resource: "*"
              - Sid: TerraformState
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt TerraformStateBucket.Arn
                  - !Sub ${TerraformStateBucket.Arn}/*
                  - !GetAtt TerraformLockTable.Arn
      Tags:
        - Key: Chain
          Value: JUNCA Social Ecosystem Chain
        - Key: Governance
          Value: JAIOS Institutional Governance
        - Key: Network
          Value: Public Testnet / No Monetary Value
        - Key: Mainnet
          Value: "false"
        - Key: AssetsMoved
          Value: "false"
        - Key: Bridge
          Value: paused

Outputs:
  AccountId:
    Value: !Ref AWS::AccountId
  Region:
    Value: !Ref AWS::Region
  DeploymentRoleArn:
    Value: !GetAtt DeploymentRole.Arn
  TerraformStateBucket:
    Value: !Ref TerraformStateBucket
  TerraformLockTable:
    Value: !Ref TerraformLockTable
