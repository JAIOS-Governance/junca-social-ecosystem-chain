openapi: 3.1.0
info:
  title: JAIOS JUNCA Chain Read-Only Action Gateway
  version: 1.0.0
  description: >-
    Read-only gateway for the canonical JUNCA Social Ecosystem Chain public
    explorer and GitHub Actions evidence. No workflow dispatch, rerun, merge,
    deployment, asset movement, bridge activation, or Mainnet mutation is exposed.
servers:
  - url: https://replace-me.example.invalid
security:
  - JAIOSActionKey: []
paths:
  /v1/health:
    get:
      operationId: getGatewayHealth
      summary: Verify the read-only action gateway and fixed safety boundaries.
      responses:
        "200":
          description: Gateway health and safety boundaries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/explorer/status:
    get:
      operationId: getPublicExplorerStatus
      summary: Read the current public explorer JSON through the governed gateway.
      responses:
        "200":
          description: Explorer data with retrieval timestamp and SHA-256 evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelope"
  /v1/github/workflow-runs:
    get:
      operationId: listChainWorkflowRuns
      summary: List recent GitHub Actions runs for the canonical chain repository.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - completed
              - action_required
              - cancelled
              - failure
              - neutral
              - skipped
              - stale
              - success
              - timed_out
              - in_progress
              - queued
              - requested
              - waiting
              - pending
        - name: branch
          in: query
          required: false
          schema:
            type: string
        - name: event
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
      responses:
        "200":
          description: GitHub workflow runs and evidence metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelope"
  /v1/github/workflow-runs/{run_id}/jobs:
    get:
      operationId: listChainWorkflowRunJobs
      summary: List jobs and step conclusions for one workflow run.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Workflow jobs and evidence metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelope"
  /v1/github/jobs/{job_id}/logs:
    get:
      operationId: getChainWorkflowJobLog
      summary: Read a bounded tail of one GitHub Actions job log for failure analysis.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: tail_lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 400
      responses:
        "200":
          description: Bounded log tail, full-log SHA-256, and truncation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelope"
  /v1/github/commits/{sha}/status:
    get:
      operationId: getChainCommitStatus
      summary: Read combined CI status for an exact 40-character commit SHA.
      parameters:
        - name: sha
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{40}$"
      responses:
        "200":
          description: Combined commit status and evidence metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelope"
components:
  securitySchemes:
    JAIOSActionKey:
      type: apiKey
      in: header
      name: X-JAIOS-Action-Key
  schemas:
    EvidenceEnvelope:
      type: object
      required:
        - schema_version
        - source
        - source_url
        - retrieved_at
        - request_digest
        - payload_sha256
        - data
      properties:
        schema_version:
          type: string
        source:
          type: string
        source_url:
          type: string
          format: uri
        retrieved_at:
          type: string
          format: date-time
        request_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        payload_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        data:
          description: Upstream data or normalized bounded log evidence.
      additionalProperties: false
