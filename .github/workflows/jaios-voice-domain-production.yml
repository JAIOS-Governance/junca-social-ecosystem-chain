name: JAIOS Voice Custom Domain Production

on:
  workflow_dispatch:
    inputs:
      cname_target:
        description: Sites-issued CNAME target
        required: true
        default: custom-domains.chatgpt.site.
        type: string
      openai_verification_value:
        description: Complete Sites-issued openai-site-verification TXT value
        required: true
        type: string
      cloudflare_validation_value:
        description: Complete Sites-issued _cf-custom-hostname TXT value
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jaios-voice-custom-domain-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      BOOTSTRAP_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      DOMAIN: voice.jaios-governance.org
      CNAME_TARGET: ${{ inputs.cname_target }}
      OPENAI_VERIFICATION_VALUE: ${{ inputs.openai_verification_value }}
      CLOUDFLARE_VALIDATION_VALUE: ${{ inputs.cloudflare_validation_value }}
    steps:
      - name: Configure canonical AWS production identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-voice-domain-${{ github.run_id }}
          disable-retry: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"VoiceDnsWriteOnly","Effect":"Allow","Action":"route53:ChangeResourceRecordSets","Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G","Condition":{"ForAllValues:StringEquals":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":["voice.jaios-governance.org","_openai-site-verification.voice.jaios-governance.org","_cf-custom-hostname.voice.jaios-governance.org"],"route53:ChangeResourceRecordSetsRecordTypes":["CNAME","TXT"],"route53:ChangeResourceRecordSetsActions":["UPSERT"]},"Null":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":"false","route53:ChangeResourceRecordSetsRecordTypes":"false","route53:ChangeResourceRecordSetsActions":"false"}}},{"Sid":"VoiceDnsZoneReadback","Effect":"Allow","Action":["route53:GetHostedZone","route53:ListResourceRecordSets"],"Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G"},{"Sid":"VoiceDnsChangeReadback","Effect":"Allow","Action":"route53:GetChange","Resource":"arn:aws:route53:::change/*"}]}

      - name: Verify exact production boundary inputs and baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$OPENAI_VERIFICATION_VALUE"
          echo "::add-mask::$CLOUDFLARE_VALIDATION_VALUE"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          test "$CNAME_TARGET" = "custom-domains.chatgpt.site."
          [[ "$OPENAI_VERIFICATION_VALUE" =~ ^openai-site-verification=[A-Za-z0-9_-]{43}$ ]]
          [[ "$CLOUDFLARE_VALIDATION_VALUE" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='docs.jaios-governance.org.' || Name=='chain.jaios-governance.org.' || Name=='member.jaios-governance.org.']" \
            --output json >/tmp/preserved-before.json
          python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/preserved-before.json', encoding='utf-8'))
          names = {row['Name'] for row in rows}
          expected = {'docs.jaios-governance.org.', 'chain.jaios-governance.org.', 'member.jaios-governance.org.'}
          assert names == expected, (names, expected)
          PY

      - name: Apply exact Sites-issued Voice records
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg cname "$CNAME_TARGET" \
            --arg openai "$OPENAI_VERIFICATION_VALUE" \
            --arg cf "$CLOUDFLARE_VALIDATION_VALUE" \
            '{Comment:"Bind JAIOS Voice to its existing Sites project",Changes:[
              {Action:"UPSERT",ResourceRecordSet:{Name:"voice.jaios-governance.org.",Type:"CNAME",TTL:300,ResourceRecords:[{Value:$cname}]}},
              {Action:"UPSERT",ResourceRecordSet:{Name:"_openai-site-verification.voice.jaios-governance.org.",Type:"TXT",TTL:300,ResourceRecords:[{Value:("\"" + $openai + "\"")}]}},
              {Action:"UPSERT",ResourceRecordSet:{Name:"_cf-custom-hostname.voice.jaios-governance.org.",Type:"TXT",TTL:300,ResourceRecords:[{Value:("\"" + $cf + "\"")}]}}
            ]}' >/tmp/change.json
          change_id="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch file:///tmp/change.json \
            --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >>"$GITHUB_OUTPUT"

      - name: Exact Route 53 readback and preservation QA
        shell: bash
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='voice.jaios-governance.org.' || Name=='_openai-site-verification.voice.jaios-governance.org.' || Name=='_cf-custom-hostname.voice.jaios-governance.org.']" \
            --output json)"
          RECORDS="$records" python3 - <<'PY'
          import json, os
          rows = {row['Name']: row for row in json.loads(os.environ['RECORDS'])}
          assert set(rows) == {
              'voice.jaios-governance.org.',
              '_openai-site-verification.voice.jaios-governance.org.',
              '_cf-custom-hostname.voice.jaios-governance.org.',
          }
          assert rows['voice.jaios-governance.org.']['Type'] == 'CNAME'
          assert rows['voice.jaios-governance.org.']['ResourceRecords'] == [{'Value': os.environ['CNAME_TARGET']}]
          openai = rows['_openai-site-verification.voice.jaios-governance.org.']
          cloudflare = rows['_cf-custom-hostname.voice.jaios-governance.org.']
          assert openai['Type'] == 'TXT' and cloudflare['Type'] == 'TXT'
          assert openai['ResourceRecords'] == [{'Value': '"' + os.environ['OPENAI_VERIFICATION_VALUE'] + '"'}]
          assert cloudflare['ResourceRecords'] == [{'Value': '"' + os.environ['CLOUDFLARE_VALIDATION_VALUE'] + '"'}]
          PY
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='docs.jaios-governance.org.' || Name=='chain.jaios-governance.org.' || Name=='member.jaios-governance.org.']" \
            --output json >/tmp/preserved-after.json
          python3 - <<'PY'
          import json
          def canonical(path):
              with open(path, encoding='utf-8') as handle:
                  return sorted(json.load(handle), key=lambda row: (row['Name'], row['Type']))
          before = canonical('/tmp/preserved-before.json')
          after = canonical('/tmp/preserved-after.json')
          assert before == after, {'before': before, 'after': after}
          PY

      - name: DNS TLS and JAIOS Voice acceptance
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            cname="$(dig +short "$DOMAIN" CNAME | tail -1)"
            if [ "$cname" = "$CNAME_TARGET" ]; then break; fi
            sleep 10
          done
          test "$(dig +short "$DOMAIN" CNAME | tail -1)" = "$CNAME_TARGET"
          status="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' \
            --max-redirs 10 --connect-timeout 20 --max-time 60 "https://$DOMAIN/")"
          case "$status" in 2*) ;; *) echo "Unexpected final HTTP status: $status"; exit 1;; esac
          openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" </dev/null 2>/dev/null |
            openssl x509 -noout -subject -issuer -dates -ext subjectAltName >/tmp/certificate.txt
          grep -Fq "DNS:$DOMAIN" /tmp/certificate.txt
          grep -Eqi 'JAIOS VOICE|JAIOS Voice' /tmp/home.html
          {
            echo "### JAIOS Voice Custom Domain Production"
            echo "- URL: https://$DOMAIN/"
            echo "- Route 53 Change: ${{ steps.dns.outputs.change_id }}"
            echo "- Route 53 Status: INSYNC"
            echo "- HTTP Status: $status"
            echo "- TLS SAN: PASS"
            echo "- JAIOS Voice identity: PASS"
            echo "- Existing docs / chain / member records preserved exactly: true"
          } >>"$GITHUB_STEP_SUMMARY"
