name: JUNCA Emergency Finality Restore

on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-finality-restore.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-finality-restore-${{ github.run_id }}
      - name: Restore validator 01 configuration permissions
        run: |
          set -euo pipefail
          cat > /tmp/permissions.json <<'JSON'
          {"commands":["set -euo pipefail","chown root:junca /etc/junca /etc/junca/genesis.json /etc/junca/runtime.env; chmod 0750 /etc/junca; chmod 0640 /etc/junca/genesis.json /etc/junca/runtime.env","systemctl restart junca-validator.service","for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8545/health && exit 0; sleep 2; done; systemctl status junca-validator.service --no-pager -l; exit 1"]}
          JSON
          command_id="$(aws ssm send-command --instance-ids i-015288fae43f2b40f --document-name AWS-RunShellScript --parameters file:///tmp/permissions.json --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id i-015288fae43f2b40f
          result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-015288fae43f2b40f)"
          jq -r '.StandardOutputContent,.StandardErrorContent' <<<"$result"
          jq -e '.Status=="Success"' <<<"$result"
      - name: Re-establish 3 of 3 finality and public gateways
        run: |
          set -euo pipefail
          instances=(i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b)
          now="$(date +%s)"; epoch="$(( ((now + 120 + 29) / 30) * 30 ))"
          jq -n --arg epoch "$epoch" '{commands:["set -euo pipefail","sed -i -E s/^AUTOMATIC_FINALITY_ENABLED=.*/AUTOMATIC_FINALITY_ENABLED=true/ /etc/junca/runtime.env; sed -i -E s/^TESTNET_BLOCK_INTERVAL_SECONDS=.*/TESTNET_BLOCK_INTERVAL_SECONDS=30/ /etc/junca/runtime.env; sed -i -E s/^TESTNET_SLOT_EPOCH_SECONDS=.*/TESTNET_SLOT_EPOCH_SECONDS=" + $epoch + "/ /etc/junca/runtime.env","systemctl restart junca-validator.service","for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health >/dev/null && exit 0; sleep 2; done; exit 1"]}' > /tmp/finality.json
          command_id="$(aws ssm send-command --instance-ids "${instances[@]}" --document-name AWS-RunShellScript --parameters file:///tmp/finality.json --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance"; done
          sleep 150
          jq -n '{commands:["systemctl restart junca-public-rpc.service junca-public-explorer.service"]}' > /tmp/gateway.json
          restart_id="$(aws ssm send-command --instance-ids "${instances[@]}" --document-name AWS-RunShellScript --parameters file:///tmp/gateway.json --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do aws ssm wait command-executed --command-id "$restart_id" --instance-id "$instance" || true; done
          for attempt in $(seq 1 60); do
            e="$(curl -sS -o /tmp/e -w '%{http_code}' https://explorer.jaios-governance.org/ || true)"
            h="$(curl -sS -o /tmp/h -w '%{http_code}' https://health.jaios-governance.org/health || true)"
            r="$(curl -sS -o /tmp/r -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ || true)"
            if [[ "$e" == 200 && "$h" == 200 && "$r" == 200 ]]; then
              jq -e '.status=="healthy" and .consensus.last_certificate.signed_power==3 and .mainnet_changed==false and .assets_moved==false and .bridge_activated==false' /tmp/h
              jq -e '.result=="0x1352f63"' /tmp/r
              exit 0
            fi
            test "$attempt" -lt 60; sleep 5
          done
