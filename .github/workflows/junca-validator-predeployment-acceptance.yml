name: JUNCA Validator Predeployment Acceptance

on:
  pull_request:
    paths:
      - "jaios/social_ecosystem_chain/predeployment_acceptance.py"
      - "scripts/junca_validator_predeployment_acceptance.py"
      - "config/junca_validator_predeployment_inputs.pending.json"
      - "tests/test_junca_validator_predeployment_acceptance.py"
      - ".github/workflows/junca-validator-predeployment-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "jaios/social_ecosystem_chain/predeployment_acceptance.py"
      - "scripts/junca_validator_predeployment_acceptance.py"
      - "config/junca_validator_predeployment_inputs.pending.json"
      - "tests/test_junca_validator_predeployment_acceptance.py"
      - ".github/workflows/junca-validator-predeployment-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-predeployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify acceptance, negative, identity, and safety contracts
        run: |
          python -m py_compile \
            jaios/social_ecosystem_chain/predeployment_acceptance.py \
            scripts/junca_validator_predeployment_acceptance.py
          python -m unittest tests.test_junca_validator_predeployment_acceptance -v
          grep -F 'JAIOS Institutional Governance' \
            config/junca_validator_predeployment_inputs.pending.json
          grep -F 'Public Testnet / No Monetary Value' \
            config/junca_validator_predeployment_inputs.pending.json

      - name: Produce truthful current-state evidence
        run: |
          mkdir -p artifacts
          python scripts/junca_validator_artifact_handoff.py \
            --pending \
            --output artifacts/junca-validator-artifact-handoff.json
          python - <<'PY'
          import json
          from pathlib import Path

          identity = {
              "official_chain_name": "JUNCA Social Ecosystem Chain",
              "governance": "JAIOS Institutional Governance",
              "network_label": "Public Testnet / No Monetary Value",
              "source_commit": "${{ github.sha }}",
              "mainnet_changed": False,
              "assets_moved": False,
              "bridge_activated": False,
              "bridge_route": "PAUSED",
          }
          artifact_path = Path("artifacts/junca-validator-artifact-handoff.json")
          artifact = json.loads(artifact_path.read_text())
          artifact.update(identity)
          artifact_path.write_text(json.dumps(artifact, indent=2, sort_keys=True) + "\n")
          foundation = {
              **identity,
              "status": "PENDING_AWS_FOUNDATION_READBACK",
              "aws_account_id": "595710543956",
              "aws_region": "us-east-1",
              "availability_zones": [],
              "private_subnet_ids": [],
              "validator_signer_kms_key_arns": [],
              "kms_key_usage": "UNVERIFIED",
          }
          bootstrap = {
              **identity,
              "chain_id": None,
              "validator_ids": ["validator-01", "validator-02", "validator-03"],
              "validator_count": 3,
              "quorum_threshold": 2,
              "genesis_sha256": "PENDING",
              "node_artifact_sha256": "PENDING",
              "bootnode_endpoints": [],
          }
          Path("artifacts/junca-aws-foundation-readback.json").write_text(
              json.dumps(foundation, indent=2, sort_keys=True) + "\n"
          )
          Path("artifacts/junca-validator-quorum-bootstrap.json").write_text(
              json.dumps(bootstrap, indent=2, sort_keys=True) + "\n"
          )
          PY
          set +e
          python scripts/junca_validator_predeployment_acceptance.py \
            --artifact artifacts/junca-validator-artifact-handoff.json \
            --foundation artifacts/junca-aws-foundation-readback.json \
            --bootstrap artifacts/junca-validator-quorum-bootstrap.json \
            --output artifacts/junca-validator-predeployment-manifest.json
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"decision": "PREDEPLOYMENT_REJECTED"' \
            artifacts/junca-validator-predeployment-manifest.json
          grep -q '"live_runtime_verified": false' \
            artifacts/junca-validator-predeployment-manifest.json

      - name: Upload predeployment manifest and source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junca-validator-predeployment-evidence-${{ github.run_id }}
          path: |
            artifacts/junca-validator-artifact-handoff.json
            artifacts/junca-aws-foundation-readback.json
            artifacts/junca-validator-quorum-bootstrap.json
            artifacts/junca-validator-predeployment-manifest.json
            artifacts/junca-validator-predeployment-manifest.json.sha256
          if-no-files-found: error
          retention-days: 90
