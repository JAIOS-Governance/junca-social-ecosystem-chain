name: JUNCA Chain Docs Production

on:
  pull_request:
    paths:
      - "docs/technical-reference/**"
      - "infra/aws/docs-publication/**"
      - ".github/workflows/junca-chain-docs-production.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the exact verified artifact to AWS
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: junca-chain-docs-production
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/technical-reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Lint generators and QA
        run: npm run lint
      - name: Build and verify eight-route artifact
        run: npm test
      - name: Upload exact publication artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junca-chain-docs-${{ github.sha }}
          path: docs/technical-reference/dist
          if-no-files-found: error
          retention-days: 90

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: quality
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Rebuild exact source artifact
        working-directory: docs/technical-reference
        run: npm test
      - name: Verify runner clock and AWS TLS path
        shell: bash
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          curl --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --output /dev/null \
            https://sts.us-east-1.amazonaws.com/
      - name: Require configured publication role
        env:
          AWS_DOCS_DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
        run: |
          test -n "$AWS_DOCS_DEPLOYMENT_ROLE_ARN"
          case "$AWS_DOCS_DEPLOYMENT_ROLE_ARN" in
            arn:aws:iam::*:role/JuncaChainDocsProductionDeployment) ;;
            *) echo "AWS_BINDING_PENDING: AWS_DOCS_DEPLOYMENT_ROLE_ARN is missing or unexpected" >&2; exit 1 ;;
          esac
      - name: Configure publication-only AWS identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
          aws-region: us-east-1
          role-session-name: junca-chain-docs-${{ github.run_id }}
      - name: Read back AWS identity and resources
        id: resources
        env:
          AWS_DOCS_DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
        shell: bash
        run: |
          set -euo pipefail
          expected_account_id="$(cut -d: -f5 <<<"${AWS_DOCS_DEPLOYMENT_ROLE_ARN}")"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "${account_id}" = "${expected_account_id}"

          organization_id="$(aws organizations describe-organization --query Organization.Id --output text 2>/tmp/aws-organization.err || true)"
          if [[ -z "${organization_id}" || "${organization_id}" == "None" ]]; then
            if grep -Fq "AWSOrganizationsNotInUseException" /tmp/aws-organization.err; then
              organization_id="NOT_IN_USE"
            else
              cat /tmp/aws-organization.err >&2
              exit 1
            fi
          fi

          account_alias="$(aws iam list-account-aliases --query 'AccountAliases[0]' --output text)"
          if [[ -z "${account_alias}" || "${account_alias}" == "None" ]]; then
            account_alias="NONE"
          fi

          bucket="junca-chain-docs-${account_id}"
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'docs.jaios-governance.org')].Id | [0]" \
            --output text)"
          test -n "${account_id}" && test "${account_id}" != "None"
          test -n "${distribution_id}" && test "${distribution_id}" != "None"

          bucket_versioning="$(aws s3api get-bucket-versioning \
            --bucket "${bucket}" --query Status --output text)"
          test "${bucket_versioning}" = "Enabled"

          distribution_status="$(aws cloudfront get-distribution \
            --id "${distribution_id}" --query Distribution.Status --output text)"
          test "${distribution_status}" = "Deployed"
          certificate_arn="$(aws cloudfront get-distribution \
            --id "${distribution_id}" \
            --query Distribution.DistributionConfig.ViewerCertificate.ACMCertificateArn \
            --output text)"
          certificate_status="$(aws acm describe-certificate \
            --certificate-arn "${certificate_arn}" \
            --query Certificate.Status --output text)"
          test "${certificate_status}" = "ISSUED"

          printf 'bucket=%s\n' "${bucket}" >> "$GITHUB_OUTPUT"
          printf 'distribution_id=%s\n' "${distribution_id}" >> "$GITHUB_OUTPUT"
          {
            echo "### AWS publication identity"
            echo "- Account ID: \`${account_id}\`"
            echo "- Caller ARN: \`${caller_arn}\`"
            echo "- Organization ID: \`${organization_id}\`"
            echo "- Account alias: \`${account_alias}\`"
            echo "- Canonical region: \`us-east-1\`"
            echo "- Bucket: \`${bucket}\` / versioning \`${bucket_versioning}\`"
            echo "- Distribution: \`${distribution_id}\` / \`${distribution_status}\`"
            echo "- Certificate: \`${certificate_status}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Synchronize exact artifact to private S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync docs/technical-reference/dist/ \
            "s3://${{ steps.resources.outputs.bucket }}/" \
            --delete \
            --exclude "*.html" \
            --exclude "*.webmanifest" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync docs/technical-reference/dist/ \
            "s3://${{ steps.resources.outputs.bucket }}/" \
            --exclude "*" \
            --include "*.html" \
            --include "*.webmanifest" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --cache-control "public,max-age=0,must-revalidate"
      - name: Verify deployed manifest
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "s3://${{ steps.resources.outputs.bucket }}/release-manifest.json" /tmp/release-manifest.readback.json
          cmp docs/technical-reference/dist/release-manifest.json /tmp/release-manifest.readback.json
      - name: Invalidate and wait for completion
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.resources.outputs.distribution_id }}" \
            --paths "/*" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.resources.outputs.distribution_id }}" --id "${invalidation_id}"
          status="$(aws cloudfront get-invalidation \
            --distribution-id "${{ steps.resources.outputs.distribution_id }}" --id "${invalidation_id}" \
            --query Invalidation.Status --output text)"
          test "${status}" = "Completed"
          printf 'invalidation_id=%s\n' "${invalidation_id}" >> "$GITHUB_OUTPUT"
          printf 'status=%s\n' "${status}" >> "$GITHUB_OUTPUT"
      - name: Production HTTP and metadata readback
        shell: bash
        run: |
          set -euo pipefail
          for route in "" protocol assets interoperability implementation governance evidence glossary; do
            url="https://docs.jaios-governance.org/${route}"
            code="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-delay 10 \
              --output "/tmp/${route:-home}.html" --write-out '%{http_code}' "${url}")"
            test "${code}" = "200"
          done
          for asset in favicon.ico favicon.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png manifest.webmanifest official-junca-symbol.png; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 10 \
              --output "/tmp/${asset//\//-}" "https://docs.jaios-governance.org/${asset}"
            cmp "docs/technical-reference/dist/${asset}" "/tmp/${asset//\//-}"
          done
          release_token="$(jq -er '.release | gsub("\\."; "")' docs/technical-reference/dist/release-manifest.json)"
          revision_token="$(jq -er '.revision | ascii_downcase' docs/technical-reference/dist/release-manifest.json)"
          cache_token="${release_token}-${revision_token}"
          grep -F 'rel="canonical" href="https://docs.jaios-governance.org/"' /tmp/home.html
          grep -F "rel=\"manifest\" href=\"https://docs.jaios-governance.org/manifest.webmanifest?v=${cache_token}\"" /tmp/home.html
          grep -F "rel=\"apple-touch-icon\" href=\"https://docs.jaios-governance.org/apple-touch-icon.png?v=${cache_token}\"" /tmp/home.html
          manifest_headers="$(curl --fail --silent --show-error --head \
            "https://docs.jaios-governance.org/manifest.webmanifest")"
          grep -i '^content-type: application/manifest+json' <<< "${manifest_headers}"
          grep -i '^cache-control: public,max-age=0,must-revalidate' <<< "${manifest_headers}"
          icon_headers="$(curl --fail --silent --show-error --head \
            "https://docs.jaios-governance.org/icon-192.png")"
          grep -i '^content-type: image/png' <<< "${icon_headers}"
          grep -i '^cache-control: public,max-age=31536000,immutable' <<< "${icon_headers}"
          grep -F 'Public Testnet' /tmp/home.html
          {
            echo "- Invalidation: \`${{ steps.invalidate.outputs.invalidation_id }}\`"
            echo "- Invalidation status: \`${{ steps.invalidate.outputs.status }}\`"
            echo "- Public URL: https://docs.jaios-governance.org"
            echo "- DNS resolution and TLS readback: PASS"
            echo "- Eight-route HTTP readback: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
