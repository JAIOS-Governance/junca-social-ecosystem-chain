name: JUNCA Validator Foundation Release

on:
  workflow_dispatch:
    inputs:
      ami_run_id:
        description: "Verified immutable AMI workflow run ID"
        required: true
        type: string
      manifest_gate_run_id:
        description: "Successful JUNCA Runtime Release Manifest Gate run ID"
        required: true
        type: string
      resume_run_id:
        description: "Prior failed Foundation Release run ID, or 0 for a fresh rollout"
        required: false
        default: "0"
        type: string
      renew_expired_epoch:
        description: "NONE or exact authorization phrase RENEW_EXPIRED_QUIESCED_EPOCH"
        required: false
        default: "NONE"
        type: string
      renewal_preserve_prefix_count:
        description: "Exact already-replaced target prefix to preserve during an authorized epoch renewal"
        required: false
        default: "0"
        type: string
      authorize_rollout:
        description: "Exact authorization phrase: PUBLIC_TESTNET_ROLLOUT"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # Shared with the manual/auto foundation workflow because both can acquire
  # the canonical public-testnet Terraform state lock.
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 210
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      DOMAIN_NAME: jaios-governance.org
      ROUTE53_ZONE_ID: Z0336017285464TX0NT1G
      AVAILABILITY_ZONES_JSON: '["us-east-1a","us-east-1b","us-east-1c"]'
      AMI_RUN_ID: ${{ inputs.ami_run_id }}
      MANIFEST_GATE_RUN_ID: ${{ inputs.manifest_gate_run_id }}
      ROLLING_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      RENEW_EXPIRED_EPOCH: ${{ inputs.renew_expired_epoch }}
      RENEWAL_PRESERVE_PREFIX_COUNT: ${{ inputs.renewal_preserve_prefix_count }}
      FOUNDATION_ROLLING_RELEASE: "true"
    steps:
      - name: Enforce explicit rollout authorization
        env:
          AUTHORIZE_ROLLOUT: ${{ inputs.authorize_rollout }}
        run: |
          set -euo pipefail
          test "$AUTHORIZE_ROLLOUT" = "PUBLIC_TESTNET_ROLLOUT"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = \
            "refs/heads/release-candidate/$GITHUB_SHA"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve immutable candidate provenance head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/release-candidate/$GITHUB_SHA"
          test "$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/release-candidate/${GITHUB_SHA}" \
              --jq .object.sha
          )" = "$GITHUB_SHA"
          candidate_head="$GITHUB_SHA"
          if [[ "$ROLLING_RESUME_RUN_ID" != "0" ]]; then
            [[ "$ROLLING_RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$ROLLING_RESUME_RUN_ID" != "$GITHUB_RUN_ID"
            resume_run="$(gh api \
              "repos/${{ github.repository }}/actions/runs/${ROLLING_RESUME_RUN_ID}")"
            jq -e \
              --arg repository "${{ github.repository }}" '
                .status == "completed" and
                (.conclusion == "failure" or
                 .conclusion == "cancelled" or
                 .conclusion == "timed_out") and
                .name == "JUNCA Validator Foundation Release" and
                .path == ".github/workflows/junca-validator-foundation-release.yml" and
                .event == "workflow_dispatch" and
                (.head_sha | test("^[0-9a-f]{40}$")) and
                .head_branch == ("release-candidate/" + .head_sha) and
                .repository.full_name == $repository and
                .head_repository.full_name == $repository
              ' <<<"$resume_run"
            resume_producer_head="$(jq -er .head_sha <<<"$resume_run")"
            mkdir -p artifacts/resume
            gh run download "$ROLLING_RESUME_RUN_ID" \
              --repo "${{ github.repository }}" \
              --name "junca-validator-foundation-release-${ROLLING_RESUME_RUN_ID}" \
              --dir artifacts/resume
            test -f artifacts/resume/rolling-resume-evidence.json
            test -f artifacts/resume/rolling-resume-evidence.json.sha256
            (
              cd artifacts/resume
              sha256sum -c rolling-resume-evidence.json.sha256
            )
            candidate_head="$(
              jq -er \
                '.candidate.provenance_head_sha // .head_sha |
                 select(type == "string" and test("^[0-9a-f]{40}$"))' \
                artifacts/resume/rolling-resume-evidence.json
            )"
            jq -e \
              --arg repository "${{ github.repository }}" \
              --argjson producer_run_id "$ROLLING_RESUME_RUN_ID" \
              --arg producer_head "$resume_producer_head" '
                .schema_version == "junca-validator-rolling-resume/v1" and
                .repository == $repository and
                .producer_run_id == $producer_run_id and
                .head_sha == $producer_head and
                .mainnet_changed == false and
                .assets_moved == false and
                .bridge_activated == false
              ' artifacts/resume/rolling-resume-evidence.json
            gh api \
              "repos/${{ github.repository }}/compare/${candidate_head}...${GITHUB_SHA}" \
              > artifacts/resume/recovery-head-compare.json
            jq -n \
              --arg expected_base "$candidate_head" \
              --arg expected_head "$GITHUB_SHA" \
              --slurpfile comparison \
                artifacts/resume/recovery-head-compare.json '{
                expected_base: $expected_base,
                expected_head: $expected_head,
                comparison: $comparison[0]
              }' > artifacts/resume/recovery-head-evidence.json
            python -m jaios.social_ecosystem_chain.rolling_compatibility \
              --mode recovery-head \
              --evidence artifacts/resume/recovery-head-evidence.json \
              --output artifacts/resume/recovery-head-decision.json
            echo "ROLLING_RESUME_EVIDENCE_PATH=$GITHUB_WORKSPACE/artifacts/resume/rolling-resume-evidence.json" \
              >> "$GITHUB_ENV"
          fi
          [[ "$candidate_head" =~ ^[0-9a-f]{40}$ ]]
          echo "ROLLING_CANDIDATE_HEAD_SHA=$candidate_head" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Verify immutable AMI and manifest workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$AMI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MANIFEST_GATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          ami_run="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${AMI_RUN_ID}")"
          manifest_run="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${MANIFEST_GATE_RUN_ID}")"
          jq -e \
            --arg repository "${{ github.repository }}" \
            --arg head "$ROLLING_CANDIDATE_HEAD_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Validator Immutable AMI Build" and
            .path == ".github/workflows/junca-validator-ami-build.yml" and
            .event == "workflow_dispatch" and
            .head_branch == ("release-candidate/" + $head) and
            .head_sha == $head and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$ami_run"
          jq -e \
            --arg repository "${{ github.repository }}" \
            --arg head "$ROLLING_CANDIDATE_HEAD_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Runtime Release Manifest Gate" and
            .path == ".github/workflows/junca-runtime-release-manifest-gate.yml" and
            .event == "workflow_dispatch" and
            .head_branch == ("release-candidate/" + $head) and
            .head_sha == $head and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$manifest_run"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: junca-validator-ami-build-${{ env.AMI_RUN_ID }}
          path: artifacts/ami
          github-token: ${{ github.token }}
          run-id: ${{ env.AMI_RUN_ID }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: junca-runtime-release-manifest-gate-${{ env.MANIFEST_GATE_RUN_ID }}
          path: artifacts/manifest
          github-token: ${{ github.token }}
          run-id: ${{ env.MANIFEST_GATE_RUN_ID }}

      - name: Bind verified immutable AMI inputs
        run: |
          set -euo pipefail
          evidence=artifacts/ami/junca-validator-ami-build.json
          checksum=artifacts/ami/SHA256SUMS
          test ! -L artifacts/ami
          test -f "$evidence"
          test ! -L "$evidence"
          test -f "$checksum"
          test ! -L "$checksum"
          test "$(
            find artifacts/ami -mindepth 1 -maxdepth 1 | wc -l
          )" = 2
          (
            cd artifacts/ami
            test "$(wc -l < SHA256SUMS)" = 1
            grep -Eq \
              '^[0-9a-f]{64}  junca-validator-ami-build\.json$' \
              SHA256SUMS
            sha256sum --strict --check SHA256SUMS
          )
          jq -e --arg candidate_head "$ROLLING_CANDIDATE_HEAD_SHA" '
            (keys | sort) == ([
              "ami_id",
              "assets_moved",
              "bridge_activated",
              "component_source_sha256",
              "dependency_lock_sha256",
              "dnf_releasever",
              "genesis_sha256",
              "governance",
              "image_builder_arn",
              "mainnet_changed",
              "network",
              "node_artifact_sha256",
              "notice",
              "parent_ami_id",
              "parent_ami_name",
              "parent_ami_owner_id",
              "python3_boto3_nevra",
              "python3_botocore_nevra",
              "request_schema",
              "request_sha256",
              "reused_existing_ami",
              "schema_version",
              "source_commit",
              "source_run_id",
              "state",
              "supply_chain_policy_sha256",
              "terraform_state_changed"
            ] | sort) and
            .schema_version == "junca-validator-ami-build/v2" and
            .state == "AMI_VERIFIED" and
            .network == "Public Testnet" and
            .notice == "Public Testnet / No Monetary Value" and
            .governance == "JAIOS Institutional Governance" and
            .request_schema ==
              "junca-validator-ami-build-request/v2" and
            .source_commit == $candidate_head and
            (.source_run_id | type) == "string" and
            (.source_run_id | test("^[1-9][0-9]*$")) and
            (.ami_id | type) == "string" and
            (.ami_id | test("^ami-[0-9a-f]{8,17}$")) and
            (.image_builder_arn | type) == "string" and
            (.image_builder_arn | test(
              "^arn:aws:imagebuilder:us-east-1:595710543956:image/" +
              "junca-validator-[1-9][0-9]*-[1-9][0-9]*/" +
              "1\\.0\\.0/[1-9][0-9]*$"
            )) and
            (.node_artifact_sha256 | type) == "string" and
            (.node_artifact_sha256 | test("^[0-9a-f]{64}$")) and
            (.genesis_sha256 | type) == "string" and
            (.genesis_sha256 | test("^[0-9a-f]{64}$")) and
            (.request_sha256 | type) == "string" and
            (.request_sha256 | test("^[0-9a-f]{64}$")) and
            (.parent_ami_id | type) == "string" and
            (.parent_ami_id | test("^ami-[0-9a-f]{8,17}$")) and
            .parent_ami_owner_id == "137112412989" and
            (.parent_ami_name | type) == "string" and
            (.parent_ami_name | test(
              "^al2023-ami-2023\\.[0-9]+\\.[0-9]{8}\\.[0-9]+" +
              "-kernel-[0-9]+\\.[0-9]+-x86_64$"
            )) and
            (.dnf_releasever | type) == "string" and
            (.dnf_releasever | test(
              "^2023\\.[0-9]+\\.[0-9]{8}$"
            )) and
            (
              .dnf_releasever as $releasever |
              .parent_ami_name |
              startswith("al2023-ami-" + $releasever + ".")
            ) and
            (.component_source_sha256 | test("^[0-9a-f]{64}$")) and
            (.dependency_lock_sha256 | test("^[0-9a-f]{64}$")) and
            (.supply_chain_policy_sha256 |
              test("^[0-9a-f]{64}$")) and
            (.python3_boto3_nevra | type) == "string" and
            (.python3_boto3_nevra | test(
              "^python3-boto3-[0-9]+:[A-Za-z0-9][A-Za-z0-9+_.~^%-]*" +
              "-[A-Za-z0-9][A-Za-z0-9+_.~^%-]*\\.[a-z0-9_]+$"
            )) and
            (.python3_botocore_nevra | type) == "string" and
            (.python3_botocore_nevra | test(
              "^python3-botocore-[0-9]+:" +
              "[A-Za-z0-9][A-Za-z0-9+_.~^%-]*-" +
              "[A-Za-z0-9][A-Za-z0-9+_.~^%-]*\\.[a-z0-9_]+$"
            )) and
            (.reused_existing_ami | type) == "boolean" and
            .terraform_state_changed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' "$evidence"
          node_ami_id="$(jq -er '.ami_id' "$evidence")"
          node_artifact_sha256="$(
            jq -er '.node_artifact_sha256' "$evidence"
          )"
          genesis_sha256="$(jq -er '.genesis_sha256' "$evidence")"
          source_commit="$(jq -er '.source_commit' "$evidence")"
          request_sha256="$(jq -er '.request_sha256' "$evidence")"
          request_schema="$(jq -er '.request_schema' "$evidence")"
          image_builder_arn="$(jq -er '.image_builder_arn' "$evidence")"
          parent_ami_id="$(jq -er '.parent_ami_id' "$evidence")"
          parent_ami_owner_id="$(
            jq -er '.parent_ami_owner_id' "$evidence"
          )"
          parent_ami_name="$(jq -er '.parent_ami_name' "$evidence")"
          component_source_sha256="$(
            jq -er '.component_source_sha256' "$evidence"
          )"
          dependency_lock_sha256="$(
            jq -er '.dependency_lock_sha256' "$evidence"
          )"
          supply_chain_policy_sha256="$(
            jq -er '.supply_chain_policy_sha256' "$evidence"
          )"
          dnf_releasever="$(jq -er '.dnf_releasever' "$evidence")"
          python3_boto3_nevra="$(
            jq -er '.python3_boto3_nevra' "$evidence"
          )"
          python3_botocore_nevra="$(
            jq -er '.python3_botocore_nevra' "$evidence"
          )"

          decision=artifacts/manifest/junca-runtime-release-manifest-decision.json
          decision_checksum=artifacts/manifest/SHA256SUMS
          test ! -L artifacts/manifest
          test -f "$decision"
          test ! -L "$decision"
          test -f "$decision_checksum"
          test ! -L "$decision_checksum"
          test "$(
            find artifacts/manifest -mindepth 1 -maxdepth 1 | wc -l
          )" = 2
          (
            cd artifacts/manifest
            test "$(wc -l < SHA256SUMS)" = 1
            grep -Eq \
              '^[0-9a-f]{64}  junca-runtime-release-manifest-decision\.json$' \
              SHA256SUMS
            sha256sum --strict --check SHA256SUMS
          )
          jq -e \
            --arg source_commit "$source_commit" \
            --arg node_sha256 "$node_artifact_sha256" \
            --arg genesis_sha256 "$genesis_sha256" \
            --arg ami_id "$node_ami_id" \
            --arg request_sha256 "$request_sha256" \
            --arg request_schema "$request_schema" \
            --arg image_builder_arn "$image_builder_arn" \
            --arg parent_ami_id "$parent_ami_id" \
            --arg parent_ami_owner_id "$parent_ami_owner_id" \
            --arg parent_ami_name "$parent_ami_name" \
            --arg component_sha "$component_source_sha256" \
            --arg dependency_lock_sha "$dependency_lock_sha256" \
            --arg supply_chain_policy_sha \
              "$supply_chain_policy_sha256" \
            --arg dnf_releasever "$dnf_releasever" \
            --arg boto3_nevra "$python3_boto3_nevra" \
            --arg botocore_nevra "$python3_botocore_nevra" '
            (keys | sort) == ([
              "accepted",
              "baseline_mode",
              "candidate",
              "decision",
              "failure_count",
              "failures",
              "phase",
              "public_endpoint_acceptance",
              "public_endpoint_outage_status",
              "public_services_enabled",
              "release_boundary",
              "schema_version"
            ] | sort) and
            (.candidate | keys | sort) == ([
              "ami_id",
              "ami_supply_chain",
              "genesis_sha256",
              "migration_evidence_sha256",
              "node_artifact_sha256",
              "request_sha256",
              "source_commit"
            ] | sort) and
            (.candidate.ami_supply_chain | keys | sort) == ([
              "component_source_sha256",
              "dependency_lock_sha256",
              "dnf_releasever",
              "image_builder_arn",
              "parent_ami_id",
              "parent_ami_name",
              "parent_ami_owner_id",
              "python3_boto3_nevra",
              "python3_botocore_nevra",
              "request_schema",
              "supply_chain_policy_sha256"
            ] | sort) and
            (.release_boundary | keys | sort) == ([
              "assets_moved",
              "bridge_activated",
              "mainnet_changed"
            ] | sort) and
            .schema_version == "junca-runtime-release-manifest-decision/v1" and
            .accepted == true and
            .decision == "PROMOTION_GATE_PASS" and
            .failure_count == 0 and
            .failures == [] and
            .candidate.source_commit == $source_commit and
            .candidate.node_artifact_sha256 == $node_sha256 and
            .candidate.genesis_sha256 == $genesis_sha256 and
            .candidate.ami_id == $ami_id and
            .candidate.request_sha256 == $request_sha256 and
            .candidate.ami_supply_chain.request_schema ==
              $request_schema and
            .candidate.ami_supply_chain.image_builder_arn ==
              $image_builder_arn and
            .candidate.ami_supply_chain.parent_ami_id ==
              $parent_ami_id and
            .candidate.ami_supply_chain.parent_ami_owner_id ==
              $parent_ami_owner_id and
            .candidate.ami_supply_chain.parent_ami_name ==
              $parent_ami_name and
            .candidate.ami_supply_chain.component_source_sha256 ==
              $component_sha and
            .candidate.ami_supply_chain.dependency_lock_sha256 ==
              $dependency_lock_sha and
            .candidate.ami_supply_chain.supply_chain_policy_sha256 ==
              $supply_chain_policy_sha and
            .candidate.ami_supply_chain.dnf_releasever ==
              $dnf_releasever and
            .candidate.ami_supply_chain.python3_boto3_nevra ==
              $boto3_nevra and
            .candidate.ami_supply_chain.python3_botocore_nevra ==
              $botocore_nevra and
            .release_boundary.mainnet_changed == false and
            .release_boundary.assets_moved == false and
            .release_boundary.bridge_activated == false
          ' "$decision"
          manifest_decision_sha256="$(
            sha256sum "$decision" | cut -d' ' -f1
          )"
          [[ "$manifest_decision_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "NODE_AMI_ID=$node_ami_id"
            echo "NODE_ARTIFACT_SHA256=$node_artifact_sha256"
            echo "GENESIS_SHA256=$genesis_sha256"
            echo "SOURCE_COMMIT=$source_commit"
            echo "REQUEST_SHA256=$request_sha256"
            echo "AMI_REQUEST_SCHEMA=$request_schema"
            echo "IMAGE_BUILDER_ARN=$image_builder_arn"
            echo "PARENT_AMI_ID=$parent_ami_id"
            echo "PARENT_AMI_OWNER_ID=$parent_ami_owner_id"
            echo "PARENT_AMI_NAME=$parent_ami_name"
            echo "COMPONENT_SOURCE_SHA256=$component_source_sha256"
            echo "DEPENDENCY_LOCK_SHA256=$dependency_lock_sha256"
            echo "SUPPLY_CHAIN_POLICY_SHA256=$supply_chain_policy_sha256"
            echo "DNF_RELEASEVER=$dnf_releasever"
            echo "PYTHON3_BOTO3_NEVRA=$python3_boto3_nevra"
            echo "PYTHON3_BOTOCORE_NEVRA=$python3_botocore_nevra"
            echo "MANIFEST_DECISION_SHA256=$manifest_decision_sha256"
          } >> "$GITHUB_ENV"

      - name: Resolve exact resumable rolling evidence
        if: inputs.resume_run_id != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ROLLING_RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$ROLLING_RESUME_RUN_ID" != "$GITHUB_RUN_ID"
          test -f "$ROLLING_RESUME_EVIDENCE_PATH"
          jq -e \
            --arg repository "${{ github.repository }}" \
            --arg candidate_head "$ROLLING_CANDIDATE_HEAD_SHA" \
            --argjson producer_run_id "$ROLLING_RESUME_RUN_ID" \
            --argjson ami_run_id "$AMI_RUN_ID" \
            --argjson manifest_gate_run_id "$MANIFEST_GATE_RUN_ID" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg node_sha256 "$NODE_ARTIFACT_SHA256" \
            --arg genesis_sha256 "$GENESIS_SHA256" \
            --arg ami_id "$NODE_AMI_ID" \
            --arg request_sha256 "$REQUEST_SHA256" \
            --arg manifest_decision_sha256 "$MANIFEST_DECISION_SHA256" '
              .schema_version == "junca-validator-rolling-resume/v1" and
              .repository == $repository and
              (.candidate.provenance_head_sha // .head_sha) ==
                $candidate_head and
              .producer_run_id == $producer_run_id and
              .ami_run_id == $ami_run_id and
              .manifest_gate_run_id == $manifest_gate_run_id and
              .candidate.source_commit == $source_commit and
              .candidate.node_artifact_sha256 == $node_sha256 and
              .candidate.genesis_sha256 == $genesis_sha256 and
              .candidate.ami_id == $ami_id and
              .candidate.request_sha256 == $request_sha256 and
              .candidate.manifest_decision_sha256 ==
                $manifest_decision_sha256 and
              .automatic_finality.block_interval_seconds == 30 and
              (.automatic_finality.slot_epoch_seconds | type) == "number" and
              (.automatic_finality.slot_epoch_seconds | floor) ==
                .automatic_finality.slot_epoch_seconds and
              .automatic_finality.slot_epoch_seconds > 0 and
              .automatic_finality.slot_epoch_seconds % 30 == 0 and
              .automatic_finality.minimum_remaining_seconds == 900 and
              .automatic_finality.maximum_remaining_seconds == 7230 and
              (.updated_count | type) == "number" and
              .updated_count >= 0 and .updated_count <= 3 and
              .mainnet_changed == false and
              .assets_moved == false and
              .bridge_activated == false
            ' "$ROLLING_RESUME_EVIDENCE_PATH"

      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-validator-release-${{ github.run_id }}

      - name: Cross-bind live AMI supply-chain tags
        run: |
          set -euo pipefail
          test "$(
            aws sts get-caller-identity --query Account --output text
          )" = "$AWS_ACCOUNT_ID"
          aws ec2 describe-images \
            --owners self \
            --image-ids "$NODE_AMI_ID" \
            --output json > "$RUNNER_TEMP/foundation-live-ami.json"
          jq -e \
            --arg ami_id "$NODE_AMI_ID" \
            --arg account_id "$AWS_ACCOUNT_ID" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg node_sha "$NODE_ARTIFACT_SHA256" \
            --arg genesis_sha "$GENESIS_SHA256" \
            --arg request_sha "$REQUEST_SHA256" \
            --arg request_schema "$AMI_REQUEST_SCHEMA" \
            --arg image_builder_arn "$IMAGE_BUILDER_ARN" \
            --arg parent_ami_id "$PARENT_AMI_ID" \
            --arg parent_ami_owner_id "$PARENT_AMI_OWNER_ID" \
            --arg parent_ami_name "$PARENT_AMI_NAME" \
            --arg component_sha "$COMPONENT_SOURCE_SHA256" \
            --arg dependency_lock_sha "$DEPENDENCY_LOCK_SHA256" \
            --arg supply_chain_policy_sha \
              "$SUPPLY_CHAIN_POLICY_SHA256" \
            --arg dnf_releasever "$DNF_RELEASEVER" \
            --arg boto3_nevra "$PYTHON3_BOTO3_NEVRA" \
            --arg botocore_nevra "$PYTHON3_BOTOCORE_NEVRA" '
              .Images | length == 1 and
              .[0].ImageId == $ami_id and
              .[0].OwnerId == $account_id and
              .[0].State == "available" and
              .[0].Public == false and
              .[0].ImageType == "machine" and
              .[0].Architecture == "x86_64" and
              .[0].RootDeviceType == "ebs" and
              .[0].VirtualizationType == "hvm" and
              ([.[0].Tags[] |
                select(.Key == "Network") |
                .Value] | first) == "Public Testnet" and
              ([.[0].Tags[] |
                select(.Key == "Governance") |
                .Value] | first) ==
                  "JAIOS Institutional Governance" and
              ([.[0].Tags[] |
                select(.Key == "RequestSchema") |
                .Value] | first) == $request_schema and
              ([.[0].Tags[] |
                select(.Key == "SourceCommit") |
                .Value] | first) == $source_commit and
              ([.[0].Tags[] |
                select(.Key == "NodeArtifactSHA256") |
                .Value] | first) == $node_sha and
              ([.[0].Tags[] |
                select(.Key == "GenesisSHA256") |
                .Value] | first) == $genesis_sha and
              ([.[0].Tags[] |
                select(.Key == "RequestDigest") |
                .Value] | first) == $request_sha and
              ([.[0].Tags[] |
                select(.Key == "ImageBuilderArn") |
                .Value] | first) == $image_builder_arn and
              ([.[0].Tags[] |
                select(.Key == "ParentAMIId") |
                .Value] | first) == $parent_ami_id and
              ([.[0].Tags[] |
                select(.Key == "ParentAMIOwnerId") |
                .Value] | first) == $parent_ami_owner_id and
              ([.[0].Tags[] |
                select(.Key == "ParentAMIName") |
                .Value] | first) == $parent_ami_name and
              ([.[0].Tags[] |
                select(.Key == "ComponentSourceSHA256") |
                .Value] | first) == $component_sha and
              ([.[0].Tags[] |
                select(.Key == "DependencyLockSHA256") |
                .Value] | first) == $dependency_lock_sha and
              ([.[0].Tags[] |
                select(.Key == "SupplyChainPolicySHA256") |
                .Value] | first) == $supply_chain_policy_sha and
              ([.[0].Tags[] |
                select(.Key == "DnfReleasever") |
                .Value] | first) == $dnf_releasever and
              ([.[0].Tags[] |
                select(.Key == "Boto3NEVRA") |
                .Value] | first) == $boto3_nevra and
              ([.[0].Tags[] |
                select(.Key == "BotocoreNEVRA") |
                .Value] | first) == $botocore_nevra and
              ([.[0].Tags[] |
                select(.Key == "MainnetChanged") |
                .Value] | first) == "false" and
              ([.[0].Tags[] |
                select(.Key == "AssetsMoved") |
                .Value] | first) == "false" and
              ([.[0].Tags[] |
                select(.Key == "BridgeActivated") |
                .Value] | first) == "false"
            ' "$RUNNER_TEMP/foundation-live-ami.json"

      - name: Generate or renew the shared automatic finality epoch
        run: |
          set -euo pipefail
          interval=30
          now="$(date +%s)"
          minimum_remaining=900
          maximum_remaining=7230
          activation_delay=7200
          renewal_authorization="${RENEW_EXPIRED_EPOCH:-NONE}"
          preserve_prefix_count="${RENEWAL_PRESERVE_PREFIX_COUNT:-0}"
          case "$renewal_authorization" in
            NONE|RENEW_EXPIRED_QUIESCED_EPOCH) ;;
            *) echo "invalid expired-epoch renewal authorization" >&2; exit 2 ;;
          esac
          [[ "$preserve_prefix_count" =~ ^[0-3]$ ]]
          prior_slot_epoch=0
          renewal_performed=false
          renewal_prefix_count=0
          fresh_epoch="$(( ((now + activation_delay + interval - 1) / interval) * interval ))"

          if [[ -n "${ROLLING_RESUME_EVIDENCE_PATH:-}" ]]; then
            test "$ROLLING_RESUME_RUN_ID" != "0"
            test -f "$ROLLING_RESUME_EVIDENCE_PATH"
            test "$(
              jq -er '.automatic_finality.block_interval_seconds' \
                "$ROLLING_RESUME_EVIDENCE_PATH"
            )" = "$interval"
            prior_slot_epoch="$(
              jq -er '
                .automatic_finality.slot_epoch_seconds
                | select(
                    type == "number" and
                    floor == . and
                    . > 0 and
                    . % 30 == 0
                  )
              ' "$ROLLING_RESUME_EVIDENCE_PATH"
            )"
            prior_bootstrap_epochs="$(
              jq -ce --argjson prior "$prior_slot_epoch" '
                (
                  .terraform_bootstrap.slot_epoch_seconds //
                  [$prior, $prior, $prior]
                )
                | select(
                    type == "array" and
                    length == 3 and
                    all(.[];
                      type == "number" and
                      floor == . and
                      . > 0 and
                      . % 30 == 0
                    )
                  )
              ' "$ROLLING_RESUME_EVIDENCE_PATH"
            )"
            prior_updated_count="$(
              jq -er '.updated_count | select(type == "number" and . >= 0 and . <= 3)' \
                "$ROLLING_RESUME_EVIDENCE_PATH"
            )"
            prior_remaining="$((prior_slot_epoch - now))"
            if [[ "$prior_remaining" -ge "$minimum_remaining" &&
                  "$prior_remaining" -le "$maximum_remaining" ]]; then
              test "$renewal_authorization" = "NONE"
              test "$preserve_prefix_count" = "0"
              slot_epoch="$prior_slot_epoch"
              bootstrap_epochs="$prior_bootstrap_epochs"
            else
              test "$renewal_authorization" = "RENEW_EXPIRED_QUIESCED_EPOCH"
              test "$preserve_prefix_count" -ge "$prior_updated_count"
              max_prefix="$((prior_updated_count + 1))"
              if (( max_prefix > 3 )); then
                max_prefix=3
              fi
              test "$preserve_prefix_count" -le "$max_prefix"
              slot_epoch="$fresh_epoch"
              bootstrap_epochs="$(
                jq -cn \
                  --argjson prior "$prior_bootstrap_epochs" \
                  --argjson fresh "$slot_epoch" \
                  --argjson prefix "$preserve_prefix_count" '
                    [
                      range(0; 3) as $index
                      | if $index < $prefix
                        then $prior[$index]
                        else $fresh
                        end
                    ]
                  '
              )"
              renewal_performed=true
              renewal_prefix_count="$preserve_prefix_count"
            fi
          else
            test "$ROLLING_RESUME_RUN_ID" = "0"
            test "$renewal_authorization" = "NONE"
            test "$preserve_prefix_count" = "0"
            slot_epoch="$fresh_epoch"
            bootstrap_epochs="$(jq -cn --argjson epoch "$slot_epoch" '[$epoch,$epoch,$epoch]')"
          fi

          remaining="$((slot_epoch - now))"
          test "$remaining" -ge "$minimum_remaining"
          test "$remaining" -le "$maximum_remaining"
          test "$((slot_epoch % interval))" -eq 0
          jq -e '
            type == "array" and length == 3 and
            all(.[];
              type == "number" and
              floor == . and
              . > 0 and
              . % 30 == 0
            )
          ' <<<"$bootstrap_epochs" >/dev/null
          {
            echo "AUTOMATIC_FINALITY_ENABLED=true"
            echo "VALIDATOR_BLOCK_INTERVAL_SECONDS=$interval"
            echo "VALIDATOR_SLOT_EPOCH_SECONDS=$slot_epoch"
            echo "VALIDATOR_BOOTSTRAP_SLOT_EPOCHS_JSON=$bootstrap_epochs"
            echo "ROLLING_RESUME_PRIOR_SLOT_EPOCH_SECONDS=$prior_slot_epoch"
            echo "ROLLING_EPOCH_RENEWAL_PERFORMED=$renewal_performed"
            echo "ROLLING_EPOCH_RENEWAL_PREFIX_COUNT=$renewal_prefix_count"
          } >> "$GITHUB_ENV"

      - name: Apply validators-only Terraform foundation
        run: bash scripts/junca_public_testnet_foundation.sh foundation-apply

      - name: Require three SSM-managed validators
        run: |
          set -euo pipefail
          mapfile -t instances < <(jq -r '.validator_instance_ids.value[]' \
            artifacts/foundation-outputs.json)
          test "${#instances[@]}" = 3
          for attempt in $(seq 1 60); do
            online="$(aws ssm describe-instance-information \
              --filters Key=InstanceIds,Values="$(IFS=,; echo "${instances[*]}")" \
              --query 'length(InstanceInformationList[?PingStatus==`Online`])' \
              --output text)"
            [[ "$online" == "3" ]] && break
            test "$attempt" -lt 60
            sleep 10
          done
          printf '%s\n' "${instances[@]}" > artifacts/validator-instance-ids.txt

      - name: Reset volatile consensus round from durable heads
        run: |
          set -euo pipefail
          mapfile -t instances < artifacts/validator-instance-ids.txt
          jq -n '{
            commands: [
              "set -euo pipefail",
              "if ! systemctl restart junca-validator; then systemctl status junca-validator --no-pager || true; journalctl -u junca-validator -n 100 --no-pager || true; exit 1; fi",
              "for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health >/dev/null && exit 0; sleep 2; done; systemctl status junca-validator --no-pager || true; journalctl -u junca-validator -n 100 --no-pager || true; exit 1"
            ]
          }' > artifacts/ssm-reset-round.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file://artifacts/ssm-reset-round.json \
            --comment "JUNCA Public Testnet Volatile Round Reset" \
            --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            command_status=""
            for attempt in $(seq 1 90); do
              command_status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text)"
              case "$command_status" in
                Success) break ;;
                Failed|Cancelled|TimedOut|Cancelling) break ;;
              esac
              test "$attempt" -lt 90
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/reset-round-${instance}.json"
            jq -r '.StandardOutputContent, .StandardErrorContent' \
              "artifacts/reset-round-${instance}.json"
            jq -e '.Status == "Success"' \
              "artifacts/reset-round-${instance}.json"
          done

      - name: Read back identical finalized heads
        run: |
          set -euo pipefail
          mapfile -t instances < artifacts/validator-instance-ids.txt
          health_poll='sleep 5; curl -fsS http://127.0.0.1:8545/health'
          jq -n --arg command "$health_poll" \
            '{commands: [$command]}' > artifacts/ssm-health.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file://artifacts/ssm-health.json \
            --comment "JUNCA Public Testnet Runtime Readback" \
            --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            command_status=""
            for attempt in $(seq 1 90); do
              command_status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text)"
              case "$command_status" in
                Success) break ;;
                Failed|Cancelled|TimedOut|Cancelling) exit 1 ;;
              esac
              test "$attempt" -lt 90
              sleep 2
            done
            [[ "$command_status" == "Success" ]]
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/health-command-${instance}.json"
            jq -e '.Status == "Success"' \
              "artifacts/health-command-${instance}.json"
            jq -er .StandardOutputContent \
              "artifacts/health-command-${instance}.json" \
              > "artifacts/health-${instance}.json"
          done
          jq -s -e '
            length == 3 and
            (map(.status) | unique) == ["healthy"] and
            (map(.head_height) | min) >= 1 and
            (map(.head_height) | unique | length) == 1 and
            (map(.head_hash) | unique | length) == 1 and
            (map(.consensus.last_certificate_hash) | unique | length) == 1 and
            all(
              (.consensus.last_certificate_hash | type) == "string" and
              (.consensus.last_certificate_hash | test("^0x[0-9a-f]{64}$"))
            ) and
            (map(.consensus.last_certificate | tojson) | unique | length) == 1 and
            all(
              .consensus.last_certificate.finality_status == "FINALIZED" and
              .consensus.last_certificate.height == .head_height and
              .consensus.last_certificate.block_hash == .head_hash and
              .consensus.last_certificate.signed_power == 3 and
              .consensus.last_certificate.total_power == 3 and
              .consensus.last_certificate.validator_ids ==
                ["validator-01","validator-02","validator-03"] and
              (.consensus.last_certificate.vote_hashes | length) == 3 and
              (.consensus.last_certificate.vote_hashes | unique | length) == 3
            ) and
            all(.consensus.head_height == .head_height) and
            all(.consensus.authenticated_vote_count == 3) and
            all(.consensus.required_vote_count == 3) and
            all(.private_key_material_accepted == false) and
            all(.mainnet_changed == false) and
            all(.assets_moved == false) and
            all(.bridge_activated == false)
          ' artifacts/health-i-*.json
          jq -s '{
            schema_version: "junca-public-testnet-runtime-acceptance/v1",
            result: "PASS",
            validators: .,
            mainnet_changed: false,
            assets_moved: false,
            bridge_activated: false
          }' artifacts/health-i-*.json \
            > artifacts/public-testnet-runtime-acceptance.json
          sha256sum artifacts/public-testnet-runtime-acceptance.json \
            > artifacts/public-testnet-runtime-acceptance.json.sha256

      - name: Require two consecutive canonical finality slots
        run: |
          set -euo pipefail
          mapfile -t instances < artifacts/validator-instance-ids.txt
          initial_height="$(
            jq -s -er '
              (map(.head_height) | unique) as $heads
              | select(($heads | length) == 1)
              | $heads[0]
            ' artifacts/health-i-*.json
          )"
          finality="$(
            jq -ce '
              .automatic_finality_readback.value
              | select(
                  .enabled == true and
                  .block_interval_seconds == 30 and
                  (.slot_epoch_seconds | type) == "number" and
                  .slot_epoch_seconds > 0 and
                  .slot_epoch_seconds % 30 == 0
                )
            ' artifacts/foundation-outputs.json
          )"
          slot_epoch="$(jq -er .slot_epoch_seconds <<<"$finality")"
          interval="$(jq -er .block_interval_seconds <<<"$finality")"
          ready_at="$((slot_epoch + 5))"
          now="$(date +%s)"
          if (( ready_at > now )); then
            sleep "$((ready_at - now))"
          fi

          health_command='curl -fsS http://127.0.0.1:8545/health'
          jq -n --arg command "$health_command" \
            '{commands: [$command]}' > artifacts/ssm-automatic-health.json
          observed_height="$initial_height"
          for series in 1 2; do
            accepted=false
            for observation in $(seq 1 24); do
              command_id="$(aws ssm send-command \
                --instance-ids "${instances[@]}" \
                --document-name AWS-RunShellScript \
                --parameters file://artifacts/ssm-automatic-health.json \
                --comment "JUNCA Canonical Finality Slot ${series} Readback" \
                --query Command.CommandId --output text)"
              for instance in "${instances[@]}"; do
                command_status=""
                for attempt in $(seq 1 30); do
                  command_status="$(aws ssm get-command-invocation \
                    --command-id "$command_id" --instance-id "$instance" \
                    --query Status --output text)"
                  case "$command_status" in
                    Success) break ;;
                    Failed|Cancelled|TimedOut|Cancelling) exit 1 ;;
                  esac
                  test "$attempt" -lt 30
                  sleep 2
                done
                [[ "$command_status" == "Success" ]]
                aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$instance" \
                  > "artifacts/automatic-${series}-command-${instance}.json"
                jq -er .StandardOutputContent \
                  "artifacts/automatic-${series}-command-${instance}.json" \
                  > "artifacts/automatic-${series}-health-${instance}.json"
              done
              if jq -s -e \
                --argjson previous_height "$observed_height" \
                --argjson slot_epoch "$slot_epoch" '
                length == 3 and
                (map(.status) | unique) == ["healthy"] and
                (map(.head_height) | unique | length) == 1 and
                (.[0].head_height > $previous_height) and
                (map(.head_hash) | unique | length) == 1 and
                (map(.head_timestamp) | unique | length) == 1 and
                (map(.consensus.last_certificate_hash) | unique | length) == 1 and
                (map(.consensus.last_certificate | tojson) | unique | length) == 1 and
                all(
                  .automatic_finality_enabled == true and
                  .automatic_finality_loop_running == true and
                  (.peer_count | type) == "number" and
                  .peer_count >= 2 and
                  .block_interval_seconds == 30 and
                  .slot_epoch_seconds == $slot_epoch and
                  (.head_timestamp | type) == "number" and
                  .head_timestamp ==
                    ($slot_epoch +
                      (.automatic_finality_last_successful_slot * 30)) and
                  .automatic_finality.last_successful_height == .head_height and
                  .consensus.last_certificate.finality_status == "FINALIZED" and
                  .consensus.last_certificate.height == .head_height and
                  .consensus.last_certificate.block_hash == .head_hash and
                  .consensus.last_certificate.signed_power == 3 and
                  .consensus.last_certificate.total_power == 3 and
                  .consensus.last_certificate.validator_ids ==
                    ["validator-01","validator-02","validator-03"] and
                  .private_key_material_accepted == false and
                  .mainnet_changed == false and
                  .assets_moved == false and
                  .bridge_activated == false
                )
              ' artifacts/automatic-${series}-health-i-*.json >/dev/null; then
                accepted=true
                observed_height="$(
                  jq -s -er 'map(.head_height) | unique | .[0]' \
                    artifacts/automatic-${series}-health-i-*.json
                )"
                break
              fi
              sleep 5
            done
            test "$accepted" = "true"
          done

          first_timestamp="$(
            jq -s -er 'map(.head_timestamp) | unique | .[0]' \
              artifacts/automatic-1-health-i-*.json
          )"
          final_timestamp="$(
            jq -s -er 'map(.head_timestamp) | unique | .[0]' \
              artifacts/automatic-2-health-i-*.json
          )"
          test "$((final_timestamp - first_timestamp))" -eq "$interval"

          jq -n \
            --argjson initial_height "$initial_height" \
            --argjson slot_epoch "$slot_epoch" \
            --argjson first_timestamp "$first_timestamp" \
            --argjson final_timestamp "$final_timestamp" \
            --slurpfile before <(jq -s '.' artifacts/health-i-*.json) \
            --slurpfile first <(jq -s '.' artifacts/automatic-1-health-i-*.json) \
            --slurpfile second <(jq -s '.' artifacts/automatic-2-health-i-*.json) '{
              schema_version: "junca-public-testnet-runtime-acceptance/v1",
              result: "PASS",
              validators: $second[0],
              observations: {
                before: $before[0],
                first: $first[0],
                second: $second[0],
                initial_height: $initial_height,
                first_height: $first[0][0].head_height,
                final_height: $second[0][0].head_height,
                first_timestamp: $first_timestamp,
                final_timestamp: $final_timestamp,
                consecutive_advances: 2,
                canonical_timestamp_delta_seconds:
                  ($final_timestamp - $first_timestamp),
                head_advanced: true
              },
              automatic_finality: {
                enabled: true,
                block_interval_seconds: 30,
                slot_epoch_seconds: $slot_epoch
              },
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/public-testnet-runtime-acceptance.json
          sha256sum artifacts/public-testnet-runtime-acceptance.json \
            > artifacts/public-testnet-runtime-acceptance.json.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junca-validator-foundation-release-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
