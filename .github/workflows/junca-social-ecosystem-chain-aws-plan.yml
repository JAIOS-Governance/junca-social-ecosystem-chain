name: JUNCA Social Ecosystem Chain AWS Plan

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/aws/**"
      - "scripts/junca_social_ecosystem_chain_aws_preflight.py"
      - "tests/test_junca_social_ecosystem_chain_aws_infrastructure.py"
      - "tests/test_junca_social_ecosystem_chain_aws_oidc_bootstrap.py"
      - "requirements/ci-yaml.txt"
      - ".github/workflows/junca-social-ecosystem-chain-aws-plan.yml"
      - ".github/workflows/junca-social-ecosystem-chain-aws-readback.yml"
  pull_request:
    paths:
      - "infrastructure/aws/**"
      - "scripts/junca_social_ecosystem_chain_aws_preflight.py"
      - "tests/test_junca_social_ecosystem_chain_aws_infrastructure.py"
      - "tests/test_junca_social_ecosystem_chain_aws_oidc_bootstrap.py"
      - "requirements/ci-yaml.txt"
      - ".github/workflows/junca-social-ecosystem-chain-aws-plan.yml"
      - ".github/workflows/junca-social-ecosystem-chain-aws-readback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - name: Install hash-pinned YAML parser
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/ci-yaml.txt
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.7.5"
      - name: Terraform format
        run: terraform -chdir=infrastructure/aws fmt -check -recursive
      - name: Terraform init without backend
        run: terraform -chdir=infrastructure/aws init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure/aws validate
      - name: Verify fail-closed AWS boundary
        run: |
          mkdir -p artifacts
          python scripts/junca_social_ecosystem_chain_aws_preflight.py \
            > artifacts/junca-aws-preflight.json
          grep -q '"state": "BLOCKED_FAIL_CLOSED"' artifacts/junca-aws-preflight.json
          grep -q '"apply_authorized": false' artifacts/junca-aws-preflight.json
          python -m unittest tests.test_junca_social_ecosystem_chain_aws_infrastructure -v
          python -m unittest tests.test_junca_social_ecosystem_chain_aws_oidc_bootstrap -v
      - name: Upload AWS plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junca-aws-plan-${{ github.run_id }}
          path: artifacts/junca-aws-preflight.json
          if-no-files-found: error
          retention-days: 90
