name: JUNCA Chain Custom Domain Final Execution

on:
  push:
    branches: [main]
    paths: [".github/workflows/junca-chain-domain-final-execution.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-standard-oidc:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore AWS-compatible standard OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --fail-with-body --silent --show-error -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "$endpoint" --data '{"use_default":true}'

  repair-and-upsert:
    needs: prepare-standard-oidc
    runs-on: ubuntu-latest
    environment: public-testnet
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      BOOTSTRAP_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - name: Configure canonical public-testnet recovery identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: chain-domain-final-${{ github.run_id }}
          disable-retry: true
      - name: Verify account and install least-privilege DNS policy
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          cat >/tmp/policy.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Sid":"ChainCustomDomainDnsWrite","Effect":"Allow","Action":"route53:ChangeResourceRecordSets","Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G","Condition":{"ForAllValues:StringEquals":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":["chain.jaios-governance.org","_openai-site-verification.chain.jaios-governance.org","_cf-custom-hostname.chain.jaios-governance.org"],"route53:ChangeResourceRecordSetsRecordTypes":["CNAME","TXT"],"route53:ChangeResourceRecordSetsActions":["UPSERT"]}}},{"Sid":"Route53ChangeReadback","Effect":"Allow","Action":"route53:GetChange","Resource":"arn:aws:route53:::change/*"}]}
          JSON
          aws iam put-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns --policy-document file:///tmp/policy.json
          aws iam get-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns >/tmp/iam-readback.json
      - name: UPSERT exact Sites-issued records
        id: dns
        run: |
          set -euo pipefail
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          cat >/tmp/change.json <<'JSON'
          {"Comment":"Bind chain.jaios-governance.org to Sites","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"chain.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
      - name: Read back exact records and protected names
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.']" --output json)"
          RECORDS="$records" python3 - <<'PY'
          import json, os
          rows = {r['Name']: r for r in json.loads(os.environ['RECORDS'])}
          assert rows['chain.jaios-governance.org.']['TTL'] == 300
          assert rows['chain.jaios-governance.org.']['ResourceRecords'][0]['Value'] == 'custom-domains.chatgpt.site.'
          assert 'openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM' in rows['_openai-site-verification.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          assert '0ff4e945-6380-45d2-a7fc-79e43e99da79' in rows['_cf-custom-hostname.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          PY
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='docs.jaios-governance.org.'] | length(@)" --output text)" != "0"
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='explorer.jaios-governance.org.'] | length(@)" --output text)" = "0"
          { echo "### JUNCA Chain custom domain final execution"; echo "- AWS Account: $AWS_ACCOUNT_ID"; echo "- Route 53 Change: ${{ steps.dns.outputs.change_id }}"; echo "- DNS Status: INSYNC"; echo "- docs preserved: true"; echo "- explorer created or changed: false"; echo "- URL: https://chain.jaios-governance.org/"; } >> "$GITHUB_STEP_SUMMARY"

  restore-canonical-oidc:
    if: always()
    needs: repair-and-upsert
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore canonical immutable repository context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --fail-with-body --silent --show-error -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "$endpoint" --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
