name: JUNCA Chain Custom Domain Final Execution

on:
  push:
    branches: [main]
    paths: [".github/workflows/junca-chain-domain-final-execution.yml"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  repair-and-upsert:
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      AWS_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      STACK_NAME: junca-chain-docs-publication
    steps:
      - uses: actions/checkout@v4

      - name: Configure production identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: chain-domain-final-${{ github.run_id }}

      - name: Verify immutable production boundary
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."

      - name: Reconcile canonical stack
        run: |
          set -euo pipefail
          set +e
          output="$(aws cloudformation update-stack \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-body file://infra/aws/docs-publication/main.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=DomainName,ParameterValue=docs.jaios-governance.org \
              ParameterKey=HostedZoneId,ParameterValue="$HOSTED_ZONE_ID" \
              ParameterKey=Repository,ParameterValue=JAIOS-Governance/junca-social-ecosystem-chain \
              ParameterKey=RepositoryOwnerId,ParameterValue=308604370 \
              ParameterKey=RepositoryId,ParameterValue=1310568313 \
              ParameterKey=EnvironmentName,ParameterValue=junca-chain-docs-production \
              ParameterKey=ExistingGitHubOidcProviderArn,ParameterValue=arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && ! grep -q "No updates are to be performed" <<<"$output"; then
            printf '%s\n' "$output" >&2
            exit "$rc"
          fi
          printf '%s\n' "$output"
          aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" || true

      - name: UPSERT exact Sites-issued records
        id: dns
        run: |
          set -euo pipefail
          cat >/tmp/change.json <<'JSON'
          {"Comment":"Bind chain.jaios-governance.org to Sites","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"chain.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"

      - name: Read back exact records and persist evidence
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.' || Name=='docs.jaios-governance.org.' || Name=='explorer.jaios-governance.org.']" --output json)"
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?Name=='docs.jaios-governance.org.'])" --output text)" != "0"
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?Name=='explorer.jaios-governance.org.'])" --output text)" = "0"
          mkdir -p evidence
          RECORDS="$records" python3 - <<'PY'
          import json, os
          rows=json.loads(os.environ['RECORDS'])
          by={r['Name']:r for r in rows}
          assert by['chain.jaios-governance.org.']['TTL']==300
          assert by['chain.jaios-governance.org.']['ResourceRecords'][0]['Value']=='custom-domains.chatgpt.site.'
          assert 'openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM' in by['_openai-site-verification.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          assert '0ff4e945-6380-45d2-a7fc-79e43e99da79' in by['_cf-custom-hostname.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          payload={
            'status':'PRODUCTION_DNS_COMPLETE',
            'aws_account':'595710543956',
            'hosted_zone':'Z0336017285464TX0NT1G',
            'route53_change_id':'${{ steps.dns.outputs.change_id }}',
            'route53_status':'INSYNC',
            'docs_preserved':True,
            'explorer_created':False,
            'production_url':'https://chain.jaios-governance.org/',
            'workflow_run':'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            'records':rows
          }
          open('evidence/chain-domain-production-readback.json','w').write(json.dumps(payload,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/chain-domain-production-readback.json
          git commit -m "Record chain domain production DNS readback"
          git push
