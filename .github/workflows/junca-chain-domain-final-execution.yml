name: JUNCA Chain Custom Domain Final Execution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-canonical-oidc:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set canonical GitHub OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location --request PUT --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10" "$endpoint" --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'

  recover-chain-domain:
    needs: set-canonical-oidc
    runs-on: ubuntu-latest
    environment: public-testnet
    permissions:
      id-token: write
      contents: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      BOOTSTRAP_ROLE_ARN: arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure canonical AWS bootstrap identity
        id: aws_auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-chain-domain-recovery-${{ github.run_id }}
          disable-retry: true

      - name: Repair IAM and publish chain domain
        id: execute
        if: steps.aws_auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          zone="$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)"
          test "$account" = "$AWS_ACCOUNT_ID"
          test "$zone" = "jaios-governance.org."
          cat >/tmp/policy.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Sid":"ChainCustomDomainDnsWrite","Effect":"Allow","Action":"route53:ChangeResourceRecordSets","Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G","Condition":{"ForAllValues:StringEquals":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":["chain.jaios-governance.org","_openai-site-verification.chain.jaios-governance.org","_cf-custom-hostname.chain.jaios-governance.org"],"route53:ChangeResourceRecordSetsRecordTypes":["CNAME","TXT"],"route53:ChangeResourceRecordSetsActions":["UPSERT"]},"Null":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":"false","route53:ChangeResourceRecordSetsRecordTypes":"false","route53:ChangeResourceRecordSetsActions":"false"}}},{"Sid":"Route53ChangeReadback","Effect":"Allow","Action":"route53:GetChange","Resource":"arn:aws:route53:::change/*"}]}
          JSON
          set +e
          iam_output="$(aws iam put-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns --policy-document file:///tmp/policy.json 2>&1)"
          iam_rc=$?
          set -e
          if [ "$iam_rc" -ne 0 ]; then printf '%s\n' "$iam_output" > /tmp/recovery_error.txt; exit "$iam_rc"; fi
          aws iam get-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns >/tmp/iam-readback.json
          cat >/tmp/change.json <<'JSON'
          {"Comment":"Bind chain.jaios-governance.org to Sites","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"chain.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = INSYNC
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.' || Name=='docs.jaios-governance.org.' || Name=='explorer.jaios-governance.org.']" --output json)"
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?Name=='docs.jaios-governance.org.'])" --output text)" != 0
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?Name=='explorer.jaios-governance.org.'])" --output text)" = 0
          mkdir -p evidence
          ACCOUNT="$account" ZONE="$zone" CHANGE_ID="$change_id" RECORDS="$records" python3 - <<'PY'
          import json, os
          rows=json.loads(os.environ['RECORDS']); by={r['Name']:r for r in rows}
          assert by['chain.jaios-governance.org.']['TTL']==300
          assert by['chain.jaios-governance.org.']['ResourceRecords'][0]['Value']=='custom-domains.chatgpt.site.'
          assert 'openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM' in by['_openai-site-verification.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          assert '0ff4e945-6380-45d2-a7fc-79e43e99da79' in by['_cf-custom-hostname.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          payload={'status':'PRODUCTION_DNS_COMPLETE','aws_account':os.environ['ACCOUNT'],'hosted_zone':'Z0336017285464TX0NT1G','hosted_zone_name':os.environ['ZONE'],'iam_policy':'ChainBrandCustomDomainDns','route53_change_id':os.environ['CHANGE_ID'],'route53_status':'INSYNC','docs_preserved':True,'explorer_created':False,'production_url':'https://chain.jaios-governance.org/','workflow_run':'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}','records':rows}
          open('evidence/chain-domain-production-readback.json','w').write(json.dumps(payload,indent=2))
          PY

      - name: Persist execution result
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.aws_auth.outcome }}
          EXEC_OUTCOME: ${{ steps.execute.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [ "$AUTH_OUTCOME" != success ] || [ "$EXEC_OUTCOME" != success ]; then
            python3 - <<'PY'
          import json, os
          payload={'status':'BLOCKED','aws_auth_outcome':os.environ.get('AUTH_OUTCOME'),'execution_outcome':os.environ.get('EXEC_OUTCOME'),'workflow_run':'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'}
          try: payload['error']=open('/tmp/recovery_error.txt').read()[:4000]
          except FileNotFoundError: payload['error']='AWS OIDC authentication or pre-execution failure'
          open('evidence/chain-domain-production-readback.json','w').write(json.dumps(payload,indent=2))
          PY
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/chain-domain-production-readback.json
          git commit -m "Record chain domain production execution result" || true
          git push

      - name: Enforce success
        if: always()
        run: |
          test "${{ steps.aws_auth.outcome }}" = success
          test "${{ steps.execute.outcome }}" = success
