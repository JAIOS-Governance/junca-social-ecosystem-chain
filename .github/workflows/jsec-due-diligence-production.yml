name: JSEC Restricted Due-Diligence Publication

on:
  push:
    branches: [main]
    paths:
      - "docs/technical-reference/snapshot/due-diligence/**"
      - "docs/technical-reference/snapshot/due-diligence.json"
      - "docs/technical-reference/snapshot/due-diligence.txt"
      - "docs/technical-reference/snapshot/sitemap.xml"
      - ".github/workflows/jsec-due-diligence-production.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/technical-reference/snapshot/due-diligence/**"
      - "docs/technical-reference/snapshot/due-diligence.json"
      - "docs/technical-reference/snapshot/due-diligence.txt"
      - "docs/technical-reference/snapshot/sitemap.xml"
      - ".github/workflows/jsec-due-diligence-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsec-restricted-due-diligence-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate direct-link-only visibility policy
        shell: bash
        run: |
          set -euo pipefail
          root="docs/technical-reference/snapshot"
          html="${root}/due-diligence/index.html"
          json="${root}/due-diligence.json"
          text="${root}/due-diligence.txt"
          sitemap="${root}/sitemap.xml"

          test -s "${html}"
          test -s "${json}"
          test -s "${text}"
          test -s "${sitemap}"
          python -m json.tool "${json}" >/dev/null

          grep -F '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">' "${html}"
          grep -F '<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">' "${html}"
          grep -F 'Direct-link review record' "${html}"
          grep -F '通常のウェブサイト導線、ホームページおよび公開サイトマップには掲載しません' "${html}"
          grep -F 'JUNCA Social Ecosystem Chain (JSEC)' "${html}"
          grep -F 'Mainnet Changed' "${html}"
          grep -F 'Assets Moved' "${html}"
          grep -F 'Bridge Activated' "${html}"
          grep -F 'JUNCA GLOBAL CHAIN' "${html}" "${json}" "${text}"
          grep -F 'JCC / JUNCA CASH' "${html}" "${json}" "${text}"

          if grep -Fq 'due-diligence' "${sitemap}"; then
            echo "Due-diligence must not appear in the public sitemap" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("docs/technical-reference/snapshot")
          payload = json.loads((root / "due-diligence.json").read_text())
          assert payload["schema"] == "jsec-due-diligence/v1"
          assert payload["issuer"] == "JAIOS Institutional Governance"
          assert payload["network_boundary"] == {
              "mainnet_changed": False,
              "assets_moved": False,
              "bridge_activated": False,
          }

          link_pattern = re.compile(
              r'href=["\'](?:https://docs\.jaios-governance\.org)?/due-diligence(?:/|\.|["\'])',
              re.IGNORECASE,
          )
          violations = []
          for path in root.rglob("*.html"):
              if "due-diligence" in path.parts:
                  continue
              if link_pattern.search(path.read_text(errors="ignore")):
                  violations.append(str(path))
          if violations:
              raise SystemExit("Ordinary public pages link to due-diligence: " + ", ".join(violations))
          PY

          if grep -Eqi 'No Monetary Value|金銭価値なし|\bPENDING\b' "${html}" "${json}" "${text}"; then
            echo "Prohibited wording detected" >&2
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure publication-only AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
          aws-region: us-east-1
          role-session-name: jsec-restricted-dd-${{ github.run_id }}
      - name: Read back exact publication target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${account_id}" = "595710543956"
          bucket="junca-chain-docs-${account_id}"
          distribution_id="$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'docs.jaios-governance.org')].Id | [0]" --output text)"
          test -n "${distribution_id}"
          test "${distribution_id}" != "None"
          test "$(aws s3api get-bucket-versioning --bucket "${bucket}" --query Status --output text)" = "Enabled"
          test "$(aws cloudfront get-distribution --id "${distribution_id}" --query Distribution.Status --output text)" = "Deployed"
          printf 'bucket=%s\n' "${bucket}" >> "$GITHUB_OUTPUT"
          printf 'distribution_id=%s\n' "${distribution_id}" >> "$GITHUB_OUTPUT"
      - name: Publish restricted review records and public sitemap
        shell: bash
        run: |
          set -euo pipefail
          root="docs/technical-reference/snapshot"
          bucket="${{ steps.target.outputs.bucket }}"
          restricted_cache="private,no-store,max-age=0,must-revalidate"
          public_cache="public,max-age=0,must-revalidate"

          aws s3 cp "${root}/due-diligence/index.html" "s3://${bucket}/due-diligence/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "${restricted_cache}"
          aws s3 cp "${root}/due-diligence.json" "s3://${bucket}/due-diligence.json" \
            --content-type "application/json; charset=utf-8" --cache-control "${restricted_cache}"
          aws s3 cp "${root}/due-diligence.txt" "s3://${bucket}/due-diligence.txt" \
            --content-type "text/plain; charset=utf-8" --cache-control "${restricted_cache}"
          aws s3 cp "${root}/sitemap.xml" "s3://${bucket}/sitemap.xml" \
            --content-type "application/xml; charset=utf-8" --cache-control "${public_cache}"
      - name: Invalidate exact visibility-policy paths
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.target.outputs.distribution_id }}" \
            --paths "/" "/due-diligence" "/due-diligence/" "/due-diligence/*" "/due-diligence.json" "/due-diligence.txt" "/sitemap.xml" \
            --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.target.outputs.distribution_id }}" --id "${invalidation_id}"
          test "$(aws cloudfront get-invalidation \
            --distribution-id "${{ steps.target.outputs.distribution_id }}" --id "${invalidation_id}" \
            --query Invalidation.Status --output text)" = "Completed"
          printf 'id=%s\n' "${invalidation_id}" >> "$GITHUB_OUTPUT"
      - name: Production visibility readback
        shell: bash
        run: |
          set -euo pipefail
          root="docs/technical-reference/snapshot"
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/home.html https://docs.jaios-governance.org/
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/due-diligence.html https://docs.jaios-governance.org/due-diligence/
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/due-diligence.json https://docs.jaios-governance.org/due-diligence.json
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/due-diligence.txt https://docs.jaios-governance.org/due-diligence.txt
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/sitemap.xml https://docs.jaios-governance.org/sitemap.xml

          cmp "${root}/due-diligence/index.html" /tmp/due-diligence.html
          cmp "${root}/due-diligence.json" /tmp/due-diligence.json
          cmp "${root}/due-diligence.txt" /tmp/due-diligence.txt
          cmp "${root}/sitemap.xml" /tmp/sitemap.xml

          grep -F '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">' /tmp/due-diligence.html
          grep -F 'Direct-link review record' /tmp/due-diligence.html
          if grep -Fq 'due-diligence' /tmp/sitemap.xml; then
            echo "Production sitemap still exposes due-diligence" >&2
            exit 1
          fi
          if grep -Fq '/due-diligence' /tmp/home.html; then
            echo "Production homepage exposes due-diligence" >&2
            exit 1
          fi

          restricted_headers="$(curl --fail --silent --show-error --head --location https://docs.jaios-governance.org/due-diligence/)"
          grep -Eqi '^cache-control:.*private' <<< "${restricted_headers}"
          grep -Eqi '^cache-control:.*no-store' <<< "${restricted_headers}"
          sitemap_headers="$(curl --fail --silent --show-error --head --location https://docs.jaios-governance.org/sitemap.xml)"
          grep -Eqi '^cache-control:.*public' <<< "${sitemap_headers}"

          {
            echo "### JSEC restricted due-diligence visibility readback"
            echo "- Invalidation: \`${{ steps.invalidate.outputs.id }}\`"
            echo "- Direct URL: HTTP 200 and exact content"
            echo "- Robots policy: noindex / nofollow / noarchive / nosnippet"
            echo "- Homepage link: absent"
            echo "- Public sitemap entries: absent"
            echo "- Restricted cache policy: private / no-store"
            echo "- Mainnet Changed=false; Assets Moved=false; Bridge Activated=false"
          } >> "$GITHUB_STEP_SUMMARY"
