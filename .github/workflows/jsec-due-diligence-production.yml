name: JSEC Due Diligence Production

on:
  push:
    branches: [main]
    paths:
      - "docs/technical-reference/snapshot/due-diligence/**"
      - "docs/technical-reference/snapshot/due-diligence.json"
      - "docs/technical-reference/snapshot/due-diligence.txt"
      - "docs/technical-reference/snapshot/sitemap.xml"
      - ".github/workflows/jsec-due-diligence-production.yml"
  pull_request:
    paths:
      - "docs/technical-reference/snapshot/due-diligence/**"
      - "docs/technical-reference/snapshot/due-diligence.json"
      - "docs/technical-reference/snapshot/due-diligence.txt"
      - "docs/technical-reference/snapshot/sitemap.xml"
      - ".github/workflows/jsec-due-diligence-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsec-due-diligence-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate due-diligence artifacts
        shell: bash
        run: |
          set -euo pipefail
          html="docs/technical-reference/snapshot/due-diligence/index.html"
          json="docs/technical-reference/snapshot/due-diligence.json"
          text="docs/technical-reference/snapshot/due-diligence.txt"
          sitemap="docs/technical-reference/snapshot/sitemap.xml"

          test -s "${html}"
          test -s "${json}"
          test -s "${text}"
          test -s "${sitemap}"
          python -m json.tool "${json}" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("docs/technical-reference/snapshot/due-diligence.json").read_text())
          assert payload["schema"] == "jsec-due-diligence/v1"
          assert payload["issuer"] == "JAIOS Institutional Governance"
          assert payload["current_identity"] == {
              "formal_name": "JUNCA Social Ecosystem Chain",
              "abbreviation": "JSEC",
              "network_posture": "Public Testnet",
              "canonical_identity_record": "https://docs.jaios-governance.org/current-identity/",
          }
          assert payload["network_boundary"] == {
              "mainnet_changed": False,
              "assets_moved": False,
              "bridge_activated": False,
          }
          historical = {item["name"] for item in payload["historical_materials"]}
          assert historical == {"JUNCA GLOBAL CHAIN", "legacy uses of junca Chain", "JCC / JUNCA CASH"}
          PY

          grep -F '<link rel="canonical" href="https://docs.jaios-governance.org/due-diligence/">' "${html}"
          grep -F 'JUNCA Social Ecosystem Chain (JSEC)' "${html}"
          grep -F 'Mainnet Changed' "${html}"
          grep -F 'Assets Moved' "${html}"
          grep -F 'Bridge Activated' "${html}"
          grep -F 'JUNCA GLOBAL CHAIN' "${html}" "${json}" "${text}"
          grep -F 'JCC / JUNCA CASH' "${html}" "${json}" "${text}"
          grep -F 'https://docs.jaios-governance.org/due-diligence/' "${sitemap}"
          grep -F 'https://docs.jaios-governance.org/due-diligence.json' "${sitemap}"
          grep -F 'https://docs.jaios-governance.org/due-diligence.txt' "${sitemap}"

          if grep -Eqi 'No Monetary Value|金銭価値なし|\bPENDING\b' "${html}" "${json}" "${text}"; then
            echo "Prohibited wording detected" >&2
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure publication-only AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
          aws-region: us-east-1
          role-session-name: jsec-due-diligence-${{ github.run_id }}
      - name: Read back exact publication target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${account_id}" = "595710543956"
          bucket="junca-chain-docs-${account_id}"
          distribution_id="$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'docs.jaios-governance.org')].Id | [0]" --output text)"
          test -n "${distribution_id}"
          test "${distribution_id}" != "None"
          test "$(aws s3api get-bucket-versioning --bucket "${bucket}" --query Status --output text)" = "Enabled"
          test "$(aws cloudfront get-distribution --id "${distribution_id}" --query Distribution.Status --output text)" = "Deployed"
          printf 'bucket=%s\n' "${bucket}" >> "$GITHUB_OUTPUT"
          printf 'distribution_id=%s\n' "${distribution_id}" >> "$GITHUB_OUTPUT"
      - name: Publish due-diligence artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_root="docs/technical-reference/snapshot"
          bucket="${{ steps.target.outputs.bucket }}"
          cache_control="public,max-age=0,must-revalidate"
          aws s3 cp "${source_root}/due-diligence/index.html" "s3://${bucket}/due-diligence/index.html" --content-type "text/html; charset=utf-8" --cache-control "${cache_control}"
          aws s3 cp "${source_root}/due-diligence.json" "s3://${bucket}/due-diligence.json" --content-type "application/json; charset=utf-8" --cache-control "${cache_control}"
          aws s3 cp "${source_root}/due-diligence.txt" "s3://${bucket}/due-diligence.txt" --content-type "text/plain; charset=utf-8" --cache-control "${cache_control}"
          aws s3 cp "${source_root}/sitemap.xml" "s3://${bucket}/sitemap.xml" --content-type "application/xml; charset=utf-8" --cache-control "${cache_control}"
      - name: Invalidate exact due-diligence paths
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "${{ steps.target.outputs.distribution_id }}" --paths "/due-diligence" "/due-diligence/" "/due-diligence/*" "/due-diligence.json" "/due-diligence.txt" "/sitemap.xml" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "${{ steps.target.outputs.distribution_id }}" --id "${invalidation_id}"
          test "$(aws cloudfront get-invalidation --distribution-id "${{ steps.target.outputs.distribution_id }}" --id "${invalidation_id}" --query Invalidation.Status --output text)" = "Completed"
          printf 'id=%s\n' "${invalidation_id}" >> "$GITHUB_OUTPUT"
      - name: Public production readback
        shell: bash
        run: |
          set -euo pipefail
          source_root="docs/technical-reference/snapshot"
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors --output /tmp/due-diligence.html https://docs.jaios-governance.org/due-diligence/
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors --output /tmp/due-diligence.json https://docs.jaios-governance.org/due-diligence.json
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors --output /tmp/due-diligence.txt https://docs.jaios-governance.org/due-diligence.txt
          curl --fail-with-body --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors --output /tmp/sitemap.xml https://docs.jaios-governance.org/sitemap.xml

          cmp "${source_root}/due-diligence/index.html" /tmp/due-diligence.html
          cmp "${source_root}/due-diligence.json" /tmp/due-diligence.json
          cmp "${source_root}/due-diligence.txt" /tmp/due-diligence.txt
          cmp "${source_root}/sitemap.xml" /tmp/sitemap.xml

          for url in https://docs.jaios-governance.org/due-diligence/ https://docs.jaios-governance.org/due-diligence.json https://docs.jaios-governance.org/due-diligence.txt https://docs.jaios-governance.org/sitemap.xml; do
            headers="$(curl --fail --silent --show-error --head --location "${url}")"
            grep -i '^cache-control: public,max-age=0,must-revalidate' <<< "${headers}"
          done

          grep -F 'Official due-diligence record' /tmp/due-diligence.html
          jq -e '.schema == "jsec-due-diligence/v1"' /tmp/due-diligence.json
          grep -F 'JSEC-DD-2026-08-05' /tmp/due-diligence.txt
          {
            echo "### JSEC due-diligence production readback"
            echo "- Invalidation: \`${{ steps.invalidate.outputs.id }}\`"
            echo "- HTML: https://docs.jaios-governance.org/due-diligence/"
            echo "- JSON: https://docs.jaios-governance.org/due-diligence.json"
            echo "- TXT: https://docs.jaios-governance.org/due-diligence.txt"
            echo "- Exact content and cache readback: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
