name: JUNCA Emergency Public Acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-public-acceptance.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Explorer Health and RPC
        run: |
          set -euo pipefail
          curl -fsS https://explorer.jaios-governance.org/explorer.json -o /tmp/x
          curl -fsS https://health.jaios-governance.org/health -o /tmp/h
          curl -fsS -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ -o /tmp/r
          jq . /tmp/x
          jq . /tmp/h
          jq . /tmp/r
          jq -e '.status=="ready" and .head.signed_power==3 and .head.total_power==3 and .mainnet_changed==false and .assets_moved==false and .bridge_activated==false' /tmp/x
          jq -e '.status=="healthy" and ((.consensus.last_certificate.signed_power // .head.signed_power)==3) and .mainnet_changed==false and .assets_moved==false and .bridge_activated==false' /tmp/h
          jq -e '.result=="0x1352773"' /tmp/r
