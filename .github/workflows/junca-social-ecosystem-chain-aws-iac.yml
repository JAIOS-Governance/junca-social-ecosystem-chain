name: JUNCA Chain AWS IaC

on:
  push:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - "infrastructure/aws/**"
      - "tests/test_junca_social_ecosystem_chain_aws_foundation.py"
      - "config/junca_social_ecosystem_chain_aws_binding.pending.json"
      - "config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json"
      - ".github/workflows/junca-social-ecosystem-chain-aws-iac.yml"
      - ".github/workflows/junca-social-ecosystem-chain-aws-foundation-execution.yml"
  pull_request:
    paths:
      - "infra/aws/**"
      - "infrastructure/aws/**"
      - "tests/test_junca_social_ecosystem_chain_aws_foundation.py"
      - "config/junca_social_ecosystem_chain_aws_binding.pending.json"
      - "config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json"
      - ".github/workflows/junca-social-ecosystem-chain-aws-iac.yml"
      - ".github/workflows/junca-social-ecosystem-chain-aws-foundation-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - module: infra/aws/bootstrap
            evidence_name: bootstrap
          - module: infra/aws/public-testnet
            evidence_name: public-testnet
          - module: infrastructure/aws
            evidence_name: legacy-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform format
        run: terraform -chdir=${{ matrix.module }} fmt -check -recursive

      - name: Terraform initialize without backend
        run: terraform -chdir=${{ matrix.module }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.module }} validate -no-color

      - name: Validate fail-closed AWS binding
        if: matrix.module == 'infrastructure/aws'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/junca_social_ecosystem_chain_aws_binding.pending.json")
          binding = json.loads(path.read_text(encoding="utf-8"))
          assert binding["chain_name"] == "JUNCA Social Ecosystem Chain"
          assert binding["governance"] == "JAIOS Institutional Governance"
          assert binding["notice"] == "Public Testnet / No Monetary Value"
          assert binding["provider"] == "aws"
          assert binding["binding_state"] == "BLOCKED"
          assert binding["mainnet_changed"] is False
          assert binding["assets_moved"] is False
          assert binding["bridge_activated"] is False
          assert binding["bridge_route_paused"] is True
          assert len(binding["availability_zones"]) == 3
          assert len(binding["validator_signer_arns"]) == 3
          assert all("PENDING" in value for value in binding["validator_signer_arns"])
          PY

      - name: Validate separated AWS foundation gates
        run: |
          mkdir -p artifacts
          cp config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json \
            artifacts/junca-aws-foundation-gates.json
          python -m unittest tests.test_junca_social_ecosystem_chain_aws_foundation -v

      - name: Upload AWS foundation gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: junca-aws-foundation-gates-${{ matrix.evidence_name }}-${{ github.run_id }}
          path: artifacts/junca-aws-foundation-gates.json
          if-no-files-found: error
          retention-days: 90

      - name: Reject secret material
        run: |
          ! grep -RIE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|mnemonic|seed_phrase|secret_value|private_key[[:space:]]*=)' \
            --exclude='README.md' \
            --exclude='*.tftpl' \
            infra/aws config/junca_social_ecosystem_chain_aws_binding.pending.json
