name: JUNCA Chain Route53 Single Record Recovery

on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure production role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: chain-route53-single-${{ github.run_id }}
          disable-retry: true
      - name: Verify account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - name: UPSERT chain CNAME and capture result
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cat >/tmp/change.json <<'JSON'
          {
            "Comment": "Recover JUNCA Chain custom domain CNAME",
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "chain.jaios-governance.org.",
                "Type": "CNAME",
                "TTL": 300,
                "ResourceRecords": [{"Value": "custom-domains.chatgpt.site."}]
              }
            }]
          }
          JSON
          aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch file:///tmp/change.json \
            > /tmp/result.json 2> /tmp/error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic evidence
        shell: bash
        env:
          APPLY_RC: ${{ steps.apply.outputs.rc }}
        run: |
          set -euo pipefail
          mkdir -p evidence/production
          {
            echo '# JUNCA Chain Route 53 Single Record Recovery'
            echo
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Apply return code: ${APPLY_RC:-unknown}"
            echo
            echo '## Result'
            echo '```json'
            cat /tmp/result.json 2>/dev/null || true
            echo '```'
            echo
            echo '## Error'
            echo '```text'
            sed -E 's/(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN)=[^ ]+/***REDACTED***/g' /tmp/error.txt 2>/dev/null || true
            echo '```'
          } > evidence/production/chain-route53-single-record-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/production/chain-route53-single-record-latest.md
          git commit -m "Record Route 53 single-record recovery run $GITHUB_RUN_ID"
          git push
