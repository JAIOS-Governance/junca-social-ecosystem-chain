name: JUNCA Emergency Validator State and Finality Restore

on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-state-finality-${{ github.run_id }}

      - name: Recover validator-01 state mount and runtime environment
        run: |
          set -euo pipefail
          source_instance=i-055763640261c47df
          target_instance=i-015288fae43f2b40f
          source_command="$(aws ssm send-command --instance-ids "$source_instance" --document-name AWS-RunShellScript --parameters 'commands=["base64 -w0 /etc/junca/runtime.env"]' --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$source_command" --instance-id "$source_instance"
          source_invocation="$(aws ssm get-command-invocation --command-id "$source_command" --instance-id "$source_instance")"
          jq -e '.Status == "Success"' <<<"$source_invocation"
          jq -er .StandardOutputContent <<<"$source_invocation" | base64 -d > /tmp/runtime.env
          sed -i -E 's/^VALIDATOR_ID=.*/VALIDATOR_ID=validator-01/' /tmp/runtime.env
          sed -i -E 's|^SIGNER_RESOURCE_ARN=.*|SIGNER_RESOURCE_ARN=arn:aws:kms:us-east-1:595710543956:key/72960fd3-1860-41b7-bd2f-4f5b682805d1|' /tmp/runtime.env
          sed -i -E 's/^NODE_ARTIFACT_SHA256=.*/NODE_ARTIFACT_SHA256=6441304649985de9a12c8758584785e0e0cc980b793fb735a1c5f0cffba70f14/' /tmp/runtime.env
          runtime_b64="$(base64 -w0 /tmp/runtime.env)"
          jq -n --arg runtime "$runtime_b64" '{commands:[
            "set -euo pipefail",
            "volume_id=vol-0277b6a13ecf87efe; serial=${volume_id//-/}; device=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_${serial}; for attempt in $(seq 1 60); do test -b $device && break; sleep 2; done; test -b $device",
            "resolved=$(readlink -f /dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_vol0277b6a13ecf87efe); test -b $resolved; install -d -m 0750 /var/lib/junca; mountpoint -q /var/lib/junca || mount -o noatime,nosuid,nodev $resolved /var/lib/junca; test -f /var/lib/junca/state.sqlite",
            "printf %s " + ($runtime|@sh) + " | base64 -d > /etc/junca/runtime.env; chmod 0640 /etc/junca/runtime.env",
            "systemctl daemon-reload; systemctl enable junca-validator.service; systemctl reset-failed junca-validator.service || true; systemctl restart junca-validator.service",
            "for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health && exit 0; sleep 2; done; systemctl status junca-validator.service --no-pager -l; journalctl -u junca-validator.service --no-pager -n 120; exit 1"
          ]}' > /tmp/validator01-recover.json
          command_id="$(aws ssm send-command --instance-ids "$target_instance" --document-name AWS-RunShellScript --parameters file:///tmp/validator01-recover.json --comment 'Restore validator-01 retained state and runtime environment' --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$target_instance" || true
          result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$target_instance")"
          jq -r '.Status, .StandardOutputContent, .StandardErrorContent' <<<"$result"
          jq -e '.Status == "Success"' <<<"$result"

      - name: Restore exact-three automatic finality
        run: |
          set -euo pipefail
          instances=(i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b)
          now="$(date +%s)"
          epoch="$(( ((now + 120 + 29) / 30) * 30 ))"
          jq -n --arg epoch "$epoch" '{commands:[
            "set -euo pipefail",
            "sed -i -E s/^AUTOMATIC_FINALITY_ENABLED=.*/AUTOMATIC_FINALITY_ENABLED=true/ /etc/junca/runtime.env",
            "sed -i -E s/^TESTNET_BLOCK_INTERVAL_SECONDS=.*/TESTNET_BLOCK_INTERVAL_SECONDS=30/ /etc/junca/runtime.env",
            "sed -i -E s/^TESTNET_SLOT_EPOCH_SECONDS=.*/TESTNET_SLOT_EPOCH_SECONDS=" + $epoch + "/ /etc/junca/runtime.env",
            "systemctl restart junca-validator.service",
            "for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health >/dev/null && exit 0; sleep 2; done; exit 1"
          ]}' > /tmp/finality.json
          command_id="$(aws ssm send-command --instance-ids "${instances[@]}" --document-name AWS-RunShellScript --parameters file:///tmp/finality.json --comment 'Restore JUNCA exact-three automatic finality' --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" || true
            result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance")"
            jq -e '.Status == "Success"' <<<"$result"
          done
          sleep 150

      - name: Restart Gateways and require public acceptance
        run: |
          set -euo pipefail
          instances=(i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b)
          jq -n '{commands:["set -euo pipefail","systemctl restart junca-public-rpc.service junca-public-explorer.service"]}' > /tmp/gateways.json
          command_id="$(aws ssm send-command --instance-ids "${instances[@]}" --document-name AWS-RunShellScript --parameters file:///tmp/gateways.json --comment 'Restore public Gateways after quorum finality' --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" || true; done
          for attempt in $(seq 1 60); do
            explorer="$(curl -sS --max-time 10 -o /tmp/explorer -w '%{http_code}' https://explorer.jaios-governance.org/ || true)"
            health="$(curl -sS --max-time 10 -o /tmp/health -w '%{http_code}' https://health.jaios-governance.org/health || true)"
            rpc="$(curl -sS --max-time 10 -o /tmp/rpc -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ || true)"
            if [[ "$explorer" == 200 && "$health" == 200 && "$rpc" == 200 ]]; then
              jq -e '.status == "healthy" and .head_height >= 1 and .consensus.last_certificate.signed_power == 3 and .mainnet_changed == false and .assets_moved == false and .bridge_activated == false' /tmp/health
              jq -e '.result == "0x1352f63"' /tmp/rpc
              exit 0
            fi
            test "$attempt" -lt 60
            sleep 5
          done
