name: JUNCA Emergency P2P Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-p2p-diagnostic-${{ github.run_id }}
      - name: Inspect peer connectivity
        run: |
          set -euo pipefail
          instances=(i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b)
          aws ec2 describe-instances --instance-ids "${instances[@]}" --query 'Reservations[].Instances[].{id:InstanceId,ip:PrivateIpAddress,sg:SecurityGroups[*].GroupId}' --output json
          cat > /tmp/peers.json <<'JSON'
          {"commands":["for peer in 10.67.16.10 10.67.32.10 10.67.48.10; do if timeout 4 bash -c \"</dev/tcp/$peer/30303\"; then echo PEER_OK=$peer; else echo PEER_FAIL=$peer; fi; done","grep -E '^(VALIDATOR_ID|VALIDATOR_PEER_ENDPOINTS|AUTOMATIC_FINALITY_ENABLED|TESTNET_BLOCK_INTERVAL_SECONDS|TESTNET_SLOT_EPOCH_SECONDS)=' /etc/junca/runtime.env","curl -sS http://127.0.0.1:8545/health"]}
          JSON
          command_id="$(aws ssm send-command --instance-ids "${instances[@]}" --document-name AWS-RunShellScript --parameters file:///tmp/peers.json --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            for attempt in $(seq 1 30); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 2; done
            echo "===== $instance ====="
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          done
