name: JAIOS Six Card Production Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jaios-six-card-production-recovery.yml"
      - "sites/jaios-root-news-photo/**"
      - "scripts/build_jaios_root_news_photo.py"
      - "infra/aws/jaios-root-news-router.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/jaios-six-card-production-recovery.yml"
      - "sites/jaios-root-news-photo/**"
      - "scripts/build_jaios_root_news_photo.py"
      - "infra/aws/jaios-root-news-router.js"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: jaios-six-card-production-single-writer
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "595710543956"
  ROOT_DOMAIN: jaios-governance.org
  EXPECTED_ORIGIN_DOMAIN: jaios-institutional-governance.juncajapan-inc.chatgpt.site
  DISTRIBUTION_ID: E2WIXG3DWW8OX1
  DISTRIBUTION_ARN: arn:aws:cloudfront::595710543956:distribution/E2WIXG3DWW8OX1
  DOCS_BUCKET: junca-chain-docs-595710543956
  EDGE_OBJECT: jaios-root-news/index.html
  FUNCTION_NAME: jaios-root-news-router
  FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/jaios-root-news-router
  RELEASE_MARKER: 20260805-six-card-photo-news

jobs:
  quality:
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical six-card package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/build_jaios_root_news_photo.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('sites/jaios-root-news-photo/news-items.json').read_text())
          items = data['items']
          assert data['selection_policy']['exact_card_count'] == 6
          assert len(items) == 6
          assert len({item['id'] for item in items}) == 6
          assert len({item['image_url'] for item in items}) == 6
          assert [item['date'] for item in items] == sorted((item['date'] for item in items), reverse=True)
          authoritative = {
              'www.digital.go.jp', 'www.un.org', 'www.oecd.org', 'www.undp.org',
              'www.meti.go.jp', 'www.boj.or.jp'
          }
          assert {urlparse(item['url']).netloc for item in items} == authoritative
          for item in items:
              for field in ('url', 'image_url', 'image_credit_url'):
                  parsed = urlparse(item[field])
                  assert parsed.scheme == 'https' and parsed.netloc, (item['id'], field)
              assert '.svg' not in item['image_url'].lower()
              assert item['title_en'] and item['title_ja']
              assert item['summary_en'] and item['summary_ja']
          print('JAIOS_SIX_CARD_EDITORIAL_PACKAGE_PASS')
          PY
          grep -F "const ROOT_ARTIFACT = '/jaios-root-news/index.html';" infra/aws/jaios-root-news-router.js
          grep -F "const BROWSER_APP_ARTIFACT = '/jaios-browser-app/index.html';" infra/aws/jaios-root-news-router.js
          grep -F "cf.updateRequestOrigin" infra/aws/jaios-root-news-router.js

      - name: Build candidate from current public page
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 45 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            --output /tmp/current-root.html "https://${ROOT_DOMAIN}/?six_card_candidate=${GITHUB_RUN_ID}"
          python3 scripts/build_jaios_root_news_photo.py \
            /tmp/current-root.html sites/jaios-root-news-photo/news-items.json /tmp/index.html
          grep -F "data-jaios-news-release='${RELEASE_MARKER}'" /tmp/index.html
          test "$(grep -o 'data-jaios-news-card=' /tmp/index.html | wc -l)" -eq 12
          test "$(grep -o '<img src=' /tmp/index.html | wc -l)" -ge 6
          ! grep -Fq "<svg viewBox='0 0 640 360'" /tmp/index.html
          test "$(wc -c < /tmp/index.html)" -lt 1000000

      - name: Configure canonical Docs production identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-six-card-preflight-${{ github.run_id }}
          disable-retry: true

      - name: Read back exact production boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" > /tmp/distribution.json
          test "$(jq -r '.DistributionConfig.Aliases.Items[] | select(. == env.ROOT_DOMAIN)' /tmp/distribution.json)" = "$ROOT_DOMAIN"
          test "$(jq -r '.DistributionConfig.Origins.Items[].DomainName | select(. == env.EXPECTED_ORIGIN_DOMAIN)' /tmp/distribution.json)" = "$EXPECTED_ORIGIN_DOMAIN"
          aws s3api head-object --bucket "$DOCS_BUCKET" --key "$EDGE_OBJECT" >/tmp/object-head.json
          aws s3api get-bucket-versioning --bucket "$DOCS_BUCKET" >/tmp/versioning.json
          test "$(jq -r '.Status' /tmp/versioning.json)" = "Enabled"

      - uses: actions/upload-artifact@v4
        with:
          name: jaios-six-card-candidate-${{ github.sha }}
          path: /tmp/index.html
          if-no-files-found: error
          retention-days: 90

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure canonical Docs production writer
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-six-card-production-${{ github.run_id }}
          disable-retry: true

      - name: Publish and accept six-card institutional News
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query Distribution.ARN --output text)" = "$DISTRIBUTION_ARN"
          test "$(aws s3api get-bucket-versioning --bucket "$DOCS_BUCKET" --query Status --output text)" = "Enabled"

          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" >/tmp/distribution-before.json
          jq '.DistributionConfig' /tmp/distribution-before.json >/tmp/distribution-before-config.json
          before_etag="$(jq -r '.ETag' /tmp/distribution-before.json)"
          test "$(jq -r '.DistributionConfig.Aliases.Items[] | select(. == env.ROOT_DOMAIN)' /tmp/distribution-before.json)" = "$ROOT_DOMAIN"
          test "$(jq -r '.DistributionConfig.Origins.Items[].DomainName | select(. == env.EXPECTED_ORIGIN_DOMAIN)' /tmp/distribution-before.json)" = "$EXPECTED_ORIGIN_DOMAIN"
          other_viewer="$(jq --arg arn "$FUNCTION_ARN" '[.DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Items[]? | select(.EventType=="viewer-request" and .FunctionARN!=$arn)] | length' /tmp/distribution-before.json)"
          test "$other_viewer" -eq 0

          aws s3 cp "s3://${DOCS_BUCKET}/${EDGE_OBJECT}" /tmp/backup-index.html
          test -s /tmp/backup-index.html
          curl --fail-with-body --silent --show-error --location --max-time 45 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            --output /tmp/current-root.html "https://${ROOT_DOMAIN}/?six_card_source=${GITHUB_RUN_ID}"
          python3 scripts/build_jaios_root_news_photo.py \
            /tmp/current-root.html sites/jaios-root-news-photo/news-items.json /tmp/index.html
          sha256sum /tmp/backup-index.html | cut -d' ' -f1 >/tmp/backup-sha256.txt
          sha256sum /tmp/index.html | cut -d' ' -f1 >/tmp/published-sha256.txt

          changed=0
          rollback() {
            rc=$?
            if [[ "$changed" -eq 1 ]]; then
              echo 'JAIOS six-card publication failed; restoring exact prior artifact and distribution.' >&2
              current_etag="$(aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" --query ETag --output text)"
              aws cloudfront update-distribution --id "$DISTRIBUTION_ID" --if-match "$current_etag" \
                --distribution-config file:///tmp/distribution-before-config.json >/tmp/rollback-distribution.json || true
              aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID" || true
              aws s3 cp /tmp/backup-index.html "s3://${DOCS_BUCKET}/${EDGE_OBJECT}" \
                --content-type 'text/html; charset=utf-8' \
                --cache-control 'public,max-age=0,must-revalidate' \
                --metadata-directive REPLACE --metadata "rollback-run=${GITHUB_RUN_ID}" || true
              aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
                --paths '/' '/index.html' >/tmp/rollback-invalidation.json || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          aws s3 cp /tmp/index.html "s3://${DOCS_BUCKET}/${EDGE_OBJECT}" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public,max-age=0,must-revalidate' \
            --metadata "source-commit=${GITHUB_SHA},release=${RELEASE_MARKER},cards=6"
          aws s3 cp "s3://${DOCS_BUCKET}/${EDGE_OBJECT}" /tmp/s3-readback.html
          cmp /tmp/index.html /tmp/s3-readback.html
          changed=1

          cat >/tmp/function-config.json <<'JSON'
          {"Comment":"Route JAIOS root and Browser app to governed AWS artifacts","Runtime":"cloudfront-js-2.0"}
          JSON
          if aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT >/tmp/function-description.json 2>/tmp/function-description.err; then
            function_etag="$(jq -r '.ETag' /tmp/function-description.json)"
            aws cloudfront update-function --name "$FUNCTION_NAME" --if-match "$function_etag" \
              --function-config file:///tmp/function-config.json \
              --function-code fileb://infra/aws/jaios-root-news-router.js >/tmp/function-update.json
          else
            aws cloudfront create-function --name "$FUNCTION_NAME" \
              --function-config file:///tmp/function-config.json \
              --function-code fileb://infra/aws/jaios-root-news-router.js >/tmp/function-create.json
          fi
          dev_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
          cat >/tmp/test-root.json <<'JSON'
          {"version":"1.0","context":{"eventType":"viewer-request"},"viewer":{"ip":"198.51.100.10"},"request":{"method":"GET","uri":"/","querystring":{},"headers":{"host":{"value":"jaios-governance.org"}},"cookies":{}}}
          JSON
          cat >/tmp/test-browser-app.json <<'JSON'
          {"version":"1.0","context":{"eventType":"viewer-request"},"viewer":{"ip":"198.51.100.10"},"request":{"method":"GET","uri":"/browser/app","querystring":{},"headers":{"host":{"value":"jaios-governance.org"}},"cookies":{}}}
          JSON
          aws cloudfront test-function --name "$FUNCTION_NAME" --if-match "$dev_etag" --stage DEVELOPMENT --event-object fileb:///tmp/test-root.json >/tmp/test-root-result.json
          aws cloudfront test-function --name "$FUNCTION_NAME" --if-match "$dev_etag" --stage DEVELOPMENT --event-object fileb:///tmp/test-browser-app.json >/tmp/test-browser-result.json
          jq -e '.TestResult.FunctionErrorMessage == null or .TestResult.FunctionErrorMessage == ""' /tmp/test-root-result.json
          jq -e '.TestResult.FunctionErrorMessage == null or .TestResult.FunctionErrorMessage == ""' /tmp/test-browser-result.json
          grep -F '/jaios-root-news/index.html' /tmp/test-root-result.json
          grep -F '/jaios-browser-app/index.html' /tmp/test-browser-result.json
          aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$dev_etag" >/tmp/function-publish.json
          test "$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage LIVE --query FunctionSummary.FunctionMetadata.FunctionARN --output text)" = "$FUNCTION_ARN"

          jq --arg arn "$FUNCTION_ARN" '
            .DefaultCacheBehavior.FunctionAssociations = (
              (.DefaultCacheBehavior.FunctionAssociations // {"Quantity":0,"Items":[]})
              | .Items = (((.Items // []) | map(select(.EventType != "viewer-request"))) + [{"FunctionARN":$arn,"EventType":"viewer-request"}])
              | .Quantity = (.Items | length)
            )
          ' /tmp/distribution-before-config.json >/tmp/distribution-after-config.json
          aws cloudfront update-distribution --id "$DISTRIBUTION_ID" --if-match "$before_etag" \
            --distribution-config file:///tmp/distribution-after-config.json >/tmp/distribution-update.json
          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/' '/index.html' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"

          ready=false
          for attempt in {1..36}; do
            if curl --fail-with-body --silent --show-error --location --max-time 45 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              --output /tmp/public-root.html "https://${ROOT_DOMAIN}/?six_card_release=${GITHUB_RUN_ID}-${attempt}" \
              && grep -Fq "data-jaios-news-release='${RELEASE_MARKER}'" /tmp/public-root.html; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          test "$(grep -o 'data-jaios-news-card=' /tmp/public-root.html | wc -l)" -eq 12
          ! grep -Fq "<svg viewBox='0 0 640 360'" /tmp/public-root.html

          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import json
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          driver = webdriver.Chrome(options=options)
          records = []
          try:
              for label, width, expected in [('desktop', 1440, 3), ('tablet', 820, 2), ('mobile', 390, 1)]:
                  driver.set_window_size(width, 1800)
                  driver.get(f'https://jaios-governance.org/?six_card_acceptance={label}')
                  WebDriverWait(driver, 45).until(
                      lambda d: len(d.find_elements(By.CSS_SELECTOR, 'section [data-jaios-news-card]')) == 6
                  )
                  WebDriverWait(driver, 60).until(
                      lambda d: len(d.find_elements(By.CSS_SELECTOR, 'section [data-jaios-news-card] .jaios-edge-news-media img')) == 6
                      and all(d.execute_script(
                          'return arguments[0].complete && arguments[0].naturalWidth > 100 && arguments[0].naturalHeight > 60', image
                      ) for image in d.find_elements(By.CSS_SELECTOR, 'section [data-jaios-news-card] .jaios-edge-news-media img'))
                  )
                  cards = driver.find_elements(By.CSS_SELECTOR, 'section [data-jaios-news-card]')
                  images = driver.find_elements(By.CSS_SELECTOR, 'section [data-jaios-news-card] .jaios-edge-news-media img')
                  vectors = driver.find_elements(By.CSS_SELECTOR, 'section [data-jaios-news-card] .jaios-edge-news-media svg')
                  grid = driver.find_element(By.CSS_SELECTOR, 'section .jaios-edge-news-grid')
                  columns = driver.execute_script(
                      "return getComputedStyle(arguments[0]).gridTemplateColumns.split(' ').filter(Boolean).length", grid
                  )
                  assert len(cards) == 6 and len(images) == 6 and len(vectors) == 0
                  assert columns == expected, (label, columns, expected)
                  sources = [image.get_attribute('currentSrc') or image.get_attribute('src') for image in images]
                  assert len(set(sources)) == 6
                  driver.save_screenshot(f'/tmp/jaios-six-card-{label}.png')
                  records.append({'viewport': label, 'cards': 6, 'images': 6, 'columns': columns, 'sources': sources})
              Path('/tmp/browser-readback.json').write_text(json.dumps(records, indent=2) + '\n')
              print('JAIOS_SIX_CARD_BROWSER_ACCEPTANCE_PASS', records)
          finally:
              driver.quit()
          PY

          for route in browser institution social-business observatory evidence; do
            curl --fail --silent --show-error --location \
              --output "/tmp/${route}.html" "https://${ROOT_DOMAIN}/${route}?six_card_preserve=${GITHUB_RUN_ID}"
            ! grep -Fq "data-jaios-news-release='${RELEASE_MARKER}'" "/tmp/${route}.html"
          done
          curl --fail --silent --show-error --location \
            --output /tmp/browser-app.html "https://${ROOT_DOMAIN}/browser/app?six_card_preserve=${GITHUB_RUN_ID}"

          export INVALIDATION_ID="$invalidation_id"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = {
              'schema': 'jaios-six-card-production-recovery/v1',
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'source_commit': os.environ['GITHUB_SHA'],
              'public_url': 'https://jaios-governance.org/',
              'release_marker': os.environ['RELEASE_MARKER'],
              'distribution_id': os.environ['DISTRIBUTION_ID'],
              'function_arn': os.environ['FUNCTION_ARN'],
              'invalidation_id': os.environ['INVALIDATION_ID'],
              'cards': 6,
              'desktop_columns': 3,
              'tablet_columns': 2,
              'mobile_columns': 1,
              'primary_sources': [
                  'Digital Agency, Government of Japan',
                  'United Nations ODET / UNU Macau / ADB',
                  'OECD',
                  'United Nations Development Programme',
                  'Ministry of Economy, Trade and Industry, Japan',
                  'Bank of Japan',
              ],
              'backup_html_sha256': Path('/tmp/backup-sha256.txt').read_text().strip(),
              'published_html_sha256': Path('/tmp/published-sha256.txt').read_text().strip(),
              'browser_readback': json.loads(Path('/tmp/browser-readback.json').read_text()),
              'non_root_routes_preserved': ['/browser', '/institution', '/social-business', '/observatory', '/evidence', '/browser/app'],
              'route53_changed': False,
              'tls_changed': False,
              'result': 'PRODUCTION_ACCEPTED',
          }
          Path('/tmp/jaios-six-card-production-acceptance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          trap - ERR
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Persist production acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          accepted=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p evidence/production
            cp /tmp/jaios-six-card-production-acceptance.json evidence/production/jaios-six-card-production-latest.json
            cp /tmp/jaios-six-card-production-acceptance.json "evidence/production/jaios-six-card-production-${GITHUB_RUN_ID}.json"
            git add evidence/production/jaios-six-card-production-latest.json "evidence/production/jaios-six-card-production-${GITHUB_RUN_ID}.json"
            git commit -m "Record JAIOS six-card production acceptance ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then accepted=true; break; fi
            sleep $((attempt * 3))
          done
          test "$accepted" = true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaios-six-card-production-${{ github.run_id }}
          path: |
            /tmp/index.html
            /tmp/public-root.html
            /tmp/browser-readback.json
            /tmp/jaios-six-card-desktop.png
            /tmp/jaios-six-card-tablet.png
            /tmp/jaios-six-card-mobile.png
            /tmp/jaios-six-card-production-acceptance.json
            evidence/production/jaios-six-card-production-latest.json
          if-no-files-found: warn
          retention-days: 90
