name: JUNCA Chain CloudFormation Self Reconcile

on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      STACK_NAME: junca-chain-docs-publication
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure production role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: chain-cfn-reconcile-${{ github.run_id }}
          disable-retry: true
      - name: Read back and reconcile canonical stack
        id: reconcile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p evidence/production
          : > /tmp/reconcile.log
          aws sts get-caller-identity >> /tmp/reconcile.log 2>&1
          rc_identity=$?
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" > /tmp/stack-before.json 2>>/tmp/reconcile.log
          rc_describe=$?
          rc_update=99
          if [ "$rc_describe" -eq 0 ]; then
            mapfile -t PARAMS < <(jq -r '.Stacks[0].Parameters[] | "ParameterKey=\(.ParameterKey),UsePreviousValue=true"' /tmp/stack-before.json)
            aws cloudformation update-stack \
              --stack-name "$STACK_NAME" \
              --template-body file://infra/aws/docs-publication/main.yaml \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameters "${PARAMS[@]}" \
              --region "$AWS_REGION" > /tmp/update.json 2>>/tmp/reconcile.log
            rc_update=$?
            if [ "$rc_update" -ne 0 ] && grep -q 'No updates are to be performed' /tmp/reconcile.log; then rc_update=0; fi
            if [ "$rc_update" -eq 0 ] && [ -s /tmp/update.json ]; then
              aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" >>/tmp/reconcile.log 2>&1
              rc_update=$?
            fi
          fi
          aws iam list-role-policies --role-name JuncaChainDocsProductionDeployment > /tmp/inline-policies.json 2>>/tmp/reconcile.log
          rc_inline=$?
          aws iam list-attached-role-policies --role-name JuncaChainDocsProductionDeployment > /tmp/attached-policies.json 2>>/tmp/reconcile.log
          rc_attached=$?
          {
            echo '# JUNCA Chain CloudFormation Self Reconcile'
            echo
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Identity RC: $rc_identity"
            echo "Describe RC: $rc_describe"
            echo "Update RC: $rc_update"
            echo "Inline policy read RC: $rc_inline"
            echo "Attached policy read RC: $rc_attached"
            if [ -s /tmp/stack-before.json ]; then echo "Stack status: $(jq -r '.Stacks[0].StackStatus' /tmp/stack-before.json)"; fi
            echo
            echo '## Inline policies'
            if [ -s /tmp/inline-policies.json ]; then jq -r '.PolicyNames[]?' /tmp/inline-policies.json | sed 's/^/- /'; fi
            echo
            echo '## Attached policies'
            if [ -s /tmp/attached-policies.json ]; then jq -r '.AttachedPolicies[]? | "- \(.PolicyName)"' /tmp/attached-policies.json; fi
            echo
            echo '## Log'
            echo '```text'
            cat /tmp/reconcile.log
            echo '```'
          } > evidence/production/chain-cloudformation-self-reconcile-latest.md
          if [ "$rc_identity" -ne 0 ] || [ "$rc_describe" -ne 0 ] || [ "$rc_update" -ne 0 ]; then exit 1; fi
      - name: Commit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name juncaGlobal
          git config user.email 298956223+juncaGlobal@users.noreply.github.com
          git add evidence/production/chain-cloudformation-self-reconcile-latest.md
          git diff --cached --quiet || git commit -m 'Record chain CloudFormation self reconcile result'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if reconcile failed
        if: steps.reconcile.outcome == 'failure'
        run: exit 1
