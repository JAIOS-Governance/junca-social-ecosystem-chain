name: JUNCA Public Testnet Runtime Acceptance Gate

on:
  workflow_run:
    workflows:
      - "JUNCA Public Testnet Live 24h Soak"
    types: [completed]
  workflow_dispatch:
    inputs:
      soak_run_id:
        description: Exact successful JUNCA Public Testnet Live 24h Soak run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: junca-public-testnet-runtime-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authorize exact acceptance trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              ;;
            workflow_run)
              test "$WORKFLOW_RUN_CONCLUSION" = "success"
              test "$WORKFLOW_RUN_NAME" = \
                "JUNCA Public Testnet Live 24h Soak"
              test "$WORKFLOW_RUN_HEAD_BRANCH" = "main"
              test "$WORKFLOW_RUN_HEAD_REPOSITORY" = "$REPOSITORY"
              ;;
            *)
              echo "::error::Unsupported acceptance event: $EVENT_NAME"
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve exact hardcoded evidence chain
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          MANUAL_SOAK_RUN_ID: ${{ inputs.soak_run_id || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            soak_run_id="$WORKFLOW_RUN_ID"
          else
            soak_run_id="$MANUAL_SOAK_RUN_ID"
          fi
          [[ "$soak_run_id" =~ ^[1-9][0-9]*$ ]]
          soak_run="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${soak_run_id}")"
          jq -e --arg repository "${{ github.repository }}" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Public Testnet Live 24h Soak" and
            .path == ".github/workflows/junca-public-testnet-live-soak.yml" and
            (
              .event == "workflow_run" or
              .event == "workflow_dispatch"
            ) and
            .head_branch == "main" and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$soak_run"
          mkdir -p evidence/soak
          gh run download "$soak_run_id" \
            --repo "${{ github.repository }}" \
            --name "junca-public-testnet-live-soak-${soak_run_id}" \
            --dir evidence/soak
          (
            cd evidence/soak
            sha256sum --check junca-public-testnet-live-soak.json.sha256
          )
          source_commit="$(
            jq -er '
              .candidate_binding.source_commit |
              select(test("^[0-9a-f]{40}$"))
            ' evidence/soak/junca-public-testnet-live-soak.json
          )"
          foundation_run_id="$(
            jq -er .provenance.foundation_run_id \
              evidence/soak/junca-public-testnet-live-soak.json
          )"
          public_release_run_id="$(
            jq -er .provenance.public_release_run_id \
              evidence/soak/junca-public-testnet-live-soak.json
          )"
          [[ "$foundation_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$public_release_run_id" =~ ^[1-9][0-9]*$ ]]
          foundation_run="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${foundation_run_id}")"
          jq -e \
            --arg repository "${{ github.repository }}" \
            --arg source_commit "$source_commit" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Validator Foundation Release" and
            .path == ".github/workflows/junca-validator-foundation-release.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $source_commit and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$foundation_run"
          public_release_run="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${public_release_run_id}")"
          jq -e \
            --arg repository "${{ github.repository }}" \
            --arg source_commit "$source_commit" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Public Testnet Release" and
            .path == ".github/workflows/junca-public-testnet-release.yml" and
            (
              (
                .event == "workflow_run" and
                .head_branch == "main"
              ) or
              (
                .event == "workflow_dispatch" and
                .head_branch == "main" and
                .head_sha == $source_commit
              )
            ) and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$public_release_run"
          gh run download "$foundation_run_id" \
            --repo "${{ github.repository }}" \
            --name "junca-validator-foundation-release-${foundation_run_id}" \
            --dir evidence/foundation
          gh run download "$public_release_run_id" \
            --repo "${{ github.repository }}" \
            --name "junca-public-testnet-release-${public_release_run_id}" \
            --dir evidence/public-release

      - name: Issue final fail-closed runtime decision
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/junca_public_testnet_runtime_acceptance_gate.py \
            --soak evidence/soak/junca-public-testnet-live-soak.json \
            --final-runtime-readback evidence/soak/final-runtime-readback.json \
            --foundation-outputs evidence/foundation/foundation-outputs.json \
            --foundation-acceptance evidence/foundation/public-testnet-runtime-acceptance.json \
            --publication evidence/public-release/public-testnet-publication.json \
            --output artifacts/junca-public-testnet-runtime-acceptance-decision.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junca-public-testnet-runtime-acceptance-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
