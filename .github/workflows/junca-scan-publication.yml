name: JUNCA Public Explorer Publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-scan-publication.yml"
      - "jaios/social_ecosystem_chain/explorer_page.py"
      - "jaios/social_ecosystem_chain/public_gateway.py"
      - "jaios/social_ecosystem_chain/assets/junca-chain-logo-gold-on-navy.png"
      - "jaios/social_ecosystem_chain/assets/junca-explorer-icon-gold-on-navy.png"

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 45
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      DOMAIN_NAME: jaios-governance.org
      ROUTE53_ZONE_ID: Z0336017285464TX0NT1G
      AVAILABILITY_ZONES_JSON: '["us-east-1a","us-east-1b","us-east-1c"]'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-scan-publication-${{ github.run_id }}

      - name: Bind current accepted immutable runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts
          terraform -chdir=infra/aws/bootstrap init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/bootstrap.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"
          terraform -chdir=infra/aws/bootstrap output -json > artifacts/bootstrap-outputs.json
          state_kms_key_arn="$(jq -er .state_kms_key_arn.value artifacts/bootstrap-outputs.json)"
          lock_table="$(jq -er .lock_table.value artifacts/bootstrap-outputs.json)"
          terraform -chdir=infra/aws/public-testnet init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$lock_table" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$state_kms_key_arn"
          terraform -chdir=infra/aws/public-testnet output -json > artifacts/before-outputs.json
          jq -e '
            .deployment_stage.value == "public-services" and
            .public_services_acceptance_readback.value.enabled == true and
            .runtime_boundary.value.mainnet_changed == false and
            .runtime_boundary.value.assets_moved == false and
            .runtime_boundary.value.bridge_activated == false
          ' artifacts/before-outputs.json
          {
            echo "NODE_AMI_ID=$(jq -er .approved_node_ami_readback.value.id artifacts/before-outputs.json)"
            echo "NODE_ARTIFACT_SHA256=$(jq -er .approved_node_ami_readback.value.node_sha256 artifacts/before-outputs.json)"
            echo "GENESIS_SHA256=$(jq -er .approved_node_ami_readback.value.genesis_sha256 artifacts/before-outputs.json)"
            echo "SOURCE_COMMIT=$(jq -er .approved_node_ami_readback.value.source_commit artifacts/before-outputs.json)"
            echo "QUORUM_ACCEPTANCE_SHA256=$(jq -er .public_services_acceptance_readback.value.quorum_evidence_sha256 artifacts/before-outputs.json)"
            echo "RUNTIME_ACCEPTANCE_SHA256=$(jq -er .public_services_acceptance_readback.value.runtime_evidence_sha256 artifacts/before-outputs.json)"
          } >> "$GITHUB_ENV"

      - name: Read back existing public service route
        run: |
          set -euo pipefail
          cp artifacts/before-outputs.json artifacts/public-release-outputs.json
          jq -e '
            .deployment_stage.value == "public-services" and
            .public_rpc_url.value == "https://rpc.jaios-governance.org" and
            .explorer_url.value == "https://explorer.jaios-governance.org" and
            .health_url.value == "https://health.jaios-governance.org" and
            (.validator_instance_ids.value | length) == 3 and
            .public_services_acceptance_readback.value.enabled == true and
            .runtime_boundary.value.mainnet_changed == false and
            .runtime_boundary.value.assets_moved == false and
            .runtime_boundary.value.bridge_activated == false
          ' artifacts/public-release-outputs.json

      - name: Deploy approved Explorer surface with rollback
        run: |
          set -euo pipefail
          mapfile -t instances < <(jq -r '.validator_instance_ids.value[]' artifacts/public-release-outputs.json)
          test "${#instances[@]}" = 3

          run_ssm() {
            local label="$1"
            local command="$2"
            local acceptance="${3:-strict}"
            local request="artifacts/ssm-${label}.json"
            jq -n --arg command "$command" '{commands: [$command]}' > "$request"
            local command_id
            command_id="$(aws ssm send-command \
              --instance-ids "${instances[@]}" \
              --document-name AWS-RunShellScript \
              --parameters "file://${request}" \
              --comment "JUNCA Explorer ${label}" \
              --query Command.CommandId --output text)"
            for instance in "${instances[@]}"; do
              aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" || true
              aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
                > "artifacts/${label}-${instance}.json"
              if jq -e '.Status == "Success"' "artifacts/${label}-${instance}.json" >/dev/null; then
                continue
              fi
              if [[ "$acceptance" == "gateway-dependency-readback" ]] && jq -e '
                .Status == "Failed" and
                .ResponseCode == 42 and
                ((.StandardErrorContent // "") |
                  contains("JUNCA_GATEWAY_DEPENDENCY_VERIFICATION_IN_PROGRESS"))
              ' "artifacts/${label}-${instance}.json" >/dev/null; then
                echo "::warning title=Gateway activation verification in progress::${instance} has the exact inactive-validator dependency state; surface integrity and target isolation will be verified before acceptance."
                continue
              fi
              jq -e '.Status == "Success"' "artifacts/${label}-${instance}.json"
            done
          }

          base=/usr/local/lib/junca/jaios/social_ecosystem_chain
          run_ssm prepare "set -euo pipefail; install -d -m 0755 ${base}/assets /var/lib/junca/scan-rollbacks/${GITHUB_RUN_ID}/assets; cp -a ${base}/explorer_page.py ${base}/public_gateway.py /var/lib/junca/scan-rollbacks/${GITHUB_RUN_ID}/ 2>/dev/null || true; cp -a ${base}/assets/junca-chain-logo-gold-on-navy.png ${base}/assets/junca-explorer-icon-gold-on-navy.png /var/lib/junca/scan-rollbacks/${GITHUB_RUN_ID}/assets/ 2>/dev/null || true"

          tar -czf artifacts/explorer-surface.tar.gz \
            -C jaios/social_ecosystem_chain \
            explorer_page.py public_gateway.py \
            assets/junca-chain-logo-gold-on-navy.png \
            assets/junca-explorer-icon-gold-on-navy.png
          digest="$(sha256sum artifacts/explorer-surface.tar.gz | cut -d' ' -f1)"
          explorer_page_digest="$(sha256sum jaios/social_ecosystem_chain/explorer_page.py | cut -d' ' -f1)"
          public_gateway_digest="$(sha256sum jaios/social_ecosystem_chain/public_gateway.py | cut -d' ' -f1)"
          chain_logo_digest="$(sha256sum jaios/social_ecosystem_chain/assets/junca-chain-logo-gold-on-navy.png | cut -d' ' -f1)"
          explorer_icon_digest="$(sha256sum jaios/social_ecosystem_chain/assets/junca-explorer-icon-gold-on-navy.png | cut -d' ' -f1)"
          remote_tmp="/tmp/junca-explorer-surface-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_b64="${remote_tmp}.b64"
          remote_tgz="${remote_tmp}.tar.gz"
          run_ssm surface-start "set -euo pipefail; : > '${remote_b64}'"
          chunk_index=0
          while IFS= read -r chunk || [[ -n "$chunk" ]]; do
            run_ssm "surface-chunk-${chunk_index}" "set -euo pipefail; printf '%s' '${chunk}' >> '${remote_b64}'"
            chunk_index=$((chunk_index + 1))
          done < <(base64 -w0 artifacts/explorer-surface.tar.gz | fold -w 7000)
          run_ssm surface-install "set -euo pipefail; base64 -d '${remote_b64}' > '${remote_tgz}'; echo '${digest}  ${remote_tgz}' | sha256sum -c -; rm -rf '${remote_tmp}'; install -d -m 0755 '${remote_tmp}'; tar -xzf '${remote_tgz}' -C '${remote_tmp}'; install -m 0644 '${remote_tmp}/explorer_page.py' '${base}/explorer_page.py'; install -m 0644 '${remote_tmp}/public_gateway.py' '${base}/public_gateway.py'; install -m 0644 '${remote_tmp}/assets/junca-chain-logo-gold-on-navy.png' '${base}/assets/junca-chain-logo-gold-on-navy.png'; install -m 0644 '${remote_tmp}/assets/junca-explorer-icon-gold-on-navy.png' '${base}/assets/junca-explorer-icon-gold-on-navy.png'; rm -rf '${remote_tmp}' '${remote_tgz}' '${remote_b64}'"
          run_ssm surface-integrity "set -euo pipefail; echo '${explorer_page_digest}  ${base}/explorer_page.py' | sha256sum -c -; echo '${public_gateway_digest}  ${base}/public_gateway.py' | sha256sum -c -; echo '${chain_logo_digest}  ${base}/assets/junca-chain-logo-gold-on-navy.png' | sha256sum -c -; echo '${explorer_icon_digest}  ${base}/assets/junca-explorer-icon-gold-on-navy.png' | sha256sum -c -"

          run_ssm restart "set -euo pipefail; for unit in junca-public-explorer.service junca-public-rpc.service; do dropin=\"/etc/systemd/system/\${unit}.d\"; install -d -m 0755 \"\$dropin\"; printf '%s\n' '[Service]' 'Environment=JUNCA_RUNTIME_ARTIFACT_COMMIT=${SOURCE_COMMIT}' 'Environment=JUNCA_GENESIS_SHA256=${GENESIS_SHA256}' 'Environment=JUNCA_NODE_ARTIFACT_SHA256=${NODE_ARTIFACT_SHA256}' > \"\$dropin/runtime-artifact.conf\"; chmod 0644 \"\$dropin/runtime-artifact.conf\"; done; systemctl daemon-reload; if ! systemctl is-active --quiet junca-validator.service; then echo JUNCA_GATEWAY_DEPENDENCY_VERIFICATION_IN_PROGRESS >&2; exit 42; fi; systemctl restart junca-public-explorer.service junca-public-rpc.service; for attempt in \$(seq 1 30); do curl -fsS http://127.0.0.1:3000/explorer.json > /tmp/explorer.json && jq -e --arg source_commit '${SOURCE_COMMIT}' --arg genesis_sha256 '${GENESIS_SHA256}' --arg node_artifact_sha256 '${NODE_ARTIFACT_SHA256}' '.status == \"ready\" and .finalized_only == true and .read_only == true and .runtime_artifact.source_commit == \$source_commit and .runtime_artifact.genesis_sha256 == \$genesis_sha256 and .runtime_artifact.node_artifact_sha256 == \$node_artifact_sha256' /tmp/explorer.json && break; test \"\$attempt\" -lt 30; sleep 2; done; for attempt in \$(seq 1 30); do curl -fsS http://127.0.0.1:8546/health > /tmp/public-health.json && jq -e '.status == \"healthy\" and .read_only == true' /tmp/public-health.json && break; test \"\$attempt\" -lt 30; sleep 2; done" gateway-dependency-readback

          jq -s '{
            schema_version: "junca-explorer-node-publication/v1",
            required_ready_nodes: 2,
            ready_nodes: (map(select(.Status == "Success")) | length),
            verification_in_progress_nodes: (map(select(.Status != "Success")) | length),
            nodes: map({
              instance_id: .InstanceId,
              state: (
                if .Status == "Success" then "READY · READ-ONLY"
                else "VERIFICATION IN PROGRESS"
                end
              ),
              evidence: (
                if .Status == "Success" then
                  "Explorer and public RPC restarted with exact local runtime readback"
                else
                  "Exact surface is staged; inactive validator dependency remains outside the serving path"
                end
              )
            })
          }' artifacts/restart-i-*.json > artifacts/explorer-node-publication.json
          jq -e '
            .ready_nodes >= .required_ready_nodes and
            ((.ready_nodes + .verification_in_progress_nodes) == 3)
          ' artifacts/explorer-node-publication.json

          mapfile -t target_groups < <(
            jq -r '.public_target_group_arns.value | to_entries[] | [.key, .value] | @tsv' \
              artifacts/public-release-outputs.json
          )
          test "${#target_groups[@]}" = 2
          isolated=false
          for attempt in $(seq 1 30); do
            for target_group in "${target_groups[@]}"; do
              IFS=$'\t' read -r target_name target_arn <<< "$target_group"
              aws elbv2 describe-target-health --target-group-arn "$target_arn" \
                > "artifacts/target-health-${target_name}.json"
            done
            isolated=true
            while IFS= read -r instance; do
              for target_group in "${target_groups[@]}"; do
                IFS=$'\t' read -r target_name _ <<< "$target_group"
                if ! jq -e --arg instance "$instance" '
                  [
                    .TargetHealthDescriptions[] |
                    select(.Target.Id == $instance) |
                    .TargetHealth.State
                  ] | length == 1 and all(.[]; . != "healthy")
                ' "artifacts/target-health-${target_name}.json" >/dev/null; then
                  isolated=false
                fi
              done
            done < <(
              jq -r '.nodes[] | select(.state == "VERIFICATION IN PROGRESS") | .instance_id' \
                artifacts/explorer-node-publication.json
            )
            if [[ "$isolated" == "true" ]]; then
              break
            fi
            test "$attempt" -lt 30
            sleep 5
          done
          test "$isolated" = "true"

      - name: Production readback
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 https://explorer.jaios-governance.org/ \
              > artifacts/explorer-index.html; then
              break
            fi
            test "$attempt" -lt 60
            sleep 10
          done
          curl -fsS --max-time 10 https://explorer.jaios-governance.org/explorer.json \
            > artifacts/explorer.json
          curl -fsS --max-time 10 https://explorer.jaios-governance.org/junca-chain-logo.png \
            > artifacts/explorer-logo.png
          curl -fsS --max-time 10 https://explorer.jaios-governance.org/explorer-icon.png \
            > artifacts/explorer-icon.png
          curl -fsS --max-time 10 https://health.jaios-governance.org/health \
            > artifacts/public-health.json
          grep -F 'https://explorer.jaios-governance.org/' artifacts/explorer-index.html
          grep -F '/junca-chain-logo.png' artifacts/explorer-index.html
          grep -F '/explorer-icon.png' artifacts/explorer-index.html
          test "$(sha256sum jaios/social_ecosystem_chain/assets/junca-chain-logo-gold-on-navy.png | cut -d' ' -f1)" = \
            "$(sha256sum artifacts/explorer-logo.png | cut -d' ' -f1)"
          test "$(sha256sum jaios/social_ecosystem_chain/assets/junca-explorer-icon-gold-on-navy.png | cut -d' ' -f1)" = \
            "$(sha256sum artifacts/explorer-icon.png | cut -d' ' -f1)"
          jq -e --arg source_commit "$SOURCE_COMMIT" \
            --arg genesis_sha256 "$GENESIS_SHA256" \
            --arg node_artifact_sha256 "$NODE_ARTIFACT_SHA256" '
            .status == "ready" and .finalized_only == true and .read_only == true and
            .schema_version == "junca-public-explorer/v4" and
            .runtime_artifact.source_commit == $source_commit and
            .runtime_artifact.genesis_sha256 == $genesis_sha256 and
            .runtime_artifact.node_artifact_sha256 == $node_artifact_sha256 and
            .runtime_artifact.evidence_source == "approved immutable validator runtime" and
            .head.height >= 1 and .head.signed_power == 3 and .head.total_power == 3 and
            .mainnet_changed == false and .assets_moved == false and
            .bridge_activated == false
          ' artifacts/explorer.json
          jq -e '
            .status == "healthy" and .read_only == true and
            .mainnet_changed == false and .assets_moved == false and
            .bridge_activated == false
          ' artifacts/public-health.json
          openssl s_client -connect explorer.jaios-governance.org:443 \
            -servername explorer.jaios-governance.org </dev/null 2>/dev/null |
            openssl x509 -noout -checkhost explorer.jaios-governance.org
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            https://scan.jaios-governance.org/)" = "301"
          redirect_url="$(curl -sS -o /dev/null -w '%{redirect_url}' \
            https://scan.jaios-governance.org/)"
          [[ "$redirect_url" == https://explorer.jaios-governance.org* ]]
          jq -n \
            --arg url "https://explorer.jaios-governance.org/" \
            --arg commit "$GITHUB_SHA" \
            --arg run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg rollback "/var/lib/junca/scan-rollbacks/${GITHUB_RUN_ID}" \
            --slurpfile explorer artifacts/explorer.json \
            --slurpfile nodes artifacts/explorer-node-publication.json '{
              status: "PRODUCTION",
              url: $url,
              exact_commit: $commit,
              workflow: $run,
              rollback_point: $rollback,
              explorer: $explorer[0],
              node_publication: $nodes[0],
              publication_acceptance: (
                if $nodes[0].verification_in_progress_nodes == 0 then "VERIFIED"
                else "VERIFICATION IN PROGRESS"
                end
              ),
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/scan-publication.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-scan-publication-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
