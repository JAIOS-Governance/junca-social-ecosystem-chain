name: JUNCA Chain Direct Stack Reconcile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/junca-chain-direct-stack-reconcile.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-chain-domain-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "595710543956"
  AWS_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
  HOSTED_ZONE_ID: Z0336017285464TX0NT1G
  STACK_NAME: junca-chain-docs-publication

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    steps:
      - uses: actions/checkout@v4

      - name: Configure verified production identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: chain-direct-reconcile-${{ github.run_id }}

      - name: Verify immutable production target
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."

      - name: Apply canonical stack template directly
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(aws cloudformation update-stack \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-body file://infra/aws/docs-publication/main.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=DomainName,ParameterValue=docs.jaios-governance.org \
              ParameterKey=HostedZoneId,ParameterValue="$HOSTED_ZONE_ID" \
              ParameterKey=Repository,ParameterValue=JAIOS-Governance/junca-social-ecosystem-chain \
              ParameterKey=RepositoryOwnerId,ParameterValue=308604370 \
              ParameterKey=RepositoryId,ParameterValue=1310568313 \
              ParameterKey=EnvironmentName,ParameterValue=junca-chain-docs-production \
              ParameterKey=ExistingGitHubOidcProviderArn,ParameterValue=arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && ! grep -q "No updates are to be performed" <<<"$output"; then
            printf '%s\n' "$output" >&2
            exit "$rc"
          fi
          printf '%s\n' "$output"

      - name: UPSERT exact Sites DNS after policy propagation
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/change.json <<'JSON'
          {"Comment":"Finalize chain.jaios-governance.org Sites binding","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"chain.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]}}]}
          JSON
          for attempt in $(seq 1 24); do
            set +e
            response="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              change_id="$response"
              aws route53 wait resource-record-sets-changed --id "$change_id"
              test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
              echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! grep -q "AccessDenied" <<<"$response"; then
              printf '%s\n' "$response" >&2
              exit "$rc"
            fi
            sleep 15
          done
          printf '%s\n' "$response" >&2
          exit 1

      - name: Exact DNS preservation readback
        shell: bash
        run: |
          set -euo pipefail
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.' || Name=='docs.jaios-governance.org.' || Name=='explorer.jaios-governance.org.']" \
            --output json
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?Name=='explorer.jaios-governance.org.'])" --output text)" = "0"

# Triggered by Production Recovery Cell after canonical OIDC subject verification.
