name: JAIOS Root Trust Direct Production

on:
  push:
    branches: [main]
    paths:
      - "config/jaios_root_trust_production_trigger.json"
      - "scripts/build_jaios_root_news_edge.py"
      - "sites/jaios-root-news/**"
      - "infra/aws/jaios-root-news-router.js"
      - ".github/workflows/jaios-root-trust-direct-production.yml"
  pull_request:
    branches: [main]
    paths:
      - "config/jaios_root_trust_production_trigger.json"
      - "scripts/build_jaios_root_news_edge.py"
      - "sites/jaios-root-news/**"
      - "infra/aws/jaios-root-news-router.js"
      - ".github/workflows/jaios-root-trust-direct-production.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: jaios-root-trust-direct-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "595710543956"
  AWS_REGION: us-east-1
  ROOT_DOMAIN: jaios-governance.org
  DOCS_DOMAIN: docs.jaios-governance.org
  DOCS_BUCKET: junca-chain-docs-595710543956
  DISTRIBUTION_ID: E2WIXG3DWW8OX1
  DISTRIBUTION_ARN: arn:aws:cloudfront::595710543956:distribution/E2WIXG3DWW8OX1
  EXPECTED_ORIGIN_DOMAIN: jaios-institutional-governance.juncajapan-inc.chatgpt.site
  FUNCTION_NAME: jaios-root-news-router
  FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/jaios-root-news-router
  RELEASE_MARKER: 20260804-six-card-news
  TRUST_MARKER: 20260804-institutional-trust

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed source and build logic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_jaios_root_news_edge.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('config/jaios_root_trust_production_trigger.json').read_text())
          news=json.loads(Path('sites/jaios-root-news/news-items.json').read_text())
          assert trigger['schema'] == 'jaios-root-trust-production-trigger/v1'
          assert trigger['release_marker'] == '20260804-institutional-trust'
          assert len(news['items']) == 6
          assert trigger['route53_changed'] is False
          assert trigger['tls_changed'] is False
          assert trigger['mainnet_changed'] is False
          assert trigger['assets_moved'] is False
          assert trigger['bridge_activated'] is False
          PY
          grep -F "import cf from 'cloudfront';" infra/aws/jaios-root-news-router.js
          grep -F "cf.updateRequestOrigin" infra/aws/jaios-root-news-router.js
          grep -F "INSTITUTIONAL TRUST ARCHITECTURE" scripts/build_jaios_root_news_edge.py
          grep -F "JAIOSによる監査" scripts/build_jaios_root_news_edge.py
          grep -F "国際的な信頼に耐え得る運営環境" scripts/build_jaios_root_news_edge.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json" > /tmp/oidc-token
          test -s /tmp/oidc-token

      - name: Assume approved bootstrap identity
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for role in \
            arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment \
            arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
          do
            if aws sts assume-role-with-web-identity \
              --role-arn "$role" \
              --role-session-name "jaios-root-trust-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/oidc-token)" \
              --duration-seconds 1800 > /tmp/assume.json 2>/tmp/assume.err; then
              selected="$role"
              break
            fi
          done
          test -n "$selected"
          export AWS_ACCESS_KEY_ID="$(jq -r '.Credentials.AccessKeyId' /tmp/assume.json)"
          export AWS_SECRET_ACCESS_KEY="$(jq -r '.Credentials.SecretAccessKey' /tmp/assume.json)"
          export AWS_SESSION_TOKEN="$(jq -r '.Credentials.SessionToken' /tmp/assume.json)"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> "$GITHUB_ENV"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Verify exact AWS boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query Distribution.ARN --output text)" = "$DISTRIBUTION_ARN"
          aws cloudfront get-distribution --id "$DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Origins.Items[].DomainName' --output json \
            | jq -e --arg origin "$EXPECTED_ORIGIN_DOMAIN" 'index($origin) != null'
          test "$(aws s3api get-bucket-versioning --bucket "$DOCS_BUCKET" --query Status --output text)" = "Enabled"

      - name: Build and publish exact governed root artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 30 \
            --output /tmp/current-root.html "https://${ROOT_DOMAIN}/"
          python3 scripts/build_jaios_root_news_edge.py \
            /tmp/current-root.html sites/jaios-root-news/news-items.json /tmp/index.html
          grep -F "data-jaios-news-release='${RELEASE_MARKER}'" /tmp/index.html
          grep -F "data-jaios-trust-release='${TRUST_MARKER}'" /tmp/index.html
          aws s3 cp /tmp/index.html "s3://${DOCS_BUCKET}/jaios-root-news/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public,max-age=0,must-revalidate" \
            --metadata "source-commit=${GITHUB_SHA},release=${TRUST_MARKER}"
          aws s3 cp "s3://${DOCS_BUCKET}/jaios-root-news/index.html" /tmp/s3-readback.html
          cmp /tmp/index.html /tmp/s3-readback.html
          sha256sum /tmp/current-root.html | cut -d' ' -f1 > /tmp/original-sha.txt
          sha256sum /tmp/index.html | cut -d' ' -f1 > /tmp/artifact-sha.txt

      - name: Create, test and publish exact CloudFront Function
        id: function
        shell: bash
        run: |
          set -euo pipefail
          cp infra/aws/jaios-root-news-router.js /tmp/function.js
          cat > /tmp/function-config.json <<'JSON'
          {"Comment":"Route only the JAIOS root document to the governed institutional trust artifact","Runtime":"cloudfront-js-2.0"}
          JSON
          cat > /tmp/test-event.json <<'JSON'
          {"version":"1.0","context":{"eventType":"viewer-request"},"viewer":{"ip":"198.51.100.10"},"request":{"method":"GET","uri":"/","querystring":{},"headers":{"host":{"value":"jaios-governance.org"}},"cookies":{}}}
          JSON
          if aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT >/tmp/function-description.json 2>/tmp/function-description.err; then
            etag="$(jq -r '.ETag' /tmp/function-description.json)"
            aws cloudfront update-function --name "$FUNCTION_NAME" --if-match "$etag" \
              --function-config file:///tmp/function-config.json \
              --function-code fileb:///tmp/function.js >/tmp/function-update.json
          else
            if ! aws cloudfront create-function --name "$FUNCTION_NAME" \
              --function-config file:///tmp/function-config.json \
              --function-code fileb:///tmp/function.js >/tmp/function-create.json; then
              aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT >/tmp/function-description-after-race.json
              etag="$(jq -r '.ETag' /tmp/function-description-after-race.json)"
              aws cloudfront update-function --name "$FUNCTION_NAME" --if-match "$etag" \
                --function-config file:///tmp/function-config.json \
                --function-code fileb:///tmp/function.js >/tmp/function-update-after-race.json
            fi
          fi
          dev_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
          aws cloudfront test-function --name "$FUNCTION_NAME" --if-match "$dev_etag" --stage DEVELOPMENT \
            --event-object fileb:///tmp/test-event.json >/tmp/function-test.json
          jq -e '.TestResult.FunctionErrorMessage == null or .TestResult.FunctionErrorMessage == ""' /tmp/function-test.json
          aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$dev_etag" >/tmp/function-publish.json
          actual_arn="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage LIVE --query FunctionSummary.FunctionMetadata.FunctionARN --output text)"
          test "$actual_arn" = "$FUNCTION_ARN"
          echo "arn=$actual_arn" >> "$GITHUB_OUTPUT"

      - name: Activate exact root-only routing with automatic rollback
        id: activate
        env:
          LIVE_FUNCTION_ARN: ${{ steps.function.outputs.arn }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" > /tmp/distribution-before.json
          jq '.DistributionConfig' /tmp/distribution-before.json > /tmp/distribution-before-config.json
          before_etag="$(jq -r '.ETag' /tmp/distribution-before.json)"
          other_viewer="$(jq --arg arn "$LIVE_FUNCTION_ARN" '[.DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Items[]? | select(.EventType == "viewer-request" and .FunctionARN != $arn)] | length' /tmp/distribution-before.json)"
          test "$other_viewer" -eq 0
          jq --arg arn "$LIVE_FUNCTION_ARN" '
            .DefaultCacheBehavior.FunctionAssociations = (
              (.DefaultCacheBehavior.FunctionAssociations // {"Quantity":0,"Items":[]})
              | .Items = (((.Items // []) | map(select(.EventType != "viewer-request"))) + [{"FunctionARN":$arn,"EventType":"viewer-request"}])
              | .Quantity = (.Items | length)
            )
          ' /tmp/distribution-before-config.json > /tmp/distribution-after-config.json

          activated=0
          rollback() {
            rc=$?
            if [[ "$activated" -eq 1 ]]; then
              current_etag="$(aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" --query ETag --output text)"
              aws cloudfront update-distribution --id "$DISTRIBUTION_ID" --if-match "$current_etag" \
                --distribution-config file:///tmp/distribution-before-config.json >/tmp/rollback.json || true
              aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID" || true
              aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/' '/index.html' >/tmp/rollback-invalidation.json || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          aws cloudfront update-distribution --id "$DISTRIBUTION_ID" --if-match "$before_etag" \
            --distribution-config file:///tmp/distribution-after-config.json >/tmp/distribution-update.json
          activated=1
          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/' '/index.html' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"

          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/public-root.html "https://${ROOT_DOMAIN}/?release=${GITHUB_SHA}" \
              && grep -Fq "data-jaios-news-release='${RELEASE_MARKER}'" /tmp/public-root.html \
              && grep -Fq "data-jaios-trust-release='${TRUST_MARKER}'" /tmp/public-root.html; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          grep -F 'INSTITUTIONAL TRUST ARCHITECTURE' /tmp/public-root.html
          grep -F 'JAIOSによる監査' /tmp/public-root.html
          grep -F 'JAIOSの管理基準' /tmp/public-root.html
          grep -F '国際的な信頼に耐え得る運営環境' /tmp/public-root.html
          if grep -Eqi 'JUNCA Point|Point conversion|Point交換|revenue model|revenue allocation|収益モデル|収益配分' /tmp/public-root.html; then
            echo "Closed or whitepaper-only information detected in public root" >&2
            exit 1
          fi
          for route in browser institution social-business observatory evidence; do
            curl --fail --silent --show-error --location --output "/tmp/${route}.html" "https://${ROOT_DOMAIN}/${route}"
            ! grep -Fq "data-jaios-trust-release='${TRUST_MARKER}'" "/tmp/${route}.html"
          done
          trap - ERR
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Persist immutable production evidence
        env:
          BOOTSTRAP_ROLE: ${{ steps.bootstrap.outputs.selected }}
          INVALIDATION_ID: ${{ steps.activate.outputs.invalidation_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/production
          jq -n \
            --arg observed_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg source_commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg bootstrap_role "$BOOTSTRAP_ROLE" \
            --arg distribution_id "$DISTRIBUTION_ID" \
            --arg function_arn "$FUNCTION_ARN" \
            --arg invalidation_id "$INVALIDATION_ID" \
            --arg original_html_sha256 "$(cat /tmp/original-sha.txt)" \
            --arg artifact_sha256 "$(cat /tmp/artifact-sha.txt)" \
            '{
              schema: "jaios-root-institutional-trust-production/v1",
              observed_at: $observed_at,
              source_commit: $source_commit,
              workflow_run_id: $run_id,
              bootstrap_role: $bootstrap_role,
              public_url: "https://jaios-governance.org/",
              distribution_id: $distribution_id,
              function_arn: $function_arn,
              invalidation_id: $invalidation_id,
              original_html_sha256: $original_html_sha256,
              artifact_sha256: $artifact_sha256,
              institutional_trust_marker: "20260804-institutional-trust",
              news_cards: 6,
              non_root_routes_preserved: ["/browser","/institution","/social-business","/observatory","/evidence"],
              closed_information_absent: true,
              route53_changed: false,
              tls_changed: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false,
              result: "PRODUCTION_ACCEPTED"
            }' > evidence/production/jaios-root-institutional-trust-production-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add evidence/production/jaios-root-institutional-trust-production-latest.json
          git diff --cached --quiet || git commit -m "Record JAIOS root institutional trust production ${GITHUB_RUN_ID}"
          git push origin HEAD:main
