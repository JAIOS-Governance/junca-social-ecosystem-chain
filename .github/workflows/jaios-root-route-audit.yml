name: JAIOS Root Route Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jaios-root-route-audit.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: jaios-root-route-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      ROOT_DOMAIN: jaios-governance.org
      RECOVERY_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure verified AWS audit identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.RECOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-root-route-audit-${{ github.run_id }}
          disable-retry: true

      - name: Verify identity boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          case "$(aws sts get-caller-identity --query Arn --output text)" in
            arn:aws:sts::595710543956:assumed-role/JuncaChainDocsProductionDeployment/*) ;;
            *) exit 1 ;;
          esac

      - name: Read Route 53 records and public resolution
        shell: bash
        run: |
          set -euo pipefail
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name=='${ROOT_DOMAIN}.' || Name=='www.${ROOT_DOMAIN}.' || Name=='_cf-custom-hostname.${ROOT_DOMAIN}.']" \
            --output json > /tmp/route53-root-records.json
          dig +noall +answer "$ROOT_DOMAIN" A > /tmp/dns-a.txt
          dig +noall +answer "$ROOT_DOMAIN" AAAA > /tmp/dns-aaaa.txt
          dig +noall +answer "$ROOT_DOMAIN" CNAME > /tmp/dns-cname.txt
          dig +noall +answer "$ROOT_DOMAIN" HTTPS > /tmp/dns-https.txt
          dig +short NS "$ROOT_DOMAIN" > /tmp/dns-ns.txt

      - name: Read HTTP identity, headers and TLS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --max-time 30 --dump-header /tmp/headers.txt \
            --output /tmp/home.html "https://${ROOT_DOMAIN}/"
          grep -Eo '<title>[^<]+' /tmp/home.html | head -1 > /tmp/title.txt || true
          grep -Eo 'https://[^"'"' ]+\.chatgpt\.site[^"'"' ]*' /tmp/home.html | sort -u > /tmp/native-site-urls.txt || true
          grep -Eo 'https://[^"'"' ]+\.(cloudfront\.net|run\.app|pages\.dev|vercel\.app|netlify\.app)[^"'"' ]*' /tmp/home.html | sort -u > /tmp/provider-urls.txt || true
          openssl s_client -connect "${ROOT_DOMAIN}:443" -servername "$ROOT_DOMAIN" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -serial -dates -ext subjectAltName \
            > /tmp/tls.txt
          sha256sum /tmp/home.html > /tmp/home-sha256.txt

      - name: Inventory existing AWS web resources
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${ROOT_DOMAIN}')].[Id,DomainName,Status,Aliases.Items,Origins.Items[*].DomainName]" \
            --output json > /tmp/cloudfront.json
          aws s3api list-buckets \
            --query "Buckets[?contains(Name, 'jaios') || contains(Name, 'junca')].[Name,CreationDate]" \
            --output json > /tmp/buckets.json
          aws acm list-certificates --region us-east-1 \
            --query "CertificateSummaryList[?contains(DomainName, '${ROOT_DOMAIN}') || contains(DomainName, 'jaios-governance.org')].[CertificateArn,DomainName,Status]" \
            --output json > /tmp/certificates.json
          aws iam list-roles \
            --query "Roles[?contains(RoleName, 'Junca') || contains(RoleName, 'JAIOS')].[RoleName,Arn]" \
            --output json > /tmp/roles.json

      - name: Build persistent audit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/production
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def text(path):
              return Path(path).read_text(encoding='utf-8', errors='replace').strip()

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          evidence = {
              'schema': 'jaios-root-route-audit/v1',
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'source_commit': os.environ['GITHUB_SHA'],
              'domain': os.environ['ROOT_DOMAIN'],
              'aws_account_id': os.environ['AWS_ACCOUNT_ID'],
              'hosted_zone_id': os.environ['HOSTED_ZONE_ID'],
              'route53_records': load('/tmp/route53-root-records.json'),
              'dns': {
                  'a': text('/tmp/dns-a.txt'),
                  'aaaa': text('/tmp/dns-aaaa.txt'),
                  'cname': text('/tmp/dns-cname.txt'),
                  'https': text('/tmp/dns-https.txt'),
                  'ns': text('/tmp/dns-ns.txt'),
              },
              'http': {
                  'title': text('/tmp/title.txt'),
                  'headers': text('/tmp/headers.txt'),
                  'html_sha256': text('/tmp/home-sha256.txt').split()[0],
                  'native_site_urls': [v for v in text('/tmp/native-site-urls.txt').splitlines() if v],
                  'provider_urls': [v for v in text('/tmp/provider-urls.txt').splitlines() if v],
              },
              'tls': text('/tmp/tls.txt'),
              'aws_resources': {
                  'cloudfront': load('/tmp/cloudfront.json'),
                  'buckets': load('/tmp/buckets.json'),
                  'certificates': load('/tmp/certificates.json'),
                  'roles': load('/tmp/roles.json'),
              },
              'mutations': {
                  'route53': False,
                  'cloudfront': False,
                  's3': False,
                  'acm': False,
                  'iam': False,
              },
              'result': 'PASS',
          }
          out = Path('evidence/production/jaios-root-route-audit-latest.json')
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          md = [
              '# JAIOS Root Route Audit',
              '',
              f"Observed: {evidence['observed_at']}",
              f"Domain: https://{evidence['domain']}/",
              f"Workflow run: {evidence['workflow_run_id']}",
              f"Source commit: `{evidence['source_commit']}`",
              f"Current HTML SHA-256: `{evidence['http']['html_sha256']}`",
              '',
              '## Route 53',
              '```json',
              json.dumps(evidence['route53_records'], ensure_ascii=False, indent=2),
              '```',
              '',
              '## CloudFront',
              '```json',
              json.dumps(evidence['aws_resources']['cloudfront'], ensure_ascii=False, indent=2),
              '```',
              '',
              '## Native / Provider URLs',
              '```text',
              '\n'.join(evidence['http']['native_site_urls'] + evidence['http']['provider_urls']) or 'none found in HTML',
              '```',
              '',
              '## TLS',
              '```text',
              evidence['tls'],
              '```',
              '',
              'No DNS, hosting, certificate or IAM mutation was performed.',
          ]
          Path('evidence/production/jaios-root-route-audit-latest.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
          PY

      - name: Persist audit evidence to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/production/jaios-root-route-audit-latest.json \
                  evidence/production/jaios-root-route-audit-latest.md
          if git diff --cached --quiet; then
            echo "Audit evidence unchanged."
            exit 0
          fi
          git commit -m "Record JAIOS root route audit ${GITHUB_RUN_ID}"
          git push origin HEAD:main

      - name: Publish bounded audit summary
        shell: bash
        run: |
          {
            echo "### JAIOS Root Route Audit"
            echo "- Domain: https://${ROOT_DOMAIN}/"
            echo "- AWS account: ${AWS_ACCOUNT_ID}"
            echo "- Hosted zone: ${HOSTED_ZONE_ID}"
            echo "- Route 53 mutation: false"
            echo "- CloudFront mutation: false"
            echo "- Current HTML SHA-256: $(cut -d' ' -f1 /tmp/home-sha256.txt)"
            echo "- Persistent evidence: evidence/production/jaios-root-route-audit-latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
