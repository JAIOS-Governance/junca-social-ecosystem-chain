name: JUNCA Public Testnet IAM Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-public-testnet-iam-recovery.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      STATE_LOCK_TABLE: junca-social-ecosystem-chain-testnet-lock
      TF_VAR_aws_account_id: "595710543956"
      TF_VAR_state_bucket_name: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      TF_VAR_lock_table_name: junca-social-ecosystem-chain-testnet-lock
      TF_VAR_github_oidc_thumbprint: 6938fd4d98bab03faadb97b34396831e3780aea1

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-public-testnet-iam-${{ github.run_id }}
          retry-max-attempts: 3

      - name: Apply exact public release permission recovery
        run: |
          set -euo pipefail
          mkdir -p artifacts
          terraform -chdir=infra/aws/bootstrap init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/bootstrap.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$STATE_LOCK_TABLE" \
            -backend-config="encrypt=true"
          terraform -chdir=infra/aws/bootstrap plan -input=false \
            -target=aws_iam_role_policy.deployment_infrastructure \
            -out="$GITHUB_WORKSPACE/artifacts/iam-recovery.tfplan"
          terraform -chdir=infra/aws/bootstrap show -json \
            "$GITHUB_WORKSPACE/artifacts/iam-recovery.tfplan" \
            > artifacts/iam-recovery-plan.json
          jq -e '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"] and .change.actions != ["read"])
              | select(.address != "aws_iam_role_policy.deployment_infrastructure")
            ] | length == 0
          ' artifacts/iam-recovery-plan.json
          jq -e '
            [.resource_changes[]?
              | select(.change.actions | index("delete"))
            ] | length == 0
          ' artifacts/iam-recovery-plan.json
          terraform -chdir=infra/aws/bootstrap apply -input=false -auto-approve \
            "$GITHUB_WORKSPACE/artifacts/iam-recovery.tfplan"

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOYMENT_ROLE_ARN" \
            --action-names iam:CreateServiceLinkedRole \
            --resource-arns \
              "arn:aws:iam::$AWS_ACCOUNT_ID:role/aws-service-role/elasticloadbalancing.amazonaws.com/AWSServiceRoleForElasticLoadBalancing" \
            --context-entries \
              ContextKeyName=iam:AWSServiceName,ContextKeyValues=elasticloadbalancing.amazonaws.com,ContextKeyType=string \
            > artifacts/iam-service-role-simulation.json
          jq -e '
            (.EvaluationResults | length) == 1 and
            all(.EvaluationResults[]; .EvalDecision == "allowed")
          ' artifacts/iam-service-role-simulation.json

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOYMENT_ROLE_ARN" \
            --action-names wafv2:CreateWebACL \
            --resource-arns "*" \
            --context-entries \
              ContextKeyName=aws:RequestTag/Project,ContextKeyValues="JUNCA Social Ecosystem Chain",ContextKeyType=string \
              ContextKeyName=aws:TagKeys,ContextKeyValues=Governance,ManagedBy,MonetaryUse,Network,Project,ContextKeyType=stringList \
            > artifacts/iam-waf-simulation.json
          jq -e '
            (.EvaluationResults | length) == 1 and
            all(.EvaluationResults[]; .EvalDecision == "allowed")
          ' artifacts/iam-waf-simulation.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-public-testnet-iam-recovery-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
