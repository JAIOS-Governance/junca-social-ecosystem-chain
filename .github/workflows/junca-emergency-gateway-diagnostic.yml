name: JUNCA Emergency Gateway Diagnostic

on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-gateway-diagnostic.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-gateway-diagnostic-${{ github.run_id }}
      - name: Inspect services and ALB targets
        run: |
          set -euo pipefail
          instances=(i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b)
          cat > /tmp/inspect.json <<'JSON'
          {"commands":["echo INSTANCE=$(ec2-metadata -i 2>/dev/null || true)","systemctl --no-pager -l status junca-validator.service junca-public-rpc.service junca-public-explorer.service || true","ss -ltnp || true","curl -sS http://127.0.0.1:8545/health || true","journalctl -u junca-public-rpc.service -u junca-public-explorer.service --no-pager -n 60 --output=cat || true"]}
          JSON
          command_id="$(aws ssm send-command --instance-ids "${instances[@]}" --document-name AWS-RunShellScript --parameters file:///tmp/inspect.json --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            for attempt in $(seq 1 30); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 2; done
            echo "===== $instance ====="
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text || true
          done
          for arn in $(aws elbv2 describe-target-groups --query 'TargetGroups[?contains(TargetGroupName, `junca`)].TargetGroupArn' --output text); do echo "===== $arn ====="; aws elbv2 describe-target-health --target-group-arn "$arn" --output json; done
