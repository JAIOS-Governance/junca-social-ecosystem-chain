name: JUNCA Validator Peer and Epoch Convergence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-validator-peer-epoch-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-validator-peer-epoch-convergence
  cancel-in-progress: false

jobs:
  converge-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: public-testnet
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-peer-epoch-${{ github.run_id }}

      - name: Resolve exact fleet and current public baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          aws sts get-caller-identity > artifacts/aws-identity.json
          jq -e --arg account "$AWS_ACCOUNT_ID" '
            .Account == $account and
            (.Arn | contains(":assumed-role/JuncaChainPublicTestnetDeployment/"))
          ' artifacts/aws-identity.json >/dev/null
          aws ec2 describe-instances \
            --filters \
              "Name=instance-state-name,Values=running" \
              "Name=tag:Project,Values=JUNCA Social Ecosystem Chain" \
              "Name=tag:Network,Values=Public Testnet" \
              "Name=tag:Validator,Values=01,02,03" \
            > artifacts/ec2-instances.json
          jq -e '
            [.Reservations[].Instances[] | {
              instance_id: .InstanceId,
              validator: (.Tags[] | select(.Key == "Validator") | .Value),
              private_ip: .PrivateIpAddress,
              state: .State.Name
            }] | sort_by(.validator) |
            select(
              length == 3 and
              map(.validator) == ["01","02","03"] and
              (map(.instance_id) | unique | length) == 3 and
              (map(.private_ip) | unique | length) == 3 and
              all(.[]; .state == "running")
            )
          ' artifacts/ec2-instances.json > artifacts/validators.json
          mapfile -t instances < <(jq -r '.[].instance_id' artifacts/validators.json)
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$(IFS=,; echo "${instances[*]}")" \
            > artifacts/ssm-instances.json
          jq -e --argjson expected "$(jq '[.[].instance_id] | sort' artifacts/validators.json)" '
            [.InstanceInformationList[] | select(.PingStatus == "Online") | .InstanceId] |
            sort | . == $expected
          ' artifacts/ssm-instances.json >/dev/null
          jq -r '[.[] | "validator-\(.validator)=\(.private_ip):30303"] | join(",")' \
            artifacts/validators.json > artifacts/canonical-peer-endpoints.txt
          curl -fsS -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
            https://rpc.jaios-governance.org/ > artifacts/public-baseline-block.json
          jq -e '.result | test("^0x[0-9a-f]+$")' artifacts/public-baseline-block.json >/dev/null

      - name: Resolve validator-01 canonical slot epoch without sourcing runtime.env
        shell: bash
        run: |
          set -Eeuo pipefail
          validator01="$(jq -er '.[] | select(.validator == "01") | .instance_id' artifacts/validators.json)"
          cat > /tmp/read-runtime.sh <<'REMOTE'
          set -Eeuo pipefail
          value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {print substr($0, length(key) + 2)}' /etc/junca/runtime.env | tail -n 1
          }
          validator_id="$(value VALIDATOR_ID)"
          epoch="$(value TESTNET_SLOT_EPOCH_SECONDS)"
          enabled="$(value AUTOMATIC_FINALITY_ENABLED)"
          interval="$(value TESTNET_BLOCK_INTERVAL_SECONDS)"
          test "$validator_id" = validator-01
          [[ "$epoch" =~ ^[0-9]+$ ]]
          test "$((epoch % 30))" -eq 0
          test "$enabled" = true
          test "$interval" = 30
          jq -n \
            --arg validator_id "$validator_id" \
            --argjson slot_epoch_seconds "$epoch" \
            --arg automatic_finality_enabled "$enabled" \
            --argjson block_interval_seconds "$interval" '{
              validator_id: $validator_id,
              slot_epoch_seconds: $slot_epoch_seconds,
              automatic_finality_enabled: $automatic_finality_enabled,
              block_interval_seconds: $block_interval_seconds
            }'
          REMOTE
          jq -Rs '{commands:[.]}' /tmp/read-runtime.sh > /tmp/read-runtime.json
          command_id="$(aws ssm send-command \
            --instance-ids "$validator01" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/read-runtime.json \
            --comment 'Read exact current JSEC runtime epoch' \
            --query Command.CommandId --output text)"
          for attempt in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$validator01" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            test "$attempt" -lt 90
            sleep 2
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$validator01" \
            > artifacts/validator-01-runtime-readback.json
          jq -e '.Status == "Success" and (.ResponseCode // -1) == 0' \
            artifacts/validator-01-runtime-readback.json >/dev/null
          jq -r '.StandardOutputContent' artifacts/validator-01-runtime-readback.json \
            | sed '/^[[:space:]]*$/d' | tail -n 1 > artifacts/canonical-runtime.json
          jq -e '
            .validator_id == "validator-01" and
            .automatic_finality_enabled == "true" and
            .block_interval_seconds == 30 and
            (.slot_epoch_seconds | type == "number" and . > 0 and . % 30 == 0)
          ' artifacts/canonical-runtime.json >/dev/null
          jq -r '.slot_epoch_seconds' artifacts/canonical-runtime.json \
            > artifacts/canonical-slot-epoch.txt

      - name: Converge exact peer endpoints and slot epoch serially
        shell: bash
        run: |
          set -Eeuo pipefail
          canonical_epoch="$(cat artifacts/canonical-slot-epoch.txt)"
          canonical_peers="$(cat artifacts/canonical-peer-endpoints.txt)"
          failures=0
          while IFS=$'\t' read -r validator instance private_ip; do
            expected_validator="validator-${validator}"
            {
              printf 'CANONICAL_EPOCH=%q\n' "$canonical_epoch"
              printf 'CANONICAL_PEERS=%q\n' "$canonical_peers"
              printf 'EXPECTED_VALIDATOR=%q\n' "$expected_validator"
              printf 'SELF_PRIVATE_IP=%q\n' "$private_ip"
              cat <<'REMOTE'
          set -Eeuo pipefail
          value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {print substr($0, length(key) + 2)}' /etc/junca/runtime.env | tail -n 1
          }
          diagnostics() {
            awk -F= '/^(VALIDATOR_ID|P2P_PORT|VALIDATOR_PEER_ENDPOINTS|AUTOMATIC_FINALITY_ENABLED|TESTNET_BLOCK_INTERVAL_SECONDS|TESTNET_SLOT_EPOCH_SECONDS)=/{print}' /etc/junca/runtime.env || true
            ss -lntp || true
            systemctl status junca-validator.service --no-pager -l || true
            journalctl -u junca-validator.service -n 180 --no-pager || true
          }
          trap 'rc=$?; echo "JUNCA_PEER_EPOCH_CONVERGENCE_FAILED rc=${rc}"; diagnostics; exit "$rc"' ERR

          test -s /etc/junca/runtime.env
          test "$(value VALIDATOR_ID)" = "$EXPECTED_VALIDATOR"
          test "$(value CHAIN_ID)" = 20260723
          test "$(value BRIDGE_ACTIVATED)" = false
          test -n "$(value VALIDATOR_SIGNER_BINDINGS)"

          python3 - "$CANONICAL_EPOCH" "$CANONICAL_PEERS" <<'PY'
          from pathlib import Path
          import os
          import sys

          epoch, peers = sys.argv[1:]
          path = Path('/etc/junca/runtime.env')
          lines = path.read_text(encoding='utf-8').splitlines()
          updates = {
              'P2P_PORT': '30303',
              'VALIDATOR_PEER_ENDPOINTS': peers,
              'AUTOMATIC_FINALITY_ENABLED': 'true',
              'TESTNET_BLOCK_INTERVAL_SECONDS': '30',
              'TESTNET_SLOT_EPOCH_SECONDS': epoch,
          }
          observed = set()
          output = []
          for line in lines:
              if '=' not in line or line.lstrip().startswith('#'):
                  output.append(line)
                  continue
              key = line.split('=', 1)[0]
              if key in updates:
                  output.append(f'{key}={updates[key]}')
                  observed.add(key)
              else:
                  output.append(line)
          missing = set(updates) - observed
          if missing:
              raise SystemExit(f'RUNTIME_ENV_KEYS_MISSING: {sorted(missing)}')
          temporary = Path('/etc/junca/runtime.env.peer-epoch.tmp')
          temporary.write_text('\n'.join(output) + '\n', encoding='utf-8')
          os.chmod(temporary, 0o640)
          os.chown(temporary, 0, os.stat(path).st_gid)
          temporary.replace(path)
          PY

          test "$(value VALIDATOR_ID)" = "$EXPECTED_VALIDATOR"
          test "$(value P2P_PORT)" = 30303
          test "$(value VALIDATOR_PEER_ENDPOINTS)" = "$CANONICAL_PEERS"
          test "$(value AUTOMATIC_FINALITY_ENABLED)" = true
          test "$(value TESTNET_BLOCK_INTERVAL_SECONDS)" = 30
          test "$(value TESTNET_SLOT_EPOCH_SECONDS)" = "$CANONICAL_EPOCH"
          chown root:junca /etc/junca/runtime.env
          chmod 0640 /etc/junca/runtime.env

          systemctl reset-failed junca-validator.service junca-public-rpc.service junca-public-explorer.service || true
          systemctl restart junca-validator.service
          validator_ready=false
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8545/health >/tmp/validator-health.json \
              && jq -e '
                .status == "healthy" and
                .chain_id == 20260723 and
                .automatic_finality_enabled == true and
                .automatic_finality_loop_running == true and
                .mainnet_changed == false and
                .assets_moved == false and
                .bridge_activated == false
              ' /tmp/validator-health.json >/dev/null \
              && ss -lntH | awk '$4 ~ /:30303$/ {found=1} END {exit found?0:1}'; then
              validator_ready=true
              break
            fi
            test "$attempt" -lt 120
            sleep 2
          done
          test "$validator_ready" = true
          systemctl is-active --quiet junca-validator.service
          systemctl restart junca-public-rpc.service junca-public-explorer.service
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8546/health >/tmp/rpc-health.json \
              && curl -fsS http://127.0.0.1:3000/health >/tmp/explorer-health.json; then
              break
            fi
            test "$attempt" -lt 60
            sleep 2
          done
          jq -n \
            --arg validator_id "$(value VALIDATOR_ID)" \
            --arg canonical_epoch "$CANONICAL_EPOCH" \
            --arg self_private_ip "$SELF_PRIVATE_IP" \
            --slurpfile health /tmp/validator-health.json '{
              schema_version: "junca-validator-peer-epoch-convergence/v2",
              accepted: true,
              validator_id: $validator_id,
              canonical_epoch: $canonical_epoch,
              self_private_ip: $self_private_ip,
              health: $health[0],
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }'
          echo 'JUNCA_PEER_EPOCH_LOCAL_ACCEPTED'
          REMOTE
            } > /tmp/converge-${validator}.sh
            jq -Rs '{commands:[.]}' /tmp/converge-${validator}.sh \
              > /tmp/converge-${validator}.json
            command_id="$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name AWS-RunShellScript \
              --parameters file:///tmp/converge-${validator}.json \
              --comment "JUNCA ${expected_validator} peer and epoch convergence" \
              --query Command.CommandId --output text)"
            echo "$command_id" > "artifacts/convergence-command-${validator}.txt"
            for attempt in $(seq 1 150); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              test "$attempt" -lt 150
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/convergence-${validator}-${instance}.json"
            jq -r '.Status, .StandardOutputContent, .StandardErrorContent' \
              "artifacts/convergence-${validator}-${instance}.json"
            if ! jq -e '
              .Status == "Success" and
              (.ResponseCode // -1) == 0 and
              (.StandardOutputContent | contains("junca-validator-peer-epoch-convergence/v2")) and
              (.StandardOutputContent | contains("JUNCA_PEER_EPOCH_LOCAL_ACCEPTED"))
            ' "artifacts/convergence-${validator}-${instance}.json" >/dev/null; then
              failures=$((failures + 1))
              break
            fi
          done < <(jq -r '.[] | [.validator,.instance_id,.private_ip] | @tsv' artifacts/validators.json)
          test "$failures" -eq 0

      - name: Require exact 2-peer convergence on all validators
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t instances < <(jq -r '.[].instance_id' artifacts/validators.json)
          cat > /tmp/peer-acceptance.sh <<'REMOTE'
          set -Eeuo pipefail
          accepted=false
          for attempt in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8545/health >/tmp/peer-health.json \
              && jq -e '
                .status == "healthy" and
                .authenticated_peer_count == 2 and
                (.authenticated_peer_ids | length) == 2 and
                .automatic_finality_enabled == true and
                .automatic_finality_loop_running == true and
                .consensus.last_certificate.signed_power == 3 and
                .consensus.last_certificate.total_power == 3 and
                .mainnet_changed == false and
                .assets_moved == false and
                .bridge_activated == false
              ' /tmp/peer-health.json >/dev/null; then
              accepted=true
              break
            fi
            test "$attempt" -lt 150
            sleep 2
          done
          test "$accepted" = true
          cat /tmp/peer-health.json
          echo 'JUNCA_EXACT_TWO_PEERS_ACCEPTED'
          REMOTE
          jq -Rs '{commands:[.]}' /tmp/peer-acceptance.sh > /tmp/peer-acceptance.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/peer-acceptance.json \
            --comment 'JUNCA exact 2-peer acceptance across all validators' \
            --query Command.CommandId --output text)"
          echo "$command_id" > artifacts/peer-acceptance-command-id.txt
          failures=0
          for instance in "${instances[@]}"; do
            for attempt in $(seq 1 180); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              test "$attempt" -lt 180
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/peer-acceptance-${instance}.json"
            jq -r '.Status, .StandardOutputContent, .StandardErrorContent' \
              "artifacts/peer-acceptance-${instance}.json"
            if ! jq -e '
              .Status == "Success" and
              (.StandardOutputContent | contains("JUNCA_EXACT_TWO_PEERS_ACCEPTED"))
            ' "artifacts/peer-acceptance-${instance}.json" >/dev/null; then
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0

      - name: Require public parity and advancing finalized height
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline="$(python3 - <<'PY'
          import json
          value=json.load(open('artifacts/public-baseline-block.json'))['result']
          print(int(value,16))
          PY
          )"
          : > artifacts/public-samples.jsonl
          for sample in 1 2 3 4; do
            accepted=false
            for attempt in $(seq 1 30); do
              if curl -fsS https://health.jaios-governance.org/health > /tmp/public-health.json \
                && curl -fsS https://explorer.jaios-governance.org/explorer.json > /tmp/public-explorer.json \
                && curl -fsS -H 'content-type: application/json' \
                  --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                  https://rpc.jaios-governance.org/ > /tmp/public-chain-id.json \
                && curl -fsS -H 'content-type: application/json' \
                  --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' \
                  https://rpc.jaios-governance.org/ > /tmp/public-block.json \
                && jq -e '.status == "healthy" and .read_only == true' /tmp/public-health.json >/dev/null \
                && jq -e '
                  .status == "ready" and .read_only == true and .finalized_only == true and
                  .network.chain_id_decimal == 20260723 and .network.peer_count == 2 and
                  .head.signed_power == 3 and .head.total_power == 3 and
                  .mainnet_changed == false and .assets_moved == false and .bridge_activated == false
                ' /tmp/public-explorer.json >/dev/null \
                && jq -e '.result == "0x1352773"' /tmp/public-chain-id.json >/dev/null; then
                accepted=true
                break
              fi
              test "$attempt" -lt 30
              sleep 2
            done
            test "$accepted" = true
            jq -n \
              --argjson sample "$sample" \
              --slurpfile health /tmp/public-health.json \
              --slurpfile explorer /tmp/public-explorer.json \
              --slurpfile chain_id /tmp/public-chain-id.json \
              --slurpfile block /tmp/public-block.json '{
                sample: $sample,
                observed_at: (now | todateiso8601),
                health: $health[0],
                explorer: $explorer[0],
                rpc_chain_id: $chain_id[0],
                rpc_block_number: $block[0]
              }' >> artifacts/public-samples.jsonl
            if [ "$sample" -lt 4 ]; then sleep 35; fi
          done
          jq -s '.' artifacts/public-samples.jsonl > artifacts/public-samples.json
          read -r first last < <(python3 - <<'PY'
          import json
          data=json.load(open('artifacts/public-samples.json'))
          print(int(data[0]['rpc_block_number']['result'],16), int(data[-1]['rpc_block_number']['result'],16))
          PY
          )
          test "$last" -gt "$baseline"
          test "$last" -gt "$first"
          jq -n \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson baseline "$baseline" \
            --argjson first "$first" \
            --argjson last "$last" \
            --argjson validators "$(cat artifacts/validators.json)" \
            --argjson samples "$(cat artifacts/public-samples.json)" '{
              schema_version: "junca-public-testnet-peer-epoch-recovery/v2",
              result: "ACTIVE_ADVANCING",
              workflow_run_url: $run_url,
              baseline_height: $baseline,
              first_sample_height: $first,
              final_sample_height: $last,
              validators: $validators,
              public_samples: $samples,
              expected_peer_count: 2,
              signed_power: 3,
              total_power: 3,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false,
              mainnet_activation_authorized: false
            }' > artifacts/public-testnet-peer-epoch-recovery.json
          sha256sum artifacts/public-testnet-peer-epoch-recovery.json \
            > artifacts/public-testnet-peer-epoch-recovery.json.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-validator-peer-epoch-convergence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
