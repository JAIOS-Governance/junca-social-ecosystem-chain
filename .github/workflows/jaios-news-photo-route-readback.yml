name: JAIOS News Photo Route Readback

on:
  pull_request:
    paths:
      - ".github/workflows/jaios-news-photo-route-readback.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      DISTRIBUTION_ID: E2WIXG3DWW8OX1
      DOCS_BUCKET: junca-chain-docs-595710543956
      EDGE_OBJECT: jaios-root-news/index.html
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-news-photo-route-readback-${{ github.run_id }}
          disable-retry: true
      - name: Read exact current route
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" > /tmp/distribution.json
          echo 'JAIOS_PHOTO_ROUTE_DISTRIBUTION_BEGIN'
          jq '{etag:.ETag,aliases:.DistributionConfig.Aliases,origins:.DistributionConfig.Origins,default_cache_behavior:.DistributionConfig.DefaultCacheBehavior,cache_behaviors:.DistributionConfig.CacheBehaviors}' /tmp/distribution.json
          echo 'JAIOS_PHOTO_ROUTE_DISTRIBUTION_END'
          echo 'JAIOS_PHOTO_ROUTE_OBJECT_BEGIN'
          aws s3api head-object --bucket "$DOCS_BUCKET" --key "$EDGE_OBJECT" || true
          echo 'JAIOS_PHOTO_ROUTE_OBJECT_END'
