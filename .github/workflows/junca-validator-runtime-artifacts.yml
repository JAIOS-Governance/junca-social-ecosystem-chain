name: JUNCA Validator Runtime Artifacts

on:
  push:
    branches: [main]
    paths:
      - "jaios/social_ecosystem_chain/validator_artifacts.py"
      - "jaios/social_ecosystem_chain/validator_node.py"
      - "jaios/social_ecosystem_chain/**"
      - "packaging/systemd/**"
      - "config/junca_hardened_immutable_candidate_policy.json"
      - "scripts/build_validator_runtime.sh"
      - "scripts/verify_validator_runtime_layout.py"
      - "scripts/generate_junca_public_testnet_genesis.py"
      - "scripts/junca-chain-node"
      - "scripts/junca_validator_artifact_handoff.py"
      - "scripts/junca_hardened_immutable_candidate_policy.py"
      - "scripts/junca_dispatch_workflow_and_wait.py"
      - "scripts/junca_release_child_provenance.py"
      - "scripts/junca_runtime_release_evidence_collector_drift.py"
      - "scripts/junca_live_rollout_prefix_gate.py"
      - "scripts/junca_public_testnet_endpoint_test.py"
      - "scripts/junca_public_testnet_foundation.sh"
      - "tests/test_junca_validator_artifacts.py"
      - "tests/test_validator_runtime_layout.py"
      - "tests/test_junca_hardened_immutable_candidate_policy.py"
      - "tests/test_junca_release_orchestration.py"
      - "tests/test_junca_runtime_release_ami_drift.py"
      - "tests/test_junca_hardened_release_v2.py"
      - "tests/test_junca_live_rollout_prefix_gate.py"
      - "tests/test_junca_public_endpoint_sampling.py"
      - ".github/image-builder/validator-component.yml"
      - ".github/workflows/junca-validator-ami-build.yml"
      - ".github/workflows/junca-validator-runtime-artifacts.yml"
      - ".github/workflows/junca-hardened-immutable-candidate-release-v2.yml"
      - ".github/workflows/junca-runtime-release-evidence-collector-v2.yml"
      - ".github/workflows/junca-runtime-release-manifest-gate.yml"
      - ".github/workflows/junca-public-testnet-release-observer.yml"
  pull_request:
    paths:
      - "jaios/social_ecosystem_chain/validator_artifacts.py"
      - "jaios/social_ecosystem_chain/validator_node.py"
      - "jaios/social_ecosystem_chain/**"
      - "packaging/systemd/**"
      - "config/junca_hardened_immutable_candidate_policy.json"
      - "scripts/build_validator_runtime.sh"
      - "scripts/verify_validator_runtime_layout.py"
      - "scripts/generate_junca_public_testnet_genesis.py"
      - "scripts/junca-chain-node"
      - "scripts/junca_validator_artifact_handoff.py"
      - "scripts/junca_hardened_immutable_candidate_policy.py"
      - "scripts/junca_dispatch_workflow_and_wait.py"
      - "scripts/junca_release_child_provenance.py"
      - "scripts/junca_runtime_release_evidence_collector_drift.py"
      - "scripts/junca_live_rollout_prefix_gate.py"
      - "scripts/junca_public_testnet_endpoint_test.py"
      - "scripts/junca_public_testnet_foundation.sh"
      - "tests/test_junca_validator_artifacts.py"
      - "tests/test_validator_runtime_layout.py"
      - "tests/test_junca_hardened_immutable_candidate_policy.py"
      - "tests/test_junca_release_orchestration.py"
      - "tests/test_junca_runtime_release_ami_drift.py"
      - "tests/test_junca_hardened_release_v2.py"
      - "tests/test_junca_live_rollout_prefix_gate.py"
      - "tests/test_junca_public_endpoint_sampling.py"
      - ".github/image-builder/validator-component.yml"
      - ".github/workflows/junca-validator-ami-build.yml"
      - ".github/workflows/junca-validator-runtime-artifacts.yml"
      - ".github/workflows/junca-hardened-immutable-candidate-release-v2.yml"
      - ".github/workflows/junca-runtime-release-evidence-collector-v2.yml"
      - ".github/workflows/junca-runtime-release-manifest-gate.yml"
      - ".github/workflows/junca-public-testnet-release-observer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable artifact and safety contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_junca_validator_artifacts \
            tests.test_validator_runtime_layout \
            tests.test_junca_hardened_immutable_candidate_policy \
            tests.test_junca_release_orchestration \
            tests.test_junca_runtime_release_ami_drift \
            tests.test_junca_hardened_release_v2 \
            tests.test_junca_live_rollout_prefix_gate \
            tests.test_junca_public_endpoint_sampling \
            tests.test_junca_social_ecosystem_chain_validator_node -v
          python3 scripts/junca_hardened_immutable_candidate_policy.py \
            --policy config/junca_hardened_immutable_candidate_policy.json \
            --candidate-source-commit "$GITHUB_SHA"
          python3 -m py_compile \
            scripts/junca_dispatch_workflow_and_wait.py \
            scripts/junca_release_child_provenance.py \
            scripts/junca_live_rollout_prefix_gate.py \
            scripts/junca_public_testnet_endpoint_test.py
          python3 scripts/junca_live_rollout_prefix_gate.py --help >/dev/null
          bash -n scripts/junca_public_testnet_foundation.sh

      - name: Build deterministic runtime and canonical zero-allocation genesis
        run: |
          set -euo pipefail
          rm -rf dist/validator-runtime
          bash scripts/build_validator_runtime.sh dist/validator-runtime
          python scripts/verify_validator_runtime_layout.py dist/validator-runtime
          python scripts/generate_junca_public_testnet_genesis.py \
            --validator validator-01 \
            --validator validator-02 \
            --validator validator-03 \
            --output dist/genesis.json
          mkdir -p artifacts/runtime artifacts/genesis artifacts/evidence
          install -m 0644 dist/validator-runtime.tar.gz \
            artifacts/runtime/validator-runtime.tar.gz
          install -m 0644 dist/genesis.json artifacts/genesis/genesis.json
          node_sha256="$(sha256sum dist/validator-runtime.tar.gz | cut -d' ' -f1)"
          genesis_sha256="$(sha256sum dist/genesis.json | cut -d' ' -f1)"
          jq -n \
            --arg source_commit "$GITHUB_SHA" \
            --arg node_sha256 "$node_sha256" \
            --arg genesis_sha256 "$genesis_sha256" \
            --arg policy_sha256 "$(jq -er .policy_sha256 config/junca_hardened_immutable_candidate_policy.json)" '{
              schema_version: "junca-validator-runtime-build/v1",
              state: "IMMUTABLE_INPUTS_VERIFIED",
              governance: "JAIOS Institutional Governance",
              notice: "Public Testnet / No Monetary Value",
              source_commit: $source_commit,
              node_artifact_sha256: $node_sha256,
              genesis_sha256: $genesis_sha256,
              hardened_candidate_policy_sha256: $policy_sha256,
              validator_ids: ["validator-01", "validator-02", "validator-03"],
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/evidence/runtime-build.json
          (
            cd artifacts/evidence
            sha256sum runtime-build.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload complete validator runtime
        uses: actions/upload-artifact@v4
        with:
          name: junca-validator-runtime-${{ github.run_id }}
          path: artifacts/runtime/validator-runtime.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload canonical genesis
        uses: actions/upload-artifact@v4
        with:
          name: junca-validator-genesis-${{ github.run_id }}
          path: artifacts/genesis/genesis.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload runtime build evidence
        uses: actions/upload-artifact@v4
        with:
          name: junca-validator-runtime-evidence-${{ github.run_id }}
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 90
