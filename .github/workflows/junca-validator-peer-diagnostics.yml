name: JUNCA Validator Peer Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-validator-peer-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-validator-peer-diagnostics
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: "595710543956"
  AWS_REGION: us-east-1
  DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: public-testnet
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-peer-diagnostics-${{ github.run_id }}

      - name: Read current fleet and network controls
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          aws ec2 describe-instances \
            --filters \
              "Name=instance-state-name,Values=running" \
              "Name=tag:Project,Values=JUNCA Social Ecosystem Chain" \
              "Name=tag:Network,Values=Public Testnet" \
              "Name=tag:Validator,Values=01,02,03" \
            > artifacts/ec2-instances.json
          jq -e '
            [.Reservations[].Instances[] | {
              instance_id:.InstanceId,
              validator:(.Tags[]|select(.Key=="Validator")|.Value),
              private_ip:.PrivateIpAddress,
              subnet_id:.SubnetId,
              vpc_id:.VpcId,
              security_groups:[.SecurityGroups[].GroupId]
            }] | sort_by(.validator) |
            select(length==3 and map(.validator)==["01","02","03"])
          ' artifacts/ec2-instances.json > artifacts/validators.json
          mapfile -t groups < <(jq -r '.[].security_groups[]' artifacts/validators.json | sort -u)
          aws ec2 describe-security-groups --group-ids "${groups[@]}" > artifacts/security-groups.json
          mapfile -t subnets < <(jq -r '.[].subnet_id' artifacts/validators.json | sort -u)
          aws ec2 describe-network-acls \
            --filters "Name=association.subnet-id,Values=$(IFS=,; echo "${subnets[*]}")" \
            > artifacts/network-acls.json
          jq -r '[.[]|.private_ip]|join(" ")' artifacts/validators.json > artifacts/private-ips.txt

      - name: Test every validator listener and private path
        shell: bash
        run: |
          set -Eeuo pipefail
          ips="$(cat artifacts/private-ips.txt)"
          failures=0
          while IFS=$'\t' read -r validator instance self_ip; do
            {
              printf 'SELF_VALIDATOR=%q\n' "validator-${validator}"
              printf 'SELF_IP=%q\n' "$self_ip"
              printf 'ALL_IPS=%q\n' "$ips"
              cat <<'REMOTE'
          set -Eeuo pipefail
          value() {
            local key="$1"
            awk -F= -v key="$key" '$1==key {print substr($0,length(key)+2)}' /etc/junca/runtime.env | tail -n1
          }
          echo "validator=$(value VALIDATOR_ID) self=${SELF_IP}"
          test "$(value VALIDATOR_ID)" = "$SELF_VALIDATOR"
          echo "configured_peers=$(value VALIDATOR_PEER_ENDPOINTS)"
          echo "epoch=$(value TESTNET_SLOT_EPOCH_SECONDS)"
          echo 'listeners:'
          ss -lntp | grep -E ':30303|:8545|:8546|:3000' || true
          curl -fsS http://127.0.0.1:8545/health > /tmp/health.json
          jq -c '{validator_id,head_height,authenticated_peer_count,authenticated_peer_ids,automatic_finality_enabled,automatic_finality_loop_running,last_attempted_slot,consensus}' /tmp/health.json
          failed=0
          for ip in $ALL_IPS; do
            if [ "$ip" = "$SELF_IP" ]; then continue; fi
            if timeout 5 bash -c "</dev/tcp/${ip}/30303"; then
              echo "tcp_30303 ${ip} reachable"
            else
              echo "tcp_30303 ${ip} blocked"
              failed=$((failed+1))
            fi
          done
          test "$failed" -eq 0
          echo JUNCA_PEER_PATH_DIAGNOSTIC_PASS
          REMOTE
            } > /tmp/diagnose-${validator}.sh
            jq -Rs '{commands:[.]}' /tmp/diagnose-${validator}.sh > /tmp/diagnose-${validator}.json
            command_id="$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name AWS-RunShellScript \
              --parameters file:///tmp/diagnose-${validator}.json \
              --comment "JUNCA validator-${validator} peer path diagnostic" \
              --query Command.CommandId --output text)"
            for attempt in $(seq 1 60); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              test "$attempt" -lt 60
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/diagnostic-${validator}-${instance}.json"
            jq -r '.Status,.StandardOutputContent,.StandardErrorContent' \
              "artifacts/diagnostic-${validator}-${instance}.json"
            if ! jq -e '
              .Status=="Success" and
              (.StandardOutputContent|contains("JUNCA_PEER_PATH_DIAGNOSTIC_PASS"))
            ' "artifacts/diagnostic-${validator}-${instance}.json" >/dev/null; then failures=$((failures+1)); fi
          done < <(jq -r '.[]|[.validator,.instance_id,.private_ip]|@tsv' artifacts/validators.json)
          test "$failures" -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-validator-peer-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
