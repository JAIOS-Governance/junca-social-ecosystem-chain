name: JUNCA Chain Brand Domain DNS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-chain-brand-domain-dns.yml"

permissions:
  contents: read

jobs:
  upsert-brand-domain:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - uses: actions/checkout@v4
      - name: Configure publication-only AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-chain-brand-domain-${{ github.run_id }}
      - name: Verify exact AWS account and preserve existing records
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "595710543956"
          aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" >/tmp/hosted-zone.json
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" >/tmp/records-before.json
      - name: UPSERT Sites custom-domain records only
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/change-batch.json <<'JSON'
          {
            "Comment": "Bind chain.jaios-governance.org to the existing Sites brand project without changing docs or explorer records",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "chain.jaios-governance.org.",
                  "Type": "CNAME",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "custom-domains.chatgpt.site."}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_openai-site-verification.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_cf-custom-hostname.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]
                }
              }
            ]
          }
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change-batch.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
      - name: Read back exact brand records and protect reserved explorer
        shell: bash
        run: |
          set -euo pipefail
          for name in chain.jaios-governance.org. _openai-site-verification.chain.jaios-governance.org. _cf-custom-hostname.chain.jaios-governance.org.; do
            aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='$name']" --output json
          done
          explorer="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='explorer.jaios-governance.org.'] | length(@)" --output text)"
          test "$explorer" = "0"
          {
            echo "### Chain brand custom domain DNS"
            echo "- Hosted zone: $HOSTED_ZONE_ID"
            echo "- Change ID: ${{ steps.dns.outputs.change_id }}"
            echo "- Status: INSYNC"
            echo "- Hostname: chain.jaios-governance.org"
            echo "- Explorer record created: false"
          } >> "$GITHUB_STEP_SUMMARY"
