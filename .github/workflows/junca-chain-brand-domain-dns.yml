name: JUNCA Chain Brand Domain DNS

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: junca-chain-brand-domain-dns
  cancel-in-progress: true

jobs:
  normalize-default-oidc:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set default branch OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint" --data '{"use_default":true}'
          state="$(curl --silent --show-error --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" "$endpoint")"
          STATE="$state" python3 -c 'import json,os; assert json.loads(os.environ["STATE"]).get("use_default") is True'

  repair-minimum-iam:
    needs: normalize-default-oidc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      BOOTSTRAP_ROLE_ARN: arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
    steps:
      - name: Configure exact AWS bootstrap identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-chain-domain-iam-${{ github.run_id }}
      - name: Verify identity and apply minimum DNS policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          cat >/tmp/chain-domain-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "ChainCustomDomainDnsWrite",
                "Effect": "Allow",
                "Action": "route53:ChangeResourceRecordSets",
                "Resource": "arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G",
                "Condition": {
                  "ForAllValues:StringEquals": {
                    "route53:ChangeResourceRecordSetsNormalizedRecordNames": [
                      "chain.jaios-governance.org",
                      "_openai-site-verification.chain.jaios-governance.org",
                      "_cf-custom-hostname.chain.jaios-governance.org"
                    ],
                    "route53:ChangeResourceRecordSetsRecordTypes": ["CNAME", "TXT"],
                    "route53:ChangeResourceRecordSetsActions": ["UPSERT"]
                  },
                  "Null": {
                    "route53:ChangeResourceRecordSetsNormalizedRecordNames": "false",
                    "route53:ChangeResourceRecordSetsRecordTypes": "false",
                    "route53:ChangeResourceRecordSetsActions": "false"
                  }
                }
              },
              {
                "Sid": "Route53ChangeReadback",
                "Effect": "Allow",
                "Action": "route53:GetChange",
                "Resource": "arn:aws:route53:::change/*"
              }
            ]
          }
          JSON
          aws iam put-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns --policy-document file:///tmp/chain-domain-policy.json
          aws iam get-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns >/tmp/iam-readback.json

  restore-canonical-oidc:
    if: always()
    needs: repair-minimum-iam
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore canonical repo and context OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint" --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
          state="$(curl --silent --show-error --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" "$endpoint")"
          STATE="$state" python3 -c 'import json,os; s=json.loads(os.environ["STATE"]); assert s.get("use_default") is False and s.get("include_claim_keys")==["repo","context"] and s.get("use_immutable_subject") is False'

  upsert-brand-domain:
    needs: [repair-minimum-iam, restore-canonical-oidc]
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      AWS_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
    steps:
      - name: Configure publication AWS identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-chain-brand-domain-${{ github.run_id }}
      - name: Verify exact AWS boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" >/tmp/records-before.json
      - name: UPSERT Sites-issued records and wait for INSYNC
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/change-batch.json <<'JSON'
          {
            "Comment": "Bind chain.jaios-governance.org to the existing Sites brand project",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "chain.jaios-governance.org.",
                  "Type": "CNAME",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "custom-domains.chatgpt.site."}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_openai-site-verification.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_cf-custom-hostname.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]
                }
              }
            ]
          }
          JSON
          change_id="$(aws route53 change-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --change-batch file:///tmp/change-batch.json             --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
      - name: Read back exact records and preserve protected names
        shell: bash
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.']"             --output json)"
          RECORDS="$records" python3 - <<'PY'
          import json
          import os
          records = json.loads(os.environ["RECORDS"])
          by_name = {record["Name"]: record for record in records}
          assert by_name["chain.jaios-governance.org."]["TTL"] == 300
          assert by_name["chain.jaios-governance.org."]["ResourceRecords"][0]["Value"] == "custom-domains.chatgpt.site."
          assert "openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM" in by_name["_openai-site-verification.chain.jaios-governance.org."]["ResourceRecords"][0]["Value"]
          assert "0ff4e945-6380-45d2-a7fc-79e43e99da79" in by_name["_cf-custom-hostname.chain.jaios-governance.org."]["ResourceRecords"][0]["Value"]
          PY
          test "$(aws route53 list-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --query "ResourceRecordSets[?Name=='explorer.jaios-governance.org.'] | length(@)"             --output text)" = "0"
          test "$(aws route53 list-resource-record-sets             --hosted-zone-id "$HOSTED_ZONE_ID"             --query "ResourceRecordSets[?Name=='docs.jaios-governance.org.'] | length(@)"             --output text)" != "0"
          {
            echo "### Chain custom domain deployment"
            echo "- Operator: JAIOS Institutional Governance"
            echo "- AWS Account: $AWS_ACCOUNT_ID"
            echo "- Hosted Zone: $HOSTED_ZONE_ID"
            echo "- Route 53 Change: ${{ steps.dns.outputs.change_id }}"
            echo "- DNS Status: INSYNC"
            echo "- Production URL: https://chain.jaios-governance.org/"
            echo "- docs.jaios-governance.org preserved: true"
            echo "- explorer.jaios-governance.org created or changed: false"
          } >> "$GITHUB_STEP_SUMMARY"
