name: Apply Live Prefix Patch V2

on:
  workflow_run:
    workflows: ["JUNCA Social Ecosystem Chain Repository Governance"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout controller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: controller
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/evidence-bound-live-prefix
          path: target
          fetch-depth: 0

      - name: Verify and apply exact patch
        run: |
          set -euo pipefail
          git -C target apply --check \
            ../controller/.github/patches/evidence-bound-live-prefix.patch
          git -C target apply \
            ../controller/.github/patches/evidence-bound-live-prefix.patch
          bash -n target/scripts/junca_public_testnet_foundation.sh
          git -C target diff --check
          test "$(grep -c 'junca_live_rollout_prefix_gate.py' \
            target/scripts/junca_public_testnet_foundation.sh)" = 1
          test "$(grep -c 'python -m jaios.social_ecosystem_chain.rolling_compatibility' \
            target/scripts/junca_public_testnet_foundation.sh)" = 1

      - name: Commit target branch patch
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/junca_public_testnet_foundation.sh
          git commit -m "Bind Foundation preflight to evidence-bound live prefix"
          git push origin HEAD:fix/evidence-bound-live-prefix
