name: JUNCA Validator Durable State Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  blocked-until-non-oidc-authorization:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 2
    steps:
      - name: Block steady-state OIDC state migration
        run: |
          set -euo pipefail
          echo "::error::State migration is not a steady-state GitHub OIDC operation."
          echo "::error::Use an approved, time-bounded non-OIDC Security Bootstrap session."
          echo "::error::The historical migration evidence remains read-only and reusable only through its exact digest binding."
          exit 1
