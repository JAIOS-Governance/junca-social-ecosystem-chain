name: JUNCA Emergency Runtime Unit Restore

on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 12
    steps:
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-runtime-unit-restore-${{ github.run_id }}
      - name: Read canonical runtime units
        run: |
          set -euo pipefail
          for spec in VALIDATOR:/etc/systemd/system/junca-validator.service RPC:/etc/systemd/system/junca-public-rpc.service EXPLORER:/etc/systemd/system/junca-public-explorer.service CONFIG:/etc/junca/validator.toml; do
            name="${spec%%:*}"; path="${spec#*:}"
            command_id="$(aws ssm send-command --instance-ids i-055763640261c47df --document-name AWS-RunShellScript --parameters "commands=[\"base64 -w0 $path\"]" --query Command.CommandId --output text)"
            aws ssm wait command-executed --command-id "$command_id" --instance-id i-055763640261c47df
            value="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-055763640261c47df --query StandardOutputContent --output text)"
            echo "${name}_B64=$value" >> "$GITHUB_ENV"
          done
      - name: Install units and restart runtime
        run: |
          set -euo pipefail
          jq -n --arg validator "$VALIDATOR_B64" --arg rpc "$RPC_B64" --arg explorer "$EXPLORER_B64" --arg config "$CONFIG_B64" '{commands:[
            "set -euo pipefail",
            "printf %s " + ($validator|@sh) + " | base64 -d > /etc/systemd/system/junca-validator.service",
            "printf %s " + ($rpc|@sh) + " | base64 -d > /etc/systemd/system/junca-public-rpc.service",
            "printf %s " + ($explorer|@sh) + " | base64 -d > /etc/systemd/system/junca-public-explorer.service",
            "printf %s " + ($config|@sh) + " | base64 -d > /etc/junca/validator.toml",
            "chown root:junca /etc/junca /etc/junca/genesis.json /etc/junca/runtime.env /etc/junca/validator.toml; chmod 0750 /etc/junca; chmod 0640 /etc/junca/genesis.json /etc/junca/runtime.env /etc/junca/validator.toml",
            "install -d /etc/systemd/system/junca-validator.service.d; printf %s\\n '[Unit]' 'RequiresMountsFor=/var/lib/junca' '[Service]' 'ExecStartPre=/usr/bin/test -f /var/lib/junca/state.sqlite' 'ExecStartPre=/usr/bin/test ! -L /var/lib/junca/state.sqlite' > /etc/systemd/system/junca-validator.service.d/validator-state.conf",
            "systemctl daemon-reload; systemctl enable junca-validator.service junca-public-rpc.service junca-public-explorer.service; systemctl restart junca-validator.service",
            "for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health >/dev/null && break; sleep 2; done; curl -fsS http://127.0.0.1:8545/health >/dev/null",
            "systemctl restart junca-public-rpc.service junca-public-explorer.service; curl -fsS http://127.0.0.1:3000/health >/dev/null; curl -fsS http://127.0.0.1:8546/health >/dev/null"
          ]}' > /tmp/install.json
          command_id="$(aws ssm send-command --instance-ids i-015288fae43f2b40f --document-name AWS-RunShellScript --parameters file:///tmp/install.json --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id i-015288fae43f2b40f
          result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-015288fae43f2b40f)"
          jq -r '.StandardOutputContent,.StandardErrorContent' <<<"$result"
          jq -e '.Status=="Success"' <<<"$result"
      - name: Verify public recovery
        run: |
          set -euo pipefail
          sleep 45
          for attempt in $(seq 1 60); do
            e="$(curl -sS -o /tmp/e -w '%{http_code}' https://explorer.jaios-governance.org/ || true)"
            h="$(curl -sS -o /tmp/h -w '%{http_code}' https://health.jaios-governance.org/health || true)"
            r="$(curl -sS -o /tmp/r -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ || true)"
            if [[ "$e" == 200 && "$h" == 200 && "$r" == 200 ]]; then
              jq -e '.status=="healthy" and .consensus.last_certificate.signed_power==3 and .mainnet_changed==false and .assets_moved==false and .bridge_activated==false' /tmp/h
              jq -e '.result=="0x1352f63"' /tmp/r
              exit 0
            fi
            test "$attempt" -lt 60; sleep 5
          done
