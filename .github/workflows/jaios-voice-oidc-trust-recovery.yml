name: JAIOS Voice OIDC Trust Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/jaios-voice-oidc-trust-recovery.yml]

permissions:
  id-token: write
  contents: read

concurrency:
  group: jaios-voice-oidc-trust-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      RECOVERY_ROLE_NAME: JuncaChainPublicTestnetDeployment
      RECOVERY_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      RECOVERY_POLICY_NAME: PublicTestnetFoundationBootstrap
      TARGET_ROLE: JuncaVoiceDomainProductionDeployment
      TARGET_POLICY_NAME: JAIOSVoiceRoute53Production
    steps:
      - name: Configure verified AWS recovery identity
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.RECOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-voice-role-bootstrap-${{ github.run_id }}
          disable-retry: true

      - name: Create or repair the missing Voice role through the logged working route
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          case "$(aws sts get-caller-identity --query Arn --output text)" in
            arn:aws:sts::595710543956:assumed-role/JuncaChainPublicTestnetDeployment/*) ;;
            *) exit 1 ;;
          esac

          aws iam get-role-policy \
            --role-name "$RECOVERY_ROLE_NAME" \
            --policy-name "$RECOVERY_POLICY_NAME" \
            --query PolicyDocument --output json > /tmp/bootstrap-original.json
          jq --arg target "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${TARGET_ROLE}" '
            .Statement = (
              (if (.Statement | type) == "array" then .Statement else [.Statement] end) +
              [{
                "Sid":"TemporaryJAIOSVoiceRoleBootstrap",
                "Effect":"Allow",
                "Action":["iam:CreateRole","iam:GetRole","iam:UpdateAssumeRolePolicy","iam:PutRolePolicy","iam:GetRolePolicy"],
                "Resource":$target
              }]
            )
          ' /tmp/bootstrap-original.json > /tmp/bootstrap-patched.json
          restore_policy() {
            aws iam put-role-policy \
              --role-name "$RECOVERY_ROLE_NAME" \
              --policy-name "$RECOVERY_POLICY_NAME" \
              --policy-document file:///tmp/bootstrap-original.json
          }
          trap restore_policy EXIT
          aws iam put-role-policy \
            --role-name "$RECOVERY_ROLE_NAME" \
            --policy-name "$RECOVERY_POLICY_NAME" \
            --policy-document file:///tmp/bootstrap-patched.json

          cat > /tmp/voice-trust.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Sid":"GitHubActionsVoiceProductionOIDC",
              "Effect":"Allow",
              "Principal":{"Federated":"arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com"},
              "Action":"sts:AssumeRoleWithWebIdentity",
              "Condition":{
                "StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},
                "StringLike":{"token.actions.githubusercontent.com:sub":[
                  "repo:juncaGlobal/junca-Project:ref:refs/heads/main",
                  "repo:juncaGlobal/junca-Project:environment:voice-admin-production",
                  "repo:juncaGlobal@298956223/junca-Project@1286881101:ref:refs/heads/main",
                  "repo:juncaGlobal@298956223/junca-Project@1286881101:environment:voice-admin-production"
                ]}
              }
            }]
          }
          JSON
          cat > /tmp/voice-permissions.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"VoiceDomainHostedZone",
                "Effect":"Allow",
                "Action":["route53:GetHostedZone","route53:ListResourceRecordSets","route53:ChangeResourceRecordSets"],
                "Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G"
              },
              {
                "Sid":"VoiceDomainChangeReadback",
                "Effect":"Allow",
                "Action":"route53:GetChange",
                "Resource":"arn:aws:route53:::change/*"
              }
            ]
          }
          JSON

          if aws iam get-role --role-name "$TARGET_ROLE" >/dev/null 2>&1; then
            aws iam update-assume-role-policy \
              --role-name "$TARGET_ROLE" \
              --policy-document file:///tmp/voice-trust.json
          else
            aws iam create-role \
              --role-name "$TARGET_ROLE" \
              --description "JAIOS Voice production custom-domain Route 53 deployment" \
              --max-session-duration 3600 \
              --assume-role-policy-document file:///tmp/voice-trust.json >/dev/null
          fi
          aws iam put-role-policy \
            --role-name "$TARGET_ROLE" \
            --policy-name "$TARGET_POLICY_NAME" \
            --policy-document file:///tmp/voice-permissions.json

          aws iam get-role --role-name "$TARGET_ROLE" \
            --query 'Role.AssumeRolePolicyDocument' --output json > /tmp/voice-trust-readback.json
          aws iam get-role-policy --role-name "$TARGET_ROLE" \
            --policy-name "$TARGET_POLICY_NAME" \
            --query PolicyDocument --output json > /tmp/voice-permissions-readback.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          trust=json.loads(Path('/tmp/voice-trust-readback.json').read_text())['Statement'][0]
          assert trust['Principal']['Federated']=='arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com'
          assert trust['Action']=='sts:AssumeRoleWithWebIdentity'
          assert trust['Condition']['StringEquals']['token.actions.githubusercontent.com:aud']=='sts.amazonaws.com'
          subjects=set(trust['Condition']['StringLike']['token.actions.githubusercontent.com:sub'])
          assert 'repo:juncaGlobal/junca-Project:ref:refs/heads/main' in subjects
          assert 'repo:juncaGlobal/junca-Project:environment:voice-admin-production' in subjects
          permissions=json.loads(Path('/tmp/voice-permissions-readback.json').read_text())
          actions={a for s in permissions['Statement'] for a in ([s['Action']] if isinstance(s['Action'],str) else s['Action'])}
          assert {'route53:GetHostedZone','route53:ListResourceRecordSets','route53:ChangeResourceRecordSets','route53:GetChange'} <= actions
          PY

          restore_policy
          trap - EXIT
          aws iam get-role-policy \
            --role-name "$RECOVERY_ROLE_NAME" \
            --policy-name "$RECOVERY_POLICY_NAME" \
            --query PolicyDocument --output json > /tmp/bootstrap-restored.json
          test "$(jq -S . /tmp/bootstrap-original.json)" = "$(jq -S . /tmp/bootstrap-restored.json)"

      - name: Record recovery evidence
        shell: bash
        run: |
          {
            echo "### JAIOS Voice AWS Role Bootstrap"
            echo "- AWS Account: $AWS_ACCOUNT_ID"
            echo "- Target Role: $TARGET_ROLE"
            echo "- Voice trust and Route 53 policy readback: PASS"
            echo "- Recovery policy restored exactly: PASS"
            echo "- Route 53 changed: false"
          } >> "$GITHUB_STEP_SUMMARY"
