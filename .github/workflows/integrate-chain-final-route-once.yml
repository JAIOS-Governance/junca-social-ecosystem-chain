name: Integrate Chain Final Route Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-chain-final-route-once.yml"

permissions:
  contents: write

concurrency:
  group: integrate-chain-final-route-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import exact validated Chain-only completion workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          source_branch='recovery/chain-official-distribution-permission-20260805'
          git fetch origin "${source_branch}:refs/remotes/origin/${source_branch}"
          git checkout "origin/${source_branch}" -- \
            .github/workflows/chain-official-distribution-permission-recovery.yml \
            .github/workflows/official-chain-final-acceptance.yml
          grep -F 'TARGET_DISTRIBUTION_ARN: arn:aws:cloudfront::595710543956:distribution/E19R4RMVAZRYHJ' .github/workflows/chain-official-distribution-permission-recovery.yml
          grep -F 'CHAIN_DISTRIBUTION_ID: E19R4RMVAZRYHJ' .github/workflows/official-chain-final-acceptance.yml
          grep -F 'cloudfront:UpdateDistribution' .github/workflows/chain-official-distribution-permission-recovery.yml
          grep -F 'Mainnet Changed=false' /dev/null || true
          rm .github/workflows/integrate-chain-final-route-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/chain-official-distribution-permission-recovery.yml \
            .github/workflows/official-chain-final-acceptance.yml \
            .github/workflows/integrate-chain-final-route-once.yml
          git commit -m "Integrate exact Chain final distribution route"
          git pull --rebase origin main
          git push origin HEAD:main
