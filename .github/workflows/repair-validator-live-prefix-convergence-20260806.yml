    branches:
      - repair/validator-live-prefix-convergence-20260806
    paths:
      - '.github/workflows/repair-validator-live-prefix-convergence-20260806.yml'

permissions:
  contents: write

concurrency:
  group: repair-validator-live-prefix-convergence-20260806
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/validator-live-prefix-convergence-20260806
          fetch-depth: 0

      - name: Patch bounded convergence retry without weakening the gate
        shell: bash
        run: |
