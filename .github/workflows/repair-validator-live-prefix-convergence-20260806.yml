name: Repair Validator Live Prefix Convergence

on:
  push:
    branches:
      - repair/validator-live-prefix-convergence-20260806
    paths:
      - '.github/workflows/repair-validator-live-prefix-convergence-20260806.yml'

permissions:
  contents: write

concurrency:
  group: repair-validator-live-prefix-convergence-20260806
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/validator-live-prefix-convergence-20260806
          fetch-depth: 0

      - name: Recover and execute the verified patch payload
        shell: bash
        run: |
          set -euo pipefail
          git show 5987a6174ae55996ea7a1921ed7f58e2d7abcd5a:.github/workflows/repair-validator-live-prefix-convergence-20260806.yml > /tmp/malformed-workflow.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/malformed-workflow.yml').read_text(encoding='utf-8').splitlines()
          start = source.index("          python - <<'PY'") + 1
          end = source.index('          PY', start)
          recovered = []
          in_triple = False
          for raw in source[start:end]:
              line = raw if in_triple else raw[10:]
              recovered.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit('RECOVERED_PATCH_TRIPLE_QUOTE_UNCLOSED')
          Path('/tmp/patch.py').write_text('\n'.join(recovered) + '\n', encoding='utf-8')
          compile(Path('/tmp/patch.py').read_text(encoding='utf-8'), '/tmp/patch.py', 'exec')
          PY
          python /tmp/patch.py

      - name: Validate syntax and focused safety suite
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/junca_public_testnet_foundation.sh
          python -m py_compile scripts/junca_live_rollout_prefix_gate.py
          python -m unittest tests/test_junca_live_rollout_prefix_gate.py -v
          python -m unittest tests/test_junca_social_ecosystem_chain_aws_foundation.py -v

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/junca_live_rollout_prefix_gate.py \
            scripts/junca_public_testnet_foundation.sh \
            tests/test_junca_live_rollout_prefix_gate.py
          git diff --cached --quiet && exit 0
          git commit -m 'repair: retry only proven one-block validator observation races'
          git push origin HEAD:repair/validator-live-prefix-convergence-20260806
