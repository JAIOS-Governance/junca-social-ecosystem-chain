name: JUNCA Emergency Runtime Activate
on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-runtime-activate.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-runtime-activate-${{ github.run_id }}
      - name: Activate canonical services
        run: |
          set -euo pipefail
          cat > /tmp/activate.json <<'JSON'
          {"commands":["set -euo pipefail","chown root:junca /etc/junca /etc/junca/genesis.json /etc/junca/runtime.env; chmod 0750 /etc/junca; chmod 0640 /etc/junca/genesis.json /etc/junca/runtime.env","install -d /etc/systemd/system/junca-validator.service.d; printf '%s\n' '[Unit]' 'RequiresMountsFor=/var/lib/junca' '[Service]' 'ExecStartPre=/usr/bin/test -f /var/lib/junca/state.sqlite' 'ExecStartPre=/usr/bin/test ! -L /var/lib/junca/state.sqlite' > /etc/systemd/system/junca-validator.service.d/validator-state.conf","systemctl daemon-reload; systemctl enable junca-validator.service junca-public-rpc.service junca-public-explorer.service","systemctl restart junca-validator.service","for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health >/dev/null && break; sleep 2; done; curl -fsS http://127.0.0.1:8545/health >/dev/null","systemctl restart junca-public-rpc.service junca-public-explorer.service","curl -fsS http://127.0.0.1:3000/health >/dev/null; curl -fsS http://127.0.0.1:8546/health >/dev/null"]}
          JSON
          command_id="$(aws ssm send-command --instance-ids i-015288fae43f2b40f --document-name AWS-RunShellScript --parameters file:///tmp/activate.json --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id i-015288fae43f2b40f
          result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-015288fae43f2b40f)"
          jq -r '.StandardOutputContent,.StandardErrorContent' <<<"$result"
          jq -e '.Status=="Success"' <<<"$result"
      - name: Verify production
        run: |
          set -euo pipefail
          sleep 45
          for attempt in $(seq 1 60); do
            e="$(curl -sS -o /tmp/e -w '%{http_code}' https://explorer.jaios-governance.org/ || true)"; h="$(curl -sS -o /tmp/h -w '%{http_code}' https://health.jaios-governance.org/health || true)"; r="$(curl -sS -o /tmp/r -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ || true)"
            if [[ "$e" == 200 && "$h" == 200 && "$r" == 200 ]]; then jq -e '.status=="healthy" and .consensus.last_certificate.signed_power==3 and .mainnet_changed==false and .assets_moved==false and .bridge_activated==false' /tmp/h; jq -e '.result=="0x1352f63"' /tmp/r; exit 0; fi
            test "$attempt" -lt 60; sleep 5
          done
