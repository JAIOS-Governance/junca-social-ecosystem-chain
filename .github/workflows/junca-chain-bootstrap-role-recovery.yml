name: JUNCA Chain Bootstrap Role Recovery

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  set-standard-subject:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set AWS-compatible default OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub" \
            --data '{"use_default":true}'

  recover:
    needs: set-standard-subject
    environment: public-testnet
    strategy:
      fail-fast: false
      matrix:
        role:
          - JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
          - JuncaChainPublicTestnetDeployment
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
    steps:
      - name: Configure branch-scoped bootstrap identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::595710543956:role/${{ matrix.role }}
          aws-region: us-east-1
          role-session-name: chain-bootstrap-${{ github.run_id }}
          disable-retry: true

      - name: Verify account and apply minimum policy
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          cat >/tmp/policy.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Sid":"ChainCustomDomainDnsWrite","Effect":"Allow","Action":"route53:ChangeResourceRecordSets","Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G","Condition":{"ForAllValues:StringEquals":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":["chain.jaios-governance.org","_openai-site-verification.chain.jaios-governance.org","_cf-custom-hostname.chain.jaios-governance.org"],"route53:ChangeResourceRecordSetsRecordTypes":["CNAME","TXT"],"route53:ChangeResourceRecordSetsActions":["UPSERT"]}}},{"Sid":"Route53ChangeReadback","Effect":"Allow","Action":"route53:GetChange","Resource":"arn:aws:route53:::change/*"}]}
          JSON
          aws iam put-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns --policy-document file:///tmp/policy.json
          aws iam get-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name ChainBrandCustomDomainDns >/dev/null

      - name: Apply exact DNS and read back
        run: |
          set -euo pipefail
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          cat >/tmp/change.json <<'JSON'
          {"Comment":"Finalize chain.jaios-governance.org Sites binding","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"chain.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = INSYNC
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.' || Name=='docs.jaios-governance.org.' || Name=='explorer.jaios-governance.org.']" --output json)"
          printf '%s\n' "$records"
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?Name=='docs.jaios-governance.org.'])" --output text)" != 0
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "length(ResourceRecordSets[?Name=='explorer.jaios-governance.org.'])" --output text)" = 0

  restore-canonical-subject:
    if: always()
    needs: [set-standard-subject, recover]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore immutable repository context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub" \
            --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'

# Triggered for final DNS cutover 2026-07-25
