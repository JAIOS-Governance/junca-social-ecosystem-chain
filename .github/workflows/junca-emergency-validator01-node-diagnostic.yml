name: JUNCA Emergency Validator 01 Node Diagnostic

on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-validator01-node-diagnostic-${{ github.run_id }}
      - name: Capture node startup failure
        run: |
          set -euo pipefail
          cat > /tmp/params.json <<'JSON'
          {"commands":["systemctl stop junca-validator.service || true","set -a; . /etc/junca/runtime.env; set +a; timeout 20s runuser -u junca -- /usr/local/bin/junca-chain-node --genesis /etc/junca/genesis.json --data-dir /var/lib/junca --validator-id ${VALIDATOR_ID} --signer-resource ${SIGNER_RESOURCE_ARN} --http.addr 127.0.0.1 --http.port 8545 --mine 2>&1 || true","systemctl restart junca-validator.service || true"]}
          JSON
          command_id="$(aws ssm send-command --instance-ids i-015288fae43f2b40f --document-name AWS-RunShellScript --parameters file:///tmp/params.json --query Command.CommandId --output text)"
          for attempt in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-015288fae43f2b40f --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-015288fae43f2b40f --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
