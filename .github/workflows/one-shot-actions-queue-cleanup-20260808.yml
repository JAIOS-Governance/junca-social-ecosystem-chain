name: One-shot Actions Queue Cleanup 2026-08-08

on:
  push:
    branches:
      - ops/unstick-actions-20260808
    paths:
      - .github/workflows/one-shot-actions-queue-cleanup-20260808.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: one-shot-actions-queue-cleanup-jsec
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_IDS: "31125147612 30969847156"
    steps:
      - name: Cancel, force-cancel, and delete isolated stale runs
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          for run_id in ${TARGET_RUN_IDS}; do
            get_code="$(curl -sS -o "/tmp/run-${run_id}.json" -w '%{http_code}' "${auth[@]}" "${api}/actions/runs/${run_id}")"
            if [[ "${get_code}" == "404" ]]; then
              echo "run=${run_id} already absent"
              continue
            fi
            [[ "${get_code}" == "200" ]] || { cat "/tmp/run-${run_id}.json" >&2; exit 1; }

            status="$(jq -r '.status' "/tmp/run-${run_id}.json")"
            echo "run=${run_id} initial_status=${status}"

            cancel_code="$(curl -sS -o "/tmp/cancel-${run_id}.json" -w '%{http_code}' -X POST "${auth[@]}" "${api}/actions/runs/${run_id}/cancel")"
            case "${cancel_code}" in 202|409|404) ;; *) cat "/tmp/cancel-${run_id}.json" >&2; exit 1 ;; esac

            force_code="$(curl -sS -o "/tmp/force-${run_id}.json" -w '%{http_code}' -X POST "${auth[@]}" "${api}/actions/runs/${run_id}/force-cancel")"
            case "${force_code}" in 202|409|404) ;; *) cat "/tmp/force-${run_id}.json" >&2; exit 1 ;; esac

            delete_code="$(curl -sS -o "/tmp/delete-${run_id}.json" -w '%{http_code}' -X DELETE "${auth[@]}" "${api}/actions/runs/${run_id}")"
            case "${delete_code}" in 204|404|409) ;; *) cat "/tmp/delete-${run_id}.json" >&2; exit 1 ;; esac

            echo "run=${run_id} cancel_http=${cancel_code} force_http=${force_code} delete_http=${delete_code}"
          done

          sleep 3
          queued="$(curl -fsS "${auth[@]}" "${api}/actions/runs?status=queued&per_page=100")"
          running="$(curl -fsS "${auth[@]}" "${api}/actions/runs?status=in_progress&per_page=100")"
          jq --arg current "${GITHUB_RUN_ID}" '[.workflow_runs[] | select((.id|tostring) != $current)]' <<<"${queued}" > /tmp/queued.json
          jq --arg current "${GITHUB_RUN_ID}" '[.workflow_runs[] | select((.id|tostring) != $current)]' <<<"${running}" > /tmp/running.json

          queued_count="$(jq 'length' /tmp/queued.json)"
          running_count="$(jq 'length' /tmp/running.json)"
          {
            echo "## Queue cleanup readback"
            echo "- target runs: ${TARGET_RUN_IDS}"
            echo "- remaining queued runs excluding this cleanup: ${queued_count}"
            echo "- remaining in-progress runs excluding this cleanup: ${running_count}"
            echo "- Mainnet Changed: false"
            echo "- Assets Moved: false"
            echo "- Bridge Activated: false"
          } >> "${GITHUB_STEP_SUMMARY}"

          [[ "${queued_count}" == "0" ]]
          [[ "${running_count}" == "0" ]]
