name: JUNCA Validator Artifact Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-validator-artifact-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: public-testnet
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-artifact-diagnostics-${{ github.run_id }}

      - name: Compare exact AMI, archive and installed runtime provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          aws ec2 describe-instances \
            --filters \
              "Name=instance-state-name,Values=running" \
              "Name=tag:Project,Values=JUNCA Social Ecosystem Chain" \
              "Name=tag:Network,Values=Public Testnet" \
              "Name=tag:Validator,Values=01,02,03" \
            > artifacts/ec2-instances.json
          jq -e '
            [.Reservations[].Instances[]|{
              instance_id:.InstanceId,
              image_id:.ImageId,
              launch_time:.LaunchTime,
              validator:(.Tags[]|select(.Key=="Validator")|.Value),
              private_ip:.PrivateIpAddress
            }]|sort_by(.validator)|select(length==3 and map(.validator)==["01","02","03"])
          ' artifacts/ec2-instances.json > artifacts/validators.json
          mapfile -t images < <(jq -r '.[].image_id' artifacts/validators.json|sort -u)
          aws ec2 describe-images --image-ids "${images[@]}" > artifacts/images.json

          cat > /tmp/artifact-readback.sh <<'REMOTE'
          set -Eeuo pipefail
          value() {
            local key="$1"
            awk -F= -v key="$key" '$1==key {print substr($0,length(key)+2)}' /etc/junca/runtime.env | tail -n1
          }
          test -f /opt/junca/validator-runtime.tar.gz
          test -x /usr/local/bin/junca-chain-node
          test -x /usr/local/bin/junca-public-gateway
          wrapper="$(cat /usr/local/bin/junca-chain-node)"
          tar -tzf /opt/junca/validator-runtime.tar.gz | sort > /tmp/runtime-entries.txt
          find /opt/junca /usr/local/lib /usr/local/lib64 /usr/lib/python3.9 \
            -xdev -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.pth' \) \
            2>/dev/null | grep -E '/(junca|jaios|social_ecosystem_chain|site-packages)/' \
            | sort > /tmp/runtime-installed-files.txt || true
          installed_digest="$(while IFS= read -r path; do test -f "$path" && sha256sum "$path"; done </tmp/runtime-installed-files.txt | sha256sum | awk '{print $1}')"
          jq -cn \
            --arg validator_id "$(value VALIDATOR_ID)" \
            --arg configured_artifact_sha "$(value NODE_ARTIFACT_SHA256)" \
            --arg actual_artifact_sha "$(sha256sum /opt/junca/validator-runtime.tar.gz|awk '{print $1}')" \
            --arg artifact_size "$(stat -c %s /opt/junca/validator-runtime.tar.gz)" \
            --arg artifact_mtime "$(stat -c %y /opt/junca/validator-runtime.tar.gz)" \
            --arg archive_entries_sha "$(sha256sum /tmp/runtime-entries.txt|awk '{print $1}')" \
            --arg archive_entries "$(head -n 120 /tmp/runtime-entries.txt)" \
            --arg installed_files_sha "$installed_digest" \
            --arg installed_files "$(head -n 160 /tmp/runtime-installed-files.txt)" \
            --arg wrapper_sha "$(sha256sum /usr/local/bin/junca-chain-node|awk '{print $1}')" \
            --arg wrapper_b64 "$(printf '%s' "$wrapper"|base64 -w0)" \
            --arg gateway_sha "$(sha256sum /usr/local/bin/junca-public-gateway|awk '{print $1}')" \
            --arg service_sha "$(sha256sum /etc/systemd/system/junca-validator.service|awk '{print $1}')" '{
              validator_id:$validator_id,
              configured_artifact_sha256:$configured_artifact_sha,
              actual_artifact_sha256:$actual_artifact_sha,
              artifact_matches_config:($configured_artifact_sha==$actual_artifact_sha),
              artifact_size:($artifact_size|tonumber),
              artifact_mtime:$artifact_mtime,
              archive_entries_sha256:$archive_entries_sha,
              archive_entries:$archive_entries,
              installed_files_sha256:$installed_files_sha,
              installed_files:$installed_files,
              wrapper_sha256:$wrapper_sha,
              wrapper_base64:$wrapper_b64,
              gateway_sha256:$gateway_sha,
              validator_service_sha256:$service_sha
            }'
          REMOTE
          jq -Rs '{commands:[.]}' /tmp/artifact-readback.sh > /tmp/artifact-readback.json
          failures=0
          while IFS=$'\t' read -r validator instance; do
            command_id="$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name AWS-RunShellScript \
              --parameters file:///tmp/artifact-readback.json \
              --comment "JUNCA validator-${validator} artifact provenance" \
              --query Command.CommandId --output text)"
            for attempt in $(seq 1 90); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null||true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
              test "$attempt" -lt 90
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/invocation-${validator}.json"
            if jq -e '.Status=="Success" and (.ResponseCode//-1)==0' "artifacts/invocation-${validator}.json" >/dev/null; then
              jq -r '.StandardOutputContent' "artifacts/invocation-${validator}.json" > "artifacts/artifact-${validator}.json"
              jq -e '.artifact_matches_config==true' "artifacts/artifact-${validator}.json" >/dev/null
            else
              failures=$((failures+1))
            fi
          done < <(jq -r '.[]|[.validator,.instance_id]|@tsv' artifacts/validators.json)
          test "$failures" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          validators=json.load(open('artifacts/validators.json'))
          runtime={v:json.load(open(f'artifacts/artifact-{v}.json')) for v in ('01','02','03')}
          result={
            'validators':validators,
            'runtime':runtime,
            'configured_artifact_parity':len({x['configured_artifact_sha256'] for x in runtime.values()})==1,
            'actual_artifact_parity':len({x['actual_artifact_sha256'] for x in runtime.values()})==1,
            'archive_entry_parity':len({x['archive_entries_sha256'] for x in runtime.values()})==1,
            'installed_file_parity':len({x['installed_files_sha256'] for x in runtime.values()})==1,
            'wrapper_parity':len({x['wrapper_sha256'] for x in runtime.values()})==1,
          }
          Path('artifacts/artifact-parity.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-validator-artifact-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
