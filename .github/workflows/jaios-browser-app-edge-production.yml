name: JAIOS Browser App Edge Production

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "sites/jaios-browser-app/**"
      - "scripts/build_jaios_browser_app_edge.py"
      - "scripts/jaios_browser_edge_function.py"
      - "infra/aws/jaios-root-news-router.js"
      - "infra/aws/junca-chain-docs-routes-baseline.js"
      - ".github/workflows/jaios-browser-app-edge-production.yml"
  push:
    branches: [main]
    paths:
      - "sites/jaios-browser-app/deploy-request.json"
      - "scripts/jaios_browser_edge_function.py"
      - "infra/aws/jaios-root-news-router.js"
      - ".github/workflows/jaios-browser-app-edge-production.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: jaios-browser-app-edge-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "595710543956"
  AWS_REGION: us-east-1
  ROOT_DOMAIN: jaios-governance.org
  DOCS_DOMAIN: docs.jaios-governance.org
  DOCS_BUCKET: junca-chain-docs-595710543956
  DISTRIBUTION_ID: E2WIXG3DWW8OX1
  EXPECTED_DISTRIBUTION_DOMAIN: d6kqifze013tg.cloudfront.net
  EXPECTED_ORIGIN_DOMAIN: jaios-institutional-governance.juncajapan-inc.chatgpt.site
  FUNCTION_NAME: junca-chain-docs-routes-595710543956
  FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/junca-chain-docs-routes-595710543956
  BASELINE_FUNCTION_SHA256: 14951b9147b390582d82b153c190ce12e7d5fcfff98be2ac55cb1b99e8329b81
  DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
  RELEASE_MARKER: 20260804-desktop-063-copy-paste-repair
  PUBLIC_ENTRY: https://jaios-governance.org/browser
  PUBLIC_APP: https://jaios-governance.org/browser/app
  ARTIFACT_PATH: jaios-browser-app/index.html

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact Browser release and shared router
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/build_jaios_browser_app_edge.py scripts/jaios_browser_edge_function.py
          test "$(sha256sum infra/aws/junca-chain-docs-routes-baseline.js | cut -d' ' -f1)" = "$BASELINE_FUNCTION_SHA256"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          release=json.loads(Path('sites/jaios-browser-app/release.json').read_text())
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text())
          assert release['schema']=='jaios-browser-web-release/v1'
          assert release['releaseMarker']=='20260804-desktop-063-copy-paste-repair'
          assert release['sourceRuntimeMergeSha']=='df797bc9f4ebf72405bbd3bb59ea355d500ff084'
          assert release['acceptedRuntimeHead']=='805af0e5d047d18002b4dde58d73eae6da2ae93e'
          assert request['execute'] is True
          assert request['nonce']=='activate-jaios-browser-app-063-20260804-1520-jst'
          assert request['target']=='https://jaios-governance.org/browser/app'
          assert set(request['safety'].values())=={False}
          assert set(release['downloads'])=={'windows','macosDmg','macosZip'}
          for item in release['downloads'].values():
              assert item['url'].startswith('https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/')
              assert re.fullmatch(r'[0-9a-f]{64}',item['sha256'])
              assert item['sizeBytes']>0
          router=Path('infra/aws/jaios-root-news-router.js').read_text()
          for value in ('docs.jaios-governance.org','/jaios-root-news/index.html','/jaios-browser-app/index.html','/browser/app'):
              assert value in router
          PY

      - name: Build byte-preserving Browser derivative
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 60 -o /tmp/current.html "$PUBLIC_APP"
          python3 scripts/build_jaios_browser_app_edge.py /tmp/current.html sites/jaios-browser-app/release.json /tmp/index.html
          grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/index.html
          test "$(grep -o 'id="installWindows"' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="installMacDmg"' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="installMacZip"' /tmp/index.html | wc -l)" -eq 1
          ! grep -Fq 'JAIOS-Browser-0.5.3-Windows-x64-Bootstrap.zip' /tmp/index.html
          ! grep -Fq 'Public Alpha: Windows 0.5.3' /tmp/index.html
          sha256sum /tmp/index.html | cut -d' ' -f1 >/tmp/staged-sha256.txt

      - name: Verify official public assets
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '.downloads[].url' sites/jaios-browser-app/release.json | while read -r url; do
            curl --fail --silent --show-error --location --head --retry 4 --retry-delay 2 --max-time 60 "$url" >/dev/null
          done

      - name: Configure governed Edge identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-browser-quality-${{ github.run_id }}
          disable-retry: true

      - name: Verify shared Function and root Distribution baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          python3 -m pip install --quiet boto3
          python3 scripts/jaios_browser_edge_function.py preflight \
            --baseline infra/aws/junca-chain-docs-routes-baseline.js \
            --composite infra/aws/jaios-root-news-router.js \
            --distribution-id "$DISTRIBUTION_ID" | tee /tmp/preflight.json
          test "$(jq -r '.result' /tmp/preflight.json)" = PASS
          test "$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query Distribution.DomainName --output text)" = "$EXPECTED_DISTRIBUTION_DOMAIN"
          test "$(aws s3api get-bucket-versioning --bucket "$DOCS_BUCKET" --query Status --output text)" = Enabled

      - name: Stage exact Browser bytes without traffic change
        shell: bash
        run: |
          set -Eeuo pipefail
          aws s3 cp /tmp/index.html "s3://${DOCS_BUCKET}/${ARTIFACT_PATH}" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public,max-age=0,must-revalidate' \
            --metadata "source-commit=${GITHUB_SHA},release=${RELEASE_MARKER},state=staged"
          aws s3 cp "s3://${DOCS_BUCKET}/${ARTIFACT_PATH}" /tmp/s3-readback.html
          cmp /tmp/index.html /tmp/s3-readback.html
          ready=false
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location -o /tmp/docs-origin.html "https://${DOCS_DOMAIN}/${ARTIFACT_PATH}" \
              && grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/docs-origin.html; then
              ready=true; break
            fi
            sleep 5
          done
          test "$ready" = true
          cmp /tmp/index.html /tmp/docs-origin.html

      - uses: actions/upload-artifact@v4
        with:
          name: jaios-browser-shared-edge-${{ github.sha }}
          path: |
            /tmp/index.html
            /tmp/staged-sha256.txt
            /tmp/preflight.json
          if-no-files-found: error
          retention-days: 90

  authorize:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: request
        shell: bash
        run: |
          execute="$(jq -r '.execute' sites/jaios-browser-app/deploy-request.json)"
          test "$execute" = true -o "$execute" = false
          echo "execute=$execute" >> "$GITHUB_OUTPUT"

  deploy:
    needs: authorize
    if: needs.authorize.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate one-shot production state
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('sites/jaios-browser-app/release.json').read_text())
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text())
          assert request['execute'] is True
          assert request['nonce']=='activate-jaios-browser-app-063-20260804-1520-jst'
          assert request['releaseMarker']==release['releaseMarker']=='20260804-desktop-063-copy-paste-repair'
          assert set(request['safety'].values())=={False}
          PY
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location -o /tmp/expected.html "https://${DOCS_DOMAIN}/${ARTIFACT_PATH}"
          grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/expected.html

      - name: Configure production Edge identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-browser-production-${{ github.run_id }}
          disable-retry: true

      - name: Publish shared Function and attach root Distribution
        id: acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet boto3 selenium
          mkdir -p /tmp/browser-edge-state
          changed=0
          rollback() {
            rc=$?
            if [[ "$changed" -eq 1 ]]; then
              python3 scripts/jaios_browser_edge_function.py rollback \
                --distribution-id "$DISTRIBUTION_ID" \
                --state-dir /tmp/browser-edge-state || true
            fi
            exit "$rc"
          }
          trap rollback ERR INT TERM
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          changed=1
          python3 scripts/jaios_browser_edge_function.py deploy \
            --composite infra/aws/jaios-root-news-router.js \
            --distribution-id "$DISTRIBUTION_ID" \
            --state-dir /tmp/browser-edge-state | tee /tmp/deploy-result.json
          test "$(jq -r '.result' /tmp/deploy-result.json)" = PUBLISHED
          invalidation_id="$(cat /tmp/browser-edge-state/invalidation-id.txt)"

          ready=false
          for attempt in {1..30}; do
            if curl --fail-with-body --silent --show-error --location --header 'Cache-Control: no-cache' \
              -o /tmp/public.html "${PUBLIC_APP}?release=${{ steps.contract.outputs.source_commit }}" \
              && grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/public.html; then
              ready=true; break
            fi
            sleep 5
          done
          test "$ready" = true
          cmp /tmp/expected.html /tmp/public.html
          grep -Fq 'JAIOS-Browser-0.6.3-Windows-x64.exe' /tmp/public.html
          grep -Fq 'JAIOS-Browser-0.6.3-mac-universal.dmg' /tmp/public.html
          grep -Fq 'JAIOS-Browser-0.6.3-mac-universal.zip' /tmp/public.html
          ! grep -Fq 'JAIOS-Browser-0.5.3-Windows-x64-Bootstrap.zip' /tmp/public.html
          ! grep -Fq 'Public Alpha: Windows 0.5.3' /tmp/public.html

          curl --fail --silent --show-error --location -o /tmp/entry.html "$PUBLIC_ENTRY"
          grep -Fq '/browser/app' /tmp/entry.html
          curl --fail --silent --show-error --location -o /tmp/root.html "https://${ROOT_DOMAIN}/"
          grep -Fq 'data-jaios-news-release=' /tmp/root.html
          grep -Fq 'data-jaios-trust-release=' /tmp/root.html

          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          expected={'installWindows':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-Windows-x64.exe','installMacDmg':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.dmg','installMacZip':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.zip'}
          options=webdriver.ChromeOptions(); options.add_argument('--headless=new'); options.add_argument('--no-sandbox'); options.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=options)
          try:
            for label,width in [('desktop',1440),('tablet',820),('mobile',390)]:
              driver.set_window_size(width,1400); driver.get('https://jaios-governance.org/browser/app')
              WebDriverWait(driver,30).until(lambda d:d.find_element(By.TAG_NAME,'body').get_attribute('data-jaios-browser-release')=='20260804-desktop-063-copy-paste-repair')
              for element_id,href in expected.items():
                element=driver.find_element(By.ID,element_id); assert element.is_displayed(); assert element.get_attribute('href')==href
              driver.save_screenshot(f'/tmp/jaios-browser-{label}.png')
          finally: driver.quit()
          PY
          trap - ERR INT TERM
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Persist production evidence and close request
        env:
          SOURCE_COMMIT: ${{ steps.contract.outputs.source_commit }}
          INVALIDATION_ID: ${{ steps.acceptance.outputs.invalidation_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/production
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          public=Path('/tmp/public.html').read_bytes(); expected=Path('/tmp/expected.html').read_bytes(); assert public==expected
          evidence={'schema':'jaios-browser-app-edge-production/v2','observed_at':datetime.now(timezone.utc).isoformat(),'source_commit':os.environ['SOURCE_COMMIT'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'public_url':'https://jaios-governance.org/browser/app','release_marker':os.environ['RELEASE_MARKER'],'public_html_sha256':hashlib.sha256(public).hexdigest(),'distribution_id':os.environ['DISTRIBUTION_ID'],'distribution_domain':os.environ['EXPECTED_DISTRIBUTION_DOMAIN'],'preserved_origin':os.environ['EXPECTED_ORIGIN_DOMAIN'],'function_arn':os.environ['FUNCTION_ARN'],'invalidation_id':os.environ['INVALIDATION_ID'],'links_present':3,'legacy_0_5_3_present':False,'desktop_acceptance':'PASS','tablet_acceptance':'PASS','mobile_acceptance':'PASS','root_route_preserved':True,'entry_route_preserved':True,'dns_changed':False,'tls_changed':False,'mainnet_changed':False,'assets_moved':False,'bridge_activated':False}
          Path('evidence/production/jaios-browser-app-production-latest.json').write_text(json.dumps(evidence,indent=2)+'\n')
          Path('evidence/production/jaios-browser-app-production-latest.md').write_text('# JAIOS Browser App 0.6.3 Production Evidence\n\n'+f'- Public URL: {evidence["public_url"]}\n- Run: {evidence["workflow_run_url"]}\n- Public HTML SHA-256: `{evidence["public_html_sha256"]}`\n- Shared Function: `{evidence["function_arn"]}`\n- Windows / macOS links: 3/3\n- Legacy Windows 0.5.3 link: absent\n- Desktop / Tablet / Mobile: PASS\n- DNS / TLS / Mainnet / Assets / Bridge changed: false\n')
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text()); request['execute']=False; request['nonce']='completed-'+os.environ['GITHUB_RUN_ID']; request['completedEvidence']='evidence/production/jaios-browser-app-production-latest.json'; Path('sites/jaios-browser-app/deploy-request.json').write_text(json.dumps(request,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/production/jaios-browser-app-production-latest.* sites/jaios-browser-app/deploy-request.json
          git commit -m "Record JAIOS Browser App 0.6.3 production evidence ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: jaios-browser-production-evidence-${{ github.run_id }}
          path: |
            evidence/production/jaios-browser-app-production-latest.json
            evidence/production/jaios-browser-app-production-latest.md
            /tmp/jaios-browser-desktop.png
            /tmp/jaios-browser-tablet.png
            /tmp/jaios-browser-mobile.png
            /tmp/browser-edge-state
          if-no-files-found: error
          retention-days: 90
