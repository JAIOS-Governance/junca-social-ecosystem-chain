name: JAIOS Browser App Edge Production

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "sites/jaios-browser-app/**"
      - "scripts/build_jaios_browser_app_edge.py"
      - "infra/aws/jaios-browser-app-router.js"
      - "infra/aws/jaios-browser-app-router-rollback.js"
      - "infra/aws/jaios-root-news-router.js"
      - ".github/workflows/jaios-browser-app-edge-production.yml"
  push:
    branches: [main]
    paths:
      - "sites/jaios-browser-app/deploy-request.json"
      - "infra/aws/jaios-root-news-router.js"
      - ".github/workflows/jaios-browser-app-edge-production.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: jaios-browser-app-edge-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "595710543956"
  AWS_REGION: us-east-1
  ROOT_DOMAIN: jaios-governance.org
  DOCS_DOMAIN: docs.jaios-governance.org
  DOCS_BUCKET: junca-chain-docs-595710543956
  DISTRIBUTION_ID: E2WIXG3DWW8OX1
  EXPECTED_DISTRIBUTION_DOMAIN: d6kqifze013tg.cloudfront.net
  EXPECTED_ORIGIN_DOMAIN: jaios-institutional-governance.juncajapan-inc.chatgpt.site
  FUNCTION_NAME: jaios-root-news-router
  FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/jaios-root-news-router
  DOCS_DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
  RELEASE_MARKER: 20260804-desktop-063-copy-paste-repair
  PUBLIC_ENTRY: https://jaios-governance.org/browser
  PUBLIC_APP: https://jaios-governance.org/browser/app
  ARTIFACT_PATH: jaios-browser-app/index.html

jobs:
  quality-and-stage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact activation source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/build_jaios_browser_app_edge.py
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          release=json.loads(Path('sites/jaios-browser-app/release.json').read_text())
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text())
          assert release['schema']=='jaios-browser-web-release/v1'
          assert release['releaseMarker']=='20260804-desktop-063-copy-paste-repair'
          assert release['sourceRuntimeMergeSha']=='df797bc9f4ebf72405bbd3bb59ea355d500ff084'
          assert release['acceptedRuntimeHead']=='805af0e5d047d18002b4dde58d73eae6da2ae93e'
          assert request['execute'] is True
          assert request['nonce']=='activate-jaios-browser-app-063-20260804-1520-jst'
          assert request['target']=='https://jaios-governance.org/browser/app'
          assert request['permissionRecoveryCommit']=='4efd15d91acf0e14c0cc1c18eaf683750677467c'
          assert set(request['safety'].values())=={False}
          assert Path('infra/aws/jaios-root-news-router.js').read_bytes()==Path('infra/aws/jaios-browser-app-router.js').read_bytes()
          assert set(release['downloads'])=={'windows','macosDmg','macosZip'}
          for item in release['downloads'].values():
              assert item['url'].startswith('https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/')
              assert re.fullmatch(r'[0-9a-f]{64}',item['sha256'])
              assert item['sizeBytes']>0
          PY
          grep -F "const BROWSER_APP_ARTIFACT = '/jaios-browser-app/index.html';" infra/aws/jaios-root-news-router.js
          grep -F "request.uri === '/browser/app'" infra/aws/jaios-root-news-router.js

      - name: Build byte-preserving Browser derivative
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 60 -o /tmp/current.html "$PUBLIC_APP"
          python3 scripts/build_jaios_browser_app_edge.py /tmp/current.html sites/jaios-browser-app/release.json /tmp/index.html
          grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/index.html
          test "$(grep -o 'id="installWindows"' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="installMacDmg"' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="installMacZip"' /tmp/index.html | wc -l)" -eq 1
          ! grep -Fq 'JAIOS-Browser-0.5.3-Windows-x64-Bootstrap.zip' /tmp/index.html
          ! grep -Fq 'Public Alpha: Windows 0.5.3' /tmp/index.html
          sha256sum /tmp/index.html | cut -d' ' -f1 >/tmp/staged-sha256.txt

      - name: Verify official public assets
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '.downloads[].url' sites/jaios-browser-app/release.json | while read -r url; do
            curl --fail --silent --show-error --location --head --retry 4 --retry-delay 2 --max-time 60 "$url" >/dev/null
          done

      - name: Configure governed Docs staging identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DOCS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-browser-stage-${{ github.run_id }}
          disable-retry: true

      - name: Stage exact bytes without traffic change
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws s3api get-bucket-versioning --bucket "$DOCS_BUCKET" --query Status --output text)" = Enabled
          aws s3 cp /tmp/index.html "s3://${DOCS_BUCKET}/${ARTIFACT_PATH}" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public,max-age=0,must-revalidate' \
            --metadata "source-commit=${GITHUB_SHA},release=${RELEASE_MARKER},state=staged"
          aws s3 cp "s3://${DOCS_BUCKET}/${ARTIFACT_PATH}" /tmp/s3-readback.html
          cmp /tmp/index.html /tmp/s3-readback.html
          ready=false
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location -o /tmp/docs-origin.html "https://${DOCS_DOMAIN}/${ARTIFACT_PATH}" \
              && grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/docs-origin.html; then
              ready=true; break
            fi
            sleep 5
          done
          test "$ready" = true
          cmp /tmp/index.html /tmp/docs-origin.html

      - uses: actions/upload-artifact@v4
        with:
          name: jaios-browser-app-stage-${{ github.sha }}
          path: |
            /tmp/index.html
            /tmp/staged-sha256.txt
          if-no-files-found: error
          retention-days: 90

  authorize-production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: request
        shell: bash
        run: |
          execute="$(jq -r '.execute' sites/jaios-browser-app/deploy-request.json)"
          test "$execute" = true -o "$execute" = false
          echo "execute=$execute" >> "$GITHUB_OUTPUT"

  publish-and-readback:
    needs: authorize-production
    if: needs.authorize-production.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify production source and staged bytes
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('sites/jaios-browser-app/release.json').read_text())
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text())
          assert request['execute'] is True
          assert request['nonce']=='activate-jaios-browser-app-063-20260804-1520-jst'
          assert request['releaseMarker']==release['releaseMarker']=='20260804-desktop-063-copy-paste-repair'
          assert request['permissionRecoveryCommit']=='4efd15d91acf0e14c0cc1c18eaf683750677467c'
          assert set(request['safety'].values())=={False}
          assert Path('infra/aws/jaios-root-news-router.js').read_bytes()==Path('infra/aws/jaios-browser-app-router.js').read_bytes()
          PY
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location -o /tmp/expected.html "https://${DOCS_DOMAIN}/${ARTIFACT_PATH}"
          grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/expected.html

      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          token_json="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json" >/tmp/oidc-token
          test -s /tmp/oidc-token

      - name: Assume approved CloudFront bootstrap identity
        id: bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=""
          for role in arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment; do
            if aws sts assume-role-with-web-identity --role-arn "$role" --role-session-name "jaios-browser-cloudfront-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/oidc-token)" --duration-seconds 1800 >/tmp/assume.json 2>/tmp/assume.err; then
              selected="$role"; break
            fi
          done
          test -n "$selected"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume.json)" >> "$GITHUB_ENV"

      - name: Publish Function and complete public acceptance
        id: acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          activated=0
          rollback() {
            rc=$?
            if [[ "$activated" -eq 1 ]]; then
              dev_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
              aws cloudfront update-function --name "$FUNCTION_NAME" --if-match "$dev_etag" --function-config file:///tmp/function-before-config.json --function-code fileb:///tmp/function-before.js >/tmp/rollback-update.json || true
              rollback_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
              aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$rollback_etag" >/tmp/rollback-publish.json || true
              rid="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/browser/app' '/browser/app/' --query Invalidation.Id --output text 2>/dev/null || true)"
              [[ -z "$rid" || "$rid" == None ]] || aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$rid" || true
            fi
            exit "$rc"
          }
          trap rollback ERR
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" >/tmp/distribution.json
          test "$(jq -r '.DistributionConfig.Aliases.Items[] | select(. == env.ROOT_DOMAIN)' /tmp/distribution.json)" = "$ROOT_DOMAIN"
          test "$(jq -r '.DistributionConfig.Origins.Items[].DomainName | select(. == env.EXPECTED_ORIGIN_DOMAIN)' /tmp/distribution.json)" = "$EXPECTED_ORIGIN_DOMAIN"
          test "$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query Distribution.DomainName --output text)" = "$EXPECTED_DISTRIBUTION_DOMAIN"
          aws cloudfront get-function --name "$FUNCTION_NAME" --stage LIVE /tmp/function-before.js >/tmp/function-before-get.json
          aws cloudfront describe-function --name "$FUNCTION_NAME" --stage LIVE >/tmp/function-before-description.json
          jq '.FunctionSummary.FunctionConfig' /tmp/function-before-description.json >/tmp/function-before-config.json
          cat >/tmp/function-after-config.json <<'JSON'
          {"Comment":"Route the JAIOS root and Browser app documents to governed exact artifacts","Runtime":"cloudfront-js-2.0"}
          JSON
          for name in root browser protected; do
            case "$name" in root) uri=/;; browser) uri=/browser/app;; protected) uri=/browser;; esac
            cat >"/tmp/test-${name}.json" <<JSON
          {"version":"1.0","context":{"eventType":"viewer-request"},"viewer":{"ip":"198.51.100.10"},"request":{"method":"GET","uri":"$uri","querystring":{},"headers":{"host":{"value":"jaios-governance.org"}},"cookies":{}}}
          JSON
          done
          dev_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
          aws cloudfront update-function --name "$FUNCTION_NAME" --if-match "$dev_etag" --function-config file:///tmp/function-after-config.json --function-code fileb://infra/aws/jaios-root-news-router.js >/tmp/function-update.json
          updated_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
          for name in root browser protected; do
            aws cloudfront test-function --name "$FUNCTION_NAME" --if-match "$updated_etag" --stage DEVELOPMENT --event-object "fileb:///tmp/test-${name}.json" >"/tmp/function-test-${name}.json"
            jq -e '.TestResult.FunctionErrorMessage == null or .TestResult.FunctionErrorMessage == ""' "/tmp/function-test-${name}.json" >/dev/null
          done
          aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$updated_etag" >/tmp/function-publish.json
          activated=1
          aws cloudfront get-function --name "$FUNCTION_NAME" --stage LIVE /tmp/live-function.js >/tmp/live-function-get.json
          cmp /tmp/live-function.js infra/aws/jaios-root-news-router.js
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/browser/app' '/browser/app/' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"
          ready=false
          for attempt in {1..30}; do
            if curl --fail-with-body --silent --show-error --location --header 'Cache-Control: no-cache' -o /tmp/public.html "${PUBLIC_APP}?release=${{ steps.contract.outputs.source_commit }}" \
              && grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/public.html; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          cmp /tmp/expected.html /tmp/public.html
          grep -Fq 'JAIOS-Browser-0.6.3-Windows-x64.exe' /tmp/public.html
          grep -Fq 'JAIOS-Browser-0.6.3-mac-universal.dmg' /tmp/public.html
          grep -Fq 'JAIOS-Browser-0.6.3-mac-universal.zip' /tmp/public.html
          ! grep -Fq 'JAIOS-Browser-0.5.3-Windows-x64-Bootstrap.zip' /tmp/public.html
          curl --fail --silent --show-error --location -o /tmp/entry.html "$PUBLIC_ENTRY"
          grep -Fq '/browser/app' /tmp/entry.html
          curl --fail --silent --show-error --location -o /tmp/root.html "https://${ROOT_DOMAIN}/"
          grep -Fq 'data-jaios-news-release=' /tmp/root.html
          grep -Fq 'data-jaios-trust-release=' /tmp/root.html
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          expected={'installWindows':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-Windows-x64.exe','installMacDmg':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.dmg','installMacZip':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.zip'}
          options=webdriver.ChromeOptions(); options.add_argument('--headless=new'); options.add_argument('--no-sandbox'); options.add_argument('--disable-dev-shm-usage')
          driver=webdriver.Chrome(options=options)
          try:
            for label,width in [('desktop',1440),('tablet',820),('mobile',390)]:
              driver.set_window_size(width,1400); driver.get('https://jaios-governance.org/browser/app')
              WebDriverWait(driver,30).until(lambda d:d.find_element(By.TAG_NAME,'body').get_attribute('data-jaios-browser-release')=='20260804-desktop-063-copy-paste-repair')
              for element_id,href in expected.items():
                element=driver.find_element(By.ID,element_id); assert element.is_displayed(); assert element.get_attribute('href')==href
              driver.save_screenshot(f'/tmp/jaios-browser-app-{label}.png')
          finally: driver.quit()
          PY
          trap - ERR
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Persist evidence and close request
        env:
          SOURCE_COMMIT: ${{ steps.contract.outputs.source_commit }}
          INVALIDATION_ID: ${{ steps.acceptance.outputs.invalidation_id }}
          BOOTSTRAP_ROLE: ${{ steps.bootstrap.outputs.selected }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/production
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          public=Path('/tmp/public.html').read_bytes(); expected=Path('/tmp/expected.html').read_bytes(); assert public==expected
          evidence={'schema':'jaios-browser-app-edge-production/v1','observed_at':datetime.now(timezone.utc).isoformat(),'source_commit':os.environ['SOURCE_COMMIT'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'public_url':'https://jaios-governance.org/browser/app','release_marker':os.environ['RELEASE_MARKER'],'public_html_sha256':hashlib.sha256(public).hexdigest(),'distribution_id':os.environ['DISTRIBUTION_ID'],'distribution_domain':os.environ['EXPECTED_DISTRIBUTION_DOMAIN'],'preserved_origin':os.environ['EXPECTED_ORIGIN_DOMAIN'],'function_arn':os.environ['FUNCTION_ARN'],'bootstrap_role':os.environ['BOOTSTRAP_ROLE'],'invalidation_id':os.environ['INVALIDATION_ID'],'links_present':3,'legacy_0_5_3_present':False,'desktop_acceptance':'PASS','tablet_acceptance':'PASS','mobile_acceptance':'PASS','root_route_preserved':True,'entry_route_preserved':True,'dns_changed':False,'tls_changed':False,'mainnet_changed':False,'assets_moved':False,'bridge_activated':False}
          Path('evidence/production/jaios-browser-app-production-latest.json').write_text(json.dumps(evidence,indent=2)+'\n')
          Path('evidence/production/jaios-browser-app-production-latest.md').write_text('# JAIOS Browser App 0.6.3 Production Evidence\n\n'+f'- Public URL: {evidence["public_url"]}\n- Run: {evidence["workflow_run_url"]}\n- Public HTML SHA-256: `{evidence["public_html_sha256"]}`\n- Windows / macOS links: 3/3\n- Legacy Windows 0.5.3 link: absent\n- Desktop / Tablet / Mobile: PASS\n- DNS / TLS / Mainnet / Assets / Bridge changed: false\n')
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text()); request['execute']=False; request['nonce']='completed-'+os.environ['GITHUB_RUN_ID']; request['completedEvidence']='evidence/production/jaios-browser-app-production-latest.json'; Path('sites/jaios-browser-app/deploy-request.json').write_text(json.dumps(request,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/production/jaios-browser-app-production-latest.* sites/jaios-browser-app/deploy-request.json
          git commit -m "Record JAIOS Browser App 0.6.3 production evidence ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
