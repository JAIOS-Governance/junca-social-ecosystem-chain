name: JAIOS Browser App Edge Production

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "sites/jaios-browser-app/**"
      - "scripts/build_jaios_browser_app_edge.py"
      - "infra/aws/jaios-browser-app-router.js"
      - "infra/aws/jaios-browser-app-router-rollback.js"
      - "infra/aws/jaios-root-news-router.js"
      - ".github/workflows/jaios-browser-app-edge-production.yml"
  push:
    branches: [main]
    paths:
      - "sites/jaios-browser-app/deploy-request.json"
      - "infra/aws/jaios-root-news-router.js"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: jaios-browser-app-edge-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "595710543956"
  AWS_REGION: us-east-1
  ROOT_DOMAIN: jaios-governance.org
  DOCS_DOMAIN: docs.jaios-governance.org
  DOCS_BUCKET: junca-chain-docs-595710543956
  DISTRIBUTION_ID: E2WIXG3DWW8OX1
  EXPECTED_DISTRIBUTION_DOMAIN: d6kqifze013tg.cloudfront.net
  EXPECTED_ORIGIN_DOMAIN: jaios-institutional-governance.juncajapan-inc.chatgpt.site
  FUNCTION_NAME: jaios-root-news-router
  FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/jaios-root-news-router
  DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
  RELEASE_MARKER: 20260804-desktop-063-copy-paste-repair
  PUBLIC_ENTRY: https://jaios-governance.org/browser
  PUBLIC_APP: https://jaios-governance.org/browser/app
  ARTIFACT_PATH: jaios-browser-app/index.html

jobs:
  quality-and-stage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate governed source and deployment request
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/build_jaios_browser_app_edge.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          release=json.loads(Path('sites/jaios-browser-app/release.json').read_text())
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text())
          assert release['schema']=='jaios-browser-web-release/v1'
          assert release['releaseMarker']=='20260804-desktop-063-copy-paste-repair'
          assert release['entryUrl']=='https://jaios-governance.org/browser'
          assert release['publicUrl']=='https://jaios-governance.org/browser/app'
          assert release['sourceRuntimeMergeSha']=='df797bc9f4ebf72405bbd3bb59ea355d500ff084'
          assert release['acceptedRuntimeHead']=='805af0e5d047d18002b4dde58d73eae6da2ae93e'
          assert release['publisherDisplay']=='JUNCA GLOBAL PARTNER INC.'
          assert release['governanceIssuer']=='JAIOS Institutional Governance'
          assert request['schema']=='jaios-browser-app-deployment-request/v1'
          assert request['target']==release['publicUrl']
          assert request['releaseMarker']==release['releaseMarker']
          assert request['expectedSourceRuntimeMergeSha']==release['sourceRuntimeMergeSha']
          assert set(request['safety'].values())=={False}
          assert isinstance(request['execute'], bool)
          downloads=release['downloads']
          assert set(downloads)=={'windows','macosDmg','macosZip'}
          for item in downloads.values():
              assert item['url'].startswith('https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/')
              assert re.fullmatch(r'[0-9a-f]{64}', item['sha256'])
              assert isinstance(item['sizeBytes'], int) and item['sizeBytes'] > 0
          if request['execute']:
              assert request['nonce'] not in {'implementation-installed-20260804-clean','implementation-installed-20260804'}
              assert Path('infra/aws/jaios-root-news-router.js').read_bytes() == Path('infra/aws/jaios-browser-app-router.js').read_bytes()
          PY
          execute="$(jq -r '.execute' sites/jaios-browser-app/deploy-request.json)"
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          grep -F "const ROOT_ARTIFACT = '/jaios-root-news/index.html';" infra/aws/jaios-browser-app-router.js
          grep -F "const BROWSER_APP_ARTIFACT = '/jaios-browser-app/index.html';" infra/aws/jaios-browser-app-router.js
          grep -F "request.uri === '/browser/app'" infra/aws/jaios-browser-app-router.js
          grep -F "request.uri === '/browser/app/'" infra/aws/jaios-browser-app-router.js
          grep -F "const ROOT_ARTIFACT = '/jaios-root-news/index.html';" infra/aws/jaios-browser-app-router-rollback.js
          ! grep -Fq "BROWSER_APP_ARTIFACT" infra/aws/jaios-browser-app-router-rollback.js

      - name: Build exact derivative from current production Browser page
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 60 \
            --output /tmp/current-browser-app.html "$PUBLIC_APP"
          python3 scripts/build_jaios_browser_app_edge.py \
            /tmp/current-browser-app.html sites/jaios-browser-app/release.json /tmp/index.html
          grep -F "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/index.html
          test "$(grep -o 'id="installWindows"' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="installMacDmg"' /tmp/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="installMacZip"' /tmp/index.html | wc -l)" -eq 1
          ! grep -Fq 'JAIOS-Browser-0.5.3-Windows-x64-Bootstrap.zip' /tmp/index.html
          ! grep -Fq 'Public Alpha: Windows 0.5.3' /tmp/index.html
          ! grep -Fq 'DOWNLOAD WINDOWS PACKAGE' /tmp/index.html
          test "$(wc -c < /tmp/index.html)" -lt 1000000
          sha256sum /tmp/current-browser-app.html /tmp/index.html

      - name: Verify official public release targets
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '.downloads[].url' sites/jaios-browser-app/release.json >/tmp/downloads.txt
          while IFS= read -r url; do
            curl --fail --silent --show-error --location --head \
              --retry 4 --retry-delay 2 --max-time 60 "$url" >/dev/null
          done </tmp/downloads.txt

      - name: Configure bounded AWS staging identity
        if: steps.contract.outputs.execute == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-browser-stage-${{ github.run_id }}
          disable-retry: true

      - name: Stage exact Browser artifact before traffic activation
        if: steps.contract.outputs.execute == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" >/tmp/distribution.json
          test "$(jq -r '.DistributionConfig.Aliases.Items[] | select(. == env.ROOT_DOMAIN)' /tmp/distribution.json)" = "$ROOT_DOMAIN"
          test "$(jq -r '.DistributionConfig.Origins.Items[].DomainName | select(. == env.EXPECTED_ORIGIN_DOMAIN)' /tmp/distribution.json)" = "$EXPECTED_ORIGIN_DOMAIN"
          test "$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query Distribution.DomainName --output text)" = "$EXPECTED_DISTRIBUTION_DOMAIN"
          test "$(aws s3api get-bucket-versioning --bucket "$DOCS_BUCKET" --query Status --output text)" = "Enabled"
          actual_function_arn="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage LIVE --query FunctionSummary.FunctionMetadata.FunctionARN --output text)"
          test "$actual_function_arn" = "$FUNCTION_ARN"
          jq --arg arn "$FUNCTION_ARN" -e '.DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Items[] | select(.EventType=="viewer-request" and .FunctionARN==$arn)' /tmp/distribution.json >/dev/null

          aws s3 cp /tmp/index.html "s3://${DOCS_BUCKET}/${ARTIFACT_PATH}" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public,max-age=0,must-revalidate" \
            --metadata "source-commit=${GITHUB_SHA},release=${RELEASE_MARKER},state=staged"
          aws s3 cp "s3://${DOCS_BUCKET}/${ARTIFACT_PATH}" /tmp/s3-readback.html
          cmp /tmp/index.html /tmp/s3-readback.html
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location \
              --output /tmp/docs-origin.html "https://${DOCS_DOMAIN}/${ARTIFACT_PATH}" \
              && grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/docs-origin.html; then
              break
            fi
            sleep 5
          done
          cmp /tmp/index.html /tmp/docs-origin.html
          sha256sum /tmp/index.html | cut -d' ' -f1 >/tmp/staged-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jaios-browser-app-stage-${{ github.sha }}
          path: |
            /tmp/index.html
            /tmp/staged-sha256.txt
          if-no-files-found: error
          retention-days: 90

  authorize-production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read one-shot deployment authorization
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          execute="$(jq -r '.execute' sites/jaios-browser-app/deploy-request.json)"
          test "$execute" = true -o "$execute" = false
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          echo "JAIOS_BROWSER_DEPLOYMENT_EXECUTE=$execute"

  publish-and-readback:
    needs: authorize-production
    if: needs.authorize-production.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact activation state
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('sites/jaios-browser-app/release.json').read_text())
          request=json.loads(Path('sites/jaios-browser-app/deploy-request.json').read_text())
          assert request['execute'] is True
          assert request['nonce'] not in {'implementation-installed-20260804-clean','implementation-installed-20260804'}
          assert request['target']=='https://jaios-governance.org/browser/app'
          assert request['releaseMarker']=='20260804-desktop-063-copy-paste-repair'
          assert request['expectedSourceRuntimeMergeSha']=='df797bc9f4ebf72405bbd3bb59ea355d500ff084'
          assert set(request['safety'].values())=={False}
          assert release['releaseMarker']==request['releaseMarker']
          assert Path('infra/aws/jaios-root-news-router.js').read_bytes() == Path('infra/aws/jaios-browser-app-router.js').read_bytes()
          PY
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure production and rollback identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-browser-production-${{ github.run_id }}
          disable-retry: true

      - name: Publish composite router and complete public acceptance
        id: acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          activated=0
          rollback() {
            rc=$?
            if [[ "$activated" -eq 1 ]]; then
              echo "Browser public acceptance failed; restoring exact previous LIVE Function." >&2
              dev_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
              aws cloudfront update-function --name "$FUNCTION_NAME" --if-match "$dev_etag" \
                --function-config file:///tmp/function-before-config.json \
                --function-code fileb:///tmp/function-before.js >/tmp/rollback-update.json || true
              rollback_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
              aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$rollback_etag" >/tmp/rollback-publish.json || true
              rollback_invalidation="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
                --paths '/browser/app' '/browser/app/' --query Invalidation.Id --output text 2>/dev/null || true)"
              if [[ -n "$rollback_invalidation" && "$rollback_invalidation" != "None" ]]; then
                aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$rollback_invalidation" || true
              fi
            fi
            exit "$rc"
          }
          trap rollback ERR

          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID" >/tmp/distribution.json
          test "$(jq -r '.DistributionConfig.Aliases.Items[] | select(. == env.ROOT_DOMAIN)' /tmp/distribution.json)" = "$ROOT_DOMAIN"
          test "$(jq -r '.DistributionConfig.Origins.Items[].DomainName | select(. == env.EXPECTED_ORIGIN_DOMAIN)' /tmp/distribution.json)" = "$EXPECTED_ORIGIN_DOMAIN"
          jq --arg arn "$FUNCTION_ARN" -e '.DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Items[] | select(.EventType=="viewer-request" and .FunctionARN==$arn)' /tmp/distribution.json >/dev/null
          aws s3 cp "s3://${DOCS_BUCKET}/${ARTIFACT_PATH}" /tmp/expected-browser-app.html
          grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/expected-browser-app.html

          aws cloudfront get-function --name "$FUNCTION_NAME" --stage LIVE /tmp/function-before.js >/tmp/function-before-get.json
          aws cloudfront describe-function --name "$FUNCTION_NAME" --stage LIVE >/tmp/function-before-description.json
          jq '.FunctionSummary.FunctionConfig' /tmp/function-before-description.json >/tmp/function-before-config.json

          cat >/tmp/function-after-config.json <<'JSON'
          {"Comment":"Route the JAIOS root and Browser app documents to governed exact artifacts","Runtime":"cloudfront-js-2.0"}
          JSON
          cat >/tmp/test-root.json <<'JSON'
          {"version":"1.0","context":{"eventType":"viewer-request"},"viewer":{"ip":"198.51.100.10"},"request":{"method":"GET","uri":"/","querystring":{},"headers":{"host":{"value":"jaios-governance.org"}},"cookies":{}}}
          JSON
          cat >/tmp/test-browser.json <<'JSON'
          {"version":"1.0","context":{"eventType":"viewer-request"},"viewer":{"ip":"198.51.100.10"},"request":{"method":"GET","uri":"/browser/app","querystring":{},"headers":{"host":{"value":"jaios-governance.org"}},"cookies":{}}}
          JSON
          cat >/tmp/test-protected.json <<'JSON'
          {"version":"1.0","context":{"eventType":"viewer-request"},"viewer":{"ip":"198.51.100.10"},"request":{"method":"GET","uri":"/browser","querystring":{},"headers":{"host":{"value":"jaios-governance.org"}},"cookies":{}}}
          JSON
          dev_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
          aws cloudfront update-function --name "$FUNCTION_NAME" --if-match "$dev_etag" \
            --function-config file:///tmp/function-after-config.json \
            --function-code fileb://infra/aws/jaios-root-news-router.js >/tmp/function-update.json
          updated_etag="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage DEVELOPMENT --query ETag --output text)"
          for event in root browser protected; do
            aws cloudfront test-function --name "$FUNCTION_NAME" --if-match "$updated_etag" \
              --stage DEVELOPMENT --event-object "fileb:///tmp/test-${event}.json" \
              >"/tmp/function-test-${event}.json"
            jq -e '.TestResult.FunctionErrorMessage == null or .TestResult.FunctionErrorMessage == ""' "/tmp/function-test-${event}.json" >/dev/null
          done
          aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$updated_etag" >/tmp/function-publish.json
          activated=1
          live_arn="$(aws cloudfront describe-function --name "$FUNCTION_NAME" --stage LIVE --query FunctionSummary.FunctionMetadata.FunctionARN --output text)"
          test "$live_arn" = "$FUNCTION_ARN"
          aws cloudfront get-function --name "$FUNCTION_NAME" --stage LIVE /tmp/live-function.js >/tmp/live-function-get.json
          cmp /tmp/live-function.js infra/aws/jaios-root-news-router.js

          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/browser/app' '/browser/app/' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"

          ready=false
          for attempt in {1..30}; do
            if curl --fail-with-body --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/public-browser-app.html "${PUBLIC_APP}?release=${{ steps.contract.outputs.source_commit }}" \
              && grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/public-browser-app.html; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          cmp /tmp/expected-browser-app.html /tmp/public-browser-app.html
          grep -Fq 'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-Windows-x64.exe' /tmp/public-browser-app.html
          grep -Fq 'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.dmg' /tmp/public-browser-app.html
          grep -Fq 'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.zip' /tmp/public-browser-app.html
          ! grep -Fq 'JAIOS-Browser-0.5.3-Windows-x64-Bootstrap.zip' /tmp/public-browser-app.html
          ! grep -Fq 'Public Alpha: Windows 0.5.3' /tmp/public-browser-app.html
          ! grep -Fq 'DOWNLOAD WINDOWS PACKAGE' /tmp/public-browser-app.html

          curl --fail --silent --show-error --location --output /tmp/public-entry.html "$PUBLIC_ENTRY"
          grep -Fq '/browser/app' /tmp/public-entry.html
          ! grep -Fq "data-jaios-browser-release=\"${RELEASE_MARKER}\"" /tmp/public-entry.html
          curl --fail --silent --show-error --location --output /tmp/public-root.html "https://${ROOT_DOMAIN}/"
          grep -Fq 'data-jaios-news-release=' /tmp/public-root.html
          grep -Fq 'data-jaios-trust-release=' /tmp/public-root.html

          jq -r '.downloads[].url' sites/jaios-browser-app/release.json >/tmp/downloads.txt
          while IFS= read -r url; do
            curl --fail --silent --show-error --location --head \
              --retry 4 --retry-delay 2 --max-time 60 "$url" >/dev/null
          done </tmp/downloads.txt

          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          expected={
            'installWindows':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-Windows-x64.exe',
            'installMacDmg':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.dmg',
            'installMacZip':'https://github.com/juncaGlobal/junca-Project/releases/download/jaios-browser-v0.6.3/JAIOS-Browser-0.6.3-mac-universal.zip',
          }
          options=webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          driver=webdriver.Chrome(options=options)
          try:
              for label,width in [('desktop',1440),('tablet',820),('mobile',390)]:
                  driver.set_window_size(width,1400)
                  driver.get('https://jaios-governance.org/browser/app')
                  WebDriverWait(driver,30).until(
                      lambda d: d.find_element(By.TAG_NAME,'body').get_attribute('data-jaios-browser-release')=='20260804-desktop-063-copy-paste-repair'
                  )
                  for element_id, href in expected.items():
                      element=driver.find_element(By.ID,element_id)
                      assert element.is_displayed(), (label,element_id)
                      assert element.get_attribute('href')==href, (label,element_id,element.get_attribute('href'))
                  body=driver.find_element(By.TAG_NAME,'body').text
                  assert 'Public release: Windows and macOS 0.6.3' in body
                  assert 'Public Alpha: Windows 0.5.3' not in body
                  driver.save_screenshot(f'/tmp/jaios-browser-app-{label}.png')
              print('JAIOS_BROWSER_APP_RESPONSIVE_ACCEPTANCE_PASS')
          finally:
              driver.quit()
          PY

          trap - ERR
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Record immutable public deployment evidence
        env:
          SOURCE_COMMIT: ${{ steps.contract.outputs.source_commit }}
          INVALIDATION_ID: ${{ steps.acceptance.outputs.invalidation_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evidence
          cp /tmp/public-browser-app.html /tmp/evidence/browser-app-public.html
          cp /tmp/public-entry.html /tmp/evidence/browser-entry-public.html
          cp /tmp/live-function.js /tmp/evidence/live-function.js
          cp /tmp/jaios-browser-app-desktop.png /tmp/evidence/
          cp /tmp/jaios-browser-app-tablet.png /tmp/evidence/
          cp /tmp/jaios-browser-app-mobile.png /tmp/evidence/
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          public=Path('/tmp/public-browser-app.html').read_bytes()
          expected=Path('/tmp/expected-browser-app.html').read_bytes()
          assert public==expected
          evidence={
            'schema':'jaios-browser-app-edge-production/v1',
            'observed_at':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ['SOURCE_COMMIT'],
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'public_url':'https://jaios-governance.org/browser/app',
            'release_marker':os.environ['RELEASE_MARKER'],
            'public_html_sha256':hashlib.sha256(public).hexdigest(),
            'distribution_id':os.environ['DISTRIBUTION_ID'],
            'distribution_domain':os.environ['EXPECTED_DISTRIBUTION_DOMAIN'],
            'preserved_origin':os.environ['EXPECTED_ORIGIN_DOMAIN'],
            'function_name':os.environ['FUNCTION_NAME'],
            'function_arn':os.environ['FUNCTION_ARN'],
            'invalidation_id':os.environ['INVALIDATION_ID'],
            'links_present':3,
            'legacy_0_5_3_present':False,
            'desktop_acceptance':'PASS',
            'tablet_acceptance':'PASS',
            'mobile_acceptance':'PASS',
            'root_route_preserved':True,
            'entry_route_preserved':True,
            'dns_changed':False,
            'tls_changed':False,
            'mainnet_changed':False,
            'assets_moved':False,
            'bridge_activated':False,
          }
          Path('/tmp/evidence/production-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          Path('/tmp/evidence/production-evidence.md').write_text(
            '# JAIOS Browser App 0.6.3 Production Evidence\n\n'
            f'- Public URL: {evidence["public_url"]}\n'
            f'- Source commit: `{evidence["source_commit"]}`\n'
            f'- Public HTML SHA-256: `{evidence["public_html_sha256"]}`\n'
            f'- CloudFront distribution: `{evidence["distribution_id"]}`\n'
            f'- CloudFront Function: `{evidence["function_arn"]}`\n'
            f'- Invalidation: `{evidence["invalidation_id"]}`\n'
            '- Windows / macOS official links: 3/3\n'
            '- Legacy Windows 0.5.3 link: absent\n'
            '- Desktop / Tablet / Mobile: PASS\n'
            '- DNS / TLS / Mainnet / Assets / Bridge changed: false\n'
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: jaios-browser-app-production-evidence-${{ github.run_id }}
          path: /tmp/evidence
