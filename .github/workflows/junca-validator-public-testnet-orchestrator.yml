name: JUNCA Validator Public Testnet Release Orchestrator

on:
  push:
    branches: [main]
    paths:
      - config/junca_validator_ami_build_request.json

permissions:
  actions: write
  contents: read

concurrency:
  group: junca-validator-public-testnet-release-orchestrator
  cancel-in-progress: false

jobs:
  authorize-and-orchestrate:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 360
    env:
      REQUEST_PATH: config/junca_validator_ami_build_request.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify signed request-only main commit
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "${{ github.event.repository.default_branch }}" = main
          test "$GITHUB_REPOSITORY" = JAIOS-Governance/junca-social-ecosystem-chain
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          jq -e '
            .commit.verification.verified == true and
            .commit.verification.reason == "valid"
          ' <<<"$commit_json"
          python scripts/junca_validator_ami_build_request.py \
            --request "$REQUEST_PATH" \
            --require-migration-binding \
            --github-output "$GITHUB_OUTPUT"
          request_type="$(jq -er '
            if .schema_version == "junca-validator-ami-build-request/v1"
            then "ami-build"
            elif .schema_version ==
              "junca-validator-foundation-resume-request/v1"
            then "foundation-resume"
            else error("unsupported request schema")
            end
          ' "$REQUEST_PATH")"
          request_digest="$(jq -er .request_sha256 "$REQUEST_PATH")"
          if [[ "$request_type" == "ami-build" ]]; then
            jq -e --arg path "$REQUEST_PATH" '
              (.files | length) == 1 and
              .files[0].filename == $path and
              .files[0].status == "modified"
            ' <<<"$commit_json"
          else
            test "$GITHUB_RUN_ATTEMPT" = 1
            if ! jq -e --arg path "$REQUEST_PATH" '
              (.files | length) == 1 and
              .files[0].filename == $path and
              .files[0].status == "modified"
            ' <<<"$commit_json"; then
              if jq -e '
                ([.files[] |
                  select(.status == "modified") |
                  .filename] | sort) ==
                ([
                  ".github/workflows/junca-validator-public-testnet-orchestrator.yml",
                  "config/junca_validator_ami_build_request.json",
                  "jaios/social_ecosystem_chain/rolling_compatibility.py",
                  "scripts/junca_validator_ami_build_request.py",
                  "tests/test_junca_validator_ami_workflow.py"
                ] | sort) and
                (.files | length) == 5
              ' <<<"$commit_json"; then
                git show "${GITHUB_SHA}^:${REQUEST_PATH}" |
                  jq -e '.schema_version ==
                    "junca-validator-ami-build-request/v1"'
              else
                jq -e '
                  ([.files[] |
                    select(.status == "modified") |
                    .filename] | sort) ==
                  ([
                    ".github/workflows/junca-validator-public-testnet-orchestrator.yml",
                    "config/junca_validator_ami_build_request.json",
                    "jaios/social_ecosystem_chain/rolling_compatibility.py",
                    "tests/test_junca_validator_ami_workflow.py",
                    "tests/test_junca_validator_rolling_compatibility.py"
                  ] | sort) and
                  (.files | length) == 5
                ' <<<"$commit_json"
                git show "${GITHUB_SHA}^:${REQUEST_PATH}" |
                  jq -e '
                    .schema_version ==
                      "junca-validator-foundation-resume-request/v1" and
                    .one_shot_nonce ==
                      "foundation-resume-30311386951-20260727" and
                    .request_sha256 ==
                      "d143326804e0bea9ac657cb410c277801d2af6d9d08e254c2338d894bb664443"
                  '
                jq -e '
                  .one_shot_nonce ==
                    "foundation-resume-30311386951-20260727-retry-2" and
                  .request_sha256 ==
                    "9fa0cef6329eb55fa7c5180afab8e29df72dd84be4cca4711759e67e960129af"
                ' "$REQUEST_PATH"
              fi
            fi
            while IFS= read -r prior_commit; do
              prior_digest="$(git show \
                "${prior_commit}:${REQUEST_PATH}" 2>/dev/null |
                jq -r '.request_sha256 // empty' 2>/dev/null || true)"
              test -z "$prior_digest" || test "$prior_digest" != "$request_digest"
            done < <(git rev-list "${GITHUB_SHA}^" -- "$REQUEST_PATH")
          fi

      - name: Dispatch and monitor immutable AMI
        id: ami
        if: steps.request.outputs.request_type == 'ami-build'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          NODE_ARTIFACT_NAME: ${{ steps.request.outputs.node_artifact_name }}
          GENESIS_ARTIFACT_NAME: ${{ steps.request.outputs.genesis_artifact_name }}
          NODE_SHA256: ${{ steps.request.outputs.node_sha256 }}
          GENESIS_SHA256: ${{ steps.request.outputs.genesis_sha256 }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
        run: |
          set -euo pipefail
          workflow_name="JUNCA Validator Immutable AMI Build"
          workflow_path=".github/workflows/junca-validator-ami-build.yml"
          workflows="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" |
            jq -s '[.[].workflows[]]')"
          workflow="$(jq -c \
            --arg name "$workflow_name" \
            --arg path "$workflow_path" \
            '[.[] | select(.name == $name and .path == $path)] |
             if length == 1 then .[0] else error("AMI workflow mismatch") end' \
            <<<"$workflows")"
          workflow_id="$(jq -r .id <<<"$workflow")"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            -f ref=main \
            -f "inputs[source_run_id]=${SOURCE_RUN_ID}" \
            -f "inputs[source_commit]=${SOURCE_COMMIT}" \
            -f "inputs[node_artifact_name]=${NODE_ARTIFACT_NAME}" \
            -f "inputs[genesis_artifact_name]=${GENESIS_ARTIFACT_NAME}" \
            -f "inputs[node_sha256]=${NODE_SHA256}" \
            -f "inputs[genesis_sha256]=${GENESIS_SHA256}" \
            -f "inputs[request_sha256]=${REQUEST_SHA256}"

          run_id=""
          for attempt in $(seq 1 90); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=30")"
            matches="$(jq -c \
              --arg since "$dispatched_at" \
              --arg head "$GITHUB_SHA" '
              [.workflow_runs[] |
                select(.created_at >= $since and .head_sha == $head)
              ]' <<<"$runs")"
            count="$(jq length <<<"$matches")"
            test "$count" -le 1
            if [[ "$count" = 1 ]]; then
              run_id="$(jq -r '.[0].id' <<<"$matches")"
              break
            fi
            test "$attempt" -lt 90
            sleep 2
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          for attempt in $(seq 1 190); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r .status <<<"$run")"
            [[ "$status" == completed ]] && break
            test "$attempt" -lt 190
            sleep 30
          done
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$GITHUB_SHA" \
            --arg path "$workflow_path" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Validator Immutable AMI Build" and
            .path == $path and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $head and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$run"
          mkdir -p artifacts/ami
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "junca-validator-ami-build-${run_id}" \
            --dir artifacts/ami
          jq -e \
            --arg request "$REQUEST_SHA256" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg node "$NODE_SHA256" \
            --arg genesis "$GENESIS_SHA256" '
            .state == "AMI_VERIFIED" and
            .request_sha256 == $request and
            .source_commit == $source_commit and
            .node_artifact_sha256 == $node and
            .genesis_sha256 == $genesis and
            .terraform_state_changed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' artifacts/ami/junca-validator-ami-build.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch and monitor pre-rollout evidence collector
        id: evidence
        if: steps.request.outputs.request_type == 'ami-build'
        env:
          GH_TOKEN: ${{ github.token }}
          AMI_RUN_ID: ${{ steps.ami.outputs.run_id }}
          MIGRATION_RUN_ID: ${{ steps.request.outputs.migration_run_id }}
          MIGRATION_EVIDENCE_SHA256: >-
            ${{ steps.request.outputs.migration_evidence_sha256 }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
        run: |
          set -euo pipefail
          workflow_name="JUNCA Runtime Release Evidence Collector"
          workflow_path=".github/workflows/junca-runtime-release-evidence-collector.yml"
          workflows="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" |
            jq -s '[.[].workflows[]]')"
          workflow="$(jq -c \
            --arg name "$workflow_name" \
            --arg path "$workflow_path" '
            [.[] | select(
              .name == $name and .path == $path and .state == "active"
            )] |
            if length == 1 then .[0] else error("collector workflow mismatch") end
          ' <<<"$workflows")"
          workflow_id="$(jq -r .id <<<"$workflow")"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            -f ref=main \
            -f "inputs[ami_run_id]=${AMI_RUN_ID}" \
            -f "inputs[migration_run_id]=${MIGRATION_RUN_ID}" \
            -f "inputs[migration_evidence_sha256]=${MIGRATION_EVIDENCE_SHA256}" \
            -f "inputs[source_commit]=${SOURCE_COMMIT}"

          run_id=""
          for attempt in $(seq 1 90); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=30")"
            matches="$(jq -c \
              --arg since "$dispatched_at" \
              --arg head "$GITHUB_SHA" '
              [.workflow_runs[] |
                select(.created_at >= $since and .head_sha == $head)
              ]' <<<"$runs")"
            count="$(jq length <<<"$matches")"
            test "$count" -le 1
            if [[ "$count" = 1 ]]; then
              run_id="$(jq -r '.[0].id' <<<"$matches")"
              break
            fi
            test "$attempt" -lt 90
            sleep 2
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          for attempt in $(seq 1 50); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            [[ "$(jq -r .status <<<"$run")" == completed ]] && break
            test "$attempt" -lt 50
            sleep 30
          done
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$GITHUB_SHA" \
            --arg path "$workflow_path" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Runtime Release Evidence Collector" and
            .path == $path and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $head and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$run"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch and monitor release manifest gate
        id: manifest
        if: steps.request.outputs.request_type == 'ami-build'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          NODE_SHA256: ${{ steps.request.outputs.node_sha256 }}
          GENESIS_SHA256: ${{ steps.request.outputs.genesis_sha256 }}
        run: |
          set -euo pipefail
          workflow_name="JUNCA Runtime Release Manifest Gate"
          workflow_path=".github/workflows/junca-runtime-release-manifest-gate.yml"
          workflows="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" |
            jq -s '[.[].workflows[]]')"
          workflow_id="$(jq -r \
            --arg name "$workflow_name" \
            --arg path "$workflow_path" '
            [.[] | select(.name == $name and .path == $path)] |
            if length == 1 then .[0].id else error("manifest workflow mismatch") end
          ' <<<"$workflows")"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            -f ref=main \
            -f "inputs[evidence_run_id]=${EVIDENCE_RUN_ID}" \
            -f "inputs[source_commit]=${SOURCE_COMMIT}" \
            -f "inputs[node_artifact_sha256]=${NODE_SHA256}" \
            -f "inputs[genesis_sha256]=${GENESIS_SHA256}"

          run_id=""
          for attempt in $(seq 1 90); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=30")"
            matches="$(jq -c \
              --arg since "$dispatched_at" \
              --arg head "$GITHUB_SHA" '
              [.workflow_runs[] |
                select(.created_at >= $since and .head_sha == $head)
              ]' <<<"$runs")"
            count="$(jq length <<<"$matches")"
            test "$count" -le 1
            if [[ "$count" = 1 ]]; then
              run_id="$(jq -r '.[0].id' <<<"$matches")"
              break
            fi
            test "$attempt" -lt 90
            sleep 2
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          for attempt in $(seq 1 40); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            [[ "$(jq -r .status <<<"$run")" == completed ]] && break
            test "$attempt" -lt 40
            sleep 15
          done
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$GITHUB_SHA" \
            --arg path "$workflow_path" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Runtime Release Manifest Gate" and
            .path == $path and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $head and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$run"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch Validator Foundation rolling release
        id: foundation
        if: >-
          steps.request.outputs.request_type == 'ami-build' ||
          steps.request.outputs.request_type == 'foundation-resume'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_TYPE: ${{ steps.request.outputs.request_type }}
          NEW_AMI_RUN_ID: ${{ steps.ami.outputs.run_id }}
          NEW_MANIFEST_GATE_RUN_ID: ${{ steps.manifest.outputs.run_id }}
          REQUEST_AMI_RUN_ID: ${{ steps.request.outputs.ami_run_id }}
          REQUEST_MANIFEST_GATE_RUN_ID: >-
            ${{ steps.request.outputs.manifest_gate_run_id }}
          REQUEST_RESUME_RUN_ID: ${{ steps.request.outputs.resume_run_id }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_TYPE" == "foundation-resume" ]]; then
            AMI_RUN_ID="$REQUEST_AMI_RUN_ID"
            MANIFEST_GATE_RUN_ID="$REQUEST_MANIFEST_GATE_RUN_ID"
            RESUME_RUN_ID="$REQUEST_RESUME_RUN_ID"
          else
            AMI_RUN_ID="$NEW_AMI_RUN_ID"
            MANIFEST_GATE_RUN_ID="$NEW_MANIFEST_GATE_RUN_ID"
            RESUME_RUN_ID=0
          fi
          [[ "$AMI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MANIFEST_GATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RESUME_RUN_ID" =~ ^(0|[1-9][0-9]*)$ ]]
          workflow_name="JUNCA Validator Foundation Release"
          workflow_path=".github/workflows/junca-validator-foundation-release.yml"
          workflows="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" |
            jq -s '[.[].workflows[]]')"
          workflow_id="$(jq -r \
            --arg name "$workflow_name" \
            --arg path "$workflow_path" '
            [.[] | select(.name == $name and .path == $path)] |
            if length == 1 then .[0].id else error("foundation workflow mismatch") end
          ' <<<"$workflows")"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            -f ref=main \
            -f "inputs[ami_run_id]=${AMI_RUN_ID}" \
            -f "inputs[manifest_gate_run_id]=${MANIFEST_GATE_RUN_ID}" \
            -f "inputs[resume_run_id]=${RESUME_RUN_ID}" \
            -f "inputs[authorize_rollout]=PUBLIC_TESTNET_ROLLOUT"

          run_id=""
          for attempt in $(seq 1 90); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=30")"
            matches="$(jq -c \
              --arg since "$dispatched_at" \
              --arg head "$GITHUB_SHA" '
              [.workflow_runs[] |
                select(.created_at >= $since and .head_sha == $head)
              ]' <<<"$runs")"
            count="$(jq length <<<"$matches")"
            test "$count" -le 1
            if [[ "$count" = 1 ]]; then
              run_id="$(jq -r '.[0].id' <<<"$matches")"
              break
            fi
            test "$attempt" -lt 90
            sleep 2
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 310); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            [[ "$(jq -r .status <<<"$run")" == completed ]] && break
            test "$attempt" -lt 310
            sleep 30
          done
          conclusion="$(jq -r .conclusion <<<"$run")"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$GITHUB_SHA" \
            --arg path "$workflow_path" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Validator Foundation Release" and
            .path == $path and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $head and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$run"
          echo "The public endpoint release remains provenance-bound to this successful Foundation workflow_run."

      - name: Record Foundation resume request audit
        if: >-
          always() &&
          steps.request.outputs.request_type == 'foundation-resume'
        env:
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
          ONE_SHOT_NONCE: ${{ steps.request.outputs.one_shot_nonce }}
          AMI_RUN_ID: ${{ steps.request.outputs.ami_run_id }}
          MANIFEST_GATE_RUN_ID: >-
            ${{ steps.request.outputs.manifest_gate_run_id }}
          RESUME_RUN_ID: ${{ steps.request.outputs.resume_run_id }}
          FOUNDATION_RUN_ID: ${{ steps.foundation.outputs.run_id }}
          FOUNDATION_CONCLUSION: ${{ steps.foundation.outputs.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/foundation-resume-request
          jq -n \
            --arg request_sha256 "$REQUEST_SHA256" \
            --arg request_commit "$GITHUB_SHA" \
            --arg one_shot_nonce "$ONE_SHOT_NONCE" \
            --arg ami_run_id "$AMI_RUN_ID" \
            --arg manifest_gate_run_id "$MANIFEST_GATE_RUN_ID" \
            --arg resume_run_id "$RESUME_RUN_ID" \
            --arg foundation_run_id "$FOUNDATION_RUN_ID" \
            --arg foundation_conclusion "$FOUNDATION_CONCLUSION" \
            '{
              schema_version: "junca-validator-foundation-resume-audit/v1",
              state: "FOUNDATION_RESUME_REQUEST_CONSUMED",
              request_sha256: $request_sha256,
              request_commit: $request_commit,
              one_shot_nonce: $one_shot_nonce,
              target_workflow:
                ".github/workflows/junca-validator-foundation-release.yml",
              ami_run_id: $ami_run_id,
              manifest_gate_run_id: $manifest_gate_run_id,
              resume_run_id: $resume_run_id,
              foundation_run_id: $foundation_run_id,
              foundation_conclusion: $foundation_conclusion,
              rebuild_ami: false,
              rebuild_manifest: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/foundation-resume-request/audit.json
          (
            cd artifacts/foundation-resume-request
            sha256sum audit.json > audit.json.sha256
          )

      - name: Upload Foundation resume request audit
        if: >-
          always() &&
          steps.request.outputs.request_type == 'foundation-resume'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-resume-request-${{ github.run_id }}
          path: artifacts/foundation-resume-request
          if-no-files-found: error
          retention-days: 90
