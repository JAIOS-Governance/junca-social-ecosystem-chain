name: One-shot JSEC Deterministic Identity Source Fix 2026-08-08

on:
  push:
    branches:
      - fix/jsec-deterministic-system-identity-20260808
    paths:
      - .github/workflows/one-shot-jsec-deterministic-identity-source-fix-20260808.yml

permissions:
  contents: write

concurrency:
  group: one-shot-jsec-deterministic-identity-source-fix-20260808
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/jsec-deterministic-system-identity-20260808
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded source repair
        run: python scripts/ops/apply_deterministic_identity_patch.py

      - name: Validate deterministic identity contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/junca_public_testnet_foundation.sh
          python -m unittest \
            tests.test_junca_deterministic_system_identity \
            tests.test_junca_hardened_immutable_release_workflow \
            -v

      - name: Commit non-workflow source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JSEC Runtime Identity Recovery Cell"
          git config user.email "juncajapan.inc@gmail.com"
          git add \
            scripts/junca_public_testnet_foundation.sh \
            .github/image-builder/validator-component.yml \
            infra/aws/public-testnet/templates/validator-user-data.sh.tftpl \
            tests/test_junca_deterministic_system_identity.py
          git commit -m "fix(runtime): pin and migrate validator system identity"
          git push origin HEAD:fix/jsec-deterministic-system-identity-20260808

# activation: structural-function-boundary-v2
