name: One-shot JSEC Deterministic Identity Source Fix 2026-08-08

on:
  push:
    branches:
      - fix/jsec-deterministic-system-identity-20260808
    paths:
      - .github/workflows/one-shot-jsec-deterministic-identity-source-fix-20260808.yml

permissions:
  contents: write

concurrency:
  group: one-shot-jsec-deterministic-identity-source-fix-20260808
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/jsec-deterministic-system-identity-20260808
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Implement deterministic identity creation and bounded legacy migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          foundation_path = Path("scripts/junca_public_testnet_foundation.sh")
          component_path = Path(".github/image-builder/validator-component.yml")
          user_data_path = Path("infra/aws/public-testnet/templates/validator-user-data.sh.tftpl")
          test_path = Path("tests/test_junca_deterministic_system_identity.py")

          foundation = foundation_path.read_text(encoding="utf-8")
          old_ensure = '''ensure_junca_system_identity() {
            local passwd_entry=""
            local group_entry=""
            local group_name=""
            local group_gid=""
            if verify_junca_system_identity; then
              return 0
            fi
            system_identity_repair_attempted=true
            passwd_entry="$(getent passwd junca 2>/dev/null || true)"
            group_entry="$(getent group junca 2>/dev/null || true)"
            [[ -z "$passwd_entry" ]] || return 1
            if [[ -n "$group_entry" ]]; then
              IFS=: read -r group_name _ group_gid _ <<<"$group_entry"
              [[ "$group_name" == junca && "$group_gid" == 992 ]] || return 1
            else
              [[ -z "$(getent group 992 2>/dev/null || true)" ]] || return 1
              groupadd --system --gid 992 junca || return 1
            fi
            [[ -z "$(getent passwd 992 2>/dev/null || true)" ]] || return 1
            useradd --system --uid 992 --gid 992 --home-dir /var/lib/junca \
              --shell /sbin/nologin --no-create-home junca || return 1
            verify_junca_system_identity || return 1
            system_identity_repaired=true
          }
          '''
          new_ensure = '''ensure_junca_system_identity() {
            local passwd_entry=""
            local group_entry=""
            local occupied_entry=""
            local passwd_name=""
            local old_uid=""
            local old_primary_gid=""
            local old_home=""
            local old_shell=""
            local group_name=""
            local old_group_gid=""
            local path=""
            if verify_junca_system_identity; then
              return 0
            fi
            [[ "$repair_status_admitted" == true ]] || return 1
            system_identity_repair_attempted=true
            passwd_entry="$(getent passwd junca 2>/dev/null || true)"
            group_entry="$(getent group junca 2>/dev/null || true)"

            if [[ -n "$group_entry" ]]; then
              IFS=: read -r group_name _ old_group_gid _ <<<"$group_entry"
              [[ "$group_name" == junca ]] || return 1
              if [[ "$old_group_gid" != 992 ]]; then
                occupied_entry="$(getent group 992 2>/dev/null || true)"
                if [[ -n "$occupied_entry" && "$occupied_entry" != "$group_entry" ]]; then
                  echo "JUNCA_SYSTEM_GID_992_COLLISION entry=${occupied_entry%%:*}" >&2
                  return 1
                fi
                groupmod --gid 992 junca || return 1
              fi
            else
              occupied_entry="$(getent group 992 2>/dev/null || true)"
              if [[ -n "$occupied_entry" ]]; then
                echo "JUNCA_SYSTEM_GID_992_COLLISION entry=${occupied_entry%%:*}" >&2
                return 1
              fi
              groupadd --system --gid 992 junca || return 1
            fi

            if [[ -n "$passwd_entry" ]]; then
              IFS=: read -r passwd_name _ old_uid old_primary_gid _ old_home \
                old_shell <<<"$passwd_entry"
              [[ "$passwd_name" == junca ]] || return 1
              systemctl stop junca-public-rpc.service \
                junca-public-explorer.service >/dev/null 2>&1 || true
              if [[ "$old_uid" != 992 ]]; then
                occupied_entry="$(getent passwd 992 2>/dev/null || true)"
                if [[ -n "$occupied_entry" && "$occupied_entry" != "$passwd_entry" ]]; then
                  echo "JUNCA_SYSTEM_UID_992_COLLISION entry=${occupied_entry%%:*}" >&2
                  return 1
                fi
                for attempt in $(seq 1 20); do
                  if ! pgrep -u "$old_uid" >/dev/null 2>&1; then
                    break
                  fi
                  sleep 1
                done
                if pgrep -u "$old_uid" >/dev/null 2>&1; then
                  echo "JUNCA_SYSTEM_IDENTITY_ACTIVE_PROCESS uid=${old_uid}" >&2
                  return 1
                fi
              fi
              usermod --uid 992 --gid 992 --home /var/lib/junca \
                --shell /sbin/nologin junca || return 1
            else
              occupied_entry="$(getent passwd 992 2>/dev/null || true)"
              if [[ -n "$occupied_entry" ]]; then
                echo "JUNCA_SYSTEM_UID_992_COLLISION entry=${occupied_entry%%:*}" >&2
                return 1
              fi
              useradd --system --uid 992 --gid 992 \
                --home-dir /var/lib/junca --shell /sbin/nologin \
                --no-create-home junca || return 1
            fi

            for path in /etc/junca /var/lib/junca /opt/junca; do
              [[ -e "$path" && ! -L "$path" ]] || continue
              if [[ -n "$old_uid" && "$old_uid" != 992 ]]; then
                find "$path" -xdev -uid "$old_uid" -exec chown -h 992 {} + ||
                  return 1
              fi
              if [[ -n "$old_group_gid" && "$old_group_gid" != 992 ]]; then
                find "$path" -xdev -gid "$old_group_gid" -exec chgrp -h 992 {} + ||
                  return 1
              fi
            done
            sync
            verify_junca_system_identity || return 1
            system_identity_repaired=true
          }
          '''
          if foundation.count(old_ensure) != 1:
              raise SystemExit("FOUNDATION_ENSURE_IDENTITY_SIGNATURE_MISMATCH")
          foundation = foundation.replace(old_ensure, new_ensure, 1)

          old_containment = '''        if [[ "$containment_health_status" == "healthy" &&
              "$containment_validator_id" == "$expected_validator_id" ]]; then
          containment_recovered=true
          break
        fi
          '''
          new_containment = '''        if [[ "$containment_health_status" == "healthy" &&
              "$containment_validator_id" == "$expected_validator_id" ]]; then
          if systemctl start junca-public-rpc.service \
              junca-public-explorer.service >/dev/null 2>&1; then
            containment_recovered=true
          fi
          break
        fi
          '''
          if foundation.count(old_containment) != 1:
              raise SystemExit("FOUNDATION_CONTAINMENT_SIGNATURE_MISMATCH")
          foundation = foundation.replace(old_containment, new_containment, 1)
          foundation_path.write_text(foundation, encoding="utf-8")

          component = component_path.read_text(encoding="utf-8")
          old_component = '''            - getent group junca >/dev/null || groupadd --system junca
            - id -u junca >/dev/null 2>&1 || useradd --system --gid junca --home-dir /var/lib/junca --shell /sbin/nologin junca
          '''
          new_component = '''            - getent group junca >/dev/null || groupadd --system --gid 992 junca
            - test "$(getent group junca | cut -d: -f3)" = "992"
            - id -u junca >/dev/null 2>&1 || useradd --system --uid 992 --gid 992 --home-dir /var/lib/junca --shell /sbin/nologin --no-create-home junca
            - test "$(id -u junca)" = "992"
            - test "$(id -g junca)" = "992"
          '''
          if component.count(old_component) != 1:
              raise SystemExit("IMAGE_COMPONENT_IDENTITY_SIGNATURE_MISMATCH")
          component = component.replace(old_component, new_component, 1)
          validation_anchor = '''            - id -u junca
            - getent group junca
          '''
          validation_replacement = '''            - test "$(id -u junca)" = "992"
            - test "$(id -g junca)" = "992"
            - test "$(getent group junca | cut -d: -f3)" = "992"
          '''
          if component.count(validation_anchor) != 1:
              raise SystemExit("IMAGE_COMPONENT_VALIDATION_SIGNATURE_MISMATCH")
          component = component.replace(
              validation_anchor, validation_replacement, 1
          )
          component_path.write_text(component, encoding="utf-8")

          user_data = user_data_path.read_text(encoding="utf-8")
          old_user_data = '''getent group junca >/dev/null || groupadd --system junca
          id -u junca >/dev/null 2>&1 || \
            useradd --system --gid junca --home-dir /var/lib/junca --shell /sbin/nologin junca
          '''
          new_user_data = '''getent group junca >/dev/null || groupadd --system --gid 992 junca
          test "$(getent group junca | cut -d: -f3)" = "992"
          id -u junca >/dev/null 2>&1 || \
            useradd --system --uid 992 --gid 992 --home-dir /var/lib/junca \
              --shell /sbin/nologin --no-create-home junca
          test "$(id -u junca)" = "992"
          test "$(id -g junca)" = "992"
          '''
          if user_data.count(old_user_data) != 1:
              raise SystemExit("USER_DATA_IDENTITY_SIGNATURE_MISMATCH")
          user_data = user_data.replace(old_user_data, new_user_data, 1)
          user_data_path.write_text(user_data, encoding="utf-8")

          test_path.write_text('''from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[1]
          FOUNDATION = ROOT / "scripts/junca_public_testnet_foundation.sh"
          COMPONENT = ROOT / ".github/image-builder/validator-component.yml"
          USER_DATA = ROOT / "infra/aws/public-testnet/templates/validator-user-data.sh.tftpl"


          class DeterministicSystemIdentityTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.foundation = FOUNDATION.read_text(encoding="utf-8")
                  cls.component = COMPONENT.read_text(encoding="utf-8")
                  cls.user_data = USER_DATA.read_text(encoding="utf-8")

              def test_immutable_image_pins_uid_and_gid(self) -> None:
                  for value in (
                      "groupadd --system --gid 992 junca",
                      "useradd --system --uid 992 --gid 992",
                      'test "$(id -u junca)" = "992"',
                      'test "$(id -g junca)" = "992"',
                  ):
                      self.assertIn(value, self.component)
                  self.assertNotIn("groupadd --system junca", self.component)
                  self.assertNotIn("useradd --system --gid junca", self.component)

              def test_bootstrap_requires_deterministic_identity(self) -> None:
                  for value in (
                      "groupadd --system --gid 992 junca",
                      "useradd --system --uid 992 --gid 992",
                      'test "$(id -u junca)" = "992"',
                      'test "$(id -g junca)" = "992"',
                  ):
                      self.assertIn(value, self.user_data)

              def test_live_prefix_migrates_legacy_dynamic_identity(self) -> None:
                  for value in (
                      "groupmod --gid 992 junca",
                      "usermod --uid 992 --gid 992 --home /var/lib/junca",
                      'find "$path" -xdev -uid "$old_uid"',
                      'find "$path" -xdev -gid "$old_group_gid"',
                      "JUNCA_SYSTEM_UID_992_COLLISION",
                      "JUNCA_SYSTEM_GID_992_COLLISION",
                      "JUNCA_SYSTEM_IDENTITY_ACTIVE_PROCESS",
                      '[[ "$repair_status_admitted" == true ]]',
                  ):
                      self.assertIn(value, self.foundation)

              def test_containment_restores_public_gateways(self) -> None:
                  self.assertIn(
                      "systemctl start junca-public-rpc.service",
                      self.foundation,
                  )
                  self.assertIn(
                      "junca-public-explorer.service >/dev/null 2>&1",
                      self.foundation,
                  )


          if __name__ == "__main__":
              unittest.main()
          ''', encoding="utf-8")
          PY

      - name: Validate deterministic identity contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/junca_public_testnet_foundation.sh
          python -m unittest \
            tests.test_junca_deterministic_system_identity \
            tests.test_junca_hardened_immutable_release_workflow \
            -v

      - name: Commit non-workflow source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JSEC Runtime Identity Recovery Cell"
          git config user.email "juncajapan.inc@gmail.com"
          git add \
            scripts/junca_public_testnet_foundation.sh \
            .github/image-builder/validator-component.yml \
            infra/aws/public-testnet/templates/validator-user-data.sh.tftpl \
            tests/test_junca_deterministic_system_identity.py
          git commit -m "fix(runtime): pin and migrate validator system identity"
          git push origin HEAD:fix/jsec-deterministic-system-identity-20260808
