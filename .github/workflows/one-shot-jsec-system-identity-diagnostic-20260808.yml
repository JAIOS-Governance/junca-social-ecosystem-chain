name: One-shot JSEC System Identity Diagnostic 2026-08-08

on:
  push:
    branches:
      - diag/jsec-system-identity-20260808
    paths:
      - .github/workflows/one-shot-jsec-system-identity-diagnostic-20260808.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: one-shot-jsec-system-identity-diagnostic-20260808
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jsec-identity-diagnostic-${{ github.run_id }}

      - name: Read system identity and ownership from all validators
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          mapfile -t instance_ids < <(
            aws ec2 describe-instances \
              --filters \
                Name=instance-state-name,Values=running \
                Name=tag:Project,Values='JUNCA Social Ecosystem Chain' \
                Name=tag:Network,Values='Public Testnet' \
                Name=tag-key,Values=Validator \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text | tr '\t' '\n' | sort -u
          )
          test "${#instance_ids[@]}" = 3

          jq -n '{commands:[
            "set -u",
            "echo PASSWD_JUNCA=$(getent passwd junca 2>/dev/null || true)",
            "echo GROUP_JUNCA=$(getent group junca 2>/dev/null || true)",
            "echo PASSWD_UID_992=$(getent passwd 992 2>/dev/null || true)",
            "echo GROUP_GID_992=$(getent group 992 2>/dev/null || true)",
            "echo ID_JUNCA=$(id junca 2>/dev/null || true)",
            "for path in /etc/junca /etc/junca/genesis.json /etc/junca/validator.toml /etc/junca/runtime.env /var/lib/junca /var/lib/junca/state.sqlite /var/log/junca; do if [ -e \"$path\" ]; then stat -c \"PATH=%n UID=%u GID=%g USER=%U GROUP=%G MODE=%a TYPE=%F\" \"$path\"; else echo \"PATH=$path MISSING=true\"; fi; done",
            "systemctl show junca-validator.service -p User -p Group -p ActiveState -p SubState --no-pager || true"
          ]}' > evidence/command.json

          : > evidence/readback.jsonl
          for instance_id in "${instance_ids[@]}"; do
            command_id="$(
              aws ssm send-command \
                --instance-ids "$instance_id" \
                --document-name AWS-RunShellScript \
                --parameters file://evidence/command.json \
                --comment 'JSEC controlled system identity diagnostic' \
                --query Command.CommandId \
                --output text
            )"
            status=""
            for attempt in $(seq 1 60); do
              status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              > "evidence/${instance_id}.json"
            jq -c \
              --arg instance_id "$instance_id" \
              '{instance_id:$instance_id,status:.Status,response_code:.ResponseCode,stdout:.StandardOutputContent,stderr:.StandardErrorContent}' \
              "evidence/${instance_id}.json" >> evidence/readback.jsonl
          done

          jq -s '{schema_version:"jsec-system-identity-diagnostic/v1",validators:.,mainnet_changed:false,assets_moved:false,bridge_activated:false}' \
            evidence/readback.jsonl > evidence/system-identity-diagnostic.json
          jq -e '.validators|length==3 and all(.[];.status=="Success" and .response_code==0)' \
            evidence/system-identity-diagnostic.json >/dev/null
          cat evidence/system-identity-diagnostic.json

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: jsec-system-identity-diagnostic-${{ github.run_id }}
          path: evidence/system-identity-diagnostic.json
          if-no-files-found: error
          retention-days: 3
