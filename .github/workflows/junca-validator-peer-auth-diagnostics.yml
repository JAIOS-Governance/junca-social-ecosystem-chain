name: JUNCA Validator Peer Authentication Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-validator-peer-auth-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-validator-peer-auth-diagnostics
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: public-testnet
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-peer-auth-diagnostics-${{ github.run_id }}

      - name: Capture exact authentication diagnostics from all validators
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          aws ec2 describe-instances \
            --filters \
              "Name=instance-state-name,Values=running" \
              "Name=tag:Project,Values=JUNCA Social Ecosystem Chain" \
              "Name=tag:Network,Values=Public Testnet" \
              "Name=tag:Validator,Values=01,02,03" \
            > artifacts/ec2-instances.json
          jq -e '
            [.Reservations[].Instances[]|{
              instance_id:.InstanceId,
              validator:(.Tags[]|select(.Key=="Validator")|.Value),
              private_ip:.PrivateIpAddress
            }]|sort_by(.validator)|select(length==3 and map(.validator)==["01","02","03"])
          ' artifacts/ec2-instances.json > artifacts/validators.json
          cat > /tmp/peer-auth-diagnostic.sh <<'REMOTE'
          set -Eeuo pipefail
          value() {
            local key="$1"
            awk -F= -v key="$key" '$1==key {print substr($0,length(key)+2)}' /etc/junca/runtime.env | tail -n1
          }
          mkdir -p /tmp/junca-peer-auth
          curl -fsS http://127.0.0.1:8545/health > /tmp/junca-peer-auth/health.json
          {
            echo "validator_id=$(value VALIDATOR_ID)"
            echo "chain_id=$(value CHAIN_ID)"
            echo "p2p_port=$(value P2P_PORT)"
            echo "peer_endpoints=$(value VALIDATOR_PEER_ENDPOINTS)"
            echo "automatic_finality=$(value AUTOMATIC_FINALITY_ENABLED)"
            echo "block_interval=$(value TESTNET_BLOCK_INTERVAL_SECONDS)"
            echo "slot_epoch=$(value TESTNET_SLOT_EPOCH_SECONDS)"
            printf 'signer_resource_sha256='; value SIGNER_RESOURCE_ARN | sha256sum | awk '{print $1}'
            printf 'signer_bindings_sha256='; value VALIDATOR_SIGNER_BINDINGS | sha256sum | awk '{print $1}'
          } > /tmp/junca-peer-auth/runtime-summary.txt
          ss -lntp > /tmp/junca-peer-auth/listeners.txt
          ss -ntp > /tmp/junca-peer-auth/connections.txt
          systemctl show junca-validator.service \
            -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p EnvironmentFiles \
            > /tmp/junca-peer-auth/service-show.txt
          journalctl -u junca-validator.service \
            --since '20 minutes ago' --no-pager -o short-iso-precise \
            > /tmp/junca-peer-auth/validator-journal.txt
          grep -Eai 'peer|auth|handshake|reject|invalid|signature|signer|vote|slot|round|conflict|mismatch|genesis|chain|error|warn|fail' \
            /tmp/junca-peer-auth/validator-journal.txt \
            > /tmp/junca-peer-auth/validator-journal-filtered.txt || true
          tar -C /tmp -czf /tmp/junca-peer-auth.tgz junca-peer-auth
          base64 -w0 /tmp/junca-peer-auth.tgz
          echo
          echo JUNCA_PEER_AUTH_DIAGNOSTIC_COMPLETE
          REMOTE
          jq -Rs '{commands:[.]}' /tmp/peer-auth-diagnostic.sh > /tmp/peer-auth-diagnostic.json
          while IFS=$'\t' read -r validator instance; do
            command_id="$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name AWS-RunShellScript \
              --parameters file:///tmp/peer-auth-diagnostic.json \
              --comment "JUNCA validator-${validator} peer authentication diagnostic" \
              --query Command.CommandId --output text)"
            for attempt in $(seq 1 90); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              test "$attempt" -lt 90
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/invocation-${validator}-${instance}.json"
            jq -e '.Status=="Success" and (.ResponseCode//-1)==0' \
              "artifacts/invocation-${validator}-${instance}.json" >/dev/null
            jq -r '.StandardOutputContent' "artifacts/invocation-${validator}-${instance}.json" \
              | sed '/JUNCA_PEER_AUTH_DIAGNOSTIC_COMPLETE/d' \
              | tr -d '\n' | base64 -d > "artifacts/validator-${validator}.tgz"
            mkdir -p "artifacts/validator-${validator}"
            tar -xzf "artifacts/validator-${validator}.tgz" \
              -C "artifacts/validator-${validator}" --strip-components=1
          done < <(jq -r '.[]|[.validator,.instance_id]|@tsv' artifacts/validators.json)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-validator-peer-auth-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
