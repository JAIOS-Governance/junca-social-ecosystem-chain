name: JUNCA Runtime Release Evidence Collector
run-name: JSEC dispatch ${{ inputs.dispatch_token }}

on:
  workflow_dispatch:
    inputs:
      ami_run_id:
        description: Exact successful JUNCA Validator Immutable AMI Build run ID
        required: true
        type: string
      migration_run_id:
        description: Exact successful JUNCA Validator Durable State Migration run ID
        required: true
        type: string
      migration_evidence_sha256:
        description: SHA-256 of the exact accepted migration evidence JSON
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit bound to the immutable AMI
        required: true
        type: string
      dispatch_token:
        description: Unique canonical-parent dispatch correlation token
        required: true
        type: string
      orchestrator_run_id:
        description: Canonical immutable-candidate parent run ID
        required: true
        type: string
      orchestrator_run_attempt:
        description: Canonical immutable-candidate parent run attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: junca-runtime-release-evidence-collector-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 25
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      OBSERVER_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetObserver
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      AMI_RUN_ID: ${{ inputs.ami_run_id }}
      MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
      MIGRATION_EVIDENCE_SHA256: ${{ inputs.migration_evidence_sha256 }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Verify protected workflow execution ref
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}

      - name: Verify exact child run binding before AWS readback
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          ORCHESTRATOR_RUN_ATTEMPT: ${{ inputs.orchestrator_run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/junca_release_child_provenance.py \
            --source-commit "$SOURCE_COMMIT" \
            --dispatch-token "$DISPATCH_TOKEN" \
            --orchestrator-run-id "$ORCHESTRATOR_RUN_ID" \
            --orchestrator-run-attempt "$ORCHESTRATOR_RUN_ATTEMPT" \
            --workflow-path \
              ".github/workflows/junca-runtime-release-evidence-collector-v2.yml" \
            --input "ami_run_id=$AMI_RUN_ID" \
            --input "migration_run_id=$MIGRATION_RUN_ID" \
            --input "migration_evidence_sha256=$MIGRATION_EVIDENCE_SHA256" \
            --input "source_commit=$SOURCE_COMMIT"
          [[ "$AMI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MIGRATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MIGRATION_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"

          ami_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AMI_RUN_ID}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$SOURCE_COMMIT" \
            --arg execution_ref "main" '
              .status == "completed" and
              .conclusion == "success" and
              .name == "JUNCA Validator Immutable AMI Build" and
              .path == ".github/workflows/junca-validator-ami-build.yml" and
              .event == "workflow_dispatch" and
              .head_branch == $execution_ref and
              .head_sha == $head and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository
            ' <<<"$ami_run_json"

          migration_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MIGRATION_RUN_ID}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" '
              .status == "completed" and
              .conclusion == "success" and
              .name == "JUNCA Validator Durable State Migration" and
              .path == ".github/workflows/junca-validator-state-migration.yml" and
              .event == "push" and
              .head_branch == "main" and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository
            ' <<<"$migration_run_json"
          echo "MIGRATION_RUN_HEAD_SHA=$(jq -er .head_sha <<<"$migration_run_json")" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: junca-validator-ami-build-${{ env.AMI_RUN_ID }}
          path: evidence/ami
          github-token: ${{ github.token }}
          run-id: ${{ env.AMI_RUN_ID }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: junca-validator-state-migration-${{ env.MIGRATION_RUN_ID }}
          path: evidence/state-migration
          github-token: ${{ github.token }}
          run-id: ${{ env.MIGRATION_RUN_ID }}

      - name: Verify immutable AMI and migration artifacts
        run: |
          set -euo pipefail
          test "$(find evidence/ami -type f | wc -l)" = 2
          test -f evidence/ami/junca-validator-ami-build.json
          test -f evidence/ami/SHA256SUMS
          (cd evidence/ami && sha256sum -c SHA256SUMS)
          jq -e --arg source_commit "$SOURCE_COMMIT" '
            .schema_version == "junca-validator-ami-build/v2" and
            .state == "AMI_VERIFIED" and
            .network == "Public Testnet" and
            .notice == "Public Testnet / No Monetary Value" and
            .governance == "JAIOS Institutional Governance" and
            .source_commit == $source_commit and
            (.ami_id | test("^ami-[0-9a-f]{8,17}$")) and
            (.request_sha256 | test("^[0-9a-f]{64}$")) and
            .request_schema ==
              "junca-validator-ami-build-request/v2" and
            (.image_builder_arn |
              test("^arn:aws:imagebuilder:us-east-1:595710543956:image/")) and
            (.parent_ami_id | test("^ami-[0-9a-f]{8,17}$")) and
            .parent_ami_owner_id == "137112412989" and
            (.parent_ami_name |
              test("^al2023-ami-2023\\.[0-9]+\\.[0-9]{8}\\.[0-9]+-kernel-")) and
            (.component_source_sha256 |
              test("^[0-9a-f]{64}$")) and
            (.dependency_lock_sha256 |
              test("^[0-9a-f]{64}$")) and
            (.supply_chain_policy_sha256 |
              test("^[0-9a-f]{64}$")) and
            (.dnf_releasever |
              test("^2023\\.[0-9]+\\.[0-9]{8}$")) and
            (.python3_boto3_nevra |
              startswith("python3-boto3-")) and
            (.python3_botocore_nevra |
              startswith("python3-botocore-")) and
            (.reused_existing_ami | type == "boolean") and
            .terraform_state_changed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' evidence/ami/junca-validator-ami-build.json

          test -f evidence/state-migration/junca-validator-state-migration.json
          test -f evidence/state-migration/junca-validator-state-migration-binding.json
          test -f evidence/state-migration/SHA256SUMS
          (cd evidence/state-migration && sha256sum -c SHA256SUMS)
          printf '%s  %s\n' \
            "$MIGRATION_EVIDENCE_SHA256" \
            evidence/state-migration/junca-validator-state-migration.json \
            | sha256sum -c -
          jq -e \
            --arg run_id "$MIGRATION_RUN_ID" \
            --arg head "$MIGRATION_RUN_HEAD_SHA" '
              .schema_version == "junca-validator-state-migration/v1" and
              .state == "VERIFIED_PASS" and
              .network == "Public Testnet" and
              .migration_run_id == $run_id and
              .migration_run_head_sha == $head and
              (.migration_request_sha256 | test("^[0-9a-f]{64}$")) and
              (.instance_ids | length) == 3 and
              (.state_volume_ids | length) == 3 and
              (.rollback_snapshot_ids | length) == 3 and
              (.validator_mappings | length) == 3 and
              .serial_migration == true and
              .terraform_canonicalized == true and
              .runtime_mount_verified == true and
              .immutable_runtime_mount_activation_pending == true and
              .immutable_runtime_certificate_activation_pending == true and
              (.finalized_head.height >= 1) and
              (.finalized_head.hash | test("^0x[0-9a-f]{64}$")) and
              (.finalized_head.certificate_hash | test("^0x[0-9a-f]{64}$")) and
              .bootstrap_changed == false and
              .mainnet_changed == false and
              .assets_moved == false and
              .bridge_activated == false
            ' evidence/state-migration/junca-validator-state-migration.json
          migration_request_sha256="$(jq -er .migration_request_sha256 evidence/state-migration/junca-validator-state-migration.json)"
          echo "MIGRATION_REQUEST_SHA256=$migration_request_sha256" >> "$GITHUB_ENV"
          jq -e \
            --arg run_id "$MIGRATION_RUN_ID" \
            --arg head "$MIGRATION_RUN_HEAD_SHA" \
            --arg request "$migration_request_sha256" \
            --arg evidence "$MIGRATION_EVIDENCE_SHA256" '
              .schema_version == "junca-validator-state-migration-binding/v1" and
              .state == "MIGRATION_VERIFIED" and
              .network == "Public Testnet" and
              .notice == "Public Testnet / No Monetary Value" and
              .migration_run_id == $run_id and
              .migration_run_head_sha == $head and
              .migration_request_sha256 == $request and
              .migration_evidence_sha256 == $evidence and
              .bootstrap_changed == false and
              .mainnet_changed == false and
              .assets_moved == false and
              .bridge_activated == false
            ' evidence/state-migration/junca-validator-state-migration-binding.json

      - name: Attest exact live GitHub OIDC claims
        run: |
          set -euo pipefail
          python3 scripts/junca_oidc_claim_attestation.py \
            --workflow-path \
              ".github/workflows/junca-runtime-release-evidence-collector-v2.yml" \
            --role-arn "$OBSERVER_ROLE_ARN" \
            --output evidence/release/oidc-claim-attestation.json

      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.OBSERVER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-release-evidence-v2-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Read canonical Terraform outputs without state mutation
        run: |
          set -euo pipefail
          mkdir -p evidence/readback evidence/release
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          terraform -chdir=infra/aws/bootstrap init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/bootstrap.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"
          terraform -chdir=infra/aws/bootstrap output -json \
            > evidence/readback/bootstrap-outputs.json
          state_kms_key_arn="$(jq -er .state_kms_key_arn.value evidence/readback/bootstrap-outputs.json)"
          lock_table="$(jq -er .lock_table.value evidence/readback/bootstrap-outputs.json)"
          terraform -chdir=infra/aws/public-testnet init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$lock_table" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$state_kms_key_arn"
          terraform -chdir=infra/aws/public-testnet output -json \
            > evidence/readback/public-testnet-outputs.json

      - name: Read exact AWS runtime resources
        run: |
          set -euo pipefail
          candidate_ami="$(jq -er .ami_id evidence/ami/junca-validator-ami-build.json)"
          mapfile -t instances < <(jq -er '.validator_instance_ids.value[]' evidence/readback/public-testnet-outputs.json)
          mapfile -t volumes < <(jq -er '.validator_state_volume_readback.value[].volume_id' evidence/readback/public-testnet-outputs.json)
          test "${#instances[@]}" = 3
          test "${#volumes[@]}" = 3
          test "$(printf '%s\n' "${instances[@]}" | sort -u | wc -l)" = 3
          test "$(printf '%s\n' "${volumes[@]}" | sort -u | wc -l)" = 3
          aws ec2 describe-images --image-ids "$candidate_ami" > evidence/readback/images.json
          aws ec2 describe-instances --instance-ids "${instances[@]}" > evidence/readback/instances.json
          aws ec2 describe-volumes --volume-ids "${volumes[@]}" > evidence/readback/volumes.json
          mapfile -t snapshots < <(
            jq -er '
              .Volumes[] |
              [.Tags[] | select(.Key == "JuncaRollbackSnapshotId") | .Value] |
              if length == 1 then .[0] else error("missing exact rollback snapshot") end
            ' evidence/readback/volumes.json
          )
          test "${#snapshots[@]}" = 3
          test "$(printf '%s\n' "${snapshots[@]}" | sort -u | wc -l)" = 3
          aws ec2 describe-snapshots --snapshot-ids "${snapshots[@]}" > evidence/readback/snapshots.json

      - name: Verify read-only Public Testnet baseline
        run: |
          set -euo pipefail
          test "$(jq -er '.public_services_acceptance_readback.value.enabled' evidence/readback/public-testnet-outputs.json)" = true
          python scripts/junca_public_testnet_endpoint_test.py \
            > evidence/readback/endpoint-acceptance.json
          jq -e '
            .status == "PASS" and
            .scope == "Public Testnet Runtime Acceptance / Read-only" and
            .checks.health == "PASS" and
            .checks.explorer.result == "PASS" and
            .checks.safe_rpc.result == "PASS" and
            .checks.unsafe_rpc_rejection.result == "PASS"
          ' evidence/readback/endpoint-acceptance.json

          python scripts/junca_runtime_release_evidence_collector_drift.py \
            --candidate-ami evidence/ami/junca-validator-ami-build.json \
            --bootstrap-outputs evidence/readback/bootstrap-outputs.json \
            --public-testnet-outputs evidence/readback/public-testnet-outputs.json \
            --images evidence/readback/images.json \
            --instances evidence/readback/instances.json \
            --volumes evidence/readback/volumes.json \
            --snapshots evidence/readback/snapshots.json \
            --endpoint-acceptance evidence/readback/endpoint-acceptance.json \
            --migration-evidence evidence/state-migration/junca-validator-state-migration.json \
            --expected-migration-run-id "$MIGRATION_RUN_ID" \
            --expected-migration-head-sha "$MIGRATION_RUN_HEAD_SHA" \
            --expected-migration-request-sha256 "$MIGRATION_REQUEST_SHA256" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --output-dir evidence/release

          test "$(find evidence/release -type f | wc -l)" = 3
          test -f evidence/release/junca-runtime-pre-rollout-baseline.json
          test -f evidence/release/junca-public-explorer-pre-rollout-baseline.json
          test -f evidence/release/junca-validator-ebs-pre-rollout-baseline.json
          jq -e '
            .state == "PRE_ROLLOUT_BASELINE_VERIFIED" and
            .candidate_ami_preexisting == false and
            .observed_runtime_ami_state ==
              "EXACT_PRE_ROLLOUT_INVENTORY_NOT_CANDIDATE_ACCEPTANCE" and
            (.observed_validator_runtimes | length) == 3 and
            ([.observed_validator_runtimes[].instance_id] | unique | length) == 3 and
            ([.observed_validator_runtimes[].state] | unique) == ["running"] and
            .release_boundary.mainnet_changed == false and
            .release_boundary.assets_moved == false and
            .release_boundary.bridge_activated == false
          ' evidence/release/junca-runtime-pre-rollout-baseline.json

      - name: Preserve failed readback diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junca-runtime-readback-failure-v2-${{ github.run_id }}
          path: |
            evidence/ami/
            evidence/state-migration/
            evidence/readback/
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junca-runtime-release-evidence-${{ github.run_id }}
          path: evidence/release/
          if-no-files-found: error
          retention-days: 90
