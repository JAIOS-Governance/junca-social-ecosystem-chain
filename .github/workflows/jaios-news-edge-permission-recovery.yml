name: JAIOS News Edge Permission Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/jaios-news-edge-permission-recovery.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/jaios-news-edge-permission-recovery.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: jaios-news-edge-permission-recovery-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      TARGET_ROLE_NAME: JuncaChainDocsProductionDeployment
      TARGET_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      TARGET_POLICY_NAME: JAIOSRootNewsEdgeControl
      TARGET_DISTRIBUTION_ID: E2WIXG3DWW8OX1
      TARGET_DISTRIBUTION_ARN: arn:aws:cloudfront::595710543956:distribution/E2WIXG3DWW8OX1
      TARGET_FUNCTION_NAME: jaios-root-news-router
      TARGET_FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/jaios-root-news-router
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire exact GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json" > /tmp/oidc-token
          test -s /tmp/oidc-token

      - name: Assume approved IAM bootstrap identity
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for role in \
            arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment \
            arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
          do
            if aws sts assume-role-with-web-identity \
              --role-arn "$role" \
              --role-session-name "jaios-news-edge-permission-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/oidc-token)" \
              --duration-seconds 900 > /tmp/assume.json 2>/tmp/assume.err; then
              selected="$role"
              break
            fi
          done
          test -n "$selected"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume.json)" >> "$GITHUB_ENV"

      - name: Verify bootstrap account
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Create safe unattached CloudFront function when absent
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/function.js <<'JS'
          function handler(event) {
            return event.request;
          }
          JS
          cat > /tmp/function-config.json <<'JSON'
          {"Comment":"Safe unattached placeholder for the governed JAIOS root News router","Runtime":"cloudfront-js-2.0"}
          JSON
          if aws cloudfront describe-function --name "$TARGET_FUNCTION_NAME" --stage DEVELOPMENT >/tmp/function-existing.json 2>/tmp/function-existing.err; then
            echo "Function already exists; preserving its current code for the deployment workflow."
          else
            aws cloudfront create-function \
              --name "$TARGET_FUNCTION_NAME" \
              --function-config file:///tmp/function-config.json \
              --function-code fileb:///tmp/function.js \
              >/tmp/function-create.json
          fi
          function_arn="$(aws cloudfront describe-function --name "$TARGET_FUNCTION_NAME" --stage DEVELOPMENT \
            --query FunctionSummary.FunctionMetadata.FunctionARN --output text)"
          test "$function_arn" = "$TARGET_FUNCTION_ARN"

      - name: Grant exact distribution and function operating permissions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/policy.json <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "JAIOSRootDistributionReadWrite",
                "Effect": "Allow",
                "Action": [
                  "cloudfront:GetDistribution",
                  "cloudfront:GetDistributionConfig",
                  "cloudfront:UpdateDistribution",
                  "cloudfront:CreateInvalidation",
                  "cloudfront:GetInvalidation"
                ],
                "Resource": "$TARGET_DISTRIBUTION_ARN"
              },
              {
                "Sid": "JAIOSRootNewsFunctionLifecycle",
                "Effect": "Allow",
                "Action": [
                  "cloudfront:DescribeFunction",
                  "cloudfront:GetFunction",
                  "cloudfront:UpdateFunction",
                  "cloudfront:TestFunction",
                  "cloudfront:PublishFunction"
                ],
                "Resource": "$TARGET_FUNCTION_ARN"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" \
            --policy-document file:///tmp/policy.json
          aws iam get-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" \
            > /tmp/policy-readback.json
          jq -e \
            --arg distribution "$TARGET_DISTRIBUTION_ARN" \
            --arg function "$TARGET_FUNCTION_ARN" '
              .PolicyDocument.Version == "2012-10-17" and
              (.PolicyDocument.Statement | length) == 2 and
              (.PolicyDocument.Statement[0].Resource == $distribution) and
              (.PolicyDocument.Statement[1].Resource == $function) and
              ((.PolicyDocument.Statement | tostring) | contains("cloudfront:CreateFunction") | not) and
              ((.PolicyDocument.Statement | tostring) | contains("cloudfront:DeleteDistribution") | not) and
              ((.PolicyDocument.Statement | tostring) | contains("cloudfront:DeleteFunction") | not)
            ' /tmp/policy-readback.json

      - name: Verify exact target resources through bootstrap readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws cloudfront get-distribution --id "$TARGET_DISTRIBUTION_ID" \
            --query Distribution.ARN --output text)" = "$TARGET_DISTRIBUTION_ARN"
          test "$(aws cloudfront describe-function --name "$TARGET_FUNCTION_NAME" --stage DEVELOPMENT \
            --query FunctionSummary.FunctionMetadata.FunctionARN --output text)" = "$TARGET_FUNCTION_ARN"

      - name: Verify the deployment role can read exact distribution config
        shell: bash
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")"
          aws sts assume-role-with-web-identity \
            --role-arn "$TARGET_ROLE_ARN" \
            --role-session-name "jaios-news-edge-target-verify-${GITHUB_RUN_ID}" \
            --web-identity-token "$token" \
            --duration-seconds 900 > /tmp/target-assume.json
          export AWS_ACCESS_KEY_ID="$(jq -r '.Credentials.AccessKeyId' /tmp/target-assume.json)"
          export AWS_SECRET_ACCESS_KEY="$(jq -r '.Credentials.SecretAccessKey' /tmp/target-assume.json)"
          export AWS_SESSION_TOKEN="$(jq -r '.Credentials.SessionToken' /tmp/target-assume.json)"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws cloudfront get-distribution-config --id "$TARGET_DISTRIBUTION_ID" \
            --query DistributionConfig.Aliases.Items[0] --output text)" = "jaios-governance.org"
          test "$(aws cloudfront describe-function --name "$TARGET_FUNCTION_NAME" --stage DEVELOPMENT \
            --query FunctionSummary.FunctionMetadata.FunctionARN --output text)" = "$TARGET_FUNCTION_ARN"

      - name: Persist immutable recovery evidence
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SELECTED_BOOTSTRAP_ROLE: ${{ steps.bootstrap.outputs.selected }}
        run: |
          set -euo pipefail
          mkdir -p evidence/production
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_commit "$GITHUB_SHA" \
            --arg account_id "$AWS_ACCOUNT_ID" \
            --arg selected_bootstrap_role "$SELECTED_BOOTSTRAP_ROLE" \
            --arg target_role_arn "$TARGET_ROLE_ARN" \
            --arg policy_name "$TARGET_POLICY_NAME" \
            --arg distribution_arn "$TARGET_DISTRIBUTION_ARN" \
            --arg function_arn "$TARGET_FUNCTION_ARN" \
            '{
              schema: "jaios-news-edge-permission-recovery/v1",
              run_id: $run_id,
              source_commit: $source_commit,
              account_id: $account_id,
              selected_bootstrap_role: $selected_bootstrap_role,
              target_role_arn: $target_role_arn,
              policy_name: $policy_name,
              distribution_arn: $distribution_arn,
              function_arn: $function_arn,
              target_role_runtime_readback: "PASS",
              create_function_granted_to_target_role: false,
              delete_distribution_granted: false,
              delete_function_granted: false,
              exact_policy_readback: "PASS",
              result: "RECOVERED"
            }' > evidence/production/jaios-news-edge-permission-recovery-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/production/jaios-news-edge-permission-recovery-latest.json
          git diff --cached --quiet || git commit -m "Record JAIOS News edge permission recovery ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
