name: JAIOS News Edge Permission Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/jaios-news-edge-permission-recovery.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/jaios-news-edge-permission-recovery.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: jaios-news-edge-permission-recovery-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "595710543956"
  TARGET_ROLE_NAME: JuncaChainDocsProductionDeployment
  TARGET_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
  TARGET_POLICY_NAME: JAIOSRootNewsDistributionControl
  TARGET_DISTRIBUTION_ID: E2WIXG3DWW8OX1
  TARGET_DISTRIBUTION_ARN: arn:aws:cloudfront::595710543956:distribution/E2WIXG3DWW8OX1

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    outputs:
      selected_bootstrap_role: ${{ steps.bootstrap.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire exact GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json" > /tmp/oidc-token
          test -s /tmp/oidc-token

      - name: Assume approved IAM bootstrap identity
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for role in \
            arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment \
            arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
          do
            if aws sts assume-role-with-web-identity \
              --role-arn "$role" \
              --role-session-name "jaios-news-edge-inventory-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/oidc-token)" \
              --duration-seconds 900 > /tmp/assume.json 2>/tmp/assume.err; then
              selected="$role"
              break
            fi
          done
          test -n "$selected"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume.json)" >> "$GITHUB_ENV"

      - name: Verify bootstrap account and root distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution-config --id "$TARGET_DISTRIBUTION_ID" > /tmp/distribution.json
          test "$(jq -r '.DistributionConfig.Aliases.Items[] | select(. == "jaios-governance.org")' /tmp/distribution.json)" = "jaios-governance.org"

      - name: Grant exact root distribution and read-only function inventory
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/policy.json <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "JAIOSRootDistributionReadWrite",
                "Effect": "Allow",
                "Action": [
                  "cloudfront:GetDistribution",
                  "cloudfront:GetDistributionConfig",
                  "cloudfront:UpdateDistribution",
                  "cloudfront:CreateInvalidation",
                  "cloudfront:GetInvalidation"
                ],
                "Resource": "$TARGET_DISTRIBUTION_ARN"
              },
              {
                "Sid": "CloudFrontFunctionInventoryReadOnly",
                "Effect": "Allow",
                "Action": "cloudfront:ListFunctions",
                "Resource": "*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" \
            --policy-document file:///tmp/policy.json
          aws iam get-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" \
            > /tmp/policy-readback.json
          jq -e \
            --arg distribution "$TARGET_DISTRIBUTION_ARN" '
              .PolicyDocument.Version == "2012-10-17" and
              (.PolicyDocument.Statement | length) == 2 and
              (.PolicyDocument.Statement[0].Resource == $distribution) and
              (.PolicyDocument.Statement[1].Action == "cloudfront:ListFunctions") and
              (.PolicyDocument.Statement[1].Resource == "*") and
              ((.PolicyDocument.Statement | tostring) | contains("cloudfront:CreateFunction") | not) and
              ((.PolicyDocument.Statement | tostring) | contains("cloudfront:DeleteDistribution") | not)
            ' /tmp/policy-readback.json

  verify-target-role:
    needs: recover
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure exact deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-news-edge-target-verify-${{ github.run_id }}
          disable-retry: true

      - name: Verify target role and inventory existing functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution-config --id "$TARGET_DISTRIBUTION_ID" > /tmp/distribution.json
          test "$(jq -r '.DistributionConfig.Aliases.Items[] | select(. == "jaios-governance.org")' /tmp/distribution.json)" = "jaios-governance.org"
          test "$(aws cloudfront get-distribution --id "$TARGET_DISTRIBUTION_ID" --query Distribution.ARN --output text)" = "$TARGET_DISTRIBUTION_ARN"
          aws cloudfront list-functions --stage DEVELOPMENT --max-items 100 > /tmp/functions-development.json
          aws cloudfront list-functions --stage LIVE --max-items 100 > /tmp/functions-live.json
          echo 'JAIOS_TARGET_ROLE_FUNCTION_INVENTORY_BEGIN'
          jq '{development:[.FunctionList.Items[]? | {name:.Name,arn:.FunctionMetadata.FunctionARN,status:.Status,comment:.FunctionConfig.Comment}]}' /tmp/functions-development.json
          jq '{live:[.FunctionList.Items[]? | {name:.Name,arn:.FunctionMetadata.FunctionARN,status:.Status,comment:.FunctionConfig.Comment}]}' /tmp/functions-live.json
          jq '{default_function_associations:(.DistributionConfig.DefaultCacheBehavior.FunctionAssociations // {Quantity:0,Items:[]}),default_lambda_associations:(.DistributionConfig.DefaultCacheBehavior.LambdaFunctionAssociations // {Quantity:0,Items:[]}),cache_behaviors:[.DistributionConfig.CacheBehaviors.Items[]? | {path:.PathPattern,origin:.TargetOriginId,functions:(.FunctionAssociations // {Quantity:0,Items:[]}),lambdas:(.LambdaFunctionAssociations // {Quantity:0,Items:[]})}]}' /tmp/distribution.json
          echo 'JAIOS_TARGET_ROLE_FUNCTION_INVENTORY_END'

      - name: Persist immutable distribution recovery evidence
        if: github.event_name != 'pull_request'
        env:
          SELECTED_BOOTSTRAP_ROLE: ${{ needs.recover.outputs.selected_bootstrap_role }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/production
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_commit "$GITHUB_SHA" \
            --arg account_id "$AWS_ACCOUNT_ID" \
            --arg selected_bootstrap_role "$SELECTED_BOOTSTRAP_ROLE" \
            --arg target_role_arn "$TARGET_ROLE_ARN" \
            --arg policy_name "$TARGET_POLICY_NAME" \
            --arg distribution_arn "$TARGET_DISTRIBUTION_ARN" \
            --argjson development_functions "$(jq '.FunctionList.Items // []' /tmp/functions-development.json)" \
            --argjson live_functions "$(jq '.FunctionList.Items // []' /tmp/functions-live.json)" \
            '{
              schema: "jaios-news-distribution-permission-recovery/v2",
              run_id: $run_id,
              source_commit: $source_commit,
              account_id: $account_id,
              selected_bootstrap_role: $selected_bootstrap_role,
              target_role_arn: $target_role_arn,
              policy_name: $policy_name,
              distribution_arn: $distribution_arn,
              development_functions: $development_functions,
              live_functions: $live_functions,
              target_role_runtime_readback: "PASS",
              list_functions_readback: "PASS",
              create_function_granted: false,
              delete_distribution_granted: false,
              result: "RECOVERED"
            }' > evidence/production/jaios-news-distribution-permission-recovery-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/production/jaios-news-distribution-permission-recovery-latest.json
          git diff --cached --quiet || git commit -m "Record JAIOS News distribution permission recovery ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
