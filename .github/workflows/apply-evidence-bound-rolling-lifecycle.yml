name: Apply Evidence-bound Rolling Lifecycle

on:
  pull_request:
    paths:
      - ".github/patches/apply_evidence_bound_rolling_lifecycle.py"
      - ".github/patches/fix_evidence_bound_lifecycle_ci.py"
      - ".github/workflows/apply-evidence-bound-rolling-lifecycle.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout controller source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/evidence-bound-rolling-lifecycle
          path: target
          fetch-depth: 0

      - name: Repair exact lifecycle CI contracts
        run: |
          set -euo pipefail
          python controller/.github/patches/fix_evidence_bound_lifecycle_ci.py \
            target/scripts/junca_public_testnet_foundation.sh \
            target/tests/test_junca_social_ecosystem_chain_aws_foundation.py
          bash -n target/scripts/junca_public_testnet_foundation.sh
          python -m py_compile \
            target/scripts/junca_live_rollout_prefix_gate.py \
            target/tests/test_junca_live_rollout_prefix_gate.py \
            target/tests/test_junca_social_ecosystem_chain_aws_foundation.py
          git -C target diff --check
          test "$(grep -c 'python scripts/junca_live_rollout_prefix_gate.py' \
            target/scripts/junca_public_testnet_foundation.sh)" = 2
          test "$(grep -c -- '--mode rolling' \
            target/scripts/junca_public_testnet_foundation.sh)" = 1
          test "$(grep -c 'evidence-bound-rollout-baseline.json' \
            target/scripts/junca_public_testnet_foundation.sh)" -ge 2

      - name: Commit target branch repair
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/junca_public_testnet_foundation.sh \
            tests/test_junca_social_ecosystem_chain_aws_foundation.py
          git commit -m "Fix evidence-bound rolling lifecycle CI contracts"
          git push origin HEAD:fix/evidence-bound-rolling-lifecycle
