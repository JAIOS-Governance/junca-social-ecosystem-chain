name: One-shot Foundation Identity Source Repair 2026-08-08

on:
  push:
    branches:
      - fix/public-testnet-rejected-notification-and-identity-repair-20260808
    paths:
      - .github/workflows/one-shot-foundation-identity-source-repair-20260808.yml

permissions:
  contents: write

concurrency:
  group: one-shot-foundation-identity-source-repair-20260808
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/public-testnet-rejected-notification-and-identity-repair-20260808
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Patch controlled system-identity admission
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/junca_public_testnet_foundation.sh")
          content = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''(?m)^if \[\[ "\$runtime_config_access_verified" != true \]\]; then\n'''
              r'''  admit_controlled_active_repair \|\| true\n'''
              r'''fi\n'''
              r'''verify_junca_system_identity \|\| true\n'''
              r'''if \[\[ "\$repair_status_admitted" == true &&\n'''
              r'''      "\$system_identity_verified" != true \]\]; then\n'''
              r'''  ensure_junca_system_identity \|\| true\n'''
              r'''fi\n'''
          )
          replacement = '''verify_junca_system_identity || true
          if [[ "$repair_status_admitted" != true &&
                ( "$runtime_config_access_verified" != true ||
                  "$system_identity_verified" != true ) ]]; then
            admit_controlled_active_repair || true
          fi
          if [[ "$repair_status_admitted" == true &&
                "$system_identity_verified" != true ]]; then
            ensure_junca_system_identity || true
          fi
          '''
          content, changes = pattern.subn(replacement, content, count=1)
          if changes != 1:
              raise SystemExit(
                  f"FOUNDATION_IDENTITY_ADMISSION_SIGNATURE_MISMATCH count={changes}"
              )
          path.write_text(content, encoding="utf-8")
          PY

      - name: Validate repaired release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/junca_public_testnet_foundation.sh
          python -m unittest \
            tests.test_junca_foundation_controlled_identity_repair \
            tests.test_junca_hardened_immutable_release_workflow \
            -v

      - name: Commit non-workflow source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JSEC Release Reliability Cell"
          git config user.email "juncajapan.inc@gmail.com"
          git add scripts/junca_public_testnet_foundation.sh
          git commit -m "fix(foundation): admit controlled repair when system identity is missing"
          git push origin HEAD:fix/public-testnet-rejected-notification-and-identity-repair-20260808
