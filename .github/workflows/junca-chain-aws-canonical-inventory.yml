name: JUNCA Chain AWS Canonical Inventory

on:
  pull_request:
    paths:
      - ".github/workflows/junca-chain-aws-canonical-inventory.yml"
      - "scripts/junca_aws_canonical_inventory.py"
      - "tests/test_junca_social_ecosystem_chain_aws_canonical_inventory.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-chain-aws-canonical-inventory.yml"
      - "scripts/junca_aws_canonical_inventory.py"
      - "tests/test_junca_social_ecosystem_chain_aws_canonical_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junca-chain-repository-oidc-subject
  cancel-in-progress: false

jobs:
  set-default-oidc-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set standard GitHub OIDC subject for bootstrap role
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint" \
            --data '{"use_default":true}'
          state="$(curl --silent --show-error --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint")"
          STATE="$state" python3 -c 'import json,os; s=json.loads(os.environ["STATE"]); assert s.get("use_default") is True, s'

  canonical-inventory:
    needs: set-default-oidc-subject
    runs-on: ubuntu-latest
    environment: public-testnet
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate readback controller
        run: |
          python -m py_compile scripts/junca_aws_canonical_inventory.py
          python -m unittest tests.test_junca_social_ecosystem_chain_aws_canonical_inventory -v
      - name: Configure canonical AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-canonical-inventory-${{ github.run_id }}
      - name: Read canonical non-secret AWS inventory
        run: |
          python scripts/junca_aws_canonical_inventory.py \
            --region "$AWS_REGION" \
            --output artifacts/junca-aws-canonical-inventory.json
          test "$(jq -r .account_id artifacts/junca-aws-canonical-inventory.json)" = "595710543956"
          test "$(jq -r .deployment_performed artifacts/junca-aws-canonical-inventory.json)" = "false"
          test "$(jq -r .mainnet_changed artifacts/junca-aws-canonical-inventory.json)" = "false"
          test "$(jq -r .assets_moved artifacts/junca-aws-canonical-inventory.json)" = "false"
          test "$(jq -r .bridge_activated artifacts/junca-aws-canonical-inventory.json)" = "false"
      - uses: actions/upload-artifact@v4
        with:
          name: junca-aws-canonical-inventory-${{ github.run_id }}
          path: artifacts/junca-aws-canonical-inventory.json
          if-no-files-found: error
          retention-days: 90

  restore-canonical-oidc-subject:
    if: always()
    needs: [set-default-oidc-subject, canonical-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore canonical GitHub OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint" \
            --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
          state="$(curl --silent --show-error --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint")"
          STATE="$state" python3 -c 'import json,os; s=json.loads(os.environ["STATE"]); assert s.get("use_default") is False and s.get("include_claim_keys")==["repo","context"] and s.get("use_immutable_subject") is False, s'
