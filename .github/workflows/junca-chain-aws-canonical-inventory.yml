name: JUNCA Chain AWS Canonical Inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-chain-aws-canonical-inventory
  cancel-in-progress: false

jobs:
  canonical-inventory:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      REQUIRED_SUBJECT: repo:JAIOS-Governance@308604370/junca-social-ecosystem-chain@1310568313:environment:public-testnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate readback controller and handoff
        run: |
          python -m py_compile scripts/junca_aws_canonical_inventory.py
          python -m unittest tests.test_junca_social_ecosystem_chain_aws_canonical_inventory -v
          python -m json.tool infrastructure/aws/public-testnet-oidc-trust-handoff.json >/dev/null

      - name: Capture redacted OIDC claims
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          response="$(curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          token="$(RESPONSE="$response" python3 -c 'import json,os; print(json.loads(os.environ["RESPONSE"])["value"])')"
          printf '%s' "$token" > /tmp/junca-oidc-token
          chmod 600 /tmp/junca-oidc-token
          TOKEN="$token" REQUIRED_SUBJECT="$REQUIRED_SUBJECT" python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          segment = os.environ["TOKEN"].split(".")[1]
          segment += "=" * (-len(segment) % 4)
          claims = json.loads(base64.urlsafe_b64decode(segment))
          allowed = (
              "aud", "sub", "repository", "repository_id",
              "repository_owner_id", "environment",
          )
          evidence = {key: claims.get(key) for key in allowed}
          evidence.update({
              "expected_subject": os.environ["REQUIRED_SUBJECT"],
              "subject_match": claims.get("sub") == os.environ["REQUIRED_SUBJECT"],
              "token_included": False,
              "mainnet_changed": False,
              "assets_moved": False,
              "bridge_activated": False,
              "deployment_performed": False,
          })
          Path("artifacts/junca-github-oidc-redacted.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if not evidence["subject_match"]:
              raise SystemExit("OIDC subject differs from the verified immutable subject")
          PY

      - name: Assume an approved Public Testnet role
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/junca-oidc-token)"
          roles=(
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment"
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/JuncaChainPublicTestnetDeployment"
          )
          selected=""
          : > artifacts/junca-aws-sts-redacted.log
          for role in "${roles[@]}"; do
            if aws sts assume-role-with-web-identity \
              --role-arn "$role" \
              --role-session-name "junca-inventory-${GITHUB_RUN_ID}" \
              --web-identity-token "$token" \
              --duration-seconds 900 \
              --output json > /tmp/junca-aws-credentials.json \
              2> /tmp/junca-aws-assume-error.log; then
              selected="$role"
              break
            fi
            printf 'role=%s result=REJECTED error=%s\n' \
              "$role" \
              "$(tr '\n' ' ' < /tmp/junca-aws-assume-error.log | sed 's/[[:space:]]\+/ /g')" \
              >> artifacts/junca-aws-sts-redacted.log
          done
          rm -f /tmp/junca-oidc-token /tmp/junca-aws-assume-error.log
          if [ -z "$selected" ]; then
            echo "No approved Public Testnet role accepted the verified GitHub OIDC token."
            exit 1
          fi
          printf 'role=%s result=ACCEPTED\n' "$selected" >> artifacts/junca-aws-sts-redacted.log
          SELECTED_ROLE="$selected" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          credentials = json.loads(
              Path("/tmp/junca-aws-credentials.json").read_text(encoding="utf-8")
          )["Credentials"]
          values = {
              "AWS_ACCESS_KEY_ID": credentials["AccessKeyId"],
              "AWS_SECRET_ACCESS_KEY": credentials["SecretAccessKey"],
              "AWS_SESSION_TOKEN": credentials["SessionToken"],
              "AWS_DEFAULT_REGION": os.environ["AWS_REGION"],
              "JUNCA_SELECTED_AWS_ROLE_ARN": os.environ["SELECTED_ROLE"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          for key in ("AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"):
              print(f"::add-mask::{values[key]}")
          PY
          rm -f /tmp/junca-aws-credentials.json

      - name: Read canonical non-secret AWS inventory
        run: |
          python scripts/junca_aws_canonical_inventory.py \
            --region "$AWS_REGION" \
            --output artifacts/junca-aws-canonical-inventory.json
          test "$(jq -r .account_id artifacts/junca-aws-canonical-inventory.json)" = "$AWS_ACCOUNT_ID"
          test "$(jq -r .region artifacts/junca-aws-canonical-inventory.json)" = "$AWS_REGION"
          test "$(jq -r .deployment_performed artifacts/junca-aws-canonical-inventory.json)" = "false"
          test "$(jq -r .mainnet_changed artifacts/junca-aws-canonical-inventory.json)" = "false"
          test "$(jq -r .assets_moved artifacts/junca-aws-canonical-inventory.json)" = "false"
          test "$(jq -r .bridge_activated artifacts/junca-aws-canonical-inventory.json)" = "false"

      - name: Record evidence digests
        if: always()
        run: |
          cp infrastructure/aws/public-testnet-oidc-trust-handoff.json artifacts/
          sha256sum artifacts/* > artifacts/SHA256SUMS

      - name: Upload redacted recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junca-aws-canonical-inventory-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
