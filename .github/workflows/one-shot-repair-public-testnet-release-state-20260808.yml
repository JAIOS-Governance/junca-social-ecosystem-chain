name: One-shot Public Testnet Release-State Repair 2026-08-08

on:
  push:
    branches:
      - fix/public-testnet-rejected-notification-and-identity-repair-20260808
    paths:
      - .github/workflows/one-shot-repair-public-testnet-release-state-20260808.yml

permissions:
  contents: write

concurrency:
  group: one-shot-public-testnet-release-state-repair-20260808
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/public-testnet-rejected-notification-and-identity-repair-20260808
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Repair controlled identity admission and notification governance
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          foundation_path = Path("scripts/junca_public_testnet_foundation.sh")
          observer_path = Path(".github/workflows/junca-public-testnet-release-observer.yml")
          observer_test_path = Path("tests/test_junca_hardened_immutable_release_workflow.py")
          identity_test_path = Path("tests/test_junca_foundation_controlled_identity_repair.py")

          foundation = foundation_path.read_text(encoding="utf-8")
          foundation_pattern = re.compile(
              r'''(?m)^if \[\[ "\$runtime_config_access_verified" != true \]\]; then\n'''
              r'''  admit_controlled_active_repair \|\| true\n'''
              r'''fi\n'''
              r'''verify_junca_system_identity \|\| true\n'''
              r'''if \[\[ "\$repair_status_admitted" == true &&\n'''
              r'''      "\$system_identity_verified" != true \]\]; then\n'''
              r'''  ensure_junca_system_identity \|\| true\n'''
              r'''fi\n'''
          )
          foundation_replacement = '''verify_junca_system_identity || true
          if [[ "$repair_status_admitted" != true &&
                ( "$runtime_config_access_verified" != true ||
                  "$system_identity_verified" != true ) ]]; then
            admit_controlled_active_repair || true
          fi
          if [[ "$repair_status_admitted" == true &&
                "$system_identity_verified" != true ]]; then
            ensure_junca_system_identity || true
          fi
          '''
          foundation, foundation_changes = foundation_pattern.subn(
              foundation_replacement, foundation, count=1
          )
          if foundation_changes != 1:
              raise SystemExit(
                  f"FOUNDATION_IDENTITY_ADMISSION_SIGNATURE_MISMATCH count={foundation_changes}"
              )
          foundation_path.write_text(foundation, encoding="utf-8")

          observer = observer_path.read_text(encoding="utf-8")
          function_start_marker = "          publish_with_retry() {"
          function_end_marker = "\n\n          publish_failures=0"
          function_start = observer.find(function_start_marker)
          function_end = observer.find(function_end_marker, function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("OBSERVER_PUBLISH_FUNCTION_BOUNDARY_MISSING")
          new_publish_function = '''          publish_with_retry() {
            local method="$1"
            local endpoint="$2"
            local payload="${3:-$body}"
            local attempt
            for attempt in 1 2 3; do
              if gh api --method "$method" "$endpoint" -f body="$payload" >/dev/null 2>&1; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }'''
          observer = (
              observer[:function_start]
              + new_publish_function
              + observer[function_end:]
          )

          incident_start_marker = '          if [ "$result" != "VERIFIED" ]; then'
          incident_end_marker = "\n\n          # Reporting degradation"
          incident_start = observer.find(incident_start_marker)
          incident_end = observer.find(incident_end_marker, incident_start)
          if incident_start < 0 or incident_end < 0:
              raise SystemExit("OBSERVER_INCIDENT_BLOCK_BOUNDARY_MISSING")
          new_incident_block = '''          incident_notification=false
          if [ "$source_binding" = "EXACT_CURRENT_MAIN" ]; then
            case "${result}:${phase}" in
              REJECTED:IMMUTABLE_RELEASE_CHAIN|\
              TIMED_OUT:IMMUTABLE_RELEASE_CHAIN|\
              ACTION_REQUIRED:IMMUTABLE_RELEASE_CHAIN|\
              REJECTED:IMMUTABLE_RELEASE_CHAIN_V2|\
              TIMED_OUT:IMMUTABLE_RELEASE_CHAIN_V2|\
              ACTION_REQUIRED:IMMUTABLE_RELEASE_CHAIN_V2|\
              REJECTED:FINALITY_CONTINUITY_READBACK|\
              TIMED_OUT:FINALITY_CONTINUITY_READBACK|\
              ACTION_REQUIRED:FINALITY_CONTINUITY_READBACK)
                incident_notification=true
                ;;
            esac
          fi

          incident_comment_emitted=false
          incident_duplicate=false
          if [ "$incident_notification" = true ]; then
            incident_marker="<!-- junca-release-observer:${OBSERVED_RUN_ID}:${live_attempt}:${result} -->"
            incident_body="${incident_marker}"$'\\n'"${body}"
            existing_comments="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/266/comments?per_page=100" \
                --jq '.[].body' 2>/dev/null || true
            )"
            if grep -Fq "$incident_marker" <<<"$existing_comments"; then
              incident_duplicate=true
            elif publish_with_retry POST \
              "repos/${GITHUB_REPOSITORY}/issues/266/comments" \
              "$incident_body"; then
              incident_comment_emitted=true
            else
              publish_failures=$((publish_failures + 1))
              echo "::warning title=Incident publication deferred::Issue 266 comment failed after bounded retries."
            fi
          fi

          {
            echo "## Final release observer readback"
            echo "- Workflow: ${OBSERVED_NAME}"
            echo "- Run: ${OBSERVED_RUN_URL}"
            echo "- Result: ${result}"
            echo "- Source binding: ${source_binding}"
            echo "- Current-state issue updated: $([ "$source_binding" = "EXACT_CURRENT_MAIN" ] && echo attempted || echo not-applicable)"
            echo "- Incident notification eligible: ${incident_notification}"
            echo "- Incident comment emitted: ${incident_comment_emitted}"
            echo "- Duplicate incident suppressed: ${incident_duplicate}"
            echo "- Incident issue: 266 only"
            echo "- Publication failures: ${publish_failures}"
          } >> "$GITHUB_STEP_SUMMARY"'''
          observer = (
              observer[:incident_start]
              + new_incident_block
              + observer[incident_end:]
          )
          observer_path.write_text(observer, encoding="utf-8")

          observer_test = observer_test_path.read_text(encoding="utf-8")
          required_line = "            'for issue in 266 $related_issues; do',\n"
          if observer_test.count(required_line) != 1:
              raise SystemExit("OBSERVER_TEST_FANOUT_EXPECTATION_MISSING")
          observer_test = observer_test.replace(required_line, "", 1)

          old_comment_line = '            "issues/${issue}/comments",\n'
          new_comment_lines = '''            'incident_marker="<!-- junca-release-observer:${OBSERVED_RUN_ID}:${live_attempt}:${result} -->"',
            '"repos/${GITHUB_REPOSITORY}/issues/266/comments?per_page=100"',
            '"repos/${GITHUB_REPOSITORY}/issues/266/comments"',
            'incident_duplicate=true',
            'Incident issue: 266 only',
          '''
          if observer_test.count(old_comment_line) != 1:
              raise SystemExit("OBSERVER_TEST_DYNAMIC_COMMENT_EXPECTATION_MISSING")
          observer_test = observer_test.replace(
              old_comment_line, new_comment_lines, 1
          )

          assertion_line = (
              "        self.assertNotIn('in_progress) result=\"RUNNING\"', "
              "self.observer_workflow)\n"
          )
          added_assertions = assertion_line + (
              "        self.assertNotIn('for issue in 266 $related_issues; do', "
              "self.observer_workflow)\n"
              "        self.assertNotIn('issues/${issue}/comments', "
              "self.observer_workflow)\n"
          )
          if observer_test.count(assertion_line) != 1:
              raise SystemExit("OBSERVER_TEST_NEGATIVE_ASSERTION_MISSING")
          observer_test = observer_test.replace(
              assertion_line, added_assertions, 1
          )
          observer_test_path.write_text(observer_test, encoding="utf-8")

          identity_test_path.write_text(
              '''from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[1]
          FOUNDATION = ROOT / "scripts/junca_public_testnet_foundation.sh"


          class FoundationControlledIdentityRepairTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.script = FOUNDATION.read_text(encoding="utf-8")

              def test_missing_identity_enters_existing_controlled_repair_gate(self) -> None:
                  expected = """verify_junca_system_identity || true
          if [[ \"$repair_status_admitted\" != true &&
                ( \"$runtime_config_access_verified\" != true ||
                  \"$system_identity_verified\" != true ) ]]; then
            admit_controlled_active_repair || true
          fi
          if [[ \"$repair_status_admitted\" == true &&
                \"$system_identity_verified\" != true ]]; then
            ensure_junca_system_identity || true
          fi
          """
                  self.assertIn(expected, self.script)

              def test_legacy_runtime_config_only_admission_is_retired(self) -> None:
                  legacy = """if [[ \"$runtime_config_access_verified\" != true ]]; then
            admit_controlled_active_repair || true
          fi
          verify_junca_system_identity || true
          """
                  self.assertNotIn(legacy, self.script)


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )
          PY

      - name: Validate focused repair contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/junca_public_testnet_foundation.sh
          python -m unittest \
            tests.test_junca_foundation_controlled_identity_repair \
            tests.test_junca_hardened_immutable_release_workflow \
            -v

      - name: Commit bounded repair and retire one-shot route
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-shot-repair-public-testnet-release-state-20260808.yml
          git config user.name "JSEC Release Reliability Cell"
          git config user.email "juncajapan.inc@gmail.com"
          git add -A
          git commit -m "fix(release): admit identity repair and deduplicate rejected notifications"
          git push origin HEAD:fix/public-testnet-rejected-notification-and-identity-repair-20260808
