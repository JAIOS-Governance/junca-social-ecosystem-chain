name: JSEC Docs Runtime Corroboration Repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jsec-docs-mobile-cache-r39-remediation.yml"

permissions:
  contents: write

concurrency:
  group: jsec-docs-runtime-corroboration-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize current main
        run: git pull --ff-only origin main

      - name: Preserve canonical Explorer provenance while accepting redacted operational fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/technical-reference/scripts/build.mjs')
          source = path.read_text(encoding='utf-8')
          old = '''  if (!isCommit(operationalNetwork.runtimeSourceCommit)) failures.push("source_commit_format");
            if (!isDigest(operationalNetwork.nodeArtifactSha256)) failures.push("node_artifact_format");
            if (!isDigest(operationalNetwork.genesisSha256)) failures.push("genesis_format");
          '''
          new = '''  // Exact runtime provenance is validated on the canonical Explorer evidence above.
            // The public Operational API may intentionally redact these three identifiers; it remains
            // a corroboration surface for network state, finality, peers, client and safety boundaries.
          '''
          if source.count(old) != 1:
              raise SystemExit(f'corroboration repair signature count={source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          node --check docs/technical-reference/scripts/build.mjs
          ! grep -F 'source_commit_format' docs/technical-reference/scripts/build.mjs
          ! grep -F 'node_artifact_format' docs/technical-reference/scripts/build.mjs
          ! grep -F 'genesis_format' docs/technical-reference/scripts/build.mjs
          grep -F 'Exact runtime provenance is validated on the canonical Explorer evidence above.' \
            docs/technical-reference/scripts/build.mjs

      - name: Commit repair and trigger production deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/technical-reference/scripts/build.mjs
          git commit -m "fix(docs): accept redacted operational provenance with canonical Explorer authority"
          git push origin HEAD:main
