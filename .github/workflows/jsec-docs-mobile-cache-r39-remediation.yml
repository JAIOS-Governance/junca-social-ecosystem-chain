name: JSEC Docs Mobile Cache R39 Remediation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jsec-docs-mobile-cache-r39-remediation.yml"

permissions:
  contents: write

concurrency:
  group: jsec-docs-mobile-cache-r39-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact-boundary R39 remediation v2
        run: python scripts/ops/jsec_docs_mobile_cache_r39_remediation_v2.py

      - name: Validate modified source and controls
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/technical-reference/snapshot/official-brand-lockup-r29.js
          python -m json.tool docs/technical-reference/snapshot/manifest.webmanifest >/dev/null
          python -m json.tool docs/technical-reference/snapshot/current-release.json >/dev/null
          grep -F 'no-store,no-cache,must-revalidate,max-age=0' .github/workflows/junca-chain-docs-production.yml
          grep -F 'jsec-docs-release-refresh:' docs/technical-reference/snapshot/official-brand-lockup-r29.js
          grep -F '20260807-r39-mobile-cache-recovery' docs/technical-reference/snapshot/manifest.webmanifest

      - name: Commit remediation to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(docs): enforce mobile cache recovery R39"
          git pull --rebase origin main
          git push origin HEAD:main
