name: JUNCA Candidate Mainnet Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/junca-mainnet-readiness.yml"
      - "GOVERNANCE.md"
      - "config/jsec_mainnet_delivery_cell_v1.json"
      - "config/jsec_native_token_genesis_plan_v1.json"
      - "jaios/social_ecosystem_chain/mainnet_delivery_governance.py"
      - "jaios/social_ecosystem_chain/mainnet_readiness.py"
      - "jaios/social_ecosystem_chain/native_token_genesis.py"
      - "scripts/jsec_mainnet_delivery_gate.py"
      - "scripts/jsec_native_token_genesis_schedule_gate.py"
      - "scripts/jsec_native_economics_decision_packet.py"
      - "scripts/jsec_native_economics_apply_decision.py"
      - "scripts/jsec_native_genesis_allocation_apply_decision.py"
      - "scripts/jsec_native_genesis_candidate.py"
      - "scripts/jsec_native_genesis_candidate_pipeline.py"
      - "scripts/jsec_native_genesis_candidate_verify.py"
      - "tests/test_jsec_mainnet_delivery_governance.py"
      - "tests/test_junca_mainnet_readiness.py"
      - "tests/test_jsec_native_token_genesis.py"
      - "tests/test_jsec_native_economics_decision.py"
      - "tests/test_jsec_native_genesis_allocation_decision.py"
      - "tests/test_jsec_native_genesis_candidate_pipeline.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-mainnet-readiness.yml"
      - "GOVERNANCE.md"
      - "config/jsec_mainnet_delivery_cell_v1.json"
      - "config/jsec_native_token_genesis_plan_v1.json"
      - "jaios/social_ecosystem_chain/mainnet_delivery_governance.py"
      - "jaios/social_ecosystem_chain/mainnet_readiness.py"
      - "jaios/social_ecosystem_chain/native_token_genesis.py"
      - "scripts/jsec_mainnet_delivery_gate.py"
      - "scripts/jsec_native_token_genesis_schedule_gate.py"
      - "scripts/jsec_native_economics_decision_packet.py"
      - "scripts/jsec_native_economics_apply_decision.py"
      - "scripts/jsec_native_genesis_allocation_apply_decision.py"
      - "scripts/jsec_native_genesis_candidate.py"
      - "scripts/jsec_native_genesis_candidate_pipeline.py"
      - "scripts/jsec_native_genesis_candidate_verify.py"
      - "tests/test_jsec_mainnet_delivery_governance.py"
      - "tests/test_junca_mainnet_readiness.py"
      - "tests/test_jsec_native_token_genesis.py"
      - "tests/test_jsec_native_economics_decision.py"
      - "tests/test_jsec_native_genesis_allocation_decision.py"
      - "tests/test_jsec_native_genesis_candidate_pipeline.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junca-candidate-mainnet-readiness
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify fail-closed Candidate Mainnet gate
        run: |
          set -euo pipefail
          python -m unittest tests.test_jsec_mainnet_delivery_governance -v
          python -m unittest tests.test_junca_mainnet_readiness -v
          python -m unittest tests.test_jsec_native_token_genesis -v
          python -m unittest tests.test_jsec_native_economics_decision -v
          python -m unittest tests.test_jsec_native_genesis_allocation_decision -v
          python -m unittest tests.test_jsec_native_genesis_candidate_pipeline -v
          mkdir -p artifacts
          python scripts/jsec_mainnet_delivery_gate.py \
            --output artifacts/jsec-mainnet-delivery-cell.json
          python scripts/jsec_native_token_genesis_schedule_gate.py \
            --as-of "$(date -u +%F)" \
            --output artifacts/jsec-native-token-genesis-schedule.json
          python scripts/jsec_native_economics_decision_packet.py \
            --output artifacts/jsec-native-economics-decision-packet.json
          python scripts/jsec_native_genesis_candidate_pipeline.py \
            --plan config/jsec_native_token_genesis_plan_v1.json \
            --output-dir artifacts/jsec-native-genesis-candidate \
            --expect-state BLOCKED
          python - <<'PY'
          import json
          import os

          from jaios.social_ecosystem_chain.mainnet_readiness import (
              REQUIRED_GATES,
              SCHEMA_VERSION,
              evaluate_mainnet_readiness,
          )

          passed = {
              "public_testnet_runtime_acceptance",
              "rpc_boundary",
              "explorer_parity",
          }
          evidence = {
              "schema_version": SCHEMA_VERSION,
              "source_commit": os.environ["GITHUB_SHA"],
              "gates": {name: name in passed for name in REQUIRED_GATES},
              "mainnet_changed": False,
              "assets_moved": False,
              "bridge_activated": False,
          }
          result = evaluate_mainnet_readiness(evidence)
          output = result.as_evidence()
          assert output["state"] == "blocked"
          assert output["mainnet_changed"] is False
          assert output["assets_moved"] is False
          assert output["bridge_activated"] is False
          with open("artifacts/mainnet-readiness.json", "w", encoding="utf-8") as stream:
              json.dump(output, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          sha256sum artifacts/mainnet-readiness.json \
            > artifacts/mainnet-readiness.json.sha256
          sha256sum artifacts/jsec-mainnet-delivery-cell.json \
            > artifacts/jsec-mainnet-delivery-cell.json.sha256
          sha256sum artifacts/jsec-native-token-genesis-schedule.json \
            > artifacts/jsec-native-token-genesis-schedule.json.sha256
          sha256sum artifacts/jsec-native-economics-decision-packet.json \
            > artifacts/jsec-native-economics-decision-packet.json.sha256
          sha256sum \
            artifacts/jsec-native-genesis-candidate/pipeline-manifest.json \
            > artifacts/jsec-native-genesis-candidate/pipeline-manifest.json.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: junca-candidate-mainnet-readiness-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
