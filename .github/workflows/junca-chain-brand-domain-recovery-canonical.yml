name: JUNCA Chain Brand Domain Recovery via Canonical OIDC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-chain-brand-domain-recovery-canonical.yml"

permissions:
  contents: read

concurrency:
  group: junca-chain-brand-domain-recovery-canonical
  cancel-in-progress: true

jobs:
  set-default-oidc-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set canonical immutable GitHub OIDC subject for bootstrap role
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint" \
            --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
          state="$(curl --silent --show-error --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint")"
          STATE="$state" python3 -c 'import json,os; s=json.loads(os.environ["STATE"]); assert s.get("use_default") is False and s.get("include_claim_keys")==["repo","context"] and s.get("use_immutable_subject") is False, s'

  recover-chain-domain:
    needs: set-default-oidc-subject
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: junca-chain-docs-production
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      BOOTSTRAP_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - name: Configure canonical AWS bootstrap identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-chain-domain-recovery-${{ github.run_id }}
          disable-retry: true

      - name: Verify exact AWS boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" >/tmp/records-before.json

      - name: Verify DNS execution role policy boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Arn --output text)" != ""
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" >/tmp/records-authorized.json

      - name: Apply Sites-issued chain records
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/change-batch.json <<'JSON'
          {
            "Comment": "Bind chain.jaios-governance.org to the existing Sites brand project",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "chain.jaios-governance.org.",
                  "Type": "CNAME",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "custom-domains.chatgpt.site."}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_openai-site-verification.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_cf-custom-hostname.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]
                }
              }
            ]
          }
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change-batch.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"

      - name: Read back exact records and preserve explorer
        shell: bash
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.']" --output json)"
          RECORDS="$records" python3 - <<'PY'
          import json
          import os
          records = json.loads(os.environ["RECORDS"])
          by_name = {record["Name"]: record for record in records}
          assert by_name["chain.jaios-governance.org."]["ResourceRecords"][0]["Value"] == "custom-domains.chatgpt.site."
          assert "openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM" in by_name["_openai-site-verification.chain.jaios-governance.org."]["ResourceRecords"][0]["Value"]
          assert "0ff4e945-6380-45d2-a7fc-79e43e99da79" in by_name["_cf-custom-hostname.chain.jaios-governance.org."]["ResourceRecords"][0]["Value"]
          PY
          explorer="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='explorer.jaios-governance.org.'] | length(@)" --output text)"
          test "$explorer" = "0"
          {
            echo "### Chain brand custom domain recovery"
            echo "- Operator: JAIOS Institutional Governance"
            echo "- AWS Account: $AWS_ACCOUNT_ID"
            echo "- Hosted Zone: $HOSTED_ZONE_ID"
            echo "- IAM Policy: ChainBrandCustomDomainDns"
            echo "- Route 53 Change: ${{ steps.dns.outputs.change_id }}"
            echo "- DNS Status: INSYNC"
            echo "- Production URL: https://chain.jaios-governance.org/"
            echo "- Explorer record created: false"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Apply Sites-issued MEMBER records
        id: member_dns
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/member-change.json <<'JSON'
          {"Comment":"Bind member.jaios-governance.org to Sites","Changes":[
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"member.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5HgL7ZV4WE4kuhT9OKEJZ4anM4cXQgaX4PcQrAyflGE\""}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"5747a89e-d114-42d8-b33b-b4eaae61c958\""}]}}
          ]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/member-change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"

      - name: Apply Sites-issued JUNCA GLOBAL records
        id: global_dns
        shell: bash
        run: |
          set -euo pipefail
          global_zone="$(aws route53 list-hosted-zones-by-name --dns-name junca-global.group --query "HostedZones[?Name=='junca-global.group.'].Id | [0]" --output text)"
          test -n "$global_zone"
          test "$global_zone" != "None"
          global_zone="${global_zone##*/}"
          cat >/tmp/global-change.json <<'JSON'
          {"Comment":"Cut over junca-global.group to Sites Version 107","Changes":[
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"junca-global.group.","Type":"A","TTL":300,"ResourceRecords":[{"Value":"162.159.143.30"},{"Value":"172.66.3.26"}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.junca-global.group.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=72QXjN2sYBQCzy8JS-dwPT0Pfk0qzrBFWQEpJwgZAeM\""}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.junca-global.group.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"6d02be2e-2b78-4598-bf88-ecff8e3ae441\""}]}}
          ]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$global_zone" --change-batch file:///tmp/global-change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"

      - name: Read back MEMBER and JUNCA GLOBAL
        shell: bash
        run: |
          set -euo pipefail
          global_zone="$(aws route53 list-hosted-zones-by-name --dns-name junca-global.group --query "HostedZones[?Name=='junca-global.group.'].Id | [0]" --output text)"
          global_zone="${global_zone##*/}"
          aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='member.jaios-governance.org.' || Name=='_openai-site-verification.member.jaios-governance.org.' || Name=='_cf-custom-hostname.member.jaios-governance.org.']" --output json
          aws route53 list-resource-record-sets --hosted-zone-id "$global_zone" --query "ResourceRecordSets[?Name=='junca-global.group.' || Name=='_openai-site-verification.junca-global.group.' || Name=='_cf-custom-hostname.junca-global.group.']" --output json
          {
            echo "- MEMBER DNS: INSYNC"
            echo "- JUNCA GLOBAL DNS: INSYNC"
            echo "- MEMBER change: ${{ steps.member_dns.outputs.change_id }}"
            echo "- JUNCA GLOBAL change: ${{ steps.global_dns.outputs.change_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  restore-canonical-oidc-subject:
    if: always()
    needs: [set-default-oidc-subject, recover-chain-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore canonical immutable GitHub OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint" \
            --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
          state="$(curl --silent --show-error --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$endpoint")"
          STATE="$state" python3 -c 'import json,os; s=json.loads(os.environ["STATE"]); assert s.get("use_default") is False and s.get("include_claim_keys")==["repo","context"] and s.get("use_immutable_subject") is False, s'

# CEO-approved final Route 53 cutover trigger: 2026-07-26
