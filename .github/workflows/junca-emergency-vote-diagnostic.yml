name: JUNCA Emergency Vote Diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-vote-diagnostic.yml]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-runtime-inventory-${{ github.run_id }}
      - name: Inventory validator runtime installation
        run: |
          set -euo pipefail
          for instance in i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b; do
            cat > /tmp/inventory.json <<'JSON'
          {"commands":["echo UNIT; systemctl cat junca-validator.service || true","echo BIN; readlink -f /usr/local/bin/junca-chain-node; file /usr/local/bin/junca-chain-node; sha256sum /usr/local/bin/junca-chain-node || true","echo WRAPPER; sed -n '1,80p' /usr/local/bin/junca-chain-node || true","echo LIBRARY; find /usr/local/lib/junca -maxdepth 4 -type f -printf '%p %s bytes\\n' 2>/dev/null | sort || true","echo PYTHON; /usr/local/bin/junca-chain-node --help 2>&1 | head -30 || true"]}
          JSON
            command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters file:///tmp/inventory.json --query Command.CommandId --output text)"
            for attempt in $(seq 1 20); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 2; done
            echo "===== $instance ====="
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text || true
          done
