name: JUNCA Emergency Vote Diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-vote-diagnostic.yml]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-convergence-${{ github.run_id }}
      - name: Verify finality convergence
        run: |
          set -euo pipefail
          sleep 40
          for instance in i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b; do
            cat > /tmp/health.json <<'JSON'
          {"commands":["curl -fsS http://127.0.0.1:8545/health","journalctl -u junca-validator.service --since '-3 minutes' --no-pager -n 30 || true"]}
          JSON
            command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters file:///tmp/health.json --query Command.CommandId --output text)"
            for attempt in $(seq 1 30); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 2; done
            echo "===== $instance ====="
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
            test "$status" = Success
          done
