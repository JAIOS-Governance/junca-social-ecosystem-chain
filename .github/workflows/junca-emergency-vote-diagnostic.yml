name: JUNCA Emergency Vote Diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-vote-diagnostic.yml]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-vote-diagnostic-${{ github.run_id }}
      - name: Capture broadcast responses
        run: |
          set -euo pipefail
          for instance in i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b; do
            cat > /tmp/vote.json <<'JSON'
          {"commands":["curl -sS -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"junca_broadcastVote\",\"params\":[],\"id\":1}' http://127.0.0.1:8545/ || true","curl -sS http://127.0.0.1:8545/health || true"]}
          JSON
            command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters file:///tmp/vote.json --query Command.CommandId --output text)"
            for attempt in $(seq 1 20); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 2; done
            echo "===== $instance ====="
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text || true
          done
