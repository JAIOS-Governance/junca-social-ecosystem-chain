name: JUNCA Emergency Vote Diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-vote-diagnostic.yml]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-gateway-inventory-${{ github.run_id }}
      - name: Inventory canonical public gateway
        run: |
          set -euo pipefail
          cat > /tmp/gateway.json <<'JSON'
          {"commands":["systemctl list-unit-files | grep -E 'junca.*(gateway|explorer|rpc)' || true","systemctl list-units --type=service | grep junca || true","for unit in $(systemctl list-unit-files --no-legend | awk '/junca.*(gateway|explorer|rpc)/ {print $1}'); do echo UNIT=$unit; systemctl cat $unit; done","ss -ltnp | grep -E ':(8080|8081|8545|30303)' || true","find /usr/local/bin /etc/junca -maxdepth 2 -type f | sort | grep -E '(gateway|explorer|rpc)' || true"]}
          JSON
          instance=i-015288fae43f2b40f
          command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters file:///tmp/gateway.json --query Command.CommandId --output text)"
          for attempt in $(seq 1 20); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 2; done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
