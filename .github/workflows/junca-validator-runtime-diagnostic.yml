name: JUNCA Validator Runtime Diagnostic

on:
  push:
    branches:
      - main
      - agent/diagnose-validator-config-shape-v1
      - agent/diagnose-validator-runtime-env-shape-v1
    paths:
      - .github/workflows/junca-validator-runtime-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-validator-runtime-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-validator-diagnostic-${{ github.run_id }}

      - name: Capture runtime state from the exact validator set
        id: diagnostic
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts
          instances=(
            i-083280924b5536f17
            i-055763640261c47df
            i-054811d49cce9017b
          )
          jq -n '{commands: [
            "set +e",
            "printf runtime_directory=; stat -c %F,%U:%G,%a,%h /etc/junca",
            "printf genesis=; stat -c %F,%U:%G,%a,%h,%s /etc/junca/genesis.json",
            "printf validator_lexical=; if test -L /etc/junca/validator.toml; then printf symlink,; readlink /etc/junca/validator.toml; elif test -e /etc/junca/validator.toml; then stat -c %F,%U:%G,%a,%h,%s /etc/junca/validator.toml; else echo absent; fi",
            "printf validator_resolved=; stat -Lc %F,%U:%G,%a,%h,%s,%d:%i /etc/junca/validator.toml 2>&1",
            "printf runtime_env_lexical=; if test -L /etc/junca/runtime.env; then printf symlink,; readlink /etc/junca/runtime.env; elif test -e /etc/junca/runtime.env; then stat -c %F,%U:%G,%a,%h,%s /etc/junca/runtime.env; sha256sum /etc/junca/runtime.env; else echo absent; fi",
            "printf runtime_env_resolved=; stat -Lc %F,%U:%G,%a,%h,%s,%d:%i /etc/junca/runtime.env 2>&1",
            "printf junca_identity=; getent passwd junca; getent group junca",
            "systemctl status junca-validator.service --no-pager -l",
            "journalctl -u junca-validator.service --no-pager -n 200",
            "curl -sS --max-time 5 http://127.0.0.1:8545/health",
            "ss -lntp"
          ]}' > artifacts/ssm-diagnostic.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file://artifacts/ssm-diagnostic.json \
            --comment "JUNCA Public Testnet Runtime Diagnostic" \
            --query Command.CommandId --output text)"
          echo "$command_id" > artifacts/command-id.txt
          healthy=0
          for instance in "${instances[@]}"; do
            for attempt in $(seq 1 60); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || true)"
              case "$status" in
                Success|Failed|TimedOut|Cancelled) break ;;
              esac
              test "$attempt" -lt 60
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/diagnostic-${instance}.json"
            if jq -er .StandardOutputContent "artifacts/diagnostic-${instance}.json" \
              | sed -n '/^{"/,/^}/p' \
              | tail -n 1 >/dev/null; then
              healthy=$((healthy + 1))
            fi
          done
          test "$healthy" = 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-validator-runtime-diagnostic-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce diagnostic health result
        if: steps.diagnostic.outcome != 'success'
        run: exit 1
