name: One-shot Update Legacy Identity Contract 2026-08-08

on:
  push:
    branches:
      - fix/jsec-deterministic-system-identity-20260808
    paths:
      - .github/workflows/one-shot-update-legacy-identity-contract-20260808.yml

permissions:
  contents: write

concurrency:
  group: one-shot-update-legacy-identity-contract-20260808
  cancel-in-progress: false

jobs:
  update-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/jsec-deterministic-system-identity-20260808
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Replace obsolete identity-repair contract test
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_junca_social_ecosystem_chain_aws_foundation.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "    def test_legacy_system_identity_repair_is_exact_and_fail_closed(self) -> None:\n"
          end_marker = "\n    def test_system_identity_repair_follows_the_controlled_stop"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f"IDENTITY_TEST_BOUNDARY_MISSING start={start} end={end}")

          replacement = '''    def test_legacy_system_identity_repair_is_exact_and_fail_closed(self) -> None:
              remote = validator_service_recovery_remote_script(
                  self.foundation_script
              )
              start = remote.index("verify_junca_system_identity() {")
              end = remote.index(
                  "\\n\\nverify_durable_mount_persistence_contract", start
              )
              functions = remote[start:end]
              normalized = " ".join(functions.split())
              for required in (
                  "groupadd --system --gid 992 junca",
                  "groupmod --gid 992 junca",
                  "useradd --system --uid 992 --gid 992 --home-dir /var/lib/junca --shell /sbin/nologin --no-create-home junca",
                  "usermod --uid 992 --gid 992 --home /var/lib/junca --shell /sbin/nologin junca",
                  "JUNCA_SYSTEM_UID_992_COLLISION",
                  "JUNCA_SYSTEM_GID_992_COLLISION",
                  "JUNCA_SYSTEM_IDENTITY_ACTIVE_PROCESS",
                  '[[ "$repair_status_admitted" == true ]]',
              ):
                  self.assertIn(required, normalized)
              for case in (
                  {
                      "name": "canonical",
                      "passwd": "junca:x:992:992::/var/lib/junca:/sbin/nologin",
                      "group": "junca:x:992:",
                      "uid": "junca:x:992:992::/var/lib/junca:/sbin/nologin",
                      "gid": "junca:x:992:",
                      "admitted": "false",
                      "result": 0,
                      "groupadd": 0,
                      "groupmod": 0,
                      "useradd": 0,
                      "usermod": 0,
                      "repaired": "false",
                  },
                  {
                      "name": "absent-admitted",
                      "passwd": "",
                      "group": "",
                      "uid": "",
                      "gid": "",
                      "admitted": "true",
                      "result": 0,
                      "groupadd": 1,
                      "groupmod": 0,
                      "useradd": 1,
                      "usermod": 0,
                      "repaired": "true",
                  },
                  {
                      "name": "legacy-dynamic-admitted",
                      "passwd": "junca:x:991:991::/var/lib/junca:/sbin/nologin",
                      "group": "junca:x:991:",
                      "uid": "",
                      "gid": "",
                      "admitted": "true",
                      "result": 0,
                      "groupadd": 0,
                      "groupmod": 1,
                      "useradd": 0,
                      "usermod": 1,
                      "repaired": "true",
                  },
                  {
                      "name": "repair-not-admitted",
                      "passwd": "",
                      "group": "",
                      "uid": "",
                      "gid": "",
                      "admitted": "false",
                      "result": 1,
                      "groupadd": 0,
                      "groupmod": 0,
                      "useradd": 0,
                      "usermod": 0,
                      "repaired": "false",
                  },
                  {
                      "name": "numeric-gid-conflict",
                      "passwd": "",
                      "group": "",
                      "uid": "",
                      "gid": "other:x:992:",
                      "admitted": "true",
                      "result": 1,
                      "groupadd": 0,
                      "groupmod": 0,
                      "useradd": 0,
                      "usermod": 0,
                      "repaired": "false",
                  },
                  {
                      "name": "numeric-uid-conflict",
                      "passwd": "",
                      "group": "junca:x:992:",
                      "uid": "other:x:992:992::/nonexistent:/sbin/nologin",
                      "gid": "junca:x:992:",
                      "admitted": "true",
                      "result": 1,
                      "groupadd": 0,
                      "groupmod": 0,
                      "useradd": 0,
                      "usermod": 0,
                      "repaired": "false",
                  },
              ):
                  with self.subTest(case=case["name"]):
                      script = (
                          "set -u -o pipefail\\n"
                          + functions
                          + "\\n"
                          + f"PASSWD_JUNCA='{case['passwd']}'\\n"
                          + f"GROUP_JUNCA='{case['group']}'\\n"
                          + f"PASSWD_992='{case['uid']}'\\n"
                          + f"GROUP_992='{case['gid']}'\\n"
                          + "groupadd_count=0\\ngroupmod_count=0\\n"
                          + "useradd_count=0\\nusermod_count=0\\n"
                          + "system_identity_verified=false\\n"
                          + "system_identity_repair_attempted=false\\n"
                          + "system_identity_repaired=false\\n"
                          + "system_identity_uid=0\\nsystem_identity_gid=0\\n"
                          + f"repair_status_admitted={case['admitted']}\\n"
                          + "getent() {\\n"
                          + "  case \\"$1:$2\\" in\\n"
                          + "    passwd:junca) test -n \\"$PASSWD_JUNCA\\" && printf '%s\\\\n' \\"$PASSWD_JUNCA\\" ;;;\\n"
                          + "    group:junca) test -n \\"$GROUP_JUNCA\\" && printf '%s\\\\n' \\"$GROUP_JUNCA\\" ;;;\\n"
                          + "    passwd:992) test -n \\"$PASSWD_992\\" && printf '%s\\\\n' \\"$PASSWD_992\\" ;;;\\n"
                          + "    group:992) test -n \\"$GROUP_992\\" && printf '%s\\\\n' \\"$GROUP_992\\" ;;;\\n"
                          + "  esac\\n}\\n"
                          + "groupadd() { test \\"$*\\" = '--system --gid 992 junca' || return 90; groupadd_count=$((groupadd_count + 1)); GROUP_JUNCA='junca:x:992:'; GROUP_992=\\"$GROUP_JUNCA\\"; }\\n"
                          + "groupmod() { test \\"$*\\" = '--gid 992 junca' || return 91; groupmod_count=$((groupmod_count + 1)); GROUP_JUNCA='junca:x:992:'; GROUP_992=\\"$GROUP_JUNCA\\"; }\\n"
                          + "useradd() { test \\"$*\\" = '--system --uid 992 --gid 992 --home-dir /var/lib/junca --shell /sbin/nologin --no-create-home junca' || return 92; useradd_count=$((useradd_count + 1)); PASSWD_JUNCA='junca:x:992:992::/var/lib/junca:/sbin/nologin'; PASSWD_992=\\"$PASSWD_JUNCA\\"; }\\n"
                          + "usermod() { test \\"$*\\" = '--uid 992 --gid 992 --home /var/lib/junca --shell /sbin/nologin junca' || return 93; usermod_count=$((usermod_count + 1)); PASSWD_JUNCA='junca:x:992:992::/var/lib/junca:/sbin/nologin'; PASSWD_992=\\"$PASSWD_JUNCA\\"; }\\n"
                          + "systemctl() { return 0; }\\n"
                          + "pgrep() { return 1; }\\n"
                          + "result=0\\nensure_junca_system_identity || result=$?\\n"
                          + f"test \\"$result\\" -eq {case['result']}\\n"
                          + f"test \\"$groupadd_count\\" -eq {case['groupadd']}\\n"
                          + f"test \\"$groupmod_count\\" -eq {case['groupmod']}\\n"
                          + f"test \\"$useradd_count\\" -eq {case['useradd']}\\n"
                          + f"test \\"$usermod_count\\" -eq {case['usermod']}\\n"
                          + f"test \\"$system_identity_repaired\\" = {case['repaired']}\\n"
                      )
                      result = subprocess.run(
                          ["bash", "-c", script],
                          env={"PATH": "/usr/bin:/bin"},
                          check=False,
                          capture_output=True,
                          text=True,
                      )
                      self.assertEqual(result.returncode, 0, result.stderr)
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Validate updated contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile tests/test_junca_social_ecosystem_chain_aws_foundation.py
          python -m unittest \
            tests.test_junca_social_ecosystem_chain_aws_foundation.AwsFoundationTests.test_legacy_system_identity_repair_is_exact_and_fail_closed \
            tests.test_junca_deterministic_system_identity \
            -v

      - name: Commit updated contract
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JSEC Governance Contract Cell"
          git config user.email "juncajapan.inc@gmail.com"
          git add tests/test_junca_social_ecosystem_chain_aws_foundation.py
          git commit -m "test(runtime): accept controlled legacy identity migration"
          git push origin HEAD:fix/jsec-deterministic-system-identity-20260808
