name: One-shot Update Legacy Identity Contract 2026-08-08

on:
  push:
    branches:
      - fix/jsec-deterministic-system-identity-20260808
    paths:
      - .github/workflows/one-shot-update-legacy-identity-contract-20260808.yml

permissions:
  contents: write

concurrency:
  group: one-shot-update-legacy-identity-contract-20260808
  cancel-in-progress: false

jobs:
  update-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/jsec-deterministic-system-identity-20260808
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Replace obsolete identity-repair contract test
        run: python scripts/ops/update_legacy_identity_contract.py

      - name: Validate updated contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile tests/test_junca_social_ecosystem_chain_aws_foundation.py
          python -m unittest \
            tests.test_junca_social_ecosystem_chain_aws_foundation.AwsFoundationTests.test_legacy_system_identity_repair_is_exact_and_fail_closed \
            tests.test_junca_deterministic_system_identity \
            -v

      - name: Commit updated contract
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JSEC Governance Contract Cell"
          git config user.email "juncajapan.inc@gmail.com"
          git add tests/test_junca_social_ecosystem_chain_aws_foundation.py
          git commit -m "test(runtime): accept controlled legacy identity migration"
          git push origin HEAD:fix/jsec-deterministic-system-identity-20260808

# activation: bounded-updater-v2
