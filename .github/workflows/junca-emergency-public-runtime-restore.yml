name: JUNCA Emergency Public Runtime Restore

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/junca-emergency-public-runtime-restore.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-emergency-runtime-${{ github.run_id }}

      - name: Diagnose and restore validators independently
        run: |
          set -euo pipefail
          instances=(i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b)
          for instance in "${instances[@]}"; do
            state="$(aws ec2 describe-instances --instance-ids "$instance" --query 'Reservations[0].Instances[0].State.Name' --output text)"
            case "$state" in
              stopped) aws ec2 start-instances --instance-ids "$instance" >/dev/null ;;
              pending|running) ;;
              *) echo "Unsupported instance state for $instance: $state" >&2; exit 1 ;;
            esac
          done
          aws ec2 wait instance-running --instance-ids "${instances[@]}"
          aws ec2 wait instance-status-ok --instance-ids "${instances[@]}"

          for attempt in $(seq 1 60); do
            online="$(aws ssm describe-instance-information --filters Key=InstanceIds,Values="$(IFS=,; echo "${instances[*]}")" --query 'length(InstanceInformationList[?PingStatus==`Online`])' --output text)"
            [[ "$online" == "3" ]] && break
            test "$attempt" -lt 60
            sleep 5
          done

          jq -n '{commands:[
            "set +e",
            "echo ===FILESYSTEM===; findmnt --target /var/lib/junca || true; ls -la /var/lib/junca | head -40 || true; test -f /var/lib/junca/state.sqlite; echo state_file=$?",
            "echo ===BEFORE===; systemctl status junca-validator.service --no-pager -l || true; journalctl -u junca-validator.service --no-pager -n 80 || true",
            "systemctl daemon-reload; systemctl reset-failed junca-validator.service || true; systemctl restart junca-validator.service",
            "restart_status=$?; echo restart_status=$restart_status",
            "for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health && exit 0; sleep 2; done",
            "echo ===AFTER===; systemctl status junca-validator.service --no-pager -l || true; journalctl -u junca-validator.service --no-pager -n 120 || true; exit 1"
          ]}' > /tmp/ssm-restart.json

          successful=0
          for instance in "${instances[@]}"; do
            command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters file:///tmp/ssm-restart.json --comment 'JUNCA emergency validator diagnosis and restore' --query Command.CommandId --output text)"
            for attempt in $(seq 1 90); do
              status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 2
            done
            result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance")"
            echo "===== $instance ====="
            jq -r '.Status, .StandardOutputContent, .StandardErrorContent' <<<"$result"
            [[ "$(jq -r .Status <<<"$result")" == Success ]] && successful=$((successful + 1))
          done
          test "$successful" -ge 1

      - name: Require public Gateway recovery
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            explorer="$(curl -sS --max-time 10 -o /tmp/explorer -w '%{http_code}' https://explorer.jaios-governance.org/ || true)"
            health="$(curl -sS --max-time 10 -o /tmp/health -w '%{http_code}' https://health.jaios-governance.org/health || true)"
            rpc="$(curl -sS --max-time 10 -o /tmp/rpc -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ || true)"
            if [[ "$explorer" == 200 && "$health" == 200 && "$rpc" == 200 ]]; then
              jq -e '.status == "healthy" and .mainnet_changed == false and .assets_moved == false and .bridge_activated == false' /tmp/health
              jq -e '.result == "0x1352f63"' /tmp/rpc
              exit 0
            fi
            test "$attempt" -lt 60
            sleep 5
          done
