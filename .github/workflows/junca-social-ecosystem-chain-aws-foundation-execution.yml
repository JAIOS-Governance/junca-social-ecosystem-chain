name: JUNCA Chain AWS Foundation Execution

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Safe foundation phase
        required: true
        default: permission-readback
        type: choice
        options:
          - permission-readback
          - bootstrap-plan
          - foundation-plan
          - bootstrap-apply
          - foundation-apply
      apply_confirmation:
        description: Exact apply confirmation; ignored for readback and plan
        required: false
        type: string
      approved_change_reference:
        description: Immutable approval or change reference for apply
        required: false
        type: string
      state_bucket_name:
        description: Globally unique canonical Terraform state bucket
        required: false
        type: string
      github_oidc_thumbprint:
        description: Independently verified lowercase SHA-1 OIDC thumbprint
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  recovery-evidence:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact triggering recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: junca-runtime-self-permission-recovery-${{ github.event.workflow_run.id }}
          path: artifacts/recovery
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Require verified recovery before automatic resume
        run: |
          set -euo pipefail
          evidence=artifacts/recovery/runtime-self-permission-recovery.json
          jq -e '
            .account_id == "595710543956" and
            .region == "us-east-1" and
            .target_role_arn ==
              "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment" and
            .granted_action == "iam:SimulatePrincipalPolicy" and
            (.recovery_result == "APPLIED" or
             .recovery_result == "PRESENT") and
            .verification == "PASS" and
            .broad_iam_grant == false and
            .docs_runtime_role_used == false and
            .apply_executed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' "$evidence"

  permission-readback:
    needs:
      - recovery-evidence
    if: >-
      always() &&
      (github.event_name != 'workflow_run' ||
       needs.recovery-evidence.result == 'success')
    environment: public-testnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_NAME: JuncaChainPublicTestnetDeployment
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      REQUESTED_PHASE: ${{ (github.event_name == 'workflow_run' || github.event_name == 'push') && 'auto-release' || inputs.phase || 'permission-readback' }}
      AUTO_RESUME: ${{ github.event_name == 'workflow_run' }}
      RECOVERY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce Public Testnet execution boundary
        run: |
          set -euo pipefail
          test "$AWS_ACCOUNT_ID" = "595710543956"
          test "$AWS_REGION" = "us-east-1"
          test "$DEPLOYMENT_ROLE_ARN" = \
            "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment"
          jq -e '
            .notice == "Public Testnet / No Monetary Value" and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-foundation-${{ github.run_id }}

      - name: Reconcile exact bootstrap policy for authorized auto-release
        if: github.event_name == 'workflow_run' || github.event_name == 'push'
        run: |
          set -euo pipefail
          aws iam put-role-policy \
            --role-name "$DEPLOYMENT_ROLE_NAME" \
            --policy-name PublicTestnetFoundationBootstrap \
            --policy-document file://config/junca_public_testnet_foundation_bootstrap_policy.json

      - name: Read back identity and required permissions
        id: permissions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          actual_arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "$actual_account" = "$AWS_ACCOUNT_ID"
          case "$actual_arn" in
            arn:aws:sts::595710543956:assumed-role/JuncaChainPublicTestnetDeployment/*) ;;
            *) echo "Unexpected deployment identity" >&2; exit 1 ;;
          esac

          simulation_groups='[
            {
              "resource": "arn:aws:s3:::junca-social-ecosystem-chain-tfstate-595710543956-us-east-1",
              "actions": [
                "s3:CreateBucket", "s3:GetBucketLocation", "s3:GetBucketPolicy",
                "s3:GetBucketPublicAccessBlock", "s3:GetBucketVersioning",
                "s3:GetEncryptionConfiguration", "s3:GetBucketOwnershipControls",
                "s3:ListBucket", "s3:PutBucketVersioning",
                "s3:PutEncryptionConfiguration", "s3:PutBucketPublicAccessBlock",
                "s3:PutBucketOwnershipControls", "s3:PutBucketPolicy",
                "s3:PutBucketTagging"
              ]
            },
            {
              "resource": "arn:aws:s3:::junca-social-ecosystem-chain-tfstate-595710543956-us-east-1/public-testnet/bootstrap.tfstate",
              "actions": ["s3:GetObject", "s3:PutObject"]
            },
            {
              "resource": "arn:aws:dynamodb:us-east-1:595710543956:table/junca-social-ecosystem-chain-testnet-lock",
              "actions": [
                "dynamodb:CreateTable", "dynamodb:DescribeContinuousBackups",
                "dynamodb:DescribeTable", "dynamodb:DescribeTimeToLive",
                "dynamodb:ListTagsOfResource", "dynamodb:TagResource",
                "dynamodb:UpdateContinuousBackups", "dynamodb:GetItem",
                "dynamodb:PutItem", "dynamodb:DeleteItem"
              ]
            },
            {
              "resource": "*",
              "actions": [
                "kms:CreateKey", "kms:CreateAlias", "kms:CreateGrant",
                "kms:DescribeKey", "kms:ListAliases",
                "kms:EnableKeyRotation", "kms:GetKeyPolicy",
                "kms:GetKeyRotationStatus", "kms:ListResourceTags",
                "kms:TagResource", "kms:Decrypt", "kms:Encrypt",
                "kms:GenerateDataKey"
              ]
            },
            {
              "resource": "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment",
              "actions": [
                "iam:GetRole", "iam:ListAttachedRolePolicies",
                "iam:ListInstanceProfilesForRole", "iam:ListRolePolicies",
                "iam:TagRole", "iam:UntagRole", "iam:UpdateAssumeRolePolicy",
                "iam:UpdateRole", "iam:UpdateRoleDescription",
                "iam:GetRolePolicy", "iam:PutRolePolicy"
              ]
            },
            {
              "resource": "arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com",
              "actions": [
                "iam:GetOpenIDConnectProvider",
                "iam:ListOpenIDConnectProviderTags",
                "iam:AddClientIDToOpenIDConnectProvider",
                "iam:UpdateOpenIDConnectProviderThumbprint",
                "iam:TagOpenIDConnectProvider"
              ]
            }
          ]'
          actions_json="$(jq -c '[.[].actions[]]' <<<"$simulation_groups")"

          simulation_state="AVAILABLE"
          simulation_error=""
          simulation_json='[]'
          : > artifacts/permission-simulation.stderr
          while IFS= read -r group; do
            resource="$(jq -r '.resource' <<<"$group")"
            mapfile -t group_actions < <(jq -r '.actions[]' <<<"$group")
            if raw="$(aws iam simulate-principal-policy \
                --policy-source-arn "$DEPLOYMENT_ROLE_ARN" \
                --action-names "${group_actions[@]}" \
                --resource-arns "$resource" \
                --output json 2>>artifacts/permission-simulation.stderr)"; then
              group_results="$(jq --arg resource "$resource" \
                '[.EvaluationResults[] | {
                  action: .EvalActionName,
                  resource: $resource,
                  decision: .EvalDecision
                }]' <<<"$raw")"
              simulation_json="$(jq -c --argjson results "$group_results" \
                '. + $results' <<<"$simulation_json")"
            else
              simulation_state="UNAVAILABLE"
            fi
          done < <(jq -c '.[]' <<<"$simulation_groups")
          if [[ "$simulation_state" == "UNAVAILABLE" ]]; then
            simulation_error="$(tr '\n' ' ' < artifacts/permission-simulation.stderr | cut -c1-500)"
          fi

          allowed_count="$(jq '[.[] | select(.decision == "allowed")] | length' <<<"$simulation_json")"
          required_count="$(jq 'length' <<<"$actions_json")"
          if [[ "$simulation_state" == "AVAILABLE" && "$allowed_count" == "$required_count" ]]; then
            permission_gate="PASS"
          elif [[ "$simulation_state" == "AVAILABLE" ]]; then
            permission_gate="FAIL"
          else
            permission_gate="UNVERIFIED"
          fi
          denied_actions="$(jq -r '
            [.[] | select(.decision != "allowed") | "\(.action) @ \(.resource)"]
            | if length == 0 then "none" else join("\n") end
          ' <<<"$simulation_json")"
          printf 'permission_gate=%s\nDenied bootstrap permissions:\n%s\n' \
            "$permission_gate" "$denied_actions"

          jq -n \
            --arg account_id "$actual_account" \
            --arg assumed_role_arn "$actual_arn" \
            --arg region "$AWS_REGION" \
            --arg deployment_role_arn "$DEPLOYMENT_ROLE_ARN" \
            --arg requested_phase "$REQUESTED_PHASE" \
            --arg auto_resume "$AUTO_RESUME" \
            --arg recovery_run_id "$RECOVERY_RUN_ID" \
            --arg simulation_state "$simulation_state" \
            --arg simulation_error "$simulation_error" \
            --arg permission_gate "$permission_gate" \
            --argjson required_actions "$actions_json" \
            --argjson permission_results "$simulation_json" \
            '{
              schema_version: "1.0",
              chain_name: "JUNCA Social Ecosystem Chain",
              governance: "JAIOS Institutional Governance",
              notice: "Public Testnet / No Monetary Value",
              account_id: $account_id,
              region: $region,
              deployment_role_arn: $deployment_role_arn,
              assumed_role_arn: $assumed_role_arn,
              requested_phase: $requested_phase,
              orchestration: {
                auto_resume: ($auto_resume == "true"),
                recovery_run_id: $recovery_run_id
              },
              required_actions: $required_actions,
              permission_simulation: {
                state: $simulation_state,
                error: $simulation_error,
                results: $permission_results
              },
              permission_gate: $permission_gate,
              apply_executed: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/aws-foundation-permission-readback.json
          echo "permission_gate=$permission_gate" >> "$GITHUB_OUTPUT"

      - name: Validate apply authorization
        id: authorization
        env:
          APPLY_CONFIRMATION: ${{ (github.event_name == 'workflow_run' || github.event_name == 'push') && 'PUBLIC-TESTNET-FOUNDATION-APPLY' || inputs.apply_confirmation }}
          APPROVED_CHANGE_REFERENCE: ${{ github.event_name == 'workflow_run' && format('https://github.com/{0}/actions/runs/{1}', github.repository, github.event.workflow_run.id) || github.event_name == 'push' && format('https://github.com/{0}/commit/{1}', github.repository, github.sha) || inputs.approved_change_reference }}
        run: |
          set -euo pipefail
          config_authorized="$(jq -r '.apply_authorized' \
            config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json)"
          apply_requested=false
          case "$REQUESTED_PHASE" in
            bootstrap-apply|foundation-apply|auto-release) apply_requested=true ;;
          esac
          authorized=false
          if [[ "$apply_requested" == "true" ]]; then
            test "$config_authorized" = "true"
            test "${{ steps.permissions.outputs.permission_gate }}" = "PASS"
            test "$APPLY_CONFIRMATION" = "PUBLIC-TESTNET-FOUNDATION-APPLY"
            test -n "$APPROVED_CHANGE_REFERENCE"
            authorized=true
          fi
          echo "apply_requested=$apply_requested" >> "$GITHUB_OUTPUT"
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: contains(fromJSON('["bootstrap-plan","foundation-plan","bootstrap-apply","foundation-apply","auto-release"]'), env.REQUESTED_PHASE)
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Require permission PASS before any plan
        if: contains(fromJSON('["bootstrap-plan","foundation-plan","bootstrap-apply","foundation-apply","auto-release"]'), env.REQUESTED_PHASE)
        run: |
          set -euo pipefail
          test "${{ steps.permissions.outputs.permission_gate }}" = "PASS"

      - name: Produce guarded bootstrap plan
        if: contains(fromJSON('["bootstrap-plan","bootstrap-apply","auto-release"]'), env.REQUESTED_PHASE)
        env:
          AWS_MAX_ATTEMPTS: "3"
          AWS_RETRY_MODE: standard
          STATE_BUCKET_NAME: ${{ inputs.state_bucket_name || vars.JUNCA_TERRAFORM_STATE_BUCKET || 'junca-social-ecosystem-chain-tfstate-595710543956-us-east-1' }}
          GITHUB_OIDC_THUMBPRINT: ${{ inputs.github_oidc_thumbprint || vars.JUNCA_GITHUB_OIDC_THUMBPRINT || '6938fd4d98bab03faadb97b34396831e3780aea1' }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET_NAME"
          [[ "$STATE_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$GITHUB_OIDC_THUMBPRINT" =~ ^[0-9a-f]{40}$ ]]
          cat > infra/aws/bootstrap/bootstrap_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform -chdir=infra/aws/bootstrap init -reconfigure -input=false

          # Import canonical resources that predate Terraform ownership.
          tf_import() {
            local address="$1"
            local resource_id="$2"
            terraform -chdir=infra/aws/bootstrap import \
              -var="aws_account_id=$AWS_ACCOUNT_ID" \
              -var="aws_region=$AWS_REGION" \
              -var="state_bucket_name=$STATE_BUCKET_NAME" \
              -var="github_oidc_thumbprint=$GITHUB_OIDC_THUMBPRINT" \
              "$address" "$resource_id"
          }

          aws iam get-role --role-name JuncaChainPublicTestnetDeployment >/dev/null
          if ! terraform -chdir=infra/aws/bootstrap state show \
              aws_iam_role.deployment >/dev/null 2>&1; then
            tf_import aws_iam_role.deployment JuncaChainPublicTestnetDeployment
          fi
          if aws iam get-role --role-name JuncaChainPublicTestnetImageBuilder \
              >/dev/null 2>&1 &&
              ! terraform -chdir=infra/aws/bootstrap state show \
                aws_iam_role.validator_image_builder >/dev/null 2>&1; then
            tf_import aws_iam_role.validator_image_builder \
              JuncaChainPublicTestnetImageBuilder
          fi
          if aws iam get-instance-profile \
              --instance-profile-name JuncaChainPublicTestnetImageBuilder \
              >/dev/null 2>&1 &&
              ! terraform -chdir=infra/aws/bootstrap state show \
                aws_iam_instance_profile.validator_image_builder \
                >/dev/null 2>&1; then
            tf_import aws_iam_instance_profile.validator_image_builder \
              JuncaChainPublicTestnetImageBuilder
          fi
          oidc_arn="arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com"
          aws iam get-open-id-connect-provider \
            --open-id-connect-provider-arn "$oidc_arn" >/dev/null
          if ! terraform -chdir=infra/aws/bootstrap state show \
              aws_iam_openid_connect_provider.github >/dev/null 2>&1; then
            tf_import aws_iam_openid_connect_provider.github "$oidc_arn"
          fi

          if aws s3api head-bucket --bucket "$STATE_BUCKET_NAME" 2>/dev/null &&
              ! terraform -chdir=infra/aws/bootstrap state show \
                aws_s3_bucket.terraform_state >/dev/null 2>&1; then
            tf_import aws_s3_bucket.terraform_state "$STATE_BUCKET_NAME"
          fi

          if aws dynamodb describe-table \
              --table-name junca-social-ecosystem-chain-testnet-lock \
              >/dev/null 2>&1 &&
              ! terraform -chdir=infra/aws/bootstrap state show \
                aws_dynamodb_table.terraform_lock >/dev/null 2>&1; then
            tf_import aws_dynamodb_table.terraform_lock \
              junca-social-ecosystem-chain-testnet-lock
          fi

          state_alias=alias/junca-social-ecosystem-chain-testnet-state
          state_key_id="$(aws kms list-aliases \
            --query "Aliases[?AliasName=='$state_alias'].TargetKeyId | [0]" \
            --output text)"
          if [[ "$state_key_id" != "None" ]]; then
            if ! terraform -chdir=infra/aws/bootstrap state show \
                aws_kms_key.terraform_state >/dev/null 2>&1; then
              tf_import aws_kms_key.terraform_state "$state_key_id"
            fi
            if ! terraform -chdir=infra/aws/bootstrap state show \
                aws_kms_alias.terraform_state >/dev/null 2>&1; then
              tf_import aws_kms_alias.terraform_state "$state_alias"
            fi
          fi

          for index in 0 1 2; do
            number="$(printf '%02d' "$((index + 1))")"
            signer_alias="alias/junca-social-ecosystem-chain-testnet-validator-$number"
            signer_key_id="$(aws kms list-aliases \
              --query "Aliases[?AliasName=='$signer_alias'].TargetKeyId | [0]" \
              --output text)"
            if [[ "$signer_key_id" != "None" ]]; then
              key_address="aws_kms_key.validator_signer[$index]"
              alias_address="aws_kms_alias.validator_signer[$index]"
              if ! terraform -chdir=infra/aws/bootstrap state show \
                  "$key_address" >/dev/null 2>&1; then
                tf_import "$key_address" "$signer_key_id"
              fi
              if ! terraform -chdir=infra/aws/bootstrap state show \
                  "$alias_address" >/dev/null 2>&1; then
                tf_import "$alias_address" "$signer_alias"
              fi
            fi
          done

          terraform -chdir=infra/aws/bootstrap plan -input=false -lock=false \
            -var="aws_account_id=$AWS_ACCOUNT_ID" \
            -var="aws_region=$AWS_REGION" \
            -var="state_bucket_name=$STATE_BUCKET_NAME" \
            -var="github_oidc_thumbprint=$GITHUB_OIDC_THUMBPRINT" \
            -out="$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan"
          terraform -chdir=infra/aws/bootstrap show -json \
            "$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan" \
            > artifacts/bootstrap-plan.json
          jq -e '[.resource_changes[]?.change.actions | select(index("delete"))] | length == 0' \
            artifacts/bootstrap-plan.json
          if [[ -f infra/aws/bootstrap/terraform.tfstate ]]; then
            cp infra/aws/bootstrap/terraform.tfstate artifacts/bootstrap-preapply.tfstate
          else
            printf '%s\n' '{"version":4,"terraform_version":"1.9.8","serial":0,"lineage":"","outputs":{},"resources":[],"check_results":null}' \
              > artifacts/bootstrap-preapply.tfstate
          fi

      - name: Produce guarded validator foundation plan
        if: env.REQUESTED_PHASE == 'foundation-plan'
        env:
          STATE_BUCKET_NAME: ${{ vars.JUNCA_TERRAFORM_STATE_BUCKET }}
          DOMAIN_NAME: ${{ vars.JUNCA_PUBLIC_TESTNET_DOMAIN }}
          ROUTE53_ZONE_ID: ${{ vars.JUNCA_PUBLIC_TESTNET_ROUTE53_ZONE_ID }}
          NODE_AMI_ID: ${{ vars.JUNCA_PUBLIC_TESTNET_NODE_AMI_ID }}
          NODE_ARTIFACT_SHA256: ${{ vars.JUNCA_PUBLIC_TESTNET_NODE_SHA256 }}
          GENESIS_SHA256: ${{ vars.JUNCA_PUBLIC_TESTNET_GENESIS_SHA256 }}
          SOURCE_COMMIT: ${{ vars.JUNCA_PUBLIC_TESTNET_SOURCE_COMMIT }}
          AVAILABILITY_ZONES_JSON: ${{ vars.JUNCA_PUBLIC_TESTNET_AVAILABILITY_ZONES_JSON }}
        run: bash scripts/junca_public_testnet_foundation.sh foundation-plan

      - name: Apply bootstrap and migrate durable state
        if: >-
          (env.REQUESTED_PHASE == 'bootstrap-apply' || env.REQUESTED_PHASE == 'auto-release') &&
          steps.authorization.outputs.authorized == 'true'
        env:
          AWS_MAX_ATTEMPTS: "3"
          AWS_RETRY_MODE: standard
          STATE_BUCKET_NAME: ${{ inputs.state_bucket_name || vars.JUNCA_TERRAFORM_STATE_BUCKET || 'junca-social-ecosystem-chain-tfstate-595710543956-us-east-1' }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/bootstrap apply -input=false -auto-approve \
            "$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan"
          terraform -chdir=infra/aws/bootstrap output -json \
            > artifacts/bootstrap-outputs.json
          state_kms_key_arn="$(jq -er .state_kms_key_arn.value artifacts/bootstrap-outputs.json)"
          lock_table="$(jq -er .lock_table.value artifacts/bootstrap-outputs.json)"
          rm infra/aws/bootstrap/bootstrap_override.tf
          terraform -chdir=infra/aws/bootstrap init -input=false \
            -migrate-state -force-copy \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/bootstrap.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$lock_table" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$state_kms_key_arn"
          jq -e '
            .aws_account_id.value == "595710543956" and
            .aws_region.value == "us-east-1" and
            (.validator_signer_arns.value | length) == 3
          ' artifacts/bootstrap-outputs.json

      - name: Resolve validator foundation input readiness
        id: foundation_inputs
        if: >-
          (env.REQUESTED_PHASE == 'foundation-plan' ||
           env.REQUESTED_PHASE == 'foundation-apply' ||
           env.REQUESTED_PHASE == 'auto-release')
        env:
          STATE_BUCKET_NAME: ${{ inputs.state_bucket_name || vars.JUNCA_TERRAFORM_STATE_BUCKET || 'junca-social-ecosystem-chain-tfstate-595710543956-us-east-1' }}
          DOMAIN_NAME: ${{ vars.JUNCA_PUBLIC_TESTNET_DOMAIN }}
          ROUTE53_ZONE_ID: ${{ vars.JUNCA_PUBLIC_TESTNET_ROUTE53_ZONE_ID }}
          NODE_AMI_ID: ${{ vars.JUNCA_PUBLIC_TESTNET_NODE_AMI_ID }}
          NODE_ARTIFACT_SHA256: ${{ vars.JUNCA_PUBLIC_TESTNET_NODE_SHA256 }}
          GENESIS_SHA256: ${{ vars.JUNCA_PUBLIC_TESTNET_GENESIS_SHA256 }}
          SOURCE_COMMIT: ${{ vars.JUNCA_PUBLIC_TESTNET_SOURCE_COMMIT }}
          AVAILABILITY_ZONES_JSON: ${{ vars.JUNCA_PUBLIC_TESTNET_AVAILABILITY_ZONES_JSON }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            STATE_BUCKET_NAME DOMAIN_NAME ROUTE53_ZONE_ID \
            NODE_AMI_ID NODE_ARTIFACT_SHA256 GENESIS_SHA256 SOURCE_COMMIT \
            AVAILABILITY_ZONES_JSON; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          ready=false
          if (( ${#missing[@]} == 0 )); then
            ready=true
          fi
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${missing[@]:-}" |
            jq -Rsc 'split("\n") | map(select(length > 0))' > artifacts/foundation-missing-inputs.json
          jq -n \
            --arg state "$([[ "$ready" == "true" ]] && echo READY || echo PENDING_INPUTS)" \
            --arg requested_phase "$REQUESTED_PHASE" \
            --argjson missing_inputs "$(cat artifacts/foundation-missing-inputs.json)" \
            '{
              schema_version: "1.0",
              chain_name: "JUNCA Social Ecosystem Chain",
              governance: "JAIOS Institutional Governance",
              notice: "Public Testnet / No Monetary Value",
              requested_phase: $requested_phase,
              foundation_state: $state,
              missing_inputs: $missing_inputs,
              foundation_apply_executed: false,
              public_services_enabled: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/foundation-input-readiness.json
          if [[ "$ready" != "true" && "$REQUESTED_PHASE" != "auto-release" ]]; then
            echo "Validator foundation inputs are incomplete" >&2
            exit 2
          fi


      - name: Apply guarded validator foundation
        if: >-
          (env.REQUESTED_PHASE == 'foundation-apply' || env.REQUESTED_PHASE == 'auto-release') &&
          steps.authorization.outputs.authorized == 'true' &&
          steps.foundation_inputs.outputs.ready == 'true'
        env:
          STATE_BUCKET_NAME: ${{ inputs.state_bucket_name || vars.JUNCA_TERRAFORM_STATE_BUCKET || 'junca-social-ecosystem-chain-tfstate-595710543956-us-east-1' }}
          DOMAIN_NAME: ${{ vars.JUNCA_PUBLIC_TESTNET_DOMAIN }}
          ROUTE53_ZONE_ID: ${{ vars.JUNCA_PUBLIC_TESTNET_ROUTE53_ZONE_ID }}
          NODE_AMI_ID: ${{ vars.JUNCA_PUBLIC_TESTNET_NODE_AMI_ID }}
          NODE_ARTIFACT_SHA256: ${{ vars.JUNCA_PUBLIC_TESTNET_NODE_SHA256 }}
          GENESIS_SHA256: ${{ vars.JUNCA_PUBLIC_TESTNET_GENESIS_SHA256 }}
          SOURCE_COMMIT: ${{ vars.JUNCA_PUBLIC_TESTNET_SOURCE_COMMIT }}
          AVAILABILITY_ZONES_JSON: ${{ vars.JUNCA_PUBLIC_TESTNET_AVAILABILITY_ZONES_JSON }}
        run: bash scripts/junca_public_testnet_foundation.sh foundation-apply

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-aws-foundation-execution-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
