name: JUNCA Chain AWS Foundation Execution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-social-ecosystem-chain-aws-foundation-execution.yml"
      - "config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json"
      - "infra/aws/bootstrap/**"
      - "infra/aws/public-testnet/**"
  workflow_dispatch:
    inputs:
      phase:
        description: Safe foundation phase
        required: true
        default: permission-readback
        type: choice
        options:
          - permission-readback
          - bootstrap-plan
          - foundation-plan
          - bootstrap-apply
          - foundation-apply
      apply_confirmation:
        description: Exact apply confirmation; ignored for readback and plan
        required: false
        type: string
      approved_change_reference:
        description: Immutable approval or change reference for apply
        required: false
        type: string
      state_bucket_name:
        description: Globally unique canonical Terraform state bucket
        required: false
        type: string
      github_oidc_thumbprint:
        description: Independently verified lowercase SHA-1 OIDC thumbprint
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  permission-readback:
    environment: public-testnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_NAME: JuncaChainPublicTestnetDeployment
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      REQUESTED_PHASE: ${{ inputs.phase || 'permission-readback' }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce Public Testnet execution boundary
        run: |
          set -euo pipefail
          test "$AWS_ACCOUNT_ID" = "595710543956"
          test "$AWS_REGION" = "us-east-1"
          test "$DEPLOYMENT_ROLE_ARN" = \
            "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment"
          jq -e '
            .notice == "Public Testnet / No Monetary Value" and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-foundation-${{ github.run_id }}

      - name: Read back identity and required permissions
        id: permissions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          actual_arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "$actual_account" = "$AWS_ACCOUNT_ID"
          case "$actual_arn" in
            arn:aws:sts::595710543956:assumed-role/JuncaChainPublicTestnetDeployment/*) ;;
            *) echo "Unexpected deployment identity" >&2; exit 1 ;;
          esac

          actions_json='[
            "s3:CreateBucket",
            "s3:PutBucketVersioning",
            "s3:PutEncryptionConfiguration",
            "s3:PutBucketPublicAccessBlock",
            "dynamodb:CreateTable",
            "dynamodb:UpdateContinuousBackups",
            "kms:CreateKey",
            "kms:CreateAlias",
            "ec2:CreateVpc",
            "ec2:CreateSubnet",
            "ec2:CreateVpcEndpoint",
            "ec2:CreateSecurityGroup",
            "ec2:RunInstances",
            "iam:CreateRole",
            "iam:CreateInstanceProfile",
            "iam:PassRole"
          ]'
          mapfile -t required_actions < <(jq -r '.[]' <<<"$actions_json")

          simulation_state="UNAVAILABLE"
          simulation_error=""
          simulation_json='[]'
          if raw="$(aws iam simulate-principal-policy \
              --policy-source-arn "$DEPLOYMENT_ROLE_ARN" \
              --action-names "${required_actions[@]}" \
              --output json 2>artifacts/permission-simulation.stderr)"; then
            simulation_state="AVAILABLE"
            simulation_json="$(jq '[.EvaluationResults[] | {
              action: .EvalActionName,
              decision: .EvalDecision
            }]' <<<"$raw")"
          else
            simulation_error="$(tr '\n' ' ' < artifacts/permission-simulation.stderr | cut -c1-500)"
          fi

          allowed_count="$(jq '[.[] | select(.decision == "allowed")] | length' <<<"$simulation_json")"
          required_count="$(jq 'length' <<<"$actions_json")"
          if [[ "$simulation_state" == "AVAILABLE" && "$allowed_count" == "$required_count" ]]; then
            permission_gate="PASS"
          elif [[ "$simulation_state" == "AVAILABLE" ]]; then
            permission_gate="FAIL"
          else
            permission_gate="UNVERIFIED"
          fi

          jq -n \
            --arg account_id "$actual_account" \
            --arg assumed_role_arn "$actual_arn" \
            --arg region "$AWS_REGION" \
            --arg deployment_role_arn "$DEPLOYMENT_ROLE_ARN" \
            --arg requested_phase "$REQUESTED_PHASE" \
            --arg simulation_state "$simulation_state" \
            --arg simulation_error "$simulation_error" \
            --arg permission_gate "$permission_gate" \
            --argjson required_actions "$actions_json" \
            --argjson permission_results "$simulation_json" \
            '{
              schema_version: "1.0",
              chain_name: "JUNCA Social Ecosystem Chain",
              governance: "JAIOS Institutional Governance",
              notice: "Public Testnet / No Monetary Value",
              account_id: $account_id,
              region: $region,
              deployment_role_arn: $deployment_role_arn,
              assumed_role_arn: $assumed_role_arn,
              requested_phase: $requested_phase,
              required_actions: $required_actions,
              permission_simulation: {
                state: $simulation_state,
                error: $simulation_error,
                results: $permission_results
              },
              permission_gate: $permission_gate,
              apply_executed: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/aws-foundation-permission-readback.json
          echo "permission_gate=$permission_gate" >> "$GITHUB_OUTPUT"

      - name: Validate apply authorization
        id: authorization
        env:
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
          APPROVED_CHANGE_REFERENCE: ${{ inputs.approved_change_reference }}
        run: |
          set -euo pipefail
          config_authorized="$(jq -r '.apply_authorized' \
            config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json)"
          apply_requested=false
          case "$REQUESTED_PHASE" in
            bootstrap-apply|foundation-apply) apply_requested=true ;;
          esac
          authorized=false
          if [[ "$apply_requested" == "true" ]]; then
            test "$config_authorized" = "true"
            test "${{ steps.permissions.outputs.permission_gate }}" = "PASS"
            test "$APPLY_CONFIRMATION" = "PUBLIC-TESTNET-FOUNDATION-APPLY"
            test -n "$APPROVED_CHANGE_REFERENCE"
            authorized=true
          fi
          echo "apply_requested=$apply_requested" >> "$GITHUB_OUTPUT"
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: contains(fromJSON('["bootstrap-plan","foundation-plan"]'), env.REQUESTED_PHASE)
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Produce bootstrap plan
        if: env.REQUESTED_PHASE == 'bootstrap-plan'
        env:
          STATE_BUCKET_NAME: ${{ inputs.state_bucket_name }}
          GITHUB_OIDC_THUMBPRINT: ${{ inputs.github_oidc_thumbprint }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET_NAME"
          [[ "$STATE_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$GITHUB_OIDC_THUMBPRINT" =~ ^[0-9a-f]{40}$ ]]
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra/aws/bootstrap plan -input=false -lock=false \
            -var="aws_account_id=$AWS_ACCOUNT_ID" \
            -var="aws_region=$AWS_REGION" \
            -var="state_bucket_name=$STATE_BUCKET_NAME" \
            -var="github_oidc_thumbprint=$GITHUB_OIDC_THUMBPRINT" \
            -out="$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan"
          terraform -chdir=infra/aws/bootstrap show -json \
            "$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan" \
            > artifacts/bootstrap-plan.json

      - name: Require immutable runtime inputs before foundation plan
        if: env.REQUESTED_PHASE == 'foundation-plan'
        run: |
          set -euo pipefail
          jq -e '
            [.gates[] | select(.gate == "state_backend" or
              .gate == "validator_signers" or .gate == "immutable_runtime") |
              .state] | all(. == "PASS")
          ' config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json

      - name: Fail closed before any apply
        if: steps.authorization.outputs.apply_requested == 'true'
        run: |
          echo "Apply is intentionally unavailable while apply_authorized=false."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: junca-aws-foundation-execution-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
