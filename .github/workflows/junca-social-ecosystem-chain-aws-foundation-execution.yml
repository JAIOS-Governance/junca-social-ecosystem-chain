name: JUNCA Chain AWS Foundation Execution

on:
  workflow_run:
    workflows:
      - "JUNCA Chain Runtime Self Permission Recovery"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-social-ecosystem-chain-aws-foundation-execution.yml"
      - "config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json"
      - "infra/aws/bootstrap/**"
      - "infra/aws/public-testnet/**"
  workflow_dispatch:
    inputs:
      phase:
        description: Safe foundation phase
        required: true
        default: permission-readback
        type: choice
        options:
          - permission-readback
          - bootstrap-plan
          - foundation-plan
          - bootstrap-apply
          - foundation-apply
      apply_confirmation:
        description: Exact apply confirmation; ignored for readback and plan
        required: false
        type: string
      approved_change_reference:
        description: Immutable approval or change reference for apply
        required: false
        type: string
      state_bucket_name:
        description: Globally unique canonical Terraform state bucket
        required: false
        type: string
      github_oidc_thumbprint:
        description: Independently verified lowercase SHA-1 OIDC thumbprint
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  recovery-evidence:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact triggering recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: junca-runtime-self-permission-recovery-${{ github.event.workflow_run.id }}
          path: artifacts/recovery
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Require verified recovery before automatic resume
        run: |
          set -euo pipefail
          evidence=artifacts/recovery/runtime-self-permission-recovery.json
          jq -e '
            .account_id == "595710543956" and
            .region == "us-east-1" and
            .target_role_arn ==
              "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment" and
            .granted_action == "iam:SimulatePrincipalPolicy" and
            (.recovery_result == "APPLIED" or
             .recovery_result == "PRESENT") and
            .verification == "PASS" and
            .broad_iam_grant == false and
            .docs_runtime_role_used == false and
            .apply_executed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' "$evidence"

  permission-readback:
    needs:
      - recovery-evidence
    if: >-
      always() &&
      (github.event_name != 'workflow_run' ||
       needs.recovery-evidence.result == 'success')
    environment: public-testnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_NAME: JuncaChainPublicTestnetDeployment
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      REQUESTED_PHASE: ${{ github.event_name == 'workflow_run' && 'bootstrap-plan' || inputs.phase || 'permission-readback' }}
      AUTO_RESUME: ${{ github.event_name == 'workflow_run' }}
      RECOVERY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce Public Testnet execution boundary
        run: |
          set -euo pipefail
          test "$AWS_ACCOUNT_ID" = "595710543956"
          test "$AWS_REGION" = "us-east-1"
          test "$DEPLOYMENT_ROLE_ARN" = \
            "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment"
          jq -e '
            .notice == "Public Testnet / No Monetary Value" and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-foundation-${{ github.run_id }}

      - name: Read back identity and required permissions
        id: permissions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          actual_arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "$actual_account" = "$AWS_ACCOUNT_ID"
          case "$actual_arn" in
            arn:aws:sts::595710543956:assumed-role/JuncaChainPublicTestnetDeployment/*) ;;
            *) echo "Unexpected deployment identity" >&2; exit 1 ;;
          esac

          actions_json='[
            "s3:CreateBucket",
            "s3:PutBucketVersioning",
            "s3:PutEncryptionConfiguration",
            "s3:PutBucketPublicAccessBlock",
            "dynamodb:CreateTable",
            "dynamodb:UpdateContinuousBackups",
            "kms:CreateKey",
            "kms:CreateAlias",
            "ec2:CreateVpc",
            "ec2:CreateSubnet",
            "ec2:CreateVpcEndpoint",
            "ec2:CreateSecurityGroup",
            "ec2:RunInstances",
            "iam:CreateRole",
            "iam:CreateInstanceProfile",
            "iam:PassRole"
          ]'
          mapfile -t required_actions < <(jq -r '.[]' <<<"$actions_json")

          simulation_state="UNAVAILABLE"
          simulation_error=""
          simulation_json='[]'
          if raw="$(aws iam simulate-principal-policy \
              --policy-source-arn "$DEPLOYMENT_ROLE_ARN" \
              --action-names "${required_actions[@]}" \
              --output json 2>artifacts/permission-simulation.stderr)"; then
            simulation_state="AVAILABLE"
            simulation_json="$(jq '[.EvaluationResults[] | {
              action: .EvalActionName,
              decision: .EvalDecision
            }]' <<<"$raw")"
          else
            simulation_error="$(tr '\n' ' ' < artifacts/permission-simulation.stderr | cut -c1-500)"
          fi

          allowed_count="$(jq '[.[] | select(.decision == "allowed")] | length' <<<"$simulation_json")"
          required_count="$(jq 'length' <<<"$actions_json")"
          if [[ "$simulation_state" == "AVAILABLE" && "$allowed_count" == "$required_count" ]]; then
            permission_gate="PASS"
          elif [[ "$simulation_state" == "AVAILABLE" ]]; then
            permission_gate="FAIL"
          else
            permission_gate="UNVERIFIED"
          fi

          jq -n \
            --arg account_id "$actual_account" \
            --arg assumed_role_arn "$actual_arn" \
            --arg region "$AWS_REGION" \
            --arg deployment_role_arn "$DEPLOYMENT_ROLE_ARN" \
            --arg requested_phase "$REQUESTED_PHASE" \
            --arg auto_resume "$AUTO_RESUME" \
            --arg recovery_run_id "$RECOVERY_RUN_ID" \
            --arg simulation_state "$simulation_state" \
            --arg simulation_error "$simulation_error" \
            --arg permission_gate "$permission_gate" \
            --argjson required_actions "$actions_json" \
            --argjson permission_results "$simulation_json" \
            '{
              schema_version: "1.0",
              chain_name: "JUNCA Social Ecosystem Chain",
              governance: "JAIOS Institutional Governance",
              notice: "Public Testnet / No Monetary Value",
              account_id: $account_id,
              region: $region,
              deployment_role_arn: $deployment_role_arn,
              assumed_role_arn: $assumed_role_arn,
              requested_phase: $requested_phase,
              orchestration: {
                auto_resume: ($auto_resume == "true"),
                recovery_run_id: $recovery_run_id
              },
              required_actions: $required_actions,
              permission_simulation: {
                state: $simulation_state,
                error: $simulation_error,
                results: $permission_results
              },
              permission_gate: $permission_gate,
              apply_executed: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/aws-foundation-permission-readback.json
          echo "permission_gate=$permission_gate" >> "$GITHUB_OUTPUT"

      - name: Validate apply authorization
        id: authorization
        env:
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
          APPROVED_CHANGE_REFERENCE: ${{ inputs.approved_change_reference }}
        run: |
          set -euo pipefail
          config_authorized="$(jq -r '.apply_authorized' \
            config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json)"
          apply_requested=false
          case "$REQUESTED_PHASE" in
            bootstrap-apply|foundation-apply) apply_requested=true ;;
          esac
          authorized=false
          if [[ "$apply_requested" == "true" ]]; then
            test "$config_authorized" = "true"
            test "${{ steps.permissions.outputs.permission_gate }}" = "PASS"
            test "$APPLY_CONFIRMATION" = "PUBLIC-TESTNET-FOUNDATION-APPLY"
            test -n "$APPROVED_CHANGE_REFERENCE"
            authorized=true
          fi
          echo "apply_requested=$apply_requested" >> "$GITHUB_OUTPUT"
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: contains(fromJSON('["bootstrap-plan","foundation-plan","bootstrap-apply","foundation-apply"]'), env.REQUESTED_PHASE)
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Require permission PASS before any plan
        if: contains(fromJSON('["bootstrap-plan","foundation-plan","bootstrap-apply","foundation-apply"]'), env.REQUESTED_PHASE)
        run: |
          set -euo pipefail
          test "${{ steps.permissions.outputs.permission_gate }}" = "PASS"

      - name: Produce guarded bootstrap plan
        if: contains(fromJSON('["bootstrap-plan","bootstrap-apply"]'), env.REQUESTED_PHASE)
        env:
          STATE_BUCKET_NAME: ${{ inputs.state_bucket_name || vars.JUNCA_TERRAFORM_STATE_BUCKET }}
          GITHUB_OIDC_THUMBPRINT: ${{ inputs.github_oidc_thumbprint || vars.JUNCA_GITHUB_OIDC_THUMBPRINT }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET_NAME"
          [[ "$STATE_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$GITHUB_OIDC_THUMBPRINT" =~ ^[0-9a-f]{40}$ ]]
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false

          # Import canonical resources that predate Terraform ownership.
          if aws iam get-role --role-name JuncaChainPublicTestnetDeployment >/dev/null 2>&1; then
            terraform -chdir=infra/aws/bootstrap import \
              -var="aws_account_id=$AWS_ACCOUNT_ID" \
              -var="aws_region=$AWS_REGION" \
              -var="state_bucket_name=$STATE_BUCKET_NAME" \
              -var="github_oidc_thumbprint=$GITHUB_OIDC_THUMBPRINT" \
              aws_iam_role.deployment JuncaChainPublicTestnetDeployment
          fi
          oidc_arn="arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com"
          if aws iam get-open-id-connect-provider \
              --open-id-connect-provider-arn "$oidc_arn" >/dev/null 2>&1; then
            terraform -chdir=infra/aws/bootstrap import \
              -var="aws_account_id=$AWS_ACCOUNT_ID" \
              -var="aws_region=$AWS_REGION" \
              -var="state_bucket_name=$STATE_BUCKET_NAME" \
              -var="github_oidc_thumbprint=$GITHUB_OIDC_THUMBPRINT" \
              aws_iam_openid_connect_provider.github "$oidc_arn"
          fi

          terraform -chdir=infra/aws/bootstrap plan -input=false -lock=false \
            -var="aws_account_id=$AWS_ACCOUNT_ID" \
            -var="aws_region=$AWS_REGION" \
            -var="state_bucket_name=$STATE_BUCKET_NAME" \
            -var="github_oidc_thumbprint=$GITHUB_OIDC_THUMBPRINT" \
            -out="$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan"
          terraform -chdir=infra/aws/bootstrap show -json \
            "$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan" \
            > artifacts/bootstrap-plan.json
          jq -e '[.resource_changes[]?.change.actions | select(index("delete"))] | length == 0' \
            artifacts/bootstrap-plan.json
          cp infra/aws/bootstrap/terraform.tfstate artifacts/bootstrap-preapply.tfstate

      - name: Require immutable runtime inputs before foundation plan
        if: env.REQUESTED_PHASE == 'foundation-plan'
        run: |
          set -euo pipefail
          jq -e '
            [.gates[] | select(.gate == "state_backend" or
              .gate == "validator_signers" or .gate == "immutable_runtime") |
              .state] | all(. == "PASS")
          ' config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json

      - name: Apply bootstrap and migrate durable state
        if: >-
          env.REQUESTED_PHASE == 'bootstrap-apply' &&
          steps.authorization.outputs.authorized == 'true'
        env:
          STATE_BUCKET_NAME: ${{ inputs.state_bucket_name || vars.JUNCA_TERRAFORM_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/bootstrap apply -input=false -auto-approve \
            "$GITHUB_WORKSPACE/artifacts/bootstrap.tfplan"
          terraform -chdir=infra/aws/bootstrap output -json \
            > artifacts/bootstrap-outputs.json
          state_kms_key_arn="$(jq -er .state_kms_key_arn.value artifacts/bootstrap-outputs.json)"
          lock_table="$(jq -er .lock_table.value artifacts/bootstrap-outputs.json)"
          terraform -chdir=infra/aws/bootstrap init -input=false \
            -migrate-state -force-copy \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/bootstrap.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$lock_table" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$state_kms_key_arn"
          jq -e '
            .aws_account_id.value == "595710543956" and
            .aws_region.value == "us-east-1" and
            (.validator_signer_arns.value | length) == 3
          ' artifacts/bootstrap-outputs.json

      - name: Reject unimplemented foundation apply
        if: env.REQUESTED_PHASE == 'foundation-apply'
        run: |
          echo "Foundation apply remains fail-closed until bootstrap outputs are read back."
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-aws-foundation-execution-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
