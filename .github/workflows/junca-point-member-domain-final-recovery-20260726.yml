name: JUNCA POINT MEMBER Domain Final Recovery 20260726

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set AWS-compatible default OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub" --data '{"use_default":true}'

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: public-testnet
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      RECOVERY_ROLE_ARN: arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
    steps:
      - name: Assume recovered AWS deployment role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.RECOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: member-domain-final-${{ github.run_id }}
          disable-retry: true
      - name: Verify boundary and grant minimum DNS write
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          cat >/tmp/policy.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Sid":"MemberCustomDomainDnsWrite","Effect":"Allow","Action":"route53:ChangeResourceRecordSets","Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G","Condition":{"ForAllValues:StringEquals":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":["member.jaios-governance.org","_openai-site-verification.member.jaios-governance.org","_cf-custom-hostname.member.jaios-governance.org"],"route53:ChangeResourceRecordSetsRecordTypes":["CNAME","TXT"],"route53:ChangeResourceRecordSetsActions":["UPSERT"]}}},{"Sid":"Route53ChangeReadback","Effect":"Allow","Action":"route53:GetChange","Resource":"arn:aws:route53:::change/*"}]}
          JSON
          aws iam put-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name JuncaPointMemberCustomDomainDns --policy-document file:///tmp/policy.json
          aws iam get-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name JuncaPointMemberCustomDomainDns >/dev/null
      - name: Publish exact Sites-issued DNS records
        run: |
          set -euo pipefail
          cat >/tmp/change.json <<'JSON'
          {"Comment":"JUNCA POINT MEMBER production domain","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"member.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5HgL7ZV4WE4kuhT9OKEJZ4anM4cXQgaX4PcQrAyflGE\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"5747a89e-d114-42d8-b33b-b4eaae61c958\""}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = INSYNC
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='member.jaios-governance.org.' || Name=='_openai-site-verification.member.jaios-governance.org.' || Name=='_cf-custom-hostname.member.jaios-governance.org.']" --output json)"
          RECORDS="$records" python3 -c 'import json,os; rows={r["Name"]:r for r in json.loads(os.environ["RECORDS"])}; assert rows["member.jaios-governance.org."]["ResourceRecords"][0]["Value"]=="custom-domains.chatgpt.site."; assert "openai-site-verification=5HgL7ZV4WE4kuhT9OKEJZ4anM4cXQgaX4PcQrAyflGE" in rows["_openai-site-verification.member.jaios-governance.org."]["ResourceRecords"][0]["Value"]; assert "5747a89e-d114-42d8-b33b-b4eaae61c958" in rows["_cf-custom-hostname.member.jaios-governance.org."]["ResourceRecords"][0]["Value"]'

  restore:
    if: always()
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore canonical OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub" --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
