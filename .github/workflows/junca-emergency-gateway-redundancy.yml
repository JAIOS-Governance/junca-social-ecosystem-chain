name: JUNCA Emergency Gateway Redundancy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  restore-redundancy:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-gateway-redundancy-${{ github.run_id }}
      - name: Install and verify public gateways
        run: |
          set -euo pipefail
          install_script="$(cat <<'SCRIPT'
          set -euo pipefail
          rollback=/var/lib/junca/gateway-rollbacks/GITHUB_RUN_ID_PLACEHOLDER
          mkdir -p "$rollback"
          test ! -e /usr/local/bin/junca-public-gateway || cp -a /usr/local/bin/junca-public-gateway "$rollback/"
          for unit in junca-public-explorer.service junca-public-rpc.service; do test ! -e "/etc/systemd/system/$unit" || cp -a "/etc/systemd/system/$unit" "$rollback/"; done
          printf '%s\n' '#!/usr/bin/env python3' 'import sys' "sys.path.insert(0, '/usr/local/lib/junca')" 'from jaios.social_ecosystem_chain.public_gateway import main' 'raise SystemExit(main())' > /tmp/junca-public-gateway
          install -o root -g root -m 0755 /tmp/junca-public-gateway /usr/local/bin/junca-public-gateway
          printf '%s\n' '[Unit]' 'Description=JUNCA Public Testnet Finalized-only Explorer' 'After=junca-validator.service' 'Requires=junca-validator.service' '' '[Service]' 'Type=simple' 'ExecStart=/usr/local/bin/junca-public-gateway --upstream http://127.0.0.1:8545/ --http.addr 0.0.0.0 --http.port 3000' 'Restart=on-failure' 'RestartSec=5' 'NoNewPrivileges=true' 'PrivateTmp=true' 'ProtectSystem=strict' 'ProtectHome=true' '' '[Install]' 'WantedBy=multi-user.target' > /tmp/junca-public-explorer.service
          printf '%s\n' '[Unit]' 'Description=JUNCA Public Testnet Read-only RPC Gateway' 'After=junca-validator.service' 'Requires=junca-validator.service' '' '[Service]' 'Type=simple' 'ExecStart=/usr/local/bin/junca-public-gateway --upstream http://127.0.0.1:8545/ --http.addr 0.0.0.0 --http.port 8546' 'Restart=on-failure' 'RestartSec=5' 'NoNewPrivileges=true' 'PrivateTmp=true' 'ProtectSystem=strict' 'ProtectHome=true' '' '[Install]' 'WantedBy=multi-user.target' > /tmp/junca-public-rpc.service
          install -o root -g root -m 0644 /tmp/junca-public-explorer.service /etc/systemd/system/junca-public-explorer.service
          install -o root -g root -m 0644 /tmp/junca-public-rpc.service /etc/systemd/system/junca-public-rpc.service
          systemctl daemon-reload
          systemctl enable --now junca-public-explorer.service junca-public-rpc.service
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/tmp/explorer-health.json && curl -fsS http://127.0.0.1:8546/health >/tmp/rpc-health.json; then break; fi
            sleep 2
          done
          grep -q '"status":"healthy"' /tmp/explorer-health.json
          grep -q '"status":"healthy"' /tmp/rpc-health.json
          cat /tmp/explorer-health.json
          cat /tmp/rpc-health.json
          SCRIPT
          )"
          install_script="${install_script/GITHUB_RUN_ID_PLACEHOLDER/${GITHUB_RUN_ID}}"
          encoded="$(printf '%s' "$install_script" | base64 -w 0)"
          for instance in i-055763640261c47df i-054811d49cce9017b; do
            payload="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
            command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters "$payload" --query Command.CommandId --output text)"
            for attempt in $(seq 1 60); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success) break;; Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance"; exit 1;; esac; sleep 2; done
            test "$status" = Success
          done
      - name: Register redundant targets
        run: |
          set -euo pipefail
          explorer_tg='arn:aws:elasticloadbalancing:us-east-1:595710543956:targetgroup/junca-testnet-explorer/6be62899db298ed0'
          rpc_tg='arn:aws:elasticloadbalancing:us-east-1:595710543956:targetgroup/junca-testnet-rpc/f73d122c59c17130'
          targets=(Id=i-055763640261c47df Id=i-054811d49cce9017b)
          aws elbv2 register-targets --target-group-arn "$explorer_tg" --targets "${targets[@]}"
          aws elbv2 register-targets --target-group-arn "$rpc_tg" --targets "${targets[@]}"
          aws elbv2 wait target-in-service --target-group-arn "$explorer_tg" --targets "${targets[@]}"
          aws elbv2 wait target-in-service --target-group-arn "$rpc_tg" --targets "${targets[@]}"
          aws elbv2 describe-target-health --target-group-arn "$explorer_tg"
          aws elbv2 describe-target-health --target-group-arn "$rpc_tg"
      - name: Restart validator 01 after redundancy
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg c 'systemctl restart junca-validator.service; for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8545/health && exit 0; sleep 2; done; exit 1' '{commands:[$c]}')"
          instance=i-015288fae43f2b40f
          command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters "$payload" --query Command.CommandId --output text)"
          for attempt in $(seq 1 60); do status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"; case "$status" in Success) break;; Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance"; exit 1;; esac; sleep 2; done
          test "$status" = Success
          sleep 45
      - name: Public acceptance
        run: |
          set -euo pipefail
          for sample in $(seq 1 12); do
            explorer="$(curl -fsS --retry 3 https://explorer.jaios-governance.org/explorer.json)"
            health="$(curl -fsS --retry 3 https://health.jaios-governance.org/health)"
            rpc="$(curl -fsS --retry 3 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/)"
            grep -q '"status":"ready"' <<<"$explorer"
            grep -q '"status":"healthy"' <<<"$health"
            grep -q '"result":"0x1352773"' <<<"$rpc"
            grep -q '"signed_power":3' <<<"$explorer"
            grep -q '"total_power":3' <<<"$explorer"
            echo "sample=$sample accepted"
            sleep 2
          done
