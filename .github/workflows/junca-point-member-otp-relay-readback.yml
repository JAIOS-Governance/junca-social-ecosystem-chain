name: JUNCA POINT MEMBER OTP Relay Readback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-point-member-otp-relay-readback.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      RELAY_FUNCTION: junca-point-member-otp-relay
      EXECUTION_ROLE: JuncaPointMemberOtpRelayExecution
    steps:
      - name: Configure canonical AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-member-otp-readback-${{ github.run_id }}

      - name: Verify AWS resources and inspect relay package safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws sesv2 get-account > ses-account.json
          aws sesv2 list-email-identities > ses-identities.json
          aws iam get-role --role-name "$EXECUTION_ROLE" > execution-role.json
          aws lambda get-function --function-name "$RELAY_FUNCTION" > relay-function.json
          aws lambda get-function-configuration --function-name "$RELAY_FUNCTION" > relay-config.json
          aws lambda get-function-url-config --function-name "$RELAY_FUNCTION" > relay-url.json
          code_url="$(python3 -c 'import json; print(json.load(open("relay-function.json"))["Code"]["Location"])')"
          curl --silent --show-error --fail --location "$code_url" --output relay-package.zip
          mkdir relay-source
          unzip -q relay-package.zip -d relay-source
          find relay-source -maxdepth 2 -type f -printf '%P\n' | sort > relay-files.txt
          python3 - <<'PY' > relay-safe-inspection.txt
          import json, pathlib, re
          config=json.load(open('relay-config.json'))
          env=sorted(config.get('Environment',{}).get('Variables',{}).keys())
          print('Runtime:', config.get('Runtime'))
          print('Handler:', config.get('Handler'))
          print('LastModified:', config.get('LastModified'))
          print('Environment variable names:', ', '.join(env) or 'NONE')
          for p in pathlib.Path('relay-source').rglob('*'):
              if not p.is_file() or p.stat().st_size > 500000: continue
              try: text=p.read_text(errors='ignore')
              except Exception: continue
              routes=sorted(set(re.findall(r"['\"](?:/[^'\"]{0,80}|send|verify|otp|health)['\"]", text, re.I)))
              domains=sorted(set(re.findall(r'[A-Za-z0-9.-]+\.(?:org|group|site)', text)))
              print(f'File: {p.relative_to("relay-source")}')
              print('Route literals:', ', '.join(routes[:30]) or 'NONE')
              print('Domain literals:', ', '.join(domains[:30]) or 'NONE')
          PY

      - name: Publish non-secret evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import json
          ses=json.load(open('ses-account.json'))
          identities=json.load(open('ses-identities.json')).get('EmailIdentities',[])
          config=json.load(open('relay-config.json'))
          url=json.load(open('relay-url.json'))
          print('### JUNCA POINT MEMBER OTP relay AWS readback')
          print('- AWS Account: 595710543956')
          print(f"- SES Production Access: {ses.get('ProductionAccessEnabled')}")
          print(f"- SES Sending Enabled: {ses.get('SendingEnabled')}")
          print('- SES identities: ' + (', '.join(sorted(x.get('IdentityName','') for x in identities)) or 'NONE'))
          print('- Execution role: VERIFIED')
          print(f"- Relay runtime: {config.get('Runtime')} / {config.get('Handler')}")
          print(f"- Relay last modified: {config.get('LastModified')}")
          print(f"- Relay URL auth type: {url.get('AuthType')}")
          print(f"- Relay URL: {url.get('FunctionUrl')}")
          print('- Environment variable names: ' + ', '.join(sorted(config.get('Environment',{}).get('Variables',{}).keys())))
          print('\n```text')
          print(open('relay-safe-inspection.txt').read()[:6000])
          print('```')
          PY

      - name: Upload non-secret readback evidence
        uses: actions/upload-artifact@v4
        with:
          name: junca-point-member-otp-relay-inspection-${{ github.run_id }}
          path: |
            ses-account.json
            ses-identities.json
            execution-role.json
            relay-function.json
            relay-config.json
            relay-url.json
            relay-files.txt
            relay-safe-inspection.txt
          retention-days: 14
