name: JUNCA POINT MEMBER OTP Relay Readback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-point-member-otp-relay-readback.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      RELAY_FUNCTION: junca-point-member-otp-relay
      EXECUTION_ROLE: JuncaPointMemberOtpRelayExecution
    steps:
      - name: Configure canonical AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-member-otp-readback-${{ github.run_id }}

      - name: Verify AWS account and granted capabilities
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws sesv2 get-account > ses-account.json
          aws sesv2 list-email-identities > ses-identities.json
          aws iam get-role --role-name "$EXECUTION_ROLE" > execution-role.json 2>execution-role-error.txt || true
          aws lambda get-function --function-name "$RELAY_FUNCTION" > relay-function.json 2>relay-function-error.txt || true
          aws lambda get-function-url-config --function-name "$RELAY_FUNCTION" > relay-url.json 2>relay-url-error.txt || true

      - name: Publish non-secret evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          ses=json.load(open('ses-account.json'))
          identities=json.load(open('ses-identities.json')).get('EmailIdentities',[])
          sender=[]
          for x in identities:
              name=x.get('IdentityName','')
              if name in {'junca-global.group','desk@junca-global.group'}:
                  sender.append(name)
          role_exists=pathlib.Path('execution-role.json').exists()
          function_exists=pathlib.Path('relay-function.json').exists()
          url_exists=pathlib.Path('relay-url.json').exists()
          print('### JUNCA POINT MEMBER OTP relay AWS readback')
          print('- AWS Account: 595710543956')
          print(f"- SES Production Access: {ses.get('ProductionAccessEnabled')}")
          print(f"- SES Sending Enabled: {ses.get('SendingEnabled')}")
          print('- Approved sender identity present: ' + (', '.join(sender) if sender else 'NO'))
          print(f'- Execution role exists: {role_exists}')
          print(f'- Relay function exists: {function_exists}')
          print(f'- Relay Function URL exists: {url_exists}')
          PY

      - name: Upload non-secret readback evidence
        uses: actions/upload-artifact@v4
        with:
          name: junca-point-member-otp-relay-readback-${{ github.run_id }}
          path: |
            ses-account.json
            ses-identities.json
            execution-role.json
            execution-role-error.txt
            relay-function.json
            relay-function-error.txt
            relay-url.json
            relay-url-error.txt
          if-no-files-found: ignore
          retention-days: 14
