name: Chain Final Public Readback

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chain-final-public-readback.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chain-final-public-readback.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: chain-final-public-readback
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "595710543956"
  AWS_REGION: us-east-1
  ROUTE53_ZONE_ID: Z0336017285464TX0NT1G
  TARGET_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
  FALLBACK_ROLE_ARN: arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
  CHAIN_HOST: chain.jaios-governance.org
  CHAIN_URL: https://chain.jaios-governance.org/
  CHAIN_DISTRIBUTION_ID: E19R4RMVAZRYHJ
  CHAIN_DISTRIBUTION_ARN: arn:aws:cloudfront::595710543956:distribution/E19R4RMVAZRYHJ
  CHAIN_DISTRIBUTION_DOMAIN: d3kfivmi9y9cmp.cloudfront.net
  SHARED_FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/junca-chain-docs-routes-595710543956
  CONTENT_MARKER: 20260805-chain-institutional-trust
  DELIVERY_MARKER: 20260805-chain-institutional-trust-v2

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable readback scope
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'CHAIN_DISTRIBUTION_ID: E19R4RMVAZRYHJ' .github/workflows/chain-final-public-readback.yml
          grep -F 'CHAIN_DISTRIBUTION_DOMAIN: d3kfivmi9y9cmp.cloudfront.net' .github/workflows/chain-final-public-readback.yml
          grep -F 'Collect every public acceptance result' .github/workflows/chain-final-public-readback.yml

  readback:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: public-testnet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Acquire approved readback identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json" >/tmp/oidc-token
          selected=''
          for role in "$TARGET_ROLE_ARN" "$FALLBACK_ROLE_ARN"; do
            if aws sts assume-role-with-web-identity \
              --role-arn "$role" \
              --role-session-name "chain-final-readback-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/oidc-token)" \
              --duration-seconds 2400 >/tmp/assume.json 2>/tmp/assume.err; then
              selected="$role"; break
            fi
          done
          test -n "$selected"
          echo "AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/assume.json)" >> "$GITHUB_ENV"
          echo "selected_role=$selected" >> "$GITHUB_OUTPUT"
      - name: Collect every public acceptance result
        env:
          SELECTED_ROLE: ${{ steps.identity.outputs.selected_role }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/chain-final-readback evidence/production
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-distribution --id "$CHAIN_DISTRIBUTION_ID" >/tmp/chain-final-readback/distribution.json
          aws cloudfront get-distribution-config --id "$CHAIN_DISTRIBUTION_ID" >/tmp/chain-final-readback/distribution-config.json
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$ROUTE53_ZONE_ID" \
            --start-record-name "$CHAIN_HOST" \
            --start-record-type CNAME \
            --max-items 1 >/tmp/chain-final-readback/route53.json
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path

          root=Path('/tmp/chain-final-readback')
          host=os.environ['CHAIN_HOST']; url=os.environ['CHAIN_URL']
          expected_domain=os.environ['CHAIN_DISTRIBUTION_DOMAIN']
          content=os.environ['CONTENT_MARKER']; delivery=os.environ['DELIVERY_MARKER']
          results={}
          def run(name,cmd,timeout=60):
              try:
                  p=subprocess.run(cmd,text=True,capture_output=True,timeout=timeout)
                  results[name]={'passed':p.returncode==0,'returncode':p.returncode,'stdout':p.stdout[-4000:],'stderr':p.stderr[-4000:]}
                  return p
              except Exception as exc:
                  results[name]={'passed':False,'error':repr(exc)}
                  return None

          distribution=json.loads((root/'distribution.json').read_text())['Distribution']
          config=json.loads((root/'distribution-config.json').read_text())['DistributionConfig']
          route53=json.loads((root/'route53.json').read_text())['ResourceRecordSets'][0]
          aliases=(distribution.get('DistributionConfig',{}).get('Aliases') or {}).get('Items',[])
          associations=(config.get('DefaultCacheBehavior',{}).get('FunctionAssociations') or {}).get('Items',[])
          results['distribution']={'passed':distribution.get('Id')==os.environ['CHAIN_DISTRIBUTION_ID'] and distribution.get('ARN')==os.environ['CHAIN_DISTRIBUTION_ARN'] and distribution.get('DomainName')==expected_domain and distribution.get('Status')=='Deployed' and distribution.get('DistributionConfig',{}).get('Enabled') is True and host in aliases}
          results['function_association']={'passed':sum(1 for x in associations if x.get('FunctionARN')==os.environ['SHARED_FUNCTION_ARN'] and x.get('EventType')=='viewer-request')==1,'items':associations}
          results['zero_ttl']={'passed':all(config.get('DefaultCacheBehavior',{}).get(k)==0 for k in ('MinTTL','DefaultTTL','MaxTTL'))}
          r53_value=((route53.get('ResourceRecords') or [{}])[0].get('Value','')).rstrip('.')
          results['route53']={'passed':route53.get('Name')==host+'.' and route53.get('Type')=='CNAME' and r53_value==expected_domain,'record':route53}

          resolver_values={}
          for resolver in ('1.1.1.1','8.8.8.8'):
              value=''
              for _ in range(12):
                  p=subprocess.run(['dig','+short','@'+resolver,host,'CNAME'],text=True,capture_output=True)
                  value='\n'.join(sorted({x.rstrip('.') for x in p.stdout.splitlines() if x.strip()}))
                  if value==expected_domain: break
                  time.sleep(5)
              resolver_values[resolver]=value
          results['resolver_cname']={'passed':all(v==expected_domain for v in resolver_values.values()),'values':resolver_values}

          public=root/'public.html'; headers=root/'public-headers.txt'
          p=run('public_http',['curl','--fail-with-body','--silent','--show-error','--location','--max-time','60','-H','Cache-Control: no-cache','-H','Pragma: no-cache','--dump-header',str(headers),'--output',str(public),url+'?readback='+os.environ['GITHUB_RUN_ID']],75)
          html=public.read_text(encoding='utf-8',errors='replace') if public.exists() else ''
          results['content_markers']={'passed':f"data-jsec-trust-release='{content}'" in html and f'official-surface-release" content="{delivery}' in html and 'Managed under JAIOS Institutional Governance' in html and 'JAIOS Institutional Governanceの管理基準' in html}
          prohibited=('JUNCA Point','Point交換','revenue model','revenue allocation','収益モデル','収益配分')
          results['closed_information']={'passed':not any(x.lower() in html.lower() for x in prohibited)}

          tls=root/'tls.txt'
          run('tls',['bash','-lc',f"openssl s_client -connect {host}:443 -servername {host} </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName > {tls}"])
          tls_text=tls.read_text(errors='replace') if tls.exists() else ''
          results['tls_san']={'passed':f'DNS:{host}' in tls_text,'readback':tls_text}

          for surface,endpoint,needle in [
              ('robots','https://'+host+'/robots.txt','Sitemap: https://chain.jaios-governance.org/sitemap.xml'),
              ('sitemap','https://'+host+'/sitemap.xml','<loc>https://chain.jaios-governance.org/</loc>'),
              ('jaios','https://jaios-governance.org/','JAIOS Institutional Governance'),
              ('docs','https://docs.jaios-governance.org/','JUNCA Social Ecosystem Chain'),
          ]:
              out=root/(surface+'.txt')
              run(surface+'_http',['curl','--fail-with-body','--silent','--show-error','--location','--max-time','60','--output',str(out),endpoint],75)
              text=out.read_text(encoding='utf-8',errors='replace') if out.exists() else ''
              results[surface+'_content']={'passed':needle in text}

          route_results={}
          for route in ('context','foundation','build','possibilities','ecosystem','experience','governance','evidence','contact'):
              out=root/('route-'+route+'.html')
              p=run('route_'+route,['curl','--fail-with-body','--silent','--show-error','--location','--max-time','60','--output',str(out),'https://'+host+'/'+route],75)
              route_results[route]=bool(p and p.returncode==0 and out.exists() and out.stat().st_size>100)
          results['protected_routes']={'passed':all(route_results.values()),'routes':route_results}
          (root/'checks-prebrowser.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Collect browser matrix without losing failure evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import json,traceback
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          root=Path('/tmp/chain-final-readback')
          profiles=[
              ('desktop',1440,1800,3,None),
              ('android-tablet',820,1500,2,'Mozilla/5.0 (Linux; Android 13; Tablet) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0 Mobile Safari/537.36'),
              ('iphone',390,1300,1,'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'),
          ]
          records=[]
          for label,width,height,expected,ua in profiles:
              record={'profile':label,'expected_columns':expected,'passed':False}
              options=webdriver.ChromeOptions(); options.add_argument('--headless=new'); options.add_argument('--no-sandbox'); options.add_argument('--disable-dev-shm-usage'); options.add_argument('--disable-gpu')
              if ua: options.add_argument('--user-agent='+ua)
              driver=None
              try:
                  driver=webdriver.Chrome(options=options); driver.set_window_size(width,height)
                  driver.get('https://chain.jaios-governance.org/?browser_readback='+label)
                  WebDriverWait(driver,60).until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'[data-jsec-trust-release="20260805-chain-institutional-trust"]'))==1)
                  trust=driver.find_element(By.CSS_SELECTOR,'[data-jsec-trust-release="20260805-chain-institutional-trust"]')
                  grid=driver.find_element(By.CSS_SELECTOR,'.jsec-institutional-trust-grid')
                  columns=driver.execute_script("return getComputedStyle(arguments[0]).gridTemplateColumns.split(' ').filter(Boolean).length",grid)
                  record.update({'actual_columns':columns,'english':('Managed under JAIOS Institutional Governance' in trust.text),'japanese':('JAIOS Institutional Governanceの管理基準' in trust.text)})
                  record['passed']=columns==expected and record['english'] and record['japanese']
                  driver.save_screenshot(str(root/(label+'.png')))
              except Exception as exc:
                  record['error']=repr(exc); record['traceback']=traceback.format_exc()[-3000:]
              finally:
                  if driver: driver.quit()
              records.append(record)
          (root/'browser-results.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(records,ensure_ascii=False))
          PY
      - name: Build and persist final evidence
        env:
          SELECTED_ROLE: ${{ steps.identity.outputs.selected_role }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/tmp/chain-final-readback')
          checks=json.loads((root/'checks-prebrowser.json').read_text())
          browser=json.loads((root/'browser-results.json').read_text())
          checks['browser_matrix']={'passed':all(x.get('passed') is True for x in browser),'profiles':browser}
          accepted=all(value.get('passed') is True for value in checks.values())
          evidence={
              'schema':'official-surface-final-acceptance/v7',
              'observed_at':datetime.now(timezone.utc).isoformat(),
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'source_commit':os.environ['GITHUB_SHA'],
              'selected_role':os.environ['SELECTED_ROLE'],
              'public_url':'https://chain.jaios-governance.org/',
              'distribution_id':os.environ['CHAIN_DISTRIBUTION_ID'],
              'distribution_domain':os.environ['CHAIN_DISTRIBUTION_DOMAIN'],
              'content_marker':os.environ['CONTENT_MARKER'],
              'delivery_marker':os.environ['DELIVERY_MARKER'],
              'checks':checks,
              'protected_boundaries':{'mainnet_changed':False,'assets_moved':False,'bridge_activated':False,'validator_changed':False,'native_sites_origin_preserved':True},
              'result':'PRODUCTION_ACCEPTED' if accepted else 'NOT_ACCEPTED',
          }
          Path('evidence/production/official-surface-convergence-latest.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          Path('evidence/production/chain-final-public-readback-latest.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(evidence,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/production/official-surface-convergence-latest.json evidence/production/chain-final-public-readback-latest.json
          git diff --cached --quiet || git commit -m "Record Chain final public readback ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chain-final-public-readback-${{ github.run_id }}
          path: |
            /tmp/chain-final-readback
            evidence/production/official-surface-convergence-latest.json
            evidence/production/chain-final-public-readback-latest.json
          if-no-files-found: warn
          retention-days: 90
