name: JUNCA POINT MEMBER OTP Relay Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    timeout-minutes: 12
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      FUNCTION_NAME: junca-point-member-otp-relay
      EXECUTION_ROLE: JuncaPointMemberOtpRelayExecution
    steps:
      - name: Configure canonical AWS identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-member-otp-deploy-${{ github.run_id }}

      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Build relay package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cat > package/lambda_function.py <<'PY'
          import base64
          import json
          import os
          import re
          import smtplib
          import ssl
          import time
          from email.message import EmailMessage

          ALLOWED_ORIGIN = "https://member.jaios-governance.org"
          SMTP_HOST = "sv13461.xserver.jp"
          SMTP_USER = "desk@junca-global.group"
          SMTP_FROM = "desk@junca-global.group"
          RATE = {}

          def response(status, body):
              return {
                  "statusCode": status,
                  "headers": {
                      "content-type": "application/json; charset=utf-8",
                      "access-control-allow-origin": ALLOWED_ORIGIN,
                      "access-control-allow-methods": "POST,OPTIONS",
                      "access-control-allow-headers": "content-type",
                      "cache-control": "no-store",
                      "x-content-type-options": "nosniff"
                  },
                  "body": json.dumps(body, ensure_ascii=False)
              }

          def parse_body(event):
              raw = event.get("body") or "{}"
              if event.get("isBase64Encoded"):
                  raw = base64.b64decode(raw).decode("utf-8")
              return json.loads(raw)

          def allowed(ip):
              now = time.time()
              recent = [t for t in RATE.get(ip, []) if now - t < 600]
              if len(recent) >= 5:
                  RATE[ip] = recent
                  return False
              recent.append(now)
              RATE[ip] = recent
              return True

          def send_mail(password, recipient, code):
              msg = EmailMessage()
              msg["From"] = f"JUNCA Global Desk <{SMTP_FROM}>"
              msg["To"] = recipient
              msg["Subject"] = "JUNCA POINT MEMBER 認証コード"
              msg.set_content(
                  "JUNCA POINT MEMBER ログイン認証コード\n\n"
                  f"認証コード：{code}\n\n"
                  "このコードは10分間有効です。\n"
                  "心当たりがない場合は、このメールを破棄してください。\n"
              )
              context = ssl.create_default_context()
              try:
                  with smtplib.SMTP_SSL(SMTP_HOST, 465, timeout=18, context=context) as smtp:
                      smtp.login(SMTP_USER, password)
                      smtp.send_message(msg)
                      return
              except Exception as first:
                  try:
                      with smtplib.SMTP(SMTP_HOST, 587, timeout=18) as smtp:
                          smtp.ehlo()
                          smtp.starttls(context=context)
                          smtp.ehlo()
                          smtp.login(SMTP_USER, password)
                          smtp.send_message(msg)
                          return
                  except Exception as second:
                      raise RuntimeError(f"SMTP delivery failed: {type(first).__name__}/{type(second).__name__}")

          def lambda_handler(event, context):
              method = ((event.get("requestContext") or {}).get("http") or {}).get("method", "POST")
              origin = ((event.get("headers") or {}).get("origin") or "").rstrip("/")
              if method == "OPTIONS":
                  return response(204, {})
              if method != "POST" or origin != ALLOWED_ORIGIN:
                  return response(403, {"ok": False, "error": "forbidden"})
              ip = ((event.get("requestContext") or {}).get("http") or {}).get("sourceIp", "unknown")
              if not allowed(ip):
                  return response(429, {"ok": False, "error": "rate_limited"})
              try:
                  data = parse_body(event)
                  password = str(data.get("password") or "")
                  recipient = str(data.get("to") or "").strip().lower()
                  code = str(data.get("code") or "").strip()
                  if len(password) < 8:
                      return response(400, {"ok": False, "error": "invalid_request"})
                  if not re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+", recipient):
                      return response(400, {"ok": False, "error": "invalid_request"})
                  if not re.fullmatch(r"\d{6}", code):
                      return response(400, {"ok": False, "error": "invalid_request"})
                  send_mail(password, recipient, code)
                  return response(200, {"ok": True})
              except Exception as exc:
                  print(json.dumps({"event": "delivery_error", "type": type(exc).__name__}))
                  return response(502, {"ok": False, "error": "delivery_failed"})
          PY
          (cd package && zip -q ../relay.zip lambda_function.py)

      - name: Create or update execution role
        shell: bash
        run: |
          set -euo pipefail
          cat > trust.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}
          JSON
          if ! aws iam get-role --role-name "$EXECUTION_ROLE" >/dev/null 2>&1; then
            aws iam create-role --role-name "$EXECUTION_ROLE" --assume-role-policy-document file://trust.json >/dev/null
          fi
          cat > logs-policy.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["logs:CreateLogGroup","logs:CreateLogStream","logs:PutLogEvents"],"Resource":"arn:aws:logs:us-east-1:595710543956:*"}]}
          JSON
          aws iam put-role-policy --role-name "$EXECUTION_ROLE" --policy-name LambdaBasicLogs --policy-document file://logs-policy.json
          for attempt in 1 2 3 4 5; do
            role_arn="$(aws iam get-role --role-name "$EXECUTION_ROLE" --query 'Role.Arn' --output text)"
            test -n "$role_arn" && break
            sleep 3
          done
          echo "ROLE_ARN=$role_arn" >> "$GITHUB_ENV"

      - name: Create or update relay function
        shell: bash
        run: |
          set -euo pipefail
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://relay.zip >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            aws lambda update-function-configuration --function-name "$FUNCTION_NAME" --runtime python3.12 --handler lambda_function.lambda_handler --timeout 45 --memory-size 256 >/dev/null
          else
            for attempt in 1 2 3 4 5 6; do
              if aws lambda create-function --function-name "$FUNCTION_NAME" --runtime python3.12 --handler lambda_function.lambda_handler --role "$ROLE_ARN" --zip-file fileb://relay.zip --timeout 45 --memory-size 256 >/dev/null 2>create-error.txt; then
                break
              fi
              if [ "$attempt" = 6 ]; then cat create-error.txt; exit 1; fi
              sleep 5
            done
          fi
          aws lambda wait function-active-v2 --function-name "$FUNCTION_NAME"

      - name: Create public HTTPS relay URL
        shell: bash
        run: |
          set -euo pipefail
          if ! aws lambda get-function-url-config --function-name "$FUNCTION_NAME" > relay-url.json 2>/dev/null; then
            aws lambda create-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE \
              --cors '{"AllowOrigins":["https://member.jaios-governance.org"],"AllowMethods":["POST"],"AllowHeaders":["content-type"],"MaxAge":300}' \
              > relay-url.json
          fi
          aws lambda add-permission --function-name "$FUNCTION_NAME" --statement-id FunctionURLAllowPublicAccess --action lambda:InvokeFunctionUrl --principal '*' --function-url-auth-type NONE >/dev/null 2>&1 || true
          aws lambda add-permission --function-name "$FUNCTION_NAME" --statement-id FunctionURLAllowInvoke --action lambda:InvokeFunction --principal '*' --invoked-via-function-url >/dev/null 2>&1 || true
          relay_url="$(python3 -c 'import json; print(json.load(open("relay-url.json"))["FunctionUrl"])')"
          echo "RELAY_URL=$relay_url" >> "$GITHUB_ENV"
          echo "### JUNCA POINT MEMBER OTP Relay" >> "$GITHUB_STEP_SUMMARY"
          echo "- AWS account: 595710543956" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function: $FUNCTION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function URL: $relay_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sender: desk@junca-global.group" >> "$GITHUB_STEP_SUMMARY"

      - name: Health and security checks
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output response.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --header 'origin: https://invalid.example' --data '{}' "$RELAY_URL")"
          test "$status" = "403"
          test "$(python3 -c 'import json; print(json.load(open("response.json"))["error"])')" = "forbidden"
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query '{State:State,LastUpdateStatus:LastUpdateStatus,Runtime:Runtime,Timeout:Timeout}' --output json
