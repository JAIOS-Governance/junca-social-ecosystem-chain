name: JUNCA Social Ecosystem Chain AWS Canonical Readback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-social-ecosystem-chain-aws-readback.yml"
  workflow_dispatch:
    inputs:
      role_arn:
        description: Canonical OIDC deployment role ARN from bootstrap output
        required: true
        type: string
      expected_account_id:
        description: Independently read back 12-digit AWS account ID
        required: true
        type: string
      aws_region:
        description: Canonical AWS region
        required: true
        default: us-east-1
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  canonical-readback:
    environment: public-testnet
    runs-on: ubuntu-latest
    env:
      CANONICAL_ACCOUNT_ID: "595710543956"
      CANONICAL_REGION: us-east-1
      CANONICAL_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact Public Testnet AWS boundary
        env:
          REQUESTED_ROLE_ARN: ${{ inputs.role_arn || 'arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment' }}
          REQUESTED_ACCOUNT_ID: ${{ inputs.expected_account_id || '595710543956' }}
          REQUESTED_REGION: ${{ inputs.aws_region || 'us-east-1' }}
        run: |
          set -euo pipefail
          test "$REQUESTED_ROLE_ARN" = "$CANONICAL_ROLE_ARN"
          test "$REQUESTED_ACCOUNT_ID" = "$CANONICAL_ACCOUNT_ID"
          test "$REQUESTED_REGION" = "$CANONICAL_REGION"
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ inputs.role_arn || 'arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment' }}
          aws-region: ${{ inputs.aws_region || 'us-east-1' }}
          role-session-name: junca-chain-readback-${{ github.run_id }}
      - name: Verify canonical AWS identity
        env:
          EXPECTED_ACCOUNT_ID: ${{ inputs.expected_account_id || '595710543956' }}
          EXPECTED_REGION: ${{ inputs.aws_region || 'us-east-1' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          actual_arn="$(aws sts get-caller-identity --query Arn --output text)"
          configured_region="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
          test "${actual_account}" = "${EXPECTED_ACCOUNT_ID}"
          test "${actual_account}" = "${CANONICAL_ACCOUNT_ID}"
          test "${configured_region}" = "${EXPECTED_REGION}"
          test "${configured_region}" = "${CANONICAL_REGION}"
          case "${actual_arn}" in
            arn:aws:sts::595710543956:assumed-role/JuncaChainPublicTestnetDeployment/*) ;;
            *) echo "unexpected Public Testnet role identity" >&2; exit 1 ;;
          esac
          jq -n \
            --arg account_id "${actual_account}" \
            --arg role_arn "${actual_arn}" \
            --arg region "${configured_region}" \
            '{
              chain: "JUNCA Social Ecosystem Chain",
              governance: "JAIOS Institutional Governance",
              network: "Public Testnet / No Monetary Value",
              account_id: $account_id,
              role_arn: $role_arn,
              region: $region,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false,
              deployment_enabled: false,
              state: "CANONICAL_IDENTITY_VERIFIED_APPLY_BLOCKED"
            }' > artifacts/aws-canonical-readback.json
      - name: Confirm no cloud deployment
        run: |
          grep -q '"deployment_enabled": false' artifacts/aws-canonical-readback.json
          grep -q '"state": "CANONICAL_IDENTITY_VERIFIED_APPLY_BLOCKED"' artifacts/aws-canonical-readback.json
      - uses: actions/upload-artifact@v4
        with:
          name: junca-aws-canonical-readback-${{ github.run_id }}
          path: artifacts/aws-canonical-readback.json
          if-no-files-found: error
          retention-days: 90
