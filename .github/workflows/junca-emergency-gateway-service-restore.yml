name: JUNCA Emergency Gateway Service Restore

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/junca-emergency-gateway-service-restore.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  restore-gateways:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-emergency-gateway-${{ github.run_id }}

      - name: Restart public Gateway services on recovered validators
        run: |
          set -euo pipefail
          instances=(i-015288fae43f2b40f i-055763640261c47df i-054811d49cce9017b)
          jq -n '{commands:[
            "set -euo pipefail",
            "curl -fsS http://127.0.0.1:8545/health >/dev/null",
            "systemctl daemon-reload",
            "systemctl reset-failed junca-public-rpc.service junca-public-explorer.service || true",
            "systemctl enable --now junca-public-rpc.service junca-public-explorer.service",
            "systemctl restart junca-public-rpc.service junca-public-explorer.service",
            "for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8546/ >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done; systemctl status junca-public-rpc.service junca-public-explorer.service --no-pager -l; exit 1"
          ]}' > /tmp/gateway-restart.json
          successes=0
          for instance in "${instances[@]}"; do
            command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters file:///tmp/gateway-restart.json --comment 'JUNCA emergency public Gateway restore' --query Command.CommandId --output text)"
            for attempt in $(seq 1 60); do
              status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 2
            done
            result="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance")"
            echo "===== $instance ====="
            jq -r '.Status, .StandardOutputContent, .StandardErrorContent' <<<"$result"
            [[ "$(jq -r .Status <<<"$result")" == Success ]] && successes=$((successes + 1))
          done
          test "$successes" -ge 1

      - name: Require public recovery
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            explorer="$(curl -sS --max-time 10 -o /tmp/explorer -w '%{http_code}' https://explorer.jaios-governance.org/ || true)"
            health="$(curl -sS --max-time 10 -o /tmp/health -w '%{http_code}' https://health.jaios-governance.org/health || true)"
            rpc="$(curl -sS --max-time 10 -o /tmp/rpc -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ || true)"
            if [[ "$explorer" == 200 && "$health" == 200 && "$rpc" == 200 ]]; then
              jq -e '.status == "healthy" and .mainnet_changed == false and .assets_moved == false and .bridge_activated == false' /tmp/health
              jq -e '.result == "0x1352f63"' /tmp/rpc
              exit 0
            fi
            test "$attempt" -lt 60
            sleep 5
          done
