name: JUNCA V2 Release Readback

on:
  pull_request:
    paths:
      - ".github/workflows/junca-v2-release-readback.yml"

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READBACK_GENERATION: "7"
    steps:
      - uses: actions/checkout@v4

      - name: Read every patch-controller run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$READBACK_GENERATION" = "7"
          mkdir -p artifacts/v2-release-readback
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/apply-evidence-bound-live-prefix-patch.yml/runs?per_page=100" \
            | jq -s '[
                .[].workflow_runs[] |
                {
                  id,
                  name,
                  display_title,
                  path,
                  status,
                  conclusion,
                  event,
                  head_branch,
                  head_sha,
                  run_number,
                  run_attempt,
                  created_at,
                  updated_at,
                  html_url,
                  check_suite_url,
                  jobs_url
                }
              ] | unique_by(.id) | sort_by(.created_at) | reverse | .[:30]' \
            > artifacts/v2-release-readback/controller-runs.json
          jq -e 'length >= 1' artifacts/v2-release-readback/controller-runs.json
          cat artifacts/v2-release-readback/controller-runs.json

      - uses: actions/upload-artifact@v4
        with:
          name: junca-v2-release-readback-${{ github.run_id }}
          path: artifacts/v2-release-readback/
          if-no-files-found: error
          retention-days: 7
