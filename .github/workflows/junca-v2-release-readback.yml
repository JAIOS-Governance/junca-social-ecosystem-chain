name: JUNCA V2 Release Readback

on:
  pull_request:
    paths:
      - ".github/workflows/junca-v2-release-readback.yml"

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READBACK_GENERATION: "8"
      CHECK_SUITE_ID: "82394668841"
    steps:
      - uses: actions/checkout@v4

      - name: Read invalid-workflow check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$READBACK_GENERATION" = "8"
          mkdir -p artifacts/v2-release-readback
          gh api \
            "repos/${GITHUB_REPOSITORY}/check-suites/${CHECK_SUITE_ID}/check-runs" \
            > artifacts/v2-release-readback/check-runs.json
          jq -e '.total_count >= 1' artifacts/v2-release-readback/check-runs.json
          jq -r '.check_runs[].id' artifacts/v2-release-readback/check-runs.json \
            > artifacts/v2-release-readback/check-run-ids.txt
          : > artifacts/v2-release-readback/annotations.jsonl
          while read -r check_run_id; do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}/annotations?per_page=100" \
              | jq -c '.[]' >> artifacts/v2-release-readback/annotations.jsonl
          done < artifacts/v2-release-readback/check-run-ids.txt
          test -s artifacts/v2-release-readback/annotations.jsonl
          cat artifacts/v2-release-readback/check-runs.json
          cat artifacts/v2-release-readback/annotations.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: junca-v2-release-readback-${{ github.run_id }}
          path: artifacts/v2-release-readback/
          if-no-files-found: error
          retention-days: 7
