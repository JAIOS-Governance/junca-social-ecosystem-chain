name: JUNCA Emergency Runtime Parity
on:
  push:
    branches: [main]
    paths: [.github/workflows/junca-emergency-runtime-parity.yml]
permissions:
  contents: read
  id-token: write
jobs:
  restore-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-runtime-parity-${{ github.run_id }}
      - name: Build canonical runtime archive
        run: |
          set -euo pipefail
          test -f jaios/social_ecosystem_chain/validator_node.py
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/junca-runtime.tar.gz jaios
          sha256sum /tmp/junca-runtime.tar.gz
          base64 -w 0 /tmp/junca-runtime.tar.gz > /tmp/junca-runtime.b64
          split -b 12000 -d -a 4 /tmp/junca-runtime.b64 /tmp/junca-runtime.chunk.
      - name: Restore parity sequentially
        run: |
          set -euo pipefail
          archive_sha="$(sha256sum /tmp/junca-runtime.tar.gz | awk '{print $1}')"
          send_and_wait() {
            local instance="$1" payload="$2" command_id status
            command_id="$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript --parameters "$payload" --query Command.CommandId --output text)"
            for attempt in $(seq 1 60); do
              status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" --query Status --output text 2>/dev/null || true)"
              case "$status" in Success) break;; Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance"; return 1;; esac
              sleep 2
            done
            test "$status" = Success
          }
          for instance in i-055763640261c47df i-054811d49cce9017b; do
            init_payload="$(jq -cn --arg c 'set -e; systemctl start junca-validator.service || true; rm -f /tmp/junca-runtime.b64 /tmp/junca-runtime.tar.gz; : > /tmp/junca-runtime.b64' '{commands:[$c]}')"
            send_and_wait "$instance" "$init_payload"
            for chunk in /tmp/junca-runtime.chunk.*; do
              data="$(cat "$chunk")"
              payload="$(jq -cn --arg c "printf '%s' '$data' >> /tmp/junca-runtime.b64" '{commands:[$c]}')"
              send_and_wait "$instance" "$payload"
            done
            install_script="$(cat <<SCRIPT
          set -euo pipefail
          base64 -d /tmp/junca-runtime.b64 > /tmp/junca-runtime.tar.gz
          echo '${archive_sha}  /tmp/junca-runtime.tar.gz' | sha256sum -c -
          rollback=/var/lib/junca/runtime-rollbacks/${GITHUB_RUN_ID}
          rm -rf /tmp/junca-runtime-stage
          mkdir -p /tmp/junca-runtime-stage "\$rollback"
          tar -xzf /tmp/junca-runtime.tar.gz -C /tmp/junca-runtime-stage
          test -f /tmp/junca-runtime-stage/jaios/social_ecosystem_chain/validator_node.py
          systemctl stop junca-validator.service
          cp -a /usr/local/lib/junca/jaios "\$rollback/jaios"
          cp -a /var/lib/junca/state.sqlite "\$rollback/state.sqlite"
          test ! -e /var/lib/junca/state.sqlite-wal || cp -a /var/lib/junca/state.sqlite-wal "\$rollback/state.sqlite-wal"
          test ! -e /var/lib/junca/state.sqlite-shm || cp -a /var/lib/junca/state.sqlite-shm "\$rollback/state.sqlite-shm"
          rm -rf /usr/local/lib/junca/jaios.next
          cp -a /tmp/junca-runtime-stage/jaios /usr/local/lib/junca/jaios.next
          mv /usr/local/lib/junca/jaios /usr/local/lib/junca/jaios.previous
          mv /usr/local/lib/junca/jaios.next /usr/local/lib/junca/jaios
          rm -rf /usr/local/lib/junca/jaios.previous
          systemctl start junca-validator.service
          ok=false
          for attempt in \$(seq 1 30); do
            if health=\$(curl -fsS http://127.0.0.1:8545/health 2>/dev/null) && grep -q '"automatic_finality_enabled":true' <<<"\$health"; then ok=true; echo "\$health"; break; fi
            sleep 2
          done
          if ! \$ok; then
            systemctl stop junca-validator.service || true
            rm -rf /usr/local/lib/junca/jaios
            cp -a "\$rollback/jaios" /usr/local/lib/junca/jaios
            systemctl start junca-validator.service || true
            echo 'runtime parity acceptance failed; rollback restored' >&2
            exit 1
          fi
          SCRIPT
          )"
            encoded_script="$(printf '%s' "$install_script" | base64 -w 0)"
            payload="$(jq -cn --arg c "printf '%s' '$encoded_script' | base64 -d | bash" '{commands:[$c]}')"
            send_and_wait "$instance" "$payload"
            echo "runtime parity accepted on $instance"
          done
