name: One-shot Release Observer Transition Dedup 2026-08-08

on:
  push:
    branches:
      - fix/release-observer-state-transition-dedup-20260808
    paths:
      - .github/workflows/one-shot-observer-transition-dedup-20260808.yml

permissions:
  contents: read

concurrency:
  group: one-shot-release-observer-transition-dedup-20260808
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/release-observer-state-transition-dedup-20260808
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Apply transition-based terminal notification control
        run: python scripts/ops/apply_release_observer_transition_dedup.py
      - name: Validate focused observer contract
        run: python -m unittest tests.test_junca_hardened_immutable_release_workflow -v
      - name: Export exact verified files
        uses: actions/upload-artifact@v4
        with:
          name: observer-transition-dedup-${{ github.run_id }}
          path: |
            .github/workflows/junca-public-testnet-release-observer.yml
            tests/test_junca_hardened_immutable_release_workflow.py
          if-no-files-found: error
          retention-days: 1
