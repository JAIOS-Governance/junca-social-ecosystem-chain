name: One-shot Release Observer Transition Dedup 2026-08-08

on:
  push:
    branches:
      - fix/release-observer-state-transition-dedup-20260808
    paths:
      - .github/workflows/one-shot-observer-transition-dedup-20260808.yml

permissions:
  contents: write

concurrency:
  group: one-shot-release-observer-transition-dedup-20260808
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/release-observer-state-transition-dedup-20260808
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Apply transition-based terminal notification control
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          observer_path = Path('.github/workflows/junca-public-testnet-release-observer.yml')
          test_path = Path('tests/test_junca_hardened_immutable_release_workflow.py')

          observer = observer_path.read_text(encoding='utf-8')
          old_concurrency = '  group: junca-public-testnet-release-observer-${{ github.event.workflow_run.id }}-${{ github.event.action }}\n'
          new_concurrency = "  group: junca-public-testnet-release-observer-${{ github.event.action == 'completed' && 'terminal-publication' || github.event.workflow_run.id }}\n"
          if observer.count(old_concurrency) != 1:
              raise SystemExit('OBSERVER_CONCURRENCY_SIGNATURE_MISMATCH')
          observer = observer.replace(old_concurrency, new_concurrency, 1)

          old_publish = '''          publish_failures=0
          if [ "$source_binding" = "EXACT_CURRENT_MAIN" ]; then
            if ! publish_with_retry PATCH "repos/${GITHUB_REPOSITORY}/issues/269"; then
              publish_failures=$((publish_failures + 1))
              echo "::warning title=Current-state publication deferred::Issue 269 update failed after bounded retries."
            fi
          fi

          incident_notification=false
          if [ "$source_binding" = "EXACT_CURRENT_MAIN" ]; then
            case "${result}:${phase}" in
              REJECTED:IMMUTABLE_RELEASE_CHAIN|\\
              TIMED_OUT:IMMUTABLE_RELEASE_CHAIN|\\
              ACTION_REQUIRED:IMMUTABLE_RELEASE_CHAIN|\\
              REJECTED:IMMUTABLE_RELEASE_CHAIN_V2|\\
              TIMED_OUT:IMMUTABLE_RELEASE_CHAIN_V2|\\
              ACTION_REQUIRED:IMMUTABLE_RELEASE_CHAIN_V2|\\
              REJECTED:FINALITY_CONTINUITY_READBACK|\\
              TIMED_OUT:FINALITY_CONTINUITY_READBACK|\\
              ACTION_REQUIRED:FINALITY_CONTINUITY_READBACK)
                incident_notification=true
                ;;
            esac
          fi
'''
          new_publish = '''          publish_failures=0
          prior_current_state=""
          prior_phase=""
          prior_result=""
          if [ "$source_binding" = "EXACT_CURRENT_MAIN" ]; then
            prior_current_state="$(
              gh api "repos/${GITHUB_REPOSITORY}/issues/269" \
                --jq '.body // ""' 2>/dev/null || true
            )"
            prior_phase="$(
              sed -n 's/^- Phase: `\\([^`]*\\)`.*/\\1/p' \
                <<<"$prior_current_state" | head -1
            )"
            prior_result="$(
              sed -n 's/^- Result: \\*\\*\\([^*]*\\)\\*\\*.*/\\1/p' \
                <<<"$prior_current_state" | head -1
            )"
            if ! publish_with_retry PATCH "repos/${GITHUB_REPOSITORY}/issues/269"; then
              publish_failures=$((publish_failures + 1))
              echo "::warning title=Current-state publication deferred::Issue 269 update failed after bounded retries."
            fi
          fi

          hard_terminal_result=false
          case "$result" in
            REJECTED|TIMED_OUT|ACTION_REQUIRED)
              hard_terminal_result=true
              ;;
          esac

          hard_terminal_phase=false
          case "$phase" in
            IMMUTABLE_RELEASE_CHAIN|IMMUTABLE_RELEASE_CHAIN_V2|FINALITY_CONTINUITY_READBACK)
              hard_terminal_phase=true
              ;;
          esac

          state_transition=false
          if [ "$prior_phase" != "$phase" ] || [ "$prior_result" != "$result" ]; then
            state_transition=true
          fi

          incident_notification=false
          if [ "$source_binding" = "EXACT_CURRENT_MAIN" ] && \
             [ "$hard_terminal_result" = true ] && \
             [ "$hard_terminal_phase" = true ] && \
             [ "$state_transition" = true ]; then
            incident_notification=true
          fi
'''
          if observer.count(old_publish) != 1:
              raise SystemExit('OBSERVER_TRANSITION_BLOCK_SIGNATURE_MISMATCH')
          observer = observer.replace(old_publish, new_publish, 1)

          old_marker = '            incident_marker="<!-- junca-release-observer:${OBSERVED_RUN_ID}:${live_attempt}:${result} -->"\n'
          new_marker = '            incident_marker="<!-- junca-release-observer:${OBSERVED_RUN_ID}:${result} -->"\n'
          if observer.count(old_marker) != 1:
              raise SystemExit('OBSERVER_MARKER_SIGNATURE_MISMATCH')
          observer = observer.replace(old_marker, new_marker, 1)

          old_summary = '''            echo "- Incident notification eligible: ${incident_notification}"
            echo "- Incident comment emitted: ${incident_comment_emitted}"
'''
          new_summary = '''            echo "- Prior phase: ${prior_phase:-NONE}"
            echo "- Prior result: ${prior_result:-NONE}"
            echo "- Terminal state transition: ${state_transition}"
            echo "- Incident notification eligible: ${incident_notification}"
            echo "- Incident comment emitted: ${incident_comment_emitted}"
'''
          if observer.count(old_summary) != 1:
              raise SystemExit('OBSERVER_SUMMARY_SIGNATURE_MISMATCH')
          observer = observer.replace(old_summary, new_summary, 1)
          observer_path.write_text(observer, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          old_required = '''            'incident_marker="<!-- junca-release-observer:${OBSERVED_RUN_ID}:${live_attempt}:${result} -->"',
'''
          new_required = '''            "group: junca-public-testnet-release-observer-${{ github.event.action == 'completed' && 'terminal-publication' || github.event.workflow_run.id }}",
            'prior_current_state=""',
            'prior_phase=""',
            'prior_result=""',
            'state_transition=false',
            'hard_terminal_result=false',
            'hard_terminal_phase=false',
            'incident_marker="<!-- junca-release-observer:${OBSERVED_RUN_ID}:${result} -->"',
'''
          if test.count(old_required) != 1:
              raise SystemExit('OBSERVER_TEST_REQUIRED_SIGNATURE_MISMATCH')
          test = test.replace(old_required, new_required, 1)

          old_negative = '''        self.assertNotIn('issues/${issue}/comments', self.observer_workflow)
'''
          new_negative = '''        self.assertNotIn('issues/${issue}/comments', self.observer_workflow)
        self.assertNotIn(
            'incident_marker="<!-- junca-release-observer:${OBSERVED_RUN_ID}:${live_attempt}:${result} -->"',
            self.observer_workflow,
        )
'''
          if test.count(old_negative) != 1:
              raise SystemExit('OBSERVER_TEST_NEGATIVE_SIGNATURE_MISMATCH')
          test = test.replace(old_negative, new_negative, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate observer transition contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest \
            tests.test_junca_hardened_immutable_release_workflow \
            -v

      - name: Commit bounded repair and retire one-shot route
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-shot-observer-transition-dedup-20260808.yml
          git config user.name "JSEC Notification Governance Cell"
          git config user.email "juncajapan.inc@gmail.com"
          git add -A
          git commit -m "fix(observer): notify only on terminal state transitions"
          git push origin HEAD:fix/release-observer-state-transition-dedup-20260808
