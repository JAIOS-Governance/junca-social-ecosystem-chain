name: JUNCA Chain Production Role Finalize

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      AWS_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure verified production identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: chain-domain-production-final-${{ github.run_id }}
      - name: Verify exact account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
      - name: Reconcile canonical CloudFormation policy when permitted
        continue-on-error: true
        run: |
          set -euo pipefail
          aws cloudformation deploy --region us-east-1 --stack-name junca-chain-docs-publication --template-file infra/aws/docs-publication/main.yaml --capabilities CAPABILITY_NAMED_IAM --parameter-overrides DomainName=docs.jaios-governance.org HostedZoneId="$HOSTED_ZONE_ID" Repository=JAIOS-Governance/junca-social-ecosystem-chain RepositoryOwnerId=308604370 RepositoryId=1310568313 EnvironmentName=junca-chain-docs-production ExistingGitHubOidcProviderArn=arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com
      - name: UPSERT exact custom-domain records
        id: dns
        run: |
          set -euo pipefail
          cat >/tmp/change.json <<'JSON'
          {"Comment":"Finalize chain.jaios-governance.org Sites binding","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"chain.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.chain.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
      - name: Exact production readback
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.']" --output json)"
          RECORDS="$records" python3 - <<'PY'
          import json,os
          r={x['Name']:x for x in json.loads(os.environ['RECORDS'])}
          assert r['chain.jaios-governance.org.']['TTL']==300
          assert r['chain.jaios-governance.org.']['ResourceRecords'][0]['Value']=='custom-domains.chatgpt.site.'
          assert 'openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM' in r['_openai-site-verification.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          assert '0ff4e945-6380-45d2-a7fc-79e43e99da79' in r['_cf-custom-hostname.chain.jaios-governance.org.']['ResourceRecords'][0]['Value']
          PY
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='docs.jaios-governance.org.'] | length(@)" --output text)" != "0"
          test "$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='explorer.jaios-governance.org.'] | length(@)" --output text)" = "0"
          { echo "### Chain production URL finalization"; echo "- Account: $AWS_ACCOUNT_ID"; echo "- Change: ${{ steps.dns.outputs.change_id }}"; echo "- DNS: INSYNC"; echo "- Production: https://chain.jaios-governance.org/"; echo "- docs preserved: true"; echo "- explorer untouched: true"; } >> "$GITHUB_STEP_SUMMARY"
