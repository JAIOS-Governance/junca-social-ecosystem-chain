name: Render Renewed Foundation Workflow

on:
  pull_request:
    paths:
      - ".github/patches/render_renewed_foundation_workflow.py"
      - ".github/workflows/render-renewed-foundation-workflow.yml"

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout controller source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/renew-expired-foundation-epoch
          path: target
          persist-credentials: false

      - name: Render exact workflow file
        run: |
          set -euo pipefail
          python -m py_compile \
            controller/.github/patches/render_renewed_foundation_workflow.py
          python controller/.github/patches/render_renewed_foundation_workflow.py \
            target/.github/workflows/junca-validator-foundation-release.yml
          grep -Fq 'renew_expired_epoch:' \
            target/.github/workflows/junca-validator-foundation-release.yml
          grep -Fq 'RENEW_EXPIRED_QUIESCED_EPOCH' \
            target/.github/workflows/junca-validator-foundation-release.yml
          grep -Fq 'VALIDATOR_BOOTSTRAP_SLOT_EPOCHS_JSON' \
            target/.github/workflows/junca-validator-foundation-release.yml

      - name: Create unreferenced governed Git commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          parent_sha="$(git -C target rev-parse HEAD)"
          base_tree_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/commits/${parent_sha}" \
              --jq .tree.sha
          )"
          blob_sha="$(
            base64 -w0 \
              target/.github/workflows/junca-validator-foundation-release.yml \
              | jq -Rs '{content: ., encoding: "base64"}' \
              | gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - --jq .sha
          )"
          tree_sha="$(
            jq -n \
              --arg base_tree "$base_tree_sha" \
              --arg blob "$blob_sha" '{
                base_tree: $base_tree,
                tree: [{
                  path: ".github/workflows/junca-validator-foundation-release.yml",
                  mode: "100644",
                  type: "blob",
                  sha: $blob
                }]
              }' \
              | gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/trees" \
                  --input - --jq .sha
          )"
          commit_sha="$(
            jq -n \
              --arg message "Add governed expired-epoch Foundation recovery" \
              --arg tree "$tree_sha" \
              --arg parent "$parent_sha" '{
                message: $message,
                tree: $tree,
                parents: [$parent]
              }' \
              | gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/commits" \
                  --input - --jq .sha
          )"
          jq -n \
            --arg parent_sha "$parent_sha" \
            --arg base_tree_sha "$base_tree_sha" \
            --arg blob_sha "$blob_sha" \
            --arg tree_sha "$tree_sha" \
            --arg commit_sha "$commit_sha" '{
              parent_sha: $parent_sha,
              base_tree_sha: $base_tree_sha,
              workflow_blob_sha: $blob_sha,
              tree_sha: $tree_sha,
              commit_sha: $commit_sha,
              branch_ref_updated: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/workflow-commit.json
          cat artifacts/workflow-commit.json

      - uses: actions/upload-artifact@v4
        with:
          name: renewed-foundation-workflow-${{ github.run_id }}
          path: |
            target/.github/workflows/junca-validator-foundation-release.yml
            artifacts/workflow-commit.json
          if-no-files-found: error
          retention-days: 7
