name: JUNCA Chain Bootstrap Inline Policy Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/junca-chain-bootstrap-inline-policy-repair.yml
      - .github/recovery-triggers/chain-bootstrap-policy-repair.txt

permissions:
  id-token: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: public-testnet
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      TARGET_ROLE: JuncaChainDocsProductionDeployment
    steps:
      - uses: actions/checkout@v4
      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")"
          printf '%s' "$token" > /tmp/oidc-token
      - name: Try approved bootstrap roles and repair target policy
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/bootstrap-result.txt
          selected=""
          for role in \
            arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment \
            arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
          do
            echo "Trying $role" >> /tmp/bootstrap-result.txt
            aws sts assume-role-with-web-identity \
              --role-arn "$role" \
              --role-session-name "chain-policy-repair-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/oidc-token)" \
              --duration-seconds 900 \
              > /tmp/assume.json 2>> /tmp/bootstrap-result.txt
            if [ $? -eq 0 ]; then
              selected="$role"
              export AWS_ACCESS_KEY_ID="$(python3 -c 'import json; print(json.load(open("/tmp/assume.json"))["Credentials"]["AccessKeyId"])')"
              export AWS_SECRET_ACCESS_KEY="$(python3 -c 'import json; print(json.load(open("/tmp/assume.json"))["Credentials"]["SecretAccessKey"])')"
              export AWS_SESSION_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/assume.json"))["Credentials"]["SessionToken"])')"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "No bootstrap role could be assumed" >> /tmp/bootstrap-result.txt
            echo "rc=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID" || exit 1
          cat >/tmp/policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "SitesCustomDomainsDnsWriteRecovery",
                "Effect": "Allow",
                "Action": "route53:ChangeResourceRecordSets",
                "Resource": "arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G",
                "Condition": {
                  "ForAllValues:StringEquals": {
                    "route53:ChangeResourceRecordSetsNormalizedRecordNames": [
                      "member.jaios-governance.org",
                      "_openai-site-verification.member.jaios-governance.org",
                      "_cf-custom-hostname.member.jaios-governance.org",
                      "chain.jaios-governance.org",
                      "_openai-site-verification.chain.jaios-governance.org",
                      "_cf-custom-hostname.chain.jaios-governance.org"
                    ],
                    "route53:ChangeResourceRecordSetsRecordTypes": ["CNAME", "TXT"],
                    "route53:ChangeResourceRecordSetsActions": ["UPSERT"]
                  }
                }
              },
              {
                "Sid": "Route53ChangeReadback",
                "Effect": "Allow",
                "Action": "route53:GetChange",
                "Resource": "*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$TARGET_ROLE" \
            --policy-name SitesCustomDomainsDnsWriteRecovery \
            --policy-document file:///tmp/policy.json \
            >> /tmp/bootstrap-result.txt 2>&1
          rc=$?
          echo "Selected bootstrap role: $selected" >> /tmp/bootstrap-result.txt
          echo "PutRolePolicy return code: $rc" >> /tmp/bootstrap-result.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist repair evidence
        shell: bash
        env:
          REPAIR_RC: ${{ steps.repair.outputs.rc }}
        run: |
          set -euo pipefail
          mkdir -p evidence/production
          {
            echo '# JUNCA Chain Bootstrap Inline Policy Repair'
            echo
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Repair return code: ${REPAIR_RC:-unknown}"
            echo
            echo '```text'
            cat /tmp/bootstrap-result.txt
            echo '```'
          } > evidence/production/chain-bootstrap-policy-repair-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/production/chain-bootstrap-policy-repair-latest.md
          git commit -m "Record chain bootstrap policy repair run $GITHUB_RUN_ID"
          git push
