name: JUNCA and JAIOS Dual Domain Final Cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-jaios-dual-domain-final-cutover.yml"

permissions:
  contents: read

jobs:
  set-canonical-oidc-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set canonical GitHub OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location             --request PUT             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2026-03-10"             "$endpoint"             --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
          state="$(curl --silent --show-error --fail --location             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2026-03-10"             "$endpoint")"
          STATE="$state" python3 -c 'import json,os; s=json.loads(os.environ["STATE"]); assert s.get("use_default") is False and s.get("include_claim_keys")==["repo","context"] and s.get("use_immutable_subject") is False, s'

  cutover:
    needs: set-canonical-oidc-subject
    runs-on: ubuntu-latest
    environment: public-testnet
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      JAIOS_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dual-domain-cutover-${{ github.run_id }}

      - name: Verify account and discover zones
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$JAIOS_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          global_zone="$(aws route53 list-hosted-zones-by-name --dns-name junca-global.group --query "HostedZones[?Name=='junca-global.group.'].Id | [0]" --output text)"
          test -n "$global_zone"
          test "$global_zone" != "None"
          echo "GLOBAL_ZONE_ID=${global_zone##*/}" >> "$GITHUB_ENV"

      - name: Apply MEMBER Sites-issued DNS records
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/member.json <<'JSON'
          {"Comment":"Sites custom domain cutover for member.jaios-governance.org","Changes":[
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"member.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5HgL7ZV4WE4kuhT9OKEJZ4anM4cXQgaX4PcQrAyflGE\""}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"5747a89e-d114-42d8-b33b-b4eaae61c958\""}]}}
          ]}
          JSON
          id="$(aws route53 change-resource-record-sets --hosted-zone-id "$JAIOS_ZONE_ID" --change-batch file:///tmp/member.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$id"
          test "$(aws route53 get-change --id "$id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "MEMBER_CHANGE_ID=$id" >> "$GITHUB_ENV"

      - name: Apply JUNCA GLOBAL Sites-issued DNS records
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/global.json <<'JSON'
          {"Comment":"Sites Version 107 cutover for junca-global.group","Changes":[
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"junca-global.group.","Type":"A","TTL":300,"ResourceRecords":[{"Value":"162.159.143.30"},{"Value":"172.66.3.26"}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.junca-global.group.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=72QXjN2sYBQCzy8JS-dwPT0Pfk0qzrBFWQEpJwgZAeM\""}]}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.junca-global.group.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"6d02be2e-2b78-4598-bf88-ecff8e3ae441\""}]}}
          ]}
          JSON
          id="$(aws route53 change-resource-record-sets --hosted-zone-id "$GLOBAL_ZONE_ID" --change-batch file:///tmp/global.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$id"
          test "$(aws route53 get-change --id "$id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "GLOBAL_CHANGE_ID=$id" >> "$GITHUB_ENV"

      - name: Readback
        shell: bash
        run: |
          set -euo pipefail
          aws route53 list-resource-record-sets --hosted-zone-id "$JAIOS_ZONE_ID" --query "ResourceRecordSets[?Name=='member.jaios-governance.org.' || Name=='_openai-site-verification.member.jaios-governance.org.' || Name=='_cf-custom-hostname.member.jaios-governance.org.']" --output json
          aws route53 list-resource-record-sets --hosted-zone-id "$GLOBAL_ZONE_ID" --query "ResourceRecordSets[?Name=='junca-global.group.' || Name=='_openai-site-verification.junca-global.group.' || Name=='_cf-custom-hostname.junca-global.group.']" --output json
          {
            echo "### Dual domain final cutover"
            echo "- Operator: JAIOS Institutional Governance"
            echo "- Member DNS: INSYNC"
            echo "- JUNCA GLOBAL DNS: INSYNC"
            echo "- MEMBER change: $MEMBER_CHANGE_ID"
            echo "- GLOBAL change: $GLOBAL_CHANGE_ID"
          } >> "$GITHUB_STEP_SUMMARY"
