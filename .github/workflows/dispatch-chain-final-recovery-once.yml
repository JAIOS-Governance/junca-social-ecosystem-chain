name: Dispatch Chain Final Recovery Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-chain-final-recovery-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch exact Chain distribution permission recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run chain-official-distribution-permission-recovery.yml --ref main
          sleep 3
          gh run list --workflow chain-official-distribution-permission-recovery.yml --branch main --limit 5 \
            --json databaseId,status,conclusion,headSha,event,url >/tmp/chain-recovery-runs.json
          jq -e 'map(select(.event=="workflow_dispatch")) | length>=1' /tmp/chain-recovery-runs.json >/dev/null
      - name: Remove one-time dispatcher
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/dispatch-chain-final-recovery-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/dispatch-chain-final-recovery-once.yml
          git commit -m 'Remove one-time Chain final recovery dispatcher'
          git pull --rebase origin main
          git push origin HEAD:main
