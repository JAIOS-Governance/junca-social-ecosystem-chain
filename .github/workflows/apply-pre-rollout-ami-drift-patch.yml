name: Apply Pre-rollout AMI Drift Patch

on:
  push:
    branches:
      - fix/pre-rollout-ami-drift-evidence
    paths:
      - ".github/workflows/apply-pre-rollout-ami-drift-patch.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-pre-rollout-ami-drift-patch.yml"
      - "scripts/junca_runtime_release_evidence_collector_drift.py"
      - "tests/test_junca_runtime_release_ami_drift.py"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-rollout-ami-drift-evidence
          fetch-depth: 0

      - name: Apply exact workflow wiring patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          baseline = Path('.github/workflows/junca-runtime-release-evidence-collector.yml')
          text = baseline.read_text()
          old = 'python scripts/junca_runtime_release_evidence_collector.py \\\n'
          new = 'python scripts/junca_runtime_release_evidence_collector_drift.py \\\n'
          if text.count(old) != 1:
              raise SystemExit('canonical collector invocation is not exact one')
          text = text.replace(old, new)
          marker = '''          path: |
            evidence/readback/endpoint-acceptance.json
'''
          replacement = '''          path: |
            evidence/readback/bootstrap-outputs.json
            evidence/readback/public-testnet-outputs.json
            evidence/readback/images.json
            evidence/readback/instances.json
            evidence/readback/volumes.json
            evidence/readback/snapshots.json
            evidence/readback/endpoint-acceptance.json
'''
          if text.count(marker) != 1:
              raise SystemExit('failure diagnostic path marker is not exact one')
          baseline.write_text(text.replace(marker, replacement))

          runtime = Path('.github/workflows/junca-validator-runtime-artifacts.yml')
          text = runtime.read_text()
          marker = '      - "scripts/junca_dispatch_workflow_and_wait.sh"\n'
          addition = marker + '''      - "scripts/junca_runtime_release_evidence_collector_drift.py"
      - "tests/test_junca_runtime_release_ami_drift.py"
      - ".github/workflows/junca-runtime-release-evidence-collector.yml"
'''
          if text.count(marker) != 2:
              raise SystemExit('runtime trigger marker is not exact two')
          if 'scripts/junca_runtime_release_evidence_collector_drift.py' in text:
              raise SystemExit('drift trigger already present')
          runtime.write_text(text.replace(marker, addition))

          Path('.github/workflows/apply-pre-rollout-ami-drift-patch.yml').unlink()
          PY
          git diff --check
          grep -q 'junca_runtime_release_evidence_collector_drift.py' \
            .github/workflows/junca-runtime-release-evidence-collector.yml
          test "$(grep -c 'junca_runtime_release_evidence_collector_drift.py' \
            .github/workflows/junca-validator-runtime-artifacts.yml)" = 2

      - name: Commit governed patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/junca-runtime-release-evidence-collector.yml \
            .github/workflows/junca-validator-runtime-artifacts.yml \
            .github/workflows/apply-pre-rollout-ami-drift-patch.yml
          git commit -m "Wire exact pre-rollout AMI drift evidence"
          git push origin HEAD:fix/pre-rollout-ami-drift-evidence
