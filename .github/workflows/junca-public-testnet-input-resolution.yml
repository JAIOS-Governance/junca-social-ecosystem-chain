name: JUNCA Public Testnet Input Resolution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-public-testnet-input-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-input-resolution
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 15
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_NAME: JuncaChainPublicTestnetDeployment
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      DOMAIN_NAME: jaios-governance.org
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-input-resolution-${{ github.run_id }}

      - name: Enforce Public Testnet boundary
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$AWS_REGION" = "us-east-1"
          test "$DEPLOYMENT_ROLE_ARN" = \
            "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment"
          jq -e '
            .notice == "Public Testnet / No Monetary Value" and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json

      - name: Reconcile narrow inventory read permissions
        run: |
          set -euo pipefail
          cat > /tmp/input-readback-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "ResolvePublicTestnetInputs",
              "Effect": "Allow",
              "Action": [
                "route53:ListHostedZonesByName",
                "route53:GetHostedZone",
                "acm:ListCertificates",
                "acm:DescribeCertificate",
                "sns:ListTopics",
                "sns:GetTopicAttributes",
                "ec2:DescribeAvailabilityZones",
                "ec2:DescribeImages"
              ],
              "Resource": "*"
            }]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$DEPLOYMENT_ROLE_NAME" \
            --policy-name PublicTestnetInputReadback \
            --policy-document file:///tmp/input-readback-policy.json
          for attempt in 1 2 3 4 5 6; do
            if aws acm list-certificates --certificate-statuses ISSUED \
                --max-items 1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Input readback policy did not become effective" >&2
          exit 1

      - name: Resolve canonical non-secret inputs
        id: inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n '{
            schema_version: "1.0",
            state: "READBACK_STARTED",
            deployment_executed: false,
            mainnet_changed: false,
            assets_moved: false,
            bridge_activated: false
          }' > artifacts/public-testnet-input-resolution.json

          zones="$(aws route53 list-hosted-zones-by-name \
            --dns-name "$DOMAIN_NAME" --output json)"
          zone_candidates="$(jq -c --arg name "${DOMAIN_NAME}." '
            [.HostedZones[] | select(.Name == $name and .Config.PrivateZone == false)]
          ' <<<"$zones")"
          test "$(jq 'length' <<<"$zone_candidates")" = "1"
          route53_zone_id="$(jq -r '.[0].Id | sub("^/hostedzone/"; "")' \
            <<<"$zone_candidates")"
          test "$(aws route53 get-hosted-zone --id "$route53_zone_id" \
            --query HostedZone.Name --output text)" = "${DOMAIN_NAME}."

          certificates="$(aws acm list-certificates \
            --certificate-statuses ISSUED --output json)"
          certificate_candidates='[]'
          while IFS= read -r arn; do
            detail="$(aws acm describe-certificate \
              --certificate-arn "$arn" --output json)"
            if jq -e --arg rpc "rpc.${DOMAIN_NAME}" \
              --arg explorer "explorer.${DOMAIN_NAME}" \
              --arg health "health.${DOMAIN_NAME}" '
                .Certificate.Status == "ISSUED" and
                (([.Certificate.DomainName] + (.Certificate.SubjectAlternativeNames // []))
                  | unique
                  | (index($rpc) != null or index("*." + ($rpc | split(".")[1:] | join("."))) != null)
                  and (index($explorer) != null or index("*." + ($explorer | split(".")[1:] | join("."))) != null)
                  and (index($health) != null or index("*." + ($health | split(".")[1:] | join("."))) != null))
              ' <<<"$detail" >/dev/null; then
              certificate_candidates="$(jq -c --arg arn "$arn" '. + [$arn]' \
                <<<"$certificate_candidates")"
            fi
          done < <(jq -r '.CertificateSummaryList[].CertificateArn' <<<"$certificates")

          topics="$(aws sns list-topics --output json)"
          topic_candidates="$(jq -c '
            [.Topics[].TopicArn
              | select(test("junca"; "i") and test("testnet|chain"; "i"))]
          ' <<<"$topics")"

          availability_zones="$(aws ec2 describe-availability-zones \
            --filters Name=state,Values=available \
            --query 'AvailabilityZones[].ZoneName' --output json |
            jq -c 'sort | .[0:3]')"
          test "$(jq 'length' <<<"$availability_zones")" = "3"

          images="$(aws ec2 describe-images --owners self \
            --filters \
              Name=state,Values=available \
              Name=architecture,Values=x86_64 \
              Name=root-device-type,Values=ebs \
              Name=virtualization-type,Values=hvm \
              Name=tag:Network,Values='Public Testnet' \
              Name=tag:Governance,Values='JAIOS Institutional Governance' \
            --output json)"
          ami_candidates="$(jq -c '
            [.Images[] | {
              image_id: .ImageId,
              creation_date: .CreationDate,
              source_commit: ([.Tags[]? | select(.Key == "SourceCommit") | .Value] | first // ""),
              node_sha256: ([.Tags[]? | select(.Key == "NodeArtifactSHA256") | .Value] | first // ""),
              genesis_sha256: ([.Tags[]? | select(.Key == "GenesisSHA256") | .Value] | first // "")
            } | select(
              (.source_commit | test("^[0-9a-f]{40}$")) and
              (.node_sha256 | test("^[0-9a-f]{64}$")) and
              (.genesis_sha256 | test("^[0-9a-f]{64}$"))
            )] | sort_by(.creation_date) | reverse
          ' <<<"$images")"

          certificate_state=PENDING
          certificate_arn=""
          if test "$(jq 'length' <<<"$certificate_candidates")" = "1"; then
            certificate_state=VERIFIED
            certificate_arn="$(jq -r '.[0]' <<<"$certificate_candidates")"
          fi

          topic_state=PENDING
          alert_topic_arn=""
          if test "$(jq 'length' <<<"$topic_candidates")" = "1"; then
            topic_state=VERIFIED
            alert_topic_arn="$(jq -r '.[0]' <<<"$topic_candidates")"
          fi

          ami_state=PENDING
          node_ami_id=""
          source_commit=""
          node_sha256=""
          genesis_sha256=""
          if test "$(jq 'length' <<<"$ami_candidates")" = "1"; then
            ami_state=VERIFIED
            node_ami_id="$(jq -r '.[0].image_id' <<<"$ami_candidates")"
            source_commit="$(jq -r '.[0].source_commit' <<<"$ami_candidates")"
            node_sha256="$(jq -r '.[0].node_sha256' <<<"$ami_candidates")"
            genesis_sha256="$(jq -r '.[0].genesis_sha256' <<<"$ami_candidates")"
          fi

          ready=false
          if [[ "$certificate_state" == VERIFIED &&
                "$topic_state" == VERIFIED &&
                "$ami_state" == VERIFIED ]]; then
            ready=true
          fi

          jq -n \
            --arg account_id "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg state_bucket "$STATE_BUCKET_NAME" \
            --arg domain_name "$DOMAIN_NAME" \
            --arg route53_zone_id "$route53_zone_id" \
            --arg certificate_state "$certificate_state" \
            --arg certificate_arn "$certificate_arn" \
            --argjson certificate_candidates "$certificate_candidates" \
            --arg topic_state "$topic_state" \
            --arg alert_topic_arn "$alert_topic_arn" \
            --argjson topic_candidates "$topic_candidates" \
            --argjson availability_zones "$availability_zones" \
            --arg ami_state "$ami_state" \
            --arg node_ami_id "$node_ami_id" \
            --arg source_commit "$source_commit" \
            --arg node_sha256 "$node_sha256" \
            --arg genesis_sha256 "$genesis_sha256" \
            --argjson ami_candidates "$ami_candidates" \
            --argjson ready "$ready" \
            '{
              schema_version: "1.0",
              chain_name: "JUNCA Social Ecosystem Chain",
              governance: "JAIOS Institutional Governance",
              notice: "Public Testnet / No Monetary Value",
              account_id: $account_id,
              region: $region,
              inputs: {
                state_bucket: {state: "VERIFIED", value: $state_bucket},
                domain_name: {state: "VERIFIED", value: $domain_name},
                route53_zone_id: {state: "VERIFIED", value: $route53_zone_id},
                certificate_arn: {
                  state: $certificate_state,
                  value: $certificate_arn,
                  candidates: $certificate_candidates
                },
                alert_topic_arn: {
                  state: $topic_state,
                  value: $alert_topic_arn,
                  candidates: $topic_candidates
                },
                availability_zones: {state: "VERIFIED", value: $availability_zones},
                immutable_runtime: {
                  state: $ami_state,
                  node_ami_id: $node_ami_id,
                  source_commit: $source_commit,
                  node_artifact_sha256: $node_sha256,
                  genesis_sha256: $genesis_sha256,
                  candidates: $ami_candidates
                }
              },
              validator_foundation_ready: $ready,
              deployment_executed: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/public-testnet-input-resolution.json
          sha256sum artifacts/public-testnet-input-resolution.json \
            > artifacts/SHA256SUMS
          jq . artifacts/public-testnet-input-resolution.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-public-testnet-input-resolution-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
