name: JUNCA Stale Workflow Run Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-stale-run-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: junca-stale-workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require verified continuity commit in current main lineage
        shell: bash
        run: |
          set -euo pipefail
          verified_sha=c750405dff405a6773bda85a1e9754ca7452e87f
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31137046022")"
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$verified_sha"
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${verified_sha}...${main_sha}")"
          status="$(jq -r .status <<<"$compare")"
          case "$status" in
            identical|ahead) ;;
            *) echo "Verified continuity commit is not in current main lineage" >&2; exit 1 ;;
          esac

      - name: Force-cancel only the two superseded queued runs
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 31125147612 30969847156; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            case "$status" in
              queued|requested|pending|waiting|in_progress)
                if ! gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                  >/dev/null 2>/tmp/cancel-${run_id}.err; then
                  cat /tmp/cancel-${run_id}.err >&2
                  gh api --method POST \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" \
                    >/dev/null
                fi
                ;;
              completed)
                ;;
              *)
                echo "Unexpected workflow status for ${run_id}: ${status}" >&2
                exit 1
                ;;
            esac
          done
          for attempt in $(seq 1 45); do
            active=0
            for run_id in 31125147612 30969847156; do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
              case "$status" in completed) ;; *) active=$((active+1));; esac
            done
            if [ "$active" -eq 0 ]; then exit 0; fi
            test "$attempt" -lt 45
            sleep 2
          done

      - name: Publish cleanup evidence
        shell: bash
        run: |
          {
            echo '## JSEC stale workflow cleanup'
            echo '- Current continuity run: `31137046022` — `SUCCESS`'
            echo '- Superseded continuity run `31125147612`: `CANCELLED/COMPLETED`'
            echo '- Superseded publication rerun `30969847156`: `CANCELLED/COMPLETED`'
            echo '- Mainnet changed: `false`'
            echo '- Assets moved: `false`'
            echo '- Bridge activated: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
