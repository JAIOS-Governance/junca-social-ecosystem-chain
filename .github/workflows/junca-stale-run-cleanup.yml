name: JUNCA Stale Workflow Run Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-stale-run-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: junca-stale-workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require verified continuity commit in current main lineage
        shell: bash
        run: |
          set -euo pipefail
          verified_sha=c750405dff405a6773bda85a1e9754ca7452e87f
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31137046022")"
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$verified_sha"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${verified_sha}...${main_sha}" --jq .status)"
          case "$status" in identical|ahead) ;; *) exit 1;; esac

      - name: Delete only the two superseded provider-ghost runs
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          printf '%s %s\n' \
            31125147612 f9b05801399d9e40d14562e9c17fb9f66e638d90 \
            30969847156 fe9570cea070b9430136308f24a5fed2a3a1c394 \
            > /tmp/stale-runs.txt
          deleted=0
          retained=0
          while read -r run_id expected_sha; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r .head_sha <<<"$run")" = "$expected_sha"
            status="$(jq -r .status <<<"$run")"
            case "$status" in
              completed)
                ;;
              queued|requested|pending|waiting|in_progress)
                if gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                  >/dev/null 2>/tmp/delete-${run_id}.err; then
                  deleted=$((deleted+1))
                else
                  retained=$((retained+1))
                  cat /tmp/delete-${run_id}.err >&2
                fi
                ;;
              *)
                retained=$((retained+1))
                ;;
            esac
          done </tmp/stale-runs.txt
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
          echo "retained=$retained" >> "$GITHUB_OUTPUT"

      - name: Publish cleanup evidence
        shell: bash
        run: |
          {
            echo '## JSEC stale workflow cleanup'
            echo '- Current continuity run: `31137046022` — `SUCCESS`'
            echo '- Superseded ghost runs deleted: `${{ steps.cleanup.outputs.deleted }}`'
            echo '- Provider-retained ghost records: `${{ steps.cleanup.outputs.retained }}`'
            echo '- Current JSEC execution affected: `false`'
            echo '- Mainnet changed: `false`'
            echo '- Assets moved: `false`'
            echo '- Bridge activated: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
