name: Resume Foundation 30428591100

on:
  pull_request:
    paths:
      - ".github/workflows/resume-foundation-30428591100.yml"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: resume-foundation-30428591100
  cancel-in-progress: false

jobs:
  resume:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_SHA: beea0c2e7b0a0f579dc335fffd5d829a90467f1d
      AMI_RUN_ID: "30427620603"
      MANIFEST_GATE_RUN_ID: "30428572546"
      RESUME_RUN_ID: "30428591100"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact resume lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          for run_id in "$AMI_RUN_ID" "$MANIFEST_GATE_RUN_ID" "$RESUME_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          ami="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AMI_RUN_ID}")"
          jq -e --arg source "$SOURCE_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Validator Immutable AMI Build" and
            .head_sha == $source and
            .head_branch == "main"
          ' <<<"$ami"
          manifest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MANIFEST_GATE_RUN_ID}")"
          jq -e --arg source "$SOURCE_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Runtime Release Manifest Gate" and
            .head_sha == $source and
            .head_branch == "main"
          ' <<<"$manifest"
          resume="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}")"
          jq -e --arg source "$SOURCE_SHA" '
            .status == "completed" and
            .conclusion == "failure" and
            .name == "JUNCA Validator Foundation Release" and
            .head_sha == $source and
            .head_branch == "main"
          ' <<<"$resume"

      - name: Resume exact serial validator rollout
        id: foundation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          foundation_run_id="$(
            bash scripts/junca_dispatch_workflow_and_wait.sh \
              --workflow-name "JUNCA Validator Foundation Release" \
              --workflow-path ".github/workflows/junca-validator-foundation-release.yml" \
              --expected-head "$SOURCE_SHA" \
              --attempts 900 \
              --sleep-seconds 15 \
              --input "ami_run_id=$AMI_RUN_ID" \
              --input "manifest_gate_run_id=$MANIFEST_GATE_RUN_ID" \
              --input "resume_run_id=$RESUME_RUN_ID" \
              --input "authorize_rollout=PUBLIC_TESTNET_ROLLOUT"
          )"
          echo "foundation_run_id=$foundation_run_id" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/foundation
          gh run download "$foundation_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "junca-validator-foundation-release-${foundation_run_id}" \
            --dir artifacts/foundation
          test -f artifacts/foundation/rolling-resume-evidence.json
          jq -e --arg source "$SOURCE_SHA" '
            .schema_version == "junca-validator-rolling-resume/v1" and
            .candidate.source_commit == $source and
            .updated_count == 3 and
            .updated_validator_ids == ["validator-01","validator-02","validator-03"] and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' artifacts/foundation/rolling-resume-evidence.json

      - name: Verify advancing Public Testnet continuity
        id: continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          continuity_run_id="$(
            bash scripts/junca_dispatch_workflow_and_wait.sh \
              --workflow-name "JUNCA Public Testnet Continuity Evidence" \
              --workflow-path ".github/workflows/junca-public-testnet-continuity.yml" \
              --expected-head "$SOURCE_SHA" \
              --attempts 120 \
              --sleep-seconds 15 \
              --input "require_advancement=true" \
              --input "samples=3" \
              --input "interval_seconds=30"
          )"
          echo "continuity_run_id=$continuity_run_id" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/continuity
          gh run download "$continuity_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "junca-public-testnet-continuity-${continuity_run_id}" \
            --dir artifacts/continuity
          jq -e --arg source "$SOURCE_SHA" '
            .schema_version == "junca-public-testnet-continuity/v1" and
            .state == "ACTIVE_ADVANCING" and
            .source_sha == $source and
            .advancement_required == true and
            .sample_count == 3 and
            .transaction_submission_enabled == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' artifacts/continuity/evidence.json
          echo "finalized_height=$(jq -er '.observations[-1].operational.finalized_height' artifacts/continuity/evidence.json)" >> "$GITHUB_OUTPUT"

      - name: Record resumed activation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Public Testnet resumed activation acceptance

          - State: **ACTIVE_ADVANCING**
          - Source SHA: \`$SOURCE_SHA\`
          - Resume parent run: \`$RESUME_RUN_ID\`
          - Successful Foundation run: \`${{ steps.foundation.outputs.foundation_run_id }}\`
          - Continuity run: \`${{ steps.continuity.outputs.continuity_run_id }}\`
          - Finalized height: \`${{ steps.continuity.outputs.finalized_height }}\`

          Safety boundary:
          - Public Testnet / No Monetary Value
          - Transaction submission disabled
          - Mainnet Changed: false
          - Assets Moved: false
          - Bridge Activated: false
          - Mainnet Activation Authorized: false
          EOF
          )"
          for issue in 266 244 248 249 218; do
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
              -f body="$body" >/dev/null
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-resumed-public-testnet-activation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
