name: JUNCA Validator Peer Recovery V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-validator-peer-recovery-v3.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-validator-peer-recovery-v3
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "595710543956"
  AWS_REGION: us-east-1
  DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
  CANONICAL_SLOT_EPOCH: "1786033440"

jobs:
  recover-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: public-testnet
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-peer-recovery-v3-${{ github.run_id }}

      - name: Resolve exact current fleet and recovery contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          aws sts get-caller-identity > artifacts/aws-identity.json
          jq -e --arg account "$AWS_ACCOUNT_ID" '
            .Account == $account and
            (.Arn | contains(":assumed-role/JuncaChainPublicTestnetDeployment/"))
          ' artifacts/aws-identity.json >/dev/null
          aws ec2 describe-instances \
            --filters \
              "Name=instance-state-name,Values=running" \
              "Name=tag:Project,Values=JUNCA Social Ecosystem Chain" \
              "Name=tag:Network,Values=Public Testnet" \
              "Name=tag:Validator,Values=01,02,03" \
            > artifacts/ec2-instances.json
          jq -e '
            [.Reservations[].Instances[] | {
              instance_id: .InstanceId,
              validator: (.Tags[] | select(.Key == "Validator") | .Value),
              private_ip: .PrivateIpAddress,
              state: .State.Name,
              security_groups: [.SecurityGroups[].GroupId]
            }] | sort_by(.validator) |
            select(
              length == 3 and
              map(.validator) == ["01","02","03"] and
              (map(.instance_id) | unique | length) == 3 and
              (map(.private_ip) | unique | length) == 3 and
              all(.[]; .state == "running")
            )
          ' artifacts/ec2-instances.json > artifacts/validators.json
          mapfile -t instances < <(jq -r '.[].instance_id' artifacts/validators.json)
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$(IFS=,; echo "${instances[*]}")" \
            > artifacts/ssm-instances.json
          jq -e --argjson expected "$(jq '[.[].instance_id] | sort' artifacts/validators.json)" '
            [.InstanceInformationList[] | select(.PingStatus == "Online") | .InstanceId] |
            sort | . == $expected
          ' artifacts/ssm-instances.json >/dev/null
          jq -r '[.[] | "validator-\(.validator)=\(.private_ip):30303"] | join(",")' \
            artifacts/validators.json > artifacts/canonical-peer-endpoints.txt
          [[ "$CANONICAL_SLOT_EPOCH" =~ ^[0-9]+$ ]]
          test "$((CANONICAL_SLOT_EPOCH % 30))" -eq 0
          jq -n \
            --arg epoch "$CANONICAL_SLOT_EPOCH" \
            --arg peers "$(cat artifacts/canonical-peer-endpoints.txt)" \
            --arg source_run "31131733011" \
            --arg source_artifact "8976482172" '{
              schema_version: "junca-validator-peer-recovery-contract/v3",
              canonical_slot_epoch: ($epoch|tonumber),
              canonical_peer_endpoints: $peers,
              epoch_source: {
                workflow_run_id: ($source_run|tonumber),
                artifact_id: ($source_artifact|tonumber),
                validator_id: "validator-01",
                runtime_environment_source: "exact_instance_launch_user_data"
              },
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/recovery-contract.json
          curl -fsS -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
            https://rpc.jaios-governance.org/ > artifacts/public-baseline-block.json
          python3 - <<'PY' > artifacts/public-baseline-height.txt
          import json
          print(int(json.load(open('artifacts/public-baseline-block.json'))['result'],16))
          PY

      - name: Apply exact peer and epoch configuration serially
        shell: bash
        run: |
          set -Eeuo pipefail
          peers="$(cat artifacts/canonical-peer-endpoints.txt)"
          failures=0
          while IFS=$'\t' read -r validator instance private_ip; do
            expected_validator="validator-${validator}"
            {
              printf 'EXPECTED_VALIDATOR=%q\n' "$expected_validator"
              printf 'CANONICAL_PEERS=%q\n' "$peers"
              printf 'CANONICAL_EPOCH=%q\n' "$CANONICAL_SLOT_EPOCH"
              printf 'SELF_PRIVATE_IP=%q\n' "$private_ip"
              cat <<'REMOTE'
          set -Eeuo pipefail
          value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {print substr($0, length(key) + 2)}' /etc/junca/runtime.env | tail -n 1
          }
          diagnostics() {
            awk -F= '/^(VALIDATOR_ID|CHAIN_ID|P2P_PORT|VALIDATOR_PEER_ENDPOINTS|AUTOMATIC_FINALITY_ENABLED|TESTNET_BLOCK_INTERVAL_SECONDS|TESTNET_SLOT_EPOCH_SECONDS)=/{print}' /etc/junca/runtime.env || true
            ss -lntp || true
            systemctl status junca-validator.service --no-pager -l || true
            journalctl -u junca-validator.service -n 200 --no-pager || true
          }
          trap 'rc=$?; echo "JUNCA_PEER_RECOVERY_V3_FAILED rc=${rc}"; diagnostics; exit "$rc"' ERR

          test -s /etc/junca/runtime.env
          test "$(value VALIDATOR_ID)" = "$EXPECTED_VALIDATOR"
          test "$(value CHAIN_ID)" = 20260723
          test "$(value BRIDGE_ACTIVATED)" = false
          test -n "$(value SIGNER_RESOURCE_ARN)"
          test -n "$(value VALIDATOR_SIGNER_BINDINGS)"

          python3 - "$CANONICAL_EPOCH" "$CANONICAL_PEERS" <<'PY'
          from pathlib import Path
          import os, sys
          epoch, peers = sys.argv[1:]
          path = Path('/etc/junca/runtime.env')
          updates = {
              'P2P_PORT': '30303',
              'VALIDATOR_PEER_ENDPOINTS': peers,
              'AUTOMATIC_FINALITY_ENABLED': 'true',
              'TESTNET_BLOCK_INTERVAL_SECONDS': '30',
              'TESTNET_SLOT_EPOCH_SECONDS': epoch,
          }
          observed=set(); output=[]
          for line in path.read_text(encoding='utf-8').splitlines():
              if '=' not in line or line.lstrip().startswith('#'):
                  output.append(line); continue
              key=line.split('=',1)[0]
              if key in updates:
                  output.append(f'{key}={updates[key]}'); observed.add(key)
              else:
                  output.append(line)
          missing=set(updates)-observed
          if missing: raise SystemExit(f'RUNTIME_ENV_KEYS_MISSING: {sorted(missing)}')
          temporary=Path('/etc/junca/runtime.env.v3.tmp')
          temporary.write_text('\n'.join(output)+'\n',encoding='utf-8')
          os.chmod(temporary,0o640)
          os.chown(temporary,0,os.stat(path).st_gid)
          temporary.replace(path)
          PY

          test "$(value VALIDATOR_ID)" = "$EXPECTED_VALIDATOR"
          test "$(value P2P_PORT)" = 30303
          test "$(value VALIDATOR_PEER_ENDPOINTS)" = "$CANONICAL_PEERS"
          test "$(value AUTOMATIC_FINALITY_ENABLED)" = true
          test "$(value TESTNET_BLOCK_INTERVAL_SECONDS)" = 30
          test "$(value TESTNET_SLOT_EPOCH_SECONDS)" = "$CANONICAL_EPOCH"
          chown root:junca /etc/junca/runtime.env
          chmod 0640 /etc/junca/runtime.env

          systemctl reset-failed junca-validator.service junca-public-rpc.service junca-public-explorer.service || true
          systemctl restart junca-validator.service
          ready=false
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8545/health >/tmp/validator-health.json \
              && jq -e '
                .status == "healthy" and
                .chain_id == 20260723 and
                .automatic_finality_enabled == true and
                .automatic_finality_loop_running == true and
                .mainnet_changed == false and
                .assets_moved == false and
                .bridge_activated == false
              ' /tmp/validator-health.json >/dev/null \
              && ss -lntH | awk '$4 ~ /:30303$/ {found=1} END {exit found?0:1}'; then
              ready=true; break
            fi
            test "$attempt" -lt 120
            sleep 2
          done
          test "$ready" = true
          systemctl is-active --quiet junca-validator.service
          systemctl restart junca-public-rpc.service junca-public-explorer.service
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8546/health >/tmp/rpc-health.json \
              && curl -fsS http://127.0.0.1:3000/health >/tmp/explorer-health.json; then break; fi
            test "$attempt" -lt 60
            sleep 2
          done
          jq -cn \
            --arg validator_id "$(value VALIDATOR_ID)" \
            --arg private_ip "$SELF_PRIVATE_IP" \
            --argjson epoch "$CANONICAL_EPOCH" \
            --slurpfile health /tmp/validator-health.json '{
              schema_version:"junca-validator-peer-recovery/v3",
              accepted:true,
              validator_id:$validator_id,
              private_ip:$private_ip,
              canonical_epoch:$epoch,
              health:$health[0],
              mainnet_changed:false,
              assets_moved:false,
              bridge_activated:false
            }'
          echo JUNCA_PEER_RECOVERY_V3_LOCAL_ACCEPTED
          REMOTE
            } > /tmp/recover-${validator}.sh
            jq -Rs '{commands:[.]}' /tmp/recover-${validator}.sh > /tmp/recover-${validator}.json
            command_id="$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name AWS-RunShellScript \
              --parameters file:///tmp/recover-${validator}.json \
              --comment "JUNCA ${expected_validator} peer recovery v3" \
              --query Command.CommandId --output text)"
            echo "$command_id" > "artifacts/recovery-command-${validator}.txt"
            for attempt in $(seq 1 150); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              test "$attempt" -lt 150
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/recovery-${validator}-${instance}.json"
            jq -r '.Status, .StandardOutputContent, .StandardErrorContent' \
              "artifacts/recovery-${validator}-${instance}.json"
            if ! jq -e '
              .Status == "Success" and
              (.ResponseCode // -1) == 0 and
              (.StandardOutputContent | contains("junca-validator-peer-recovery/v3")) and
              (.StandardOutputContent | contains("JUNCA_PEER_RECOVERY_V3_LOCAL_ACCEPTED"))
            ' "artifacts/recovery-${validator}-${instance}.json" >/dev/null; then
              failures=$((failures+1)); break
            fi
          done < <(jq -r '.[] | [.validator,.instance_id,.private_ip] | @tsv' artifacts/validators.json)
          test "$failures" -eq 0

      - name: Require exact peer quorum and finality on every validator
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t instances < <(jq -r '.[].instance_id' artifacts/validators.json)
          cat > /tmp/accept-peers.sh <<'REMOTE'
          set -Eeuo pipefail
          accepted=false
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8545/health >/tmp/peer-health.json \
              && jq -e '
                .status == "healthy" and
                .authenticated_peer_count == 2 and
                (.authenticated_peer_ids | length) == 2 and
                .automatic_finality_enabled == true and
                .automatic_finality_loop_running == true and
                .consensus.last_certificate.signed_power == 3 and
                .consensus.last_certificate.total_power == 3 and
                .mainnet_changed == false and
                .assets_moved == false and
                .bridge_activated == false
              ' /tmp/peer-health.json >/dev/null; then accepted=true; break; fi
            test "$attempt" -lt 180
            sleep 2
          done
          test "$accepted" = true
          cat /tmp/peer-health.json
          echo JUNCA_EXACT_TWO_PEERS_ACCEPTED
          REMOTE
          jq -Rs '{commands:[.]}' /tmp/accept-peers.sh > /tmp/accept-peers.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/accept-peers.json \
            --comment 'JUNCA exact 2-peer and 3-of-3 finality acceptance' \
            --query Command.CommandId --output text)"
          echo "$command_id" > artifacts/peer-acceptance-command-id.txt
          failures=0
          for instance in "${instances[@]}"; do
            for attempt in $(seq 1 210); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || true)"
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              test "$attempt" -lt 210
              sleep 2
            done
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/peer-acceptance-${instance}.json"
            jq -r '.Status, .StandardOutputContent, .StandardErrorContent' \
              "artifacts/peer-acceptance-${instance}.json"
            if ! jq -e '
              .Status == "Success" and
              (.StandardOutputContent | contains("JUNCA_EXACT_TWO_PEERS_ACCEPTED"))
            ' "artifacts/peer-acceptance-${instance}.json" >/dev/null; then failures=$((failures+1)); fi
          done
          test "$failures" -eq 0

      - name: Require public Testnet parity and advancing finalized height
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline="$(cat artifacts/public-baseline-height.txt)"
          : > artifacts/public-samples.jsonl
          for sample in 1 2 3 4; do
            accepted=false
            for attempt in $(seq 1 40); do
              if curl -fsS https://health.jaios-governance.org/health > /tmp/health.json \
                && curl -fsS https://explorer.jaios-governance.org/explorer.json > /tmp/explorer.json \
                && curl -fsS -H 'content-type: application/json' \
                  --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                  https://rpc.jaios-governance.org/ > /tmp/chain-id.json \
                && curl -fsS -H 'content-type: application/json' \
                  --data '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' \
                  https://rpc.jaios-governance.org/ > /tmp/block.json \
                && jq -e '.status=="healthy" and .read_only==true' /tmp/health.json >/dev/null \
                && jq -e '
                  .status=="ready" and .read_only==true and .finalized_only==true and
                  .network.chain_id_decimal==20260723 and .network.peer_count==2 and
                  .head.signed_power==3 and .head.total_power==3 and
                  .mainnet_changed==false and .assets_moved==false and .bridge_activated==false
                ' /tmp/explorer.json >/dev/null \
                && jq -e '.result=="0x1352773"' /tmp/chain-id.json >/dev/null; then accepted=true; break; fi
              test "$attempt" -lt 40
              sleep 2
            done
            test "$accepted" = true
            jq -cn \
              --argjson sample "$sample" \
              --slurpfile health /tmp/health.json \
              --slurpfile explorer /tmp/explorer.json \
              --slurpfile chain_id /tmp/chain-id.json \
              --slurpfile block /tmp/block.json '{
                sample:$sample,
                observed_at:(now|todateiso8601),
                health:$health[0],
                explorer:$explorer[0],
                rpc_chain_id:$chain_id[0],
                rpc_block_number:$block[0]
              }' >> artifacts/public-samples.jsonl
            if [ "$sample" -lt 4 ]; then sleep 35; fi
          done
          jq -s '.' artifacts/public-samples.jsonl > artifacts/public-samples.json
          read -r first last < <(python3 - <<'PY'
          import json
          data=json.load(open('artifacts/public-samples.json'))
          print(int(data[0]['rpc_block_number']['result'],16),int(data[-1]['rpc_block_number']['result'],16))
          PY
          )
          test "$last" -gt "$baseline"
          test "$last" -gt "$first"
          jq -n \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson baseline "$baseline" --argjson first "$first" --argjson last "$last" \
            --argjson validators "$(cat artifacts/validators.json)" \
            --argjson samples "$(cat artifacts/public-samples.json)" '{
              schema_version:"junca-public-testnet-recovery/v3",
              result:"ACTIVE_ADVANCING",
              workflow_run_url:$run_url,
              baseline_height:$baseline,
              first_sample_height:$first,
              final_sample_height:$last,
              validators:$validators,
              public_samples:$samples,
              expected_peer_count:2,
              signed_power:3,
              total_power:3,
              mainnet_changed:false,
              assets_moved:false,
              bridge_activated:false,
              mainnet_activation_authorized:false
            }' > artifacts/public-testnet-recovery-v3.json
          sha256sum artifacts/public-testnet-recovery-v3.json > artifacts/public-testnet-recovery-v3.json.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-validator-peer-recovery-v3-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
