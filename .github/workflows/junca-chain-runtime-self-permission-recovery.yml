name: JUNCA Chain Runtime Self Permission Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/junca-chain-runtime-self-permission-recovery.yml

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 10
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      TARGET_ROLE_NAME: JuncaChainPublicTestnetDeployment
      TARGET_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
    steps:
      - uses: actions/checkout@v4

      - name: Enforce Public Testnet boundary
        run: |
          set -euo pipefail
          test "$AWS_ACCOUNT_ID" = "595710543956"
          test "$AWS_REGION" = "us-east-1"
          test "$TARGET_ROLE_ARN" = \
            "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment"
          jq -e '
            .notice == "Public Testnet / No Monetary Value" and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' config/junca_social_ecosystem_chain_aws_foundation_gates.pending.json

      - name: Acquire repository OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          jq -er .value <<<"$token_json" > /tmp/junca-oidc-token

      - name: Apply exact self-readback policy through approved roles
        id: recovery
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          result="UNAVAILABLE"
          selected_role=""
          error_summary=""
          verification="UNVERIFIED"

          # Fast path for an administrator-attached exact grant.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          if aws sts assume-role-with-web-identity \
            --role-arn "$TARGET_ROLE_ARN" \
            --role-session-name "junca-self-readback-existing-${GITHUB_RUN_ID}" \
            --web-identity-token "$(cat /tmp/junca-oidc-token)" \
            --duration-seconds 900 \
            > /tmp/existing-assume.json 2> /tmp/existing-assume.stderr; then
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            AWS_ACCESS_KEY_ID="$(jq -er .Credentials.AccessKeyId /tmp/existing-assume.json)"
            AWS_SECRET_ACCESS_KEY="$(jq -er .Credentials.SecretAccessKey /tmp/existing-assume.json)"
            AWS_SESSION_TOKEN="$(jq -er .Credentials.SessionToken /tmp/existing-assume.json)"
            if aws iam simulate-principal-policy \
              --policy-source-arn "$TARGET_ROLE_ARN" \
              --action-names iam:SimulatePrincipalPolicy \
              --resource-arns "$TARGET_ROLE_ARN" \
              > artifacts/self-permission-simulation.json \
              2> artifacts/self-permission-simulation.stderr; then
              decision="$(jq -r '.EvaluationResults[0].EvalDecision' artifacts/self-permission-simulation.json)"
              if [[ "$decision" == "allowed" ]]; then
                selected_role="$TARGET_ROLE_ARN"
                result="PRESENT"
                verification="PASS"
              fi
            fi
          else
            error_summary+="existing target-role assumption failed; "
          fi

          cat > /tmp/self-readback-policy.json <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "SimulateCanonicalDeploymentRoleOnly",
              "Effect": "Allow",
              "Action": "iam:SimulatePrincipalPolicy",
              "Resource": "$TARGET_ROLE_ARN"
            }]
          }
          JSON

          if [[ "$verification" != "PASS" ]]; then
            for bootstrap_role in \
              "arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment" \
              "arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment"
            do
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            if ! aws sts assume-role-with-web-identity \
              --role-arn "$bootstrap_role" \
              --role-session-name "junca-self-readback-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/junca-oidc-token)" \
              --duration-seconds 900 \
              > /tmp/assume.json 2> /tmp/assume.stderr; then
              error_summary+="assume ${bootstrap_role}: $(tr '\n' ' ' < /tmp/assume.stderr | cut -c1-240); "
              continue
            fi
            export AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY
            export AWS_SESSION_TOKEN
            AWS_ACCESS_KEY_ID="$(jq -er .Credentials.AccessKeyId /tmp/assume.json)"
            AWS_SECRET_ACCESS_KEY="$(jq -er .Credentials.SecretAccessKey /tmp/assume.json)"
            AWS_SESSION_TOKEN="$(jq -er .Credentials.SessionToken /tmp/assume.json)"

            actual_account="$(aws sts get-caller-identity --query Account --output text)"
            if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
              error_summary+="account mismatch for ${bootstrap_role}; "
              continue
            fi
            if aws iam put-role-policy \
              --role-name "$TARGET_ROLE_NAME" \
              --policy-name SelfPermissionReadback \
              --policy-document file:///tmp/self-readback-policy.json \
              2> /tmp/put-policy.stderr; then
              selected_role="$bootstrap_role"
              result="APPLIED"
              break
            fi
            error_summary+="put policy via ${bootstrap_role}: $(tr '\n' ' ' < /tmp/put-policy.stderr | cut -c1-240); "
            done
          fi

          if [[ "$result" == "APPLIED" ]]; then
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            if aws sts assume-role-with-web-identity \
              --role-arn "$TARGET_ROLE_ARN" \
              --role-session-name "junca-self-readback-verify-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/junca-oidc-token)" \
              --duration-seconds 900 \
              > /tmp/verify-assume.json \
              2> /tmp/verify-assume.stderr; then
              export AWS_ACCESS_KEY_ID
              export AWS_SECRET_ACCESS_KEY
              export AWS_SESSION_TOKEN
              AWS_ACCESS_KEY_ID="$(jq -er .Credentials.AccessKeyId /tmp/verify-assume.json)"
              AWS_SECRET_ACCESS_KEY="$(jq -er .Credentials.SecretAccessKey /tmp/verify-assume.json)"
              AWS_SESSION_TOKEN="$(jq -er .Credentials.SessionToken /tmp/verify-assume.json)"
            else
              error_summary+="fresh target-role assumption failed; "
            fi
            if aws iam simulate-principal-policy \
              --policy-source-arn "$TARGET_ROLE_ARN" \
              --action-names iam:SimulatePrincipalPolicy \
              --resource-arns "$TARGET_ROLE_ARN" \
              > artifacts/self-permission-simulation.json \
              2> artifacts/self-permission-simulation.stderr; then
              decision="$(jq -r '.EvaluationResults[0].EvalDecision' \
                artifacts/self-permission-simulation.json)"
              [[ "$decision" == "allowed" ]] && verification="PASS" || verification="FAIL"
            else
              error_summary+="verification simulation unavailable; "
            fi
          fi

          jq -n \
            --arg account_id "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg target_role_arn "$TARGET_ROLE_ARN" \
            --arg selected_bootstrap_role "$selected_role" \
            --arg recovery_result "$result" \
            --arg verification "$verification" \
            --arg error_summary "$error_summary" \
            '{
              schema_version: "1.0",
              chain_name: "JUNCA Social Ecosystem Chain",
              governance: "JAIOS Institutional Governance",
              notice: "Public Testnet / No Monetary Value",
              account_id: $account_id,
              region: $region,
              target_role_arn: $target_role_arn,
              granted_action: "iam:SimulatePrincipalPolicy",
              granted_resource: $target_role_arn,
              selected_bootstrap_role: $selected_bootstrap_role,
              recovery_result: $recovery_result,
              verification: $verification,
              error_summary: $error_summary,
              broad_iam_grant: false,
              docs_runtime_role_used: false,
              apply_executed: false,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/runtime-self-permission-recovery.json

          echo "recovery_result=$result" >> "$GITHUB_OUTPUT"
          echo "verification=$verification" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: junca-runtime-self-permission-recovery-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Report machine gate
        run: |
          set -euo pipefail
          jq . artifacts/runtime-self-permission-recovery.json
          if [[ "${{ steps.recovery.outputs.verification }}" != "PASS" ]]; then
            echo "::warning::Exact self-readback policy was not verified; AWS foundation remains fail-closed."
          fi

      - name: Publish non-secret recovery summary
        if: always()
        run: |
          set -euo pipefail
          evidence=artifacts/runtime-self-permission-recovery.json
          {
            echo "## JUNCA Public Testnet IAM Recovery"
            echo
            echo "- Account: $(jq -r .account_id "$evidence")"
            echo "- Region: $(jq -r .region "$evidence")"
            echo "- Result: $(jq -r .recovery_result "$evidence")"
            echo "- Verification: $(jq -r .verification "$evidence")"
            echo "- Broad IAM grant: $(jq -r .broad_iam_grant "$evidence")"
            echo "- Docs runtime role used: $(jq -r .docs_runtime_role_used "$evidence")"
            echo "- Mainnet changed: $(jq -r .mainnet_changed "$evidence")"
            echo "- Assets moved: $(jq -r .assets_moved "$evidence")"
            echo "- Bridge activated: $(jq -r .bridge_activated "$evidence")"
          } >> "$GITHUB_STEP_SUMMARY"
