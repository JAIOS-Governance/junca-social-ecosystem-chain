name: JUNCA Public Testnet Continuity Evidence

on:
  pull_request:
    paths:
      - "scripts/ops/public_testnet_continuity.py"
      - "scripts/ops/public_testnet_continuity_entrypoint.py"
      - "tests/test_public_testnet_continuity.py"
      - ".github/workflows/junca-public-testnet-continuity.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ops/public_testnet_continuity.py"
      - "scripts/ops/public_testnet_continuity_entrypoint.py"
      - "tests/test_public_testnet_continuity.py"
      - ".github/workflows/junca-public-testnet-continuity.yml"
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      require_advancement:
        description: "Require finalized height advancement during the observation window"
        required: true
        default: false
        type: boolean
      samples:
        description: "Number of evidence samples"
        required: true
        default: "3"
        type: string
      interval_seconds:
        description: "Seconds between samples"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: junca-public-testnet-continuity-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  provider-gate:
    name: GitHub Actions provider gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      operational: ${{ steps.status.outputs.operational }}
      provider_status: ${{ steps.status.outputs.provider_status }}
    steps:
      - name: Classify GitHub Actions provider state
        id: status
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "operational=true" >> "$GITHUB_OUTPUT"
            echo "provider_status=CI_EVENT_NOT_DEFERRED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          summary=""
          for attempt in 1 2 3; do
            if summary="$(curl --fail --silent --show-error --max-time 10 \
              https://www.githubstatus.com/api/v2/summary.json)"; then
              break
            fi
            sleep $((attempt * 2))
          done

          if [ -z "$summary" ]; then
            echo "operational=false" >> "$GITHUB_OUTPUT"
            echo "provider_status=STATUS_API_UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Actions provider gate::Status API unavailable; scheduled continuity run deferred without changing chain state."
            exit 0
          fi

          provider_status="$(jq -r '.components[] | select(.name == "Actions") | .status' <<<"$summary")"
          test -n "$provider_status"
          echo "provider_status=$provider_status" >> "$GITHUB_OUTPUT"
          if [ "$provider_status" = "operational" ]; then
            echo "operational=true" >> "$GITHUB_OUTPUT"
          else
            echo "operational=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Actions provider incident::Scheduled continuity run deferred while Actions status is $provider_status."
          fi

      - name: Publish provider-gate summary
        if: always()
        run: |
          {
            echo "## GitHub Actions Provider Gate"
            echo "- Event: `${{ github.event_name }}`"
            echo "- Provider status: `${{ steps.status.outputs.provider_status || 'UNKNOWN' }}`"
            echo "- Continuity execution authorized: `${{ steps.status.outputs.operational || 'false' }}`"
            echo "- Mainnet changed: `false`"
            echo "- Assets moved: `false`"
            echo "- Bridge activated: `false`"
          } >> "$GITHUB_STEP_SUMMARY"

  contract-tests:
    needs: provider-gate
    if: needs.provider-gate.outputs.operational == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate continuity evidence contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/ops/public_testnet_continuity.py
          python -m py_compile scripts/ops/public_testnet_continuity_entrypoint.py
          python -m unittest tests.test_public_testnet_continuity -v

  live-continuity-readback:
    if: github.event_name != 'pull_request' && needs.provider-gate.outputs.operational == 'true'
    needs:
      - provider-gate
      - contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SAMPLES: ${{ inputs.samples || '3' }}
      INTERVAL_SECONDS: ${{ inputs.interval_seconds || '30' }}
      REQUIRE_ADVANCEMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_advancement || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Public Testnet continuity evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-testnet-continuity
          advancement_flag=""
          if [ "${REQUIRE_ADVANCEMENT}" = "true" ]; then
            advancement_flag="--require-advancement"
          fi
          python scripts/ops/public_testnet_continuity_entrypoint.py \
            --source-sha "${GITHUB_SHA}" \
            --expected-chain-id 20260723 \
            --expected-peer-count 2 \
            --expected-signed-power 3 \
            --expected-total-power 3 \
            --max-head-age-seconds 300 \
            --samples "${SAMPLES}" \
            --interval-seconds "${INTERVAL_SECONDS}" \
            --output artifacts/public-testnet-continuity/evidence.json \
            ${advancement_flag}

      - name: Upload continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junca-public-testnet-continuity-${{ github.run_id }}
          path: artifacts/public-testnet-continuity/
          if-no-files-found: error
          retention-days: 30
