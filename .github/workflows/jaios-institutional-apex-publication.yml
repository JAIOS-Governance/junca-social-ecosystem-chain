name: JAIOS Institutional Apex Publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/jaios-institutional-apex-publication.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: jaios-institutional-apex-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 45
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      DOMAIN: jaios-governance.org
      ORIGIN: jaios-institutional-governance.juncajapan-inc.chatgpt.site
      CLOUDFRONT_ZONE_ID: Z2FDTNDATAQYW2
    steps:
      - name: Configure verified AWS identity
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-institutional-apex-${{ github.run_id }}
          disable-retry: true

      - name: Verify account and hosted zone
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "${DOMAIN}."
          curl --fail --silent --show-error --location "https://${ORIGIN}/?origin-readback=${GITHUB_RUN_ID}" >/tmp/origin.html
          grep -q "JAIOS" /tmp/origin.html

      - name: Ensure ACM certificate
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          cert_arn="$(aws acm list-certificates --certificate-statuses ISSUED PENDING_VALIDATION --query "CertificateSummaryList[?DomainName=='${DOMAIN}'].CertificateArn | [0]" --output text)"
          if [ -z "$cert_arn" ] || [ "$cert_arn" = "None" ]; then
            cert_arn="$(aws acm request-certificate --domain-name "$DOMAIN" --validation-method DNS --idempotency-token jaiosapex --options CertificateTransparencyLoggingPreference=ENABLED --query CertificateArn --output text)"
          fi
          for attempt in $(seq 1 30); do
            record_name="$(aws acm describe-certificate --certificate-arn "$cert_arn" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' --output text)"
            record_value="$(aws acm describe-certificate --certificate-arn "$cert_arn" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' --output text)"
            if [ "$record_name" != "None" ] && [ "$record_value" != "None" ]; then break; fi
            sleep 10
          done
          test "$record_name" != "None"
          test "$record_value" != "None"
          cat >/tmp/acm-validation.json <<JSON
          {"Comment":"Validate JAIOS Institutional apex certificate","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"${record_name}","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"${record_value}"}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/acm-validation.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          aws acm wait certificate-validated --certificate-arn "$cert_arn"
          test "$(aws acm describe-certificate --certificate-arn "$cert_arn" --query Certificate.Status --output text)" = "ISSUED"
          echo "arn=$cert_arn" >> "$GITHUB_OUTPUT"

      - name: Grant bounded CloudFront publication capability
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/jaios-apex-cloudfront-policy.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Sid":"JAIOSInstitutionalApexPublication",
              "Effect":"Allow",
              "Action":[
                "cloudfront:ListDistributions",
                "cloudfront:CreateDistribution",
                "cloudfront:GetDistribution",
                "cloudfront:GetDistributionConfig"
              ],
              "Resource":"*"
            }]
          }
          JSON
          aws iam put-role-policy \
            --role-name JuncaChainPublicTestnetDeployment \
            --policy-name JAIOSInstitutionalApexCloudFront \
            --policy-document file:///tmp/jaios-apex-cloudfront-policy.json
          aws iam get-role-policy \
            --role-name JuncaChainPublicTestnetDeployment \
            --policy-name JAIOSInstitutionalApexCloudFront \
            --query PolicyDocument --output json >/tmp/jaios-apex-cloudfront-policy-readback.json
          grep -q "cloudfront:CreateDistribution" /tmp/jaios-apex-cloudfront-policy-readback.json

      - name: Refresh AWS identity with bounded capability
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-institutional-cloudfront-${{ github.run_id }}
          disable-retry: true

      - name: Ensure CloudFront distribution
        id: distribution
        shell: bash
        env:
          CERT_ARN: ${{ steps.certificate.outputs.arn }}
        run: |
          set -euo pipefail
          distribution_id="$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${DOMAIN}')].Id | [0]" --output text)"
          if [ -z "$distribution_id" ] || [ "$distribution_id" = "None" ]; then
            caller_reference="jaios-institutional-${GITHUB_RUN_ID}"
            jq -n \
              --arg caller "$caller_reference" \
              --arg domain "$DOMAIN" \
              --arg origin "$ORIGIN" \
              --arg cert "$CERT_ARN" \
              '{CallerReference:$caller,Comment:"JAIOS Institutional Governance production apex",Enabled:true,IsIPV6Enabled:true,HttpVersion:"http2and3",PriceClass:"PriceClass_200",Aliases:{Quantity:1,Items:[$domain]},Origins:{Quantity:1,Items:[{Id:"jaios-sites-origin",DomainName:$origin,OriginPath:"",CustomHeaders:{Quantity:0},CustomOriginConfig:{HTTPPort:80,HTTPSPort:443,OriginProtocolPolicy:"https-only",OriginSslProtocols:{Quantity:1,Items:["TLSv1.2"]},OriginReadTimeout:30,OriginKeepaliveTimeout:5},ConnectionAttempts:3,ConnectionTimeout:10}]},DefaultCacheBehavior:{TargetOriginId:"jaios-sites-origin",ViewerProtocolPolicy:"redirect-to-https",AllowedMethods:{Quantity:3,Items:["HEAD","GET","OPTIONS"],CachedMethods:{Quantity:3,Items:["HEAD","GET","OPTIONS"]}},SmoothStreaming:false,Compress:true,LambdaFunctionAssociations:{Quantity:0},FunctionAssociations:{Quantity:0},FieldLevelEncryptionId:"",ForwardedValues:{QueryString:true,Headers:{Quantity:0},Cookies:{Forward:"all"},QueryStringCacheKeys:{Quantity:0}},MinTTL:0,DefaultTTL:0,MaxTTL:0},CacheBehaviors:{Quantity:0},CustomErrorResponses:{Quantity:0},Restrictions:{GeoRestriction:{RestrictionType:"none",Quantity:0}},ViewerCertificate:{ACMCertificateArn:$cert,SSLSupportMethod:"sni-only",MinimumProtocolVersion:"TLSv1.2_2021",CertificateSource:"acm"},WebACLId:""}' >/tmp/distribution.json
            distribution_id="$(aws cloudfront create-distribution --distribution-config file:///tmp/distribution.json --query Distribution.Id --output text)"
          fi
          distribution_domain="$(aws cloudfront get-distribution --id "$distribution_id" --query Distribution.DomainName --output text)"
          test -n "$distribution_domain"
          echo "id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "domain=$distribution_domain" >> "$GITHUB_OUTPUT"

      - name: Publish Route 53 apex aliases
        id: dns
        shell: bash
        env:
          DISTRIBUTION_DOMAIN: ${{ steps.distribution.outputs.domain }}
        run: |
          set -euo pipefail
          cat >/tmp/apex-alias.json <<JSON
          {"Comment":"Publish JAIOS Institutional Governance apex","Changes":[
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"${DOMAIN}.","Type":"A","AliasTarget":{"HostedZoneId":"${CLOUDFRONT_ZONE_ID}","DNSName":"${DISTRIBUTION_DOMAIN}.","EvaluateTargetHealth":false}}},
            {"Action":"UPSERT","ResourceRecordSet":{"Name":"${DOMAIN}.","Type":"AAAA","AliasTarget":{"HostedZoneId":"${CLOUDFRONT_ZONE_ID}","DNSName":"${DISTRIBUTION_DOMAIN}.","EvaluateTargetHealth":false}}}
          ]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/apex-alias.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and verify production
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ steps.distribution.outputs.id }}
        run: |
          set -euo pipefail
          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"
          for attempt in $(seq 1 30); do
            if body="$(curl --fail --silent --show-error --location --max-time 20 "https://${DOMAIN}/?release=${GITHUB_RUN_ID}")" && grep -q "JAIOS" <<<"$body"; then
              printf '%s' "$body" >/tmp/production.html
              break
            fi
            sleep 20
          done
          test -s /tmp/production.html
          curl --fail --silent --show-error --location "https://${DOMAIN}/observatory?release=${GITHUB_RUN_ID}" | grep -q "Global Observatory"
          {
            echo "### JAIOS Institutional Governance Apex Publication"
            echo "- Production URL: https://${DOMAIN}/"
            echo "- Observatory: https://${DOMAIN}/observatory"
            echo "- AWS Account: ${AWS_ACCOUNT_ID}"
            echo "- Hosted Zone: ${HOSTED_ZONE_ID}"
            echo "- CloudFront Distribution: ${DISTRIBUTION_ID}"
            echo "- Route 53 Change: ${{ steps.dns.outputs.change_id }}"
            echo "- HTTPS Readback: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
