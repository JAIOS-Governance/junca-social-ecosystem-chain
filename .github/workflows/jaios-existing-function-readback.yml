name: JAIOS Existing Function Readback

on:
  pull_request:
    paths:
      - ".github/workflows/jaios-existing-function-readback.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      TARGET_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      FUNCTION_NAME: junca-chain-docs-routes-595710543956
      FUNCTION_ARN: arn:aws:cloudfront::595710543956:function/junca-chain-docs-routes-595710543956
    steps:
      - uses: actions/checkout@v4

      - name: Configure exact deployment identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: jaios-existing-function-readback-${{ github.run_id }}
          disable-retry: true

      - name: Download and normalize both exact function stages
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws cloudfront get-function --name "$FUNCTION_NAME" --stage DEVELOPMENT /tmp/function-development.download > /tmp/function-development-meta.json
          aws cloudfront get-function --name "$FUNCTION_NAME" --stage LIVE /tmp/function-live.download > /tmp/function-live-meta.json
          test "$(jq -r '.FunctionSummary.FunctionMetadata.FunctionARN' /tmp/function-development-meta.json)" = "$FUNCTION_ARN"
          test "$(jq -r '.FunctionSummary.FunctionMetadata.FunctionARN' /tmp/function-live-meta.json)" = "$FUNCTION_ARN"
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          import io
          import json
          import zipfile

          def normalize(source, target, inventory_target):
              raw = Path(source).read_bytes()
              inventory = {
                  'source': source,
                  'bytes': len(raw),
                  'magic_hex': raw[:16].hex(),
                  'archive_entries': [],
                  'selected_entry': None,
                  'encoding': 'raw',
              }
              if zipfile.is_zipfile(io.BytesIO(raw)):
                  inventory['encoding'] = 'zip'
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      names = [name for name in archive.namelist() if not name.endswith('/')]
                      inventory['archive_entries'] = names
                      candidates = [name for name in names if name.lower().endswith(('.js', '.mjs'))]
                      selected = candidates[0] if candidates else names[0]
                      inventory['selected_entry'] = selected
                      raw = archive.read(selected)
              elif raw.startswith(b'\x1f\x8b'):
                  inventory['encoding'] = 'gzip'
                  raw = gzip.decompress(raw)
              Path(target).write_bytes(raw)
              Path(inventory_target).write_text(json.dumps(inventory, indent=2) + '\n')

          normalize('/tmp/function-development.download', '/tmp/function-development.js', '/tmp/function-development-inventory.json')
          normalize('/tmp/function-live.download', '/tmp/function-live.js', '/tmp/function-live-inventory.json')
          PY
          test -s /tmp/function-development.js
          test -s /tmp/function-live.js
          sha256sum /tmp/function-development.js /tmp/function-live.js > /tmp/function-digests.txt
          if cmp -s /tmp/function-development.js /tmp/function-live.js; then
            echo 'IDENTICAL' > /tmp/stage-parity.txt
          else
            echo 'DIFFERENT' > /tmp/stage-parity.txt
            diff -u /tmp/function-live.js /tmp/function-development.js > /tmp/stage-diff.patch || true
          fi

      - name: Read and resolve every exact distribution association
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront list-distributions > /tmp/distributions.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          arn = os.environ['FUNCTION_ARN']
          data = json.loads(Path('/tmp/distributions.json').read_text())
          matches = []
          for distribution in data.get('DistributionList', {}).get('Items', []) or []:
              references = []
              default = distribution.get('DefaultCacheBehavior', {})
              for association in default.get('FunctionAssociations', {}).get('Items', []) or []:
                  if association.get('FunctionARN') == arn:
                      references.append({'scope': 'default', **association})
              for behavior in distribution.get('CacheBehaviors', {}).get('Items', []) or []:
                  for association in behavior.get('FunctionAssociations', {}).get('Items', []) or []:
                      if association.get('FunctionARN') == arn:
                          references.append({
                              'scope': 'cache-behavior',
                              'path_pattern': behavior.get('PathPattern'),
                              'target_origin_id': behavior.get('TargetOriginId'),
                              **association,
                          })
              if references:
                  matches.append({
                      'id': distribution.get('Id'),
                      'domain': distribution.get('DomainName'),
                      'aliases': distribution.get('Aliases', {}).get('Items', []) or [],
                      'origins': [item.get('DomainName') for item in distribution.get('Origins', {}).get('Items', []) or []],
                      'references': references,
                  })
          Path('/tmp/function-associations.json').write_text(json.dumps(matches, indent=2) + '\n')
          PY
          test -s /tmp/function-associations.json

      - name: Publish bounded review summary
        shell: bash
        run: |
          {
            echo '### Existing CloudFront Function Readback'
            echo "- Function: \`${FUNCTION_NAME}\`"
            echo "- ARN: \`${FUNCTION_ARN}\`"
            echo "- Stage parity: \`$(cat /tmp/stage-parity.txt)\`"
            echo '- Associations:'
            echo '```json'
            cat /tmp/function-associations.json
            echo '```'
            echo '- Digests:'
            echo '```text'
            cat /tmp/function-digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jaios-existing-function-readback-${{ github.run_id }}
          path: |
            /tmp/function-development.js
            /tmp/function-live.js
            /tmp/function-development-meta.json
            /tmp/function-live-meta.json
            /tmp/function-development-inventory.json
            /tmp/function-live-inventory.json
            /tmp/function-digests.txt
            /tmp/stage-parity.txt
            /tmp/stage-diff.patch
            /tmp/function-associations.json
          if-no-files-found: error
          retention-days: 90
