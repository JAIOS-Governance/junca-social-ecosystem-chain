name: JUNCA Runtime Release Manifest Gate
run-name: JSEC dispatch ${{ inputs.dispatch_token }}

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Exact successful pre-rollout evidence collector run
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit bound to the runtime artifacts
        required: true
        type: string
      node_artifact_sha256:
        description: Expected immutable runtime artifact SHA-256
        required: true
        type: string
      genesis_sha256:
        description: Expected canonical genesis SHA-256
        required: true
        type: string
      dispatch_token:
        description: Unique canonical-parent dispatch correlation token
        required: true
        type: string
      orchestrator_run_id:
        description: Canonical immutable-candidate parent run ID
        required: true
        type: string
      orchestrator_run_attempt:
        description: Canonical immutable-candidate parent run attempt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: junca-runtime-release-manifest-gate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - name: Verify pre-rollout evidence run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          ORCHESTRATOR_RUN_ATTEMPT: ${{ inputs.orchestrator_run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/junca_release_child_provenance.py \
            --source-commit "$SOURCE_COMMIT" \
            --dispatch-token "$DISPATCH_TOKEN" \
            --orchestrator-run-id "$ORCHESTRATOR_RUN_ID" \
            --orchestrator-run-attempt "$ORCHESTRATOR_RUN_ATTEMPT"
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          evidence_run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg candidate_ref "release-candidate/$SOURCE_COMMIT" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Runtime Release Evidence Collector" and
            .path == ".github/workflows/junca-runtime-release-evidence-collector-v2.yml" and
            .event == "workflow_dispatch" and
            .head_branch == $candidate_ref and
            .head_sha == $source_commit and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$evidence_run_json"

      - name: Prove isolated evidence path is absent
        run: |
          set -euo pipefail
          test ! -e downloaded-release-evidence
          test ! -L downloaded-release-evidence

      - name: Download exact pre-rollout evidence
        uses: actions/download-artifact@v4
        with:
          name: junca-runtime-release-evidence-${{ inputs.evidence_run_id }}
          path: downloaded-release-evidence
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}

      - name: Verify exact pre-rollout evidence files
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test ! -L downloaded-release-evidence
          test "$(find downloaded-release-evidence -type f | wc -l)" = 3
          test -f downloaded-release-evidence/junca-runtime-pre-rollout-baseline.json
          test -f downloaded-release-evidence/junca-public-explorer-pre-rollout-baseline.json
          test -f downloaded-release-evidence/junca-validator-ebs-pre-rollout-baseline.json

      - name: Fail-closed release manifest decision
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          NODE_ARTIFACT_SHA256: ${{ inputs.node_artifact_sha256 }}
          GENESIS_SHA256: ${{ inputs.genesis_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NODE_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GENESIS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/junca_runtime_release_manifest_gate.py \
            --manifest downloaded-release-evidence/junca-runtime-pre-rollout-baseline.json \
            --explorer-acceptance downloaded-release-evidence/junca-public-explorer-pre-rollout-baseline.json \
            --ebs-migration downloaded-release-evidence/junca-validator-ebs-pre-rollout-baseline.json \
            --expected-source-commit "$SOURCE_COMMIT" \
            --expected-artifact-sha256 "$NODE_ARTIFACT_SHA256" \
            --expected-genesis-sha256 "$GENESIS_SHA256" \
            --output artifacts/junca-runtime-release-manifest-decision.json
          jq -e '
            .accepted == true and
            .decision == "PROMOTION_GATE_PASS" and
            .phase == "PREDEPLOYMENT_READINESS" and
            .release_boundary.mainnet_changed == false and
            .release_boundary.assets_moved == false and
            .release_boundary.bridge_activated == false
          ' artifacts/junca-runtime-release-manifest-decision.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-runtime-release-manifest-gate-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
