name: JUNCA Public Testnet Release

on:
  workflow_run:
    workflows:
      - "JUNCA Validator Foundation Release"
    types: [completed]
  workflow_dispatch:
    inputs:
      foundation_run_id:
        description: "Successful Validator Foundation Release run ID"
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 45
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      DOMAIN_NAME: jaios-governance.org
      ROUTE53_ZONE_ID: Z0336017285464TX0NT1G
      AVAILABILITY_ZONES_JSON: '["us-east-1a","us-east-1b","us-east-1c"]'

    steps:
      - name: Authorize exact release trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$GITHUB_REF" = "refs/heads/main"
              ;;
            workflow_run)
              test "$WORKFLOW_RUN_CONCLUSION" = "success"
              test "$WORKFLOW_RUN_NAME" = \
                "JUNCA Validator Foundation Release"
              [[ "$WORKFLOW_RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$WORKFLOW_RUN_HEAD_BRANCH" = "main"
              test "$WORKFLOW_RUN_HEAD_SHA" = "$GITHUB_SHA"
              test "$WORKFLOW_RUN_HEAD_REPOSITORY" = "$REPOSITORY"
              ;;
            *)
              echo "::error::Unsupported release event: $EVENT_NAME"
              exit 1
              ;;
          esac

      - name: Resolve exact Validator Foundation Release run
        id: foundation
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          MANUAL_FOUNDATION_RUN_ID: ${{ inputs.foundation_run_id || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              test "$WORKFLOW_RUN_NAME" = "JUNCA Validator Foundation Release"
              run_id="$WORKFLOW_RUN_ID"
              ;;
            workflow_dispatch)
              run_id="$MANUAL_FOUNDATION_RUN_ID"
              ;;
            *)
              echo "::error::Unsupported release event: $EVENT_NAME"
              exit 1
              ;;
          esac
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${run_id}")"
          head_sha="$(jq -er \
            --arg repository "${{ github.repository }}" '
            select(
              .status == "completed" and
              .conclusion == "success" and
              .name == "JUNCA Validator Foundation Release" and
              .path == ".github/workflows/junca-validator-foundation-release.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository and
              (.head_sha | test("^[0-9a-f]{40}$"))
            )
            | .head_sha
          ' <<<"$run_json")"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_SHA" = "$head_sha"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.foundation.outputs.head_sha }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: junca-validator-foundation-release-${{ steps.foundation.outputs.run_id }}
          path: acceptance
          github-token: ${{ github.token }}
          run-id: ${{ steps.foundation.outputs.run_id }}

      - name: Verify immutable acceptance evidence
        run: |
          set -euo pipefail
          evidence=acceptance/public-testnet-runtime-acceptance.json
          jq -e '
            .automatic_finality.slot_epoch_seconds as $slot_epoch |
            .observations.final_timestamp as $final_timestamp |
            .schema_version == "junca-public-testnet-runtime-acceptance/v1" and
            .result == "PASS" and
            (.validators | length) == 3 and
            (.validators | map(.status) | unique) == ["healthy"] and
            (.validators | map(.head_height) | min) >= 1 and
            (.validators | map(.head_hash) | unique | length) == 1 and
            (.validators | map(.consensus.last_certificate_hash) | unique | length) == 1 and
            .observations.head_advanced == true and
            .observations.final_height > .observations.initial_height and
            .observations.first_height == (.observations.initial_height + 1) and
            .observations.final_height == (.observations.first_height + 1) and
            .observations.consecutive_advances == 2 and
            .observations.canonical_timestamp_delta_seconds == 30 and
            .automatic_finality.enabled == true and
            .automatic_finality.block_interval_seconds == 30 and
            (.automatic_finality.slot_epoch_seconds | type) == "number" and
            .automatic_finality.slot_epoch_seconds > 0 and
            .automatic_finality.slot_epoch_seconds % 30 == 0 and
            all(.validators[];
              .automatic_finality_enabled == true and
              .automatic_finality_loop_running == true and
              .block_interval_seconds == 30 and
              .slot_epoch_seconds == $slot_epoch and
              .head_timestamp == $final_timestamp and
              .consensus.last_certificate.signed_power == 3 and
              .consensus.last_certificate.total_power == 3
            ) and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' "$evidence"
          digest="$(sha256sum "$evidence" | cut -d' ' -f1)"
          recorded="$(cut -d' ' -f1 acceptance/public-testnet-runtime-acceptance.json.sha256)"
          test "$digest" = "$recorded"
          {
            echo "QUORUM_ACCEPTANCE_SHA256=$digest"
            echo "RUNTIME_ACCEPTANCE_SHA256=$digest"
            echo "NODE_AMI_ID=$(jq -er .ami_id acceptance/ami/junca-validator-ami-build.json)"
            echo "NODE_ARTIFACT_SHA256=$(jq -er .node_artifact_sha256 acceptance/ami/junca-validator-ami-build.json)"
            echo "GENESIS_SHA256=$(jq -er .genesis_sha256 acceptance/ami/junca-validator-ami-build.json)"
            echo "SOURCE_COMMIT=$(jq -er .source_commit acceptance/ami/junca-validator-ami-build.json)"
            echo "REQUEST_SHA256=$(jq -er .request_sha256 acceptance/ami/junca-validator-ami-build.json)"
          } >> "$GITHUB_ENV"

      - name: Attest exact live GitHub OIDC claims
        run: |
          set -euo pipefail
          python3 scripts/junca_oidc_claim_attestation.py \
            --workflow-path \
              ".github/workflows/junca-public-testnet-release.yml" \
            --role-arn "$DEPLOYMENT_ROLE_ARN" \
            --output artifacts/oidc-claim-attestation.json

      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-public-testnet-release-${{ github.run_id }}

      - name: Apply acceptance-bound public services
        run: bash scripts/junca_public_testnet_release.sh

      - name: Require all public targets healthy
        run: |
          set -euo pipefail
          for target_group in \
            "$(jq -er .public_target_group_arns.value.rpc artifacts/public-release-outputs.json)" \
            "$(jq -er .public_target_group_arns.value.explorer artifacts/public-release-outputs.json)"
          do
            aws elbv2 wait target-in-service --target-group-arn "$target_group"
            test "$(aws elbv2 describe-target-health \
              --target-group-arn "$target_group" \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' \
              --output text)" = "3"
          done

      - name: Public Testnet endpoint acceptance
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-endpoint-observations
          for attempt in $(seq 1 60); do
            if python scripts/junca_public_testnet_endpoint_test.py --compact \
              > artifacts/public-endpoint-observations/observation-1.json; then
              break
            fi
            test "$attempt" -lt 60
            sleep 10
          done
          sleep 35
          python scripts/junca_public_testnet_endpoint_test.py --compact \
            > artifacts/public-endpoint-observations/observation-2.json
          sleep 35
          python scripts/junca_public_testnet_endpoint_test.py --compact \
            > artifacts/public-endpoint-observations/observation-3.json

          jq -s -e '
            length == 3 and
            all(.[]; .status == "PASS") and
            all(.[]; .checks.explorer.peer_count >= 2) and
            .[1].finalized_head.height == (.[0].finalized_head.height + 1) and
            .[2].finalized_head.height == (.[1].finalized_head.height + 1) and
            (map(.finalized_head.hash) | unique | length) == 3 and
            (map(.observed_at) | unique | length) == 3
          ' artifacts/public-endpoint-observations/observation-*.json \
            > artifacts/public-endpoint-observations.json
          first_timestamp="$(
            jq -er '.[0].finalized_head.timestamp' \
              artifacts/public-endpoint-observations.json
          )"
          second_timestamp="$(
            jq -er '.[1].finalized_head.timestamp' \
              artifacts/public-endpoint-observations.json
          )"
          final_timestamp="$(
            jq -er '.[2].finalized_head.timestamp' \
              artifacts/public-endpoint-observations.json
          )"
          [[ "$first_timestamp" =~ ^0x[0-9a-f]+$ ]]
          [[ "$second_timestamp" =~ ^0x[0-9a-f]+$ ]]
          [[ "$final_timestamp" =~ ^0x[0-9a-f]+$ ]]
          test "$((16#${second_timestamp#0x} - 16#${first_timestamp#0x}))" -eq 30
          test "$((16#${final_timestamp#0x} - 16#${second_timestamp#0x}))" -eq 30

          jq -n \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg foundation_run_id "${{ steps.foundation.outputs.run_id }}" \
            --arg acceptance_sha256 "$RUNTIME_ACCEPTANCE_SHA256" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg node_artifact_sha256 "$NODE_ARTIFACT_SHA256" \
            --arg genesis_sha256 "$GENESIS_SHA256" \
            --arg ami_id "$NODE_AMI_ID" \
            --arg request_sha256 "$REQUEST_SHA256" \
            --slurpfile observations artifacts/public-endpoint-observations.json '{
              schema_version: "junca-public-testnet-publication/v1",
              result: "PASS",
              release_run_url: $run_url,
              foundation_run_id: $foundation_run_id,
              validator_acceptance_sha256: $acceptance_sha256,
              candidate_binding: {
                source_commit: $source_commit,
                node_artifact_sha256: $node_artifact_sha256,
                genesis_sha256: $genesis_sha256,
                ami_id: $ami_id,
                request_sha256: $request_sha256
              },
              endpoints: {
                rpc: "https://rpc.jaios-governance.org",
                explorer: "https://explorer.jaios-governance.org",
                scan_redirect: "https://scan.jaios-governance.org",
                health: "https://health.jaios-governance.org"
              },
              observations: $observations[0],
              consecutive_canonical_advances: 2,
              canonical_timestamp_delta_seconds: 30,
              unsafe_rpc_rejected: true,
              mainnet_changed: false,
              assets_moved: false,
              bridge_activated: false
            }' > artifacts/public-testnet-publication.json
          sha256sum artifacts/public-testnet-publication.json \
            > artifacts/public-testnet-publication.json.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junca-public-testnet-release-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
