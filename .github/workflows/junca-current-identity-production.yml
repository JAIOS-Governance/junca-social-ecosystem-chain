name: JUNCA Current Identity Production

on:
  push:
    branches: [main]
    paths:
      - "docs/technical-reference/snapshot/current-identity/**"
      - "docs/technical-reference/snapshot/current-identity.json"
      - "docs/technical-reference/snapshot/current-identity.txt"
      - "docs/technical-reference/snapshot/sitemap.xml"
      - ".github/workflows/junca-current-identity-production.yml"
  pull_request:
    paths:
      - "docs/technical-reference/snapshot/current-identity/**"
      - "docs/technical-reference/snapshot/current-identity.json"
      - "docs/technical-reference/snapshot/current-identity.txt"
      - "docs/technical-reference/snapshot/sitemap.xml"
      - ".github/workflows/junca-current-identity-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junca-current-identity-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical identity artifacts
        shell: bash
        run: |
          set -euo pipefail
          html="docs/technical-reference/snapshot/current-identity/index.html"
          json="docs/technical-reference/snapshot/current-identity.json"
          text="docs/technical-reference/snapshot/current-identity.txt"
          sitemap="docs/technical-reference/snapshot/sitemap.xml"

          test -s "${html}"
          test -s "${json}"
          test -s "${text}"
          test -s "${sitemap}"

          python -m json.tool "${json}" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("docs/technical-reference/snapshot/current-identity.json").read_text())
          assert payload["schema"] == "junca-current-identity/v1"
          assert payload["current_identity"]["formal_name"] == "JUNCA Social Ecosystem Chain"
          assert payload["current_identity"]["abbreviation"] == "JSEC"
          assert payload["current_identity"]["network_state"] == "Public Testnet"
          assert payload["network_boundary"] == {
              "mainnet_changed": False,
              "assets_moved": False,
              "bridge_activated": False,
          }
          names = {item["name"] for item in payload["historical_materials"]}
          assert "JUNCA GLOBAL CHAIN" in names
          assert "JCC / JUNCA CASH" in names
          PY

          grep -F '<link rel="canonical" href="https://docs.jaios-governance.org/current-identity/">' "${html}"
          grep -F 'JUNCA Social Ecosystem Chain (JSEC)' "${html}"
          grep -F 'historical Proof-of-Concept or legacy project materials' "${html}"
          grep -F '現在の正式な技術基盤' "${html}"
          grep -F 'https://docs.jaios-governance.org/current-identity/' "${sitemap}"
          grep -F 'https://docs.jaios-governance.org/current-identity.json' "${sitemap}"
          grep -F 'https://docs.jaios-governance.org/current-identity.txt' "${sitemap}"

          if grep -Eqi 'No Monetary Value|金銭価値なし|junca-cash\.world' "${html}" "${json}" "${text}"; then
            echo "Prohibited or retired identity wording detected" >&2
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure publication-only AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
          aws-region: us-east-1
          role-session-name: junca-current-identity-${{ github.run_id }}
      - name: Read back exact publication target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "${account_id}" = "595710543956"
          bucket="junca-chain-docs-${account_id}"
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'docs.jaios-governance.org')].Id | [0]" \
            --output text)"
          test -n "${distribution_id}"
          test "${distribution_id}" != "None"
          test "$(aws s3api get-bucket-versioning --bucket "${bucket}" --query Status --output text)" = "Enabled"
          test "$(aws cloudfront get-distribution --id "${distribution_id}" --query Distribution.Status --output text)" = "Deployed"
          printf 'bucket=%s\n' "${bucket}" >> "$GITHUB_OUTPUT"
          printf 'distribution_id=%s\n' "${distribution_id}" >> "$GITHUB_OUTPUT"
          {
            echo "### Current-identity publication target"
            echo "- Account: \`${account_id}\`"
            echo "- Caller: \`${caller_arn}\`"
            echo "- Bucket: \`${bucket}\`"
            echo "- Distribution: \`${distribution_id}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact identity artifacts with revalidation cache policy
        shell: bash
        run: |
          set -euo pipefail
          source_root="docs/technical-reference/snapshot"
          bucket="${{ steps.target.outputs.bucket }}"
          cache_control="public,max-age=0,must-revalidate"

          aws s3 cp "${source_root}/current-identity/index.html" \
            "s3://${bucket}/current-identity/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "${cache_control}"
          aws s3 cp "${source_root}/current-identity.json" \
            "s3://${bucket}/current-identity.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "${cache_control}"
          aws s3 cp "${source_root}/current-identity.txt" \
            "s3://${bucket}/current-identity.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "${cache_control}"
          aws s3 cp "${source_root}/sitemap.xml" \
            "s3://${bucket}/sitemap.xml" \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "${cache_control}"
      - name: Invalidate exact current-identity paths
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.target.outputs.distribution_id }}" \
            --paths "/current-identity" "/current-identity/" "/current-identity/*" "/current-identity.json" "/current-identity.txt" "/sitemap.xml" \
            --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.target.outputs.distribution_id }}" \
            --id "${invalidation_id}"
          status="$(aws cloudfront get-invalidation \
            --distribution-id "${{ steps.target.outputs.distribution_id }}" \
            --id "${invalidation_id}" --query Invalidation.Status --output text)"
          test "${status}" = "Completed"
          printf 'id=%s\n' "${invalidation_id}" >> "$GITHUB_OUTPUT"
      - name: Public production readback
        shell: bash
        run: |
          set -euo pipefail
          source_root="docs/technical-reference/snapshot"

          curl --fail-with-body --silent --show-error --location \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/current-identity.html \
            https://docs.jaios-governance.org/current-identity/
          curl --fail-with-body --silent --show-error --location \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/current-identity.json \
            https://docs.jaios-governance.org/current-identity.json
          curl --fail-with-body --silent --show-error --location \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/current-identity.txt \
            https://docs.jaios-governance.org/current-identity.txt
          curl --fail-with-body --silent --show-error --location \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --output /tmp/sitemap.xml \
            https://docs.jaios-governance.org/sitemap.xml

          cmp "${source_root}/current-identity/index.html" /tmp/current-identity.html
          cmp "${source_root}/current-identity.json" /tmp/current-identity.json
          cmp "${source_root}/current-identity.txt" /tmp/current-identity.txt
          cmp "${source_root}/sitemap.xml" /tmp/sitemap.xml

          for url in \
            https://docs.jaios-governance.org/current-identity/ \
            https://docs.jaios-governance.org/current-identity.json \
            https://docs.jaios-governance.org/current-identity.txt \
            https://docs.jaios-governance.org/sitemap.xml; do
            headers="$(curl --fail --silent --show-error --head --location "${url}")"
            grep -i '^cache-control: public,max-age=0,must-revalidate' <<< "${headers}"
          done

          grep -F 'JUNCA Social Ecosystem Chain (JSEC)' /tmp/current-identity.html
          grep -F 'JUNCA GLOBAL CHAIN' /tmp/current-identity.html
          grep -F 'historical Proof-of-Concept or legacy project materials' /tmp/current-identity.html
          jq -e '.current_identity.formal_name == "JUNCA Social Ecosystem Chain"' /tmp/current-identity.json
          jq -e '.current_identity.network_state == "Public Testnet"' /tmp/current-identity.json
          grep -F 'https://docs.jaios-governance.org/current-identity/' /tmp/sitemap.xml

          {
            echo "### Current-identity production readback"
            echo "- Invalidation: \`${{ steps.invalidate.outputs.id }}\`"
            echo "- HTML: https://docs.jaios-governance.org/current-identity/"
            echo "- JSON: https://docs.jaios-governance.org/current-identity.json"
            echo "- TXT: https://docs.jaios-governance.org/current-identity.txt"
            echo "- Sitemap: https://docs.jaios-governance.org/sitemap.xml"
            echo "- Exact content readback: PASS"
            echo "- Revalidation cache policy: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
