name: JUNCA Runtime Release Evidence Collector

on:
  workflow_dispatch:
    inputs:
      ami_run_id:
        description: Exact successful JUNCA Validator Immutable AMI Build run ID
        required: true
        type: string
      migration_run_id:
        description: Exact successful JUNCA Validator Durable State Migration run ID
        required: true
        type: string
      migration_evidence_sha256:
        description: SHA-256 of the exact accepted migration evidence JSON
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit bound to the immutable AMI
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: junca-runtime-release-evidence-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 20
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      AMI_RUN_ID: ${{ inputs.ami_run_id }}
      MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
      MIGRATION_EVIDENCE_SHA256: ${{ inputs.migration_evidence_sha256 }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Verify immutable AMI and state migration workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$AMI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MIGRATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MIGRATION_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          ami_run_json="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${AMI_RUN_ID}")"
          jq -e \
            --arg repository "${{ github.repository }}" \
            --arg head "$GITHUB_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Validator Immutable AMI Build" and
            .path == ".github/workflows/junca-validator-ami-build.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $head and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$ami_run_json"
          migration_run_json="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${MIGRATION_RUN_ID}")"
          jq -e \
            --arg repository "${{ github.repository }}" '
            .status == "completed" and
            .conclusion == "success" and
            .name == "JUNCA Validator Durable State Migration" and
            .path == ".github/workflows/junca-validator-state-migration.yml" and
            .event == "push" and
            .head_branch == "main" and
            (.head_sha | test("^[0-9a-f]{40}$")) and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository
          ' <<<"$migration_run_json"
          migration_run_head_sha="$(jq -r .head_sha <<<"$migration_run_json")"
          echo "MIGRATION_RUN_HEAD_SHA=$migration_run_head_sha" \
            >>"$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: junca-validator-ami-build-${{ env.AMI_RUN_ID }}
          path: evidence/ami
          github-token: ${{ github.token }}
          run-id: ${{ env.AMI_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: junca-validator-state-migration-${{ env.MIGRATION_RUN_ID }}
          path: evidence/state-migration
          github-token: ${{ github.token }}
          run-id: ${{ env.MIGRATION_RUN_ID }}

      - name: Verify exact immutable AMI artifact shape
        run: |
          set -euo pipefail
          test "$(find evidence/ami -type f | wc -l)" = 2
          test -f evidence/ami/junca-validator-ami-build.json
          test -f evidence/ami/SHA256SUMS
          (
            cd evidence/ami
            sha256sum --check SHA256SUMS
          )
          jq -e --arg source_commit "$SOURCE_COMMIT" '
            .schema_version == "junca-validator-ami-build/v1" and
            .state == "AMI_VERIFIED" and
            .network == "Public Testnet" and
            .notice == "Public Testnet / No Monetary Value" and
            .source_commit == $source_commit and
            (.request_sha256 | test("^[0-9a-f]{64}$")) and
            .terraform_state_changed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' evidence/ami/junca-validator-ami-build.json
          test -f \
            evidence/state-migration/junca-validator-state-migration.json
          test -f \
            evidence/state-migration/junca-validator-state-migration-binding.json
          test -f evidence/state-migration/SHA256SUMS
          (
            cd evidence/state-migration
            sha256sum --check SHA256SUMS
          )
          printf '%s  %s\n' \
            "$MIGRATION_EVIDENCE_SHA256" \
            "evidence/state-migration/junca-validator-state-migration.json" \
            | sha256sum --check -
          jq -e \
            --arg run_id "$MIGRATION_RUN_ID" \
            --arg head "$MIGRATION_RUN_HEAD_SHA" '
            .schema_version == "junca-validator-state-migration/v1" and
            .state == "VERIFIED_PASS" and
            .network == "Public Testnet" and
            .migration_run_id == $run_id and
            .migration_run_head_sha == $head and
            (.migration_request_sha256 | test("^[0-9a-f]{64}$")) and
            (.instance_ids | length) == 3 and
            (.state_volume_ids | length) == 3 and
            (.rollback_snapshot_ids | length) == 3 and
            (.validator_mappings | length) == 3 and
            .serial_migration == true and
            .terraform_canonicalized == true and
            .runtime_mount_verified == true and
            .immutable_runtime_mount_activation_pending == true and
            .immutable_runtime_certificate_activation_pending == true and
            (
              .finalized_head
              | (
                  (.height | type == "number") and
                  (.height >= 1) and
                  (.hash | test("^0x[0-9a-f]{64}$")) and
                  (
                    .certificate_hash
                    | test("^0x[0-9a-f]{64}$")
                  )
                )
            ) and
            .bootstrap_changed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' evidence/state-migration/junca-validator-state-migration.json
          migration_request_sha256="$(
            jq -er .migration_request_sha256 \
              evidence/state-migration/junca-validator-state-migration.json
          )"
          echo "MIGRATION_REQUEST_SHA256=$migration_request_sha256" \
            >>"$GITHUB_ENV"
          jq -e \
            --arg run_id "$MIGRATION_RUN_ID" \
            --arg head "$MIGRATION_RUN_HEAD_SHA" \
            --arg request "$migration_request_sha256" \
            --arg evidence "$MIGRATION_EVIDENCE_SHA256" '
            .schema_version ==
              "junca-validator-state-migration-binding/v1" and
            .state == "MIGRATION_VERIFIED" and
            .network == "Public Testnet" and
            .notice == "Public Testnet / No Monetary Value" and
            .migration_run_id == $run_id and
            .migration_run_head_sha == $head and
            .migration_request_sha256 == $request and
            .migration_evidence_sha256 == $evidence and
            .bootstrap_changed == false and
            .mainnet_changed == false and
            .assets_moved == false and
            .bridge_activated == false
          ' \
            evidence/state-migration/junca-validator-state-migration-binding.json

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-release-evidence-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Read canonical Terraform outputs without state mutation
        run: |
          set -euo pipefail
          mkdir -p evidence/readback
          test "$(aws sts get-caller-identity --query Account --output text)" \
            = "$AWS_ACCOUNT_ID"
          terraform -chdir=infra/aws/bootstrap init -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/bootstrap.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"
          terraform -chdir=infra/aws/bootstrap output -json \
            > evidence/readback/bootstrap-outputs.json
          state_kms_key_arn="$(
            jq -er .state_kms_key_arn.value \
              evidence/readback/bootstrap-outputs.json
          )"
          lock_table="$(
            jq -er .lock_table.value evidence/readback/bootstrap-outputs.json
          )"
          terraform -chdir=infra/aws/public-testnet init \
            -input=false -reconfigure \
            -backend-config="bucket=$STATE_BUCKET_NAME" \
            -backend-config="key=public-testnet/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$lock_table" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$state_kms_key_arn"
          terraform -chdir=infra/aws/public-testnet output -json \
            > evidence/readback/public-testnet-outputs.json

      - name: Read exact AWS runtime resources
        run: |
          set -euo pipefail
          candidate_ami="$(
            jq -er .ami_id evidence/ami/junca-validator-ami-build.json
          )"
          mapfile -t instances < <(
            jq -er '.validator_instance_ids.value[]' \
              evidence/readback/public-testnet-outputs.json
          )
          mapfile -t volumes < <(
            jq -er '.validator_state_volume_readback.value[].volume_id' \
              evidence/readback/public-testnet-outputs.json
          )
          test "${#instances[@]}" = 3
          test "${#volumes[@]}" = 3
          aws ec2 describe-images --image-ids "$candidate_ami" \
            > evidence/readback/images.json
          aws ec2 describe-instances --instance-ids "${instances[@]}" \
            > evidence/readback/instances.json
          aws ec2 describe-volumes --volume-ids "${volumes[@]}" \
            > evidence/readback/volumes.json
          mapfile -t snapshots < <(
            jq -er '
              .Volumes[] |
              [.Tags[] | select(.Key == "JuncaRollbackSnapshotId") | .Value] |
              if length == 1 then .[0] else error("missing exact rollback snapshot") end
            ' evidence/readback/volumes.json
          )
          test "${#snapshots[@]}" = 3
          test "$(printf '%s\n' "${snapshots[@]}" | sort -u | wc -l)" = 3
          aws ec2 describe-snapshots --snapshot-ids "${snapshots[@]}" \
            > evidence/readback/snapshots.json

      - name: Read Public Testnet runtime baseline
        run: |
          set -euo pipefail
          public_services_enabled="$(
            jq -r '
              .public_services_acceptance_readback.value.enabled
              | if type == "boolean" then .
                else error("public services readback must be boolean") end
            ' evidence/readback/public-testnet-outputs.json
          )"
          case "$public_services_enabled" in
            true)
              set +e
              python scripts/junca_public_testnet_endpoint_test.py \
                > evidence/readback/endpoint-acceptance.json
              endpoint_exit_code="$?"
              set -e
              if [[ "$endpoint_exit_code" == "0" ]]; then
                jq -e '
                  .status == "PASS" and
                  .scope ==
                    "Public Testnet Runtime Acceptance / Read-only" and
                  .checks.health == "PASS" and
                  .checks.explorer.result == "PASS" and
                  .checks.safe_rpc.result == "PASS" and
                  .checks.unsafe_rpc_rejection.result == "PASS"
                ' evidence/readback/endpoint-acceptance.json
                echo public_endpoints \
                  > evidence/readback/runtime-baseline-mode
              else
                jq -e '
                  .status == "FAIL" and
                  (.error | type) == "string" and
                  (.error | length) > 0
                ' evidence/readback/endpoint-acceptance.json
                outage_probe() {
                  local name="$1"
                  local method="$2"
                  local url="$3"
                  local payload="${4:-}"
                  local body="evidence/readback/outage-${name}.body"
                  local error="evidence/readback/outage-${name}.stderr"
                  local http_status
                  local curl_exit
                  : >"$body"
                  : >"$error"
                  set +e
                  if [[ "$method" == "GET" ]]; then
                    http_status="$(
                      curl --silent --show-error --max-time 15 \
                        --output "$body" --write-out '%{http_code}' \
                        "$url" 2>"$error"
                    )"
                  else
                    http_status="$(
                      curl --silent --show-error --max-time 15 \
                        --request POST \
                        --header 'Content-Type: application/json' \
                        --data "$payload" \
                        --output "$body" --write-out '%{http_code}' \
                        "$url" 2>"$error"
                    )"
                  fi
                  curl_exit="$?"
                  set -e
                  [[ "$http_status" =~ ^[0-9]{3}$ ]]
                  test "$(wc -c <"$body")" -le 65536
                  test "$(wc -c <"$error")" -le 65536
                  jq -n \
                    --arg name "$name" \
                    --arg method "$method" \
                    --arg url "$url" \
                    --argjson curl_exit_code "$curl_exit" \
                    --argjson http_status "$((10#$http_status))" \
                    --arg body_sha256 "$(sha256sum "$body" | cut -d' ' -f1)" \
                    --arg body_base64 "$(base64 -w0 "$body")" \
                    --arg stderr "$(cat "$error")" '{
                      name: $name,
                      method: $method,
                      url: $url,
                      curl_exit_code: $curl_exit_code,
                      http_status: $http_status,
                      body_sha256: $body_sha256,
                      body_base64: $body_base64,
                      stderr: $stderr
                    }' > "evidence/readback/outage-${name}.json"
                }
                outage_probe health GET \
                  https://health.jaios-governance.org/health
                outage_probe explorer GET \
                  https://explorer.jaios-governance.org/explorer.json
                outage_probe rpc POST \
                  https://rpc.jaios-governance.org/ \
                  '{"jsonrpc":"2.0","id":"outage-read-only","method":"eth_chainId","params":[]}'
                jq -n \
                  --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --argjson endpoint_test_exit_code "$endpoint_exit_code" \
                  --slurpfile endpoint_test \
                    evidence/readback/endpoint-acceptance.json \
                  --slurpfile health evidence/readback/outage-health.json \
                  --slurpfile explorer \
                    evidence/readback/outage-explorer.json \
                  --slurpfile rpc evidence/readback/outage-rpc.json '{
                    schema_version: "junca-public-endpoint-outage/v1",
                    status: "PUBLIC_ENDPOINTS_UNAVAILABLE",
                    public_services_enabled: true,
                    public_endpoint_acceptance: false,
                    observed_at: $observed_at,
                    endpoint_test_exit_code: $endpoint_test_exit_code,
                    endpoint_test: $endpoint_test[0],
                    observations: [$health[0], $explorer[0], $rpc[0]],
                    mainnet_changed: false,
                    assets_moved: false,
                    bridge_activated: false
                  }' > evidence/readback/public-endpoint-outage.json
                echo private_ssm_public_outage \
                  > evidence/readback/runtime-baseline-mode
              fi
              ;;
            false)
              echo private_ssm_services_disabled \
                > evidence/readback/runtime-baseline-mode
              ;;
            *)
              echo "public services readback must be boolean" >&2
              exit 1
              ;;
          esac
          baseline_mode="$(cat evidence/readback/runtime-baseline-mode)"
          if [[ "$baseline_mode" != "public_endpoints" ]]; then
              mapfile -t instances < <(
                jq -er '.validator_instance_ids.value[]' \
                  evidence/readback/public-testnet-outputs.json
              )
              test "${#instances[@]}" = 3
              test "$(printf '%s\n' "${instances[@]}" | sort -u | wc -l)" = 3
              durable_reader="$(
                base64 -w0 <<'PY'
          import json
          import os
          import sqlite3

          health = json.loads(os.environ["JUNCA_HEALTH_JSON"])
          connection = sqlite3.connect(
              "file:/var/lib/junca/state.sqlite?mode=ro",
              uri=True,
          )
          connection.row_factory = sqlite3.Row
          connection.execute("PRAGMA query_only=ON")
          quick_check = connection.execute("PRAGMA quick_check").fetchone()[0]
          head = connection.execute(
              """
              SELECT height,block_hash,finalized,certificate_hash
              FROM blocks
              ORDER BY height DESC
              LIMIT 1
              """
          ).fetchone()
          if head is None:
              raise RuntimeError("durable finalized head is absent")
          certificate_row = connection.execute(
              """
              SELECT certificate_json
              FROM finality_certificates
              WHERE height=?
              """,
              (head["height"],),
          ).fetchone()
          if certificate_row is None:
              raise RuntimeError("durable finality certificate is absent")
          certificate = json.loads(certificate_row["certificate_json"])
          connection.close()
          print(
              json.dumps(
                  {
                      "health": health,
                      "durable_state": {
                          "quick_check": quick_check,
                          "head": dict(head),
                          "certificate": certificate,
                      },
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY
              )"
              test -n "$durable_reader"
              jq -n --arg reader "$durable_reader" '{
                commands: [
                  "set -euo pipefail",
                  "export JUNCA_HEALTH_JSON=\"$(curl -fsS http://127.0.0.1:8545/health)\"",
                  (
                    "printf %s "
                    + ($reader | @sh)
                    + " | base64 --decode | python3 -"
                  )
                ]
              }' > evidence/readback/private-health-request.json
              command_id="$(
                aws ssm send-command \
                  --instance-ids "${instances[@]}" \
                  --document-name AWS-RunShellScript \
                  --parameters \
                    file://evidence/readback/private-health-request.json \
                  --comment "JUNCA Private SSM Read-only Baseline" \
                  --query Command.CommandId --output text
              )"
              [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
              for index in 0 1 2; do
                instance_id="${instances[$index]}"
                invocation="evidence/readback/private-health-invocation-${index}.json"
                poll_errors="evidence/readback/private-health-invocation-${index}.poll-errors.log"
                : >"$poll_errors"
                command_status=""
                for attempt in $(seq 1 60); do
                  invocation_attempt="${invocation}.attempt"
                  error_attempt="${poll_errors}.attempt"
                  set +e
                  aws ssm get-command-invocation \
                      --command-id "$command_id" \
                      --instance-id "$instance_id" \
                      >"$invocation_attempt" 2>"$error_attempt"
                  invocation_exit="$?"
                  set -e
                  if [[ "$invocation_exit" != "0" ]]; then
                    cat "$error_attempt" >>"$poll_errors"
                    if grep -q 'InvocationDoesNotExist' "$error_attempt"; then
                      test "$attempt" -lt 60
                      sleep 2
                      continue
                    fi
                    cat "$error_attempt" >&2
                    exit 1
                  fi
                  mv "$invocation_attempt" "$invocation"
                  command_status="$(jq -er '.Status' "$invocation")"
                  case "$command_status" in
                    Success) break ;;
                    Failed|Cancelled|TimedOut|Cancelling)
                      cat "$invocation" >&2
                      exit 1
                      ;;
                  esac
                  test "$attempt" -lt 60
                  sleep 2
                done
                test "$command_status" = "Success"
                readback="evidence/readback/private-readback-${index}.json"
                item="evidence/readback/private-validator-${index}.json"
                jq -er '.StandardOutputContent | fromjson' \
                  "$invocation" >"$readback"
                jq -n \
                  --arg validator_id \
                    "$(printf 'validator-%02d' "$((index + 1))")" \
                  --arg instance_id "$instance_id" \
                  --slurpfile readback "$readback" '{
                    validator_id: $validator_id,
                    instance_id: $instance_id,
                    health: $readback[0].health,
                    durable_state: $readback[0].durable_state
                  }' >"$item"
              done
              jq -s '{
                schema_version: "junca-private-ssm-validator-baseline/v1",
                status: "PASS",
                scope:
                  "Public Testnet Pre-rollout Baseline / Private SSM Read-only",
                validators: .
              }' evidence/readback/private-validator-[0-2].json \
                > evidence/readback/private-validator-health.json
          fi

      - name: Build exact fail-closed release evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/release
          baseline_mode="$(cat evidence/readback/runtime-baseline-mode)"
          runtime_readback=()
          case "$baseline_mode" in
            public_endpoints)
            runtime_readback=(
              --endpoint-acceptance
              evidence/readback/endpoint-acceptance.json
            )
              ;;
            private_ssm_services_disabled)
            runtime_readback=(
              --private-validator-health
              evidence/readback/private-validator-health.json
            )
              ;;
            private_ssm_public_outage)
              runtime_readback=(
                --private-validator-health
                evidence/readback/private-validator-health.json
                --public-endpoint-outage
                evidence/readback/public-endpoint-outage.json
              )
              ;;
            *)
              echo "unsupported runtime baseline mode" >&2
              exit 1
              ;;
          esac
          python scripts/junca_runtime_release_evidence_collector.py \
            --candidate-ami evidence/ami/junca-validator-ami-build.json \
            --bootstrap-outputs evidence/readback/bootstrap-outputs.json \
            --public-testnet-outputs evidence/readback/public-testnet-outputs.json \
            --images evidence/readback/images.json \
            --instances evidence/readback/instances.json \
            --volumes evidence/readback/volumes.json \
            --snapshots evidence/readback/snapshots.json \
            "${runtime_readback[@]}" \
            --migration-evidence \
              evidence/state-migration/junca-validator-state-migration.json \
            --expected-migration-run-id "$MIGRATION_RUN_ID" \
            --expected-migration-head-sha "$MIGRATION_RUN_HEAD_SHA" \
            --expected-migration-request-sha256 \
              "$MIGRATION_REQUEST_SHA256" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --output-dir evidence/release
          test "$(find evidence/release -type f | wc -l)" = 3
          test -f evidence/release/junca-runtime-pre-rollout-baseline.json
          test -f evidence/release/junca-public-explorer-pre-rollout-baseline.json
          test -f evidence/release/junca-validator-ebs-pre-rollout-baseline.json

      - name: Preserve failed readback diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junca-runtime-readback-failure-${{ github.run_id }}
          path: |
            evidence/readback/endpoint-acceptance.json
            evidence/readback/public-endpoint-outage.json
            evidence/readback/outage-*.json
            evidence/readback/private-health-invocation-*.json
            evidence/readback/private-health-invocation-*.log
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: junca-runtime-release-evidence-${{ github.run_id }}
          path: evidence/release/
          if-no-files-found: error
          retention-days: 90
