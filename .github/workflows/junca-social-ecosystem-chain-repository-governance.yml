name: JUNCA Social Ecosystem Chain Repository Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - name: Install hash-pinned YAML parser
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r requirements/ci-yaml.txt
      - name: Run complete chain test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Generate fail-closed repository evidence
        run: |
          mkdir -p artifacts
          python scripts/junca_social_ecosystem_chain_repository_governance.py \
            --output artifacts/junca-social-ecosystem-chain-repository-governance.json \
            --expect-state READY
          grep -q '"state": "READY"' artifacts/junca-social-ecosystem-chain-repository-governance.json
          grep -q '"repository_owner_binding": "JAIOS-Governance"' artifacts/junca-social-ecosystem-chain-repository-governance.json
          grep -q '"corporate_ownership_represented": false' artifacts/junca-social-ecosystem-chain-repository-governance.json
          grep -q '"personal_control_represented": false' artifacts/junca-social-ecosystem-chain-repository-governance.json
      - name: Upload repository governance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junca-social-ecosystem-chain-repository-governance-${{ github.run_id }}
          path: artifacts/junca-social-ecosystem-chain-repository-governance.json
          if-no-files-found: error
          retention-days: 90
