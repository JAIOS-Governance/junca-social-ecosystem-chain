name: JUNCA Docs Status Language R38 Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-docs-status-language-r38-repair.yml"

permissions:
  contents: write

concurrency:
  group: junca-docs-status-language-r38-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair translated status and compact redundant SEO payload
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("docs/technical-reference/scripts/build.mjs")
          source = path.read_text(encoding="utf-8")
          before_size = len(source.encode("utf-8"))

          marker = '      .replaceAll("No Monetary Value", "Protocol Validation Environment")\n'
          addition = marker + '      .replaceAll(\n        "Protocol Validation Environment、Rate Limit、Abuse Controlを前提に公開します。",\n        "Test Asset Separation、Rate Limit、Abuse Controlを前提に公開します。",\n      )\n'
          if addition not in source:
              if marker not in source:
                  raise SystemExit("Expected R38 status normalization marker is missing")
              source = source.replace(marker, addition, 1)

          old_meta = '<meta name="keywords" content="JUNCA Social Ecosystem Chain, JSEC, JUNCA Chain, junca chain, juncachain, JUNCA Platform, junca platform, JUNCA GLOBAL CHAIN, junca Global Chain, JCC, JUNCA CASH, junca Cash, JUNCA, junca, JAIOS, JAIOS Institutional Governance, Public Testnet, chain documentation, technical reference, protocol specification">'
          new_meta = '<meta name="keywords" content="JUNCA Social Ecosystem Chain, JSEC, JUNCA Chain, JAIOS, Public Testnet, technical reference, protocol specification">'
          if old_meta in source:
              source = source.replace(old_meta, new_meta, 1)
          elif new_meta not in source:
              raise SystemExit("Expected canonical SEO keyword metadata is missing")

          duplicate_keywords = ',"keywords":["JUNCA Social Ecosystem Chain","JSEC","JUNCA Chain","junca chain","juncachain","JUNCA Platform","junca platform","JUNCA GLOBAL CHAIN","junca Global Chain","JCC","JUNCA CASH","junca Cash","JAIOS","Public Testnet","technical reference"]'
          if duplicate_keywords in source:
              source = source.replace(duplicate_keywords, "", 1)

          old_alt = '"alternateName":["JUNCA Chain Documentation","junca chain docs","juncachain docs","JUNCA Platform technical reference"]'
          new_alt = '"alternateName":["JUNCA Chain Documentation","juncachain docs"]'
          if old_alt in source:
              source = source.replace(old_alt, new_alt, 1)

          redundant_network_faq = ',{"@type":"Question","name":"What is the current network state?","acceptedAnswer":{"@type":"Answer","text":"Public Testnet. Mainnet Changed is false, Assets Moved is false, and Bridge Activated is false."}}'
          if redundant_network_faq in source:
              source = source.replace(redundant_network_faq, "", 1)

          path.write_text(source, encoding="utf-8")
          after_size = len(source.encode("utf-8"))
          saved = before_size - after_size
          if saved < 367:
              raise SystemExit(f"SEO compaction saved only {saved} bytes; minimum is 367")
          print(f"R38 source repaired; redundant SEO payload reduced by {saved} bytes")
          PY

      - name: Run full eight-route build and QA
        working-directory: docs/technical-reference
        run: npm test

      - name: Commit verified repair to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juncaGlobal"
          git config user.email "juncajapan.inc@gmail.com"
          git add docs/technical-reference/scripts/build.mjs
          if git diff --cached --quiet; then
            echo "R38 status and SEO payload repair already applied."
            exit 0
          fi
          git commit -m "fix: finalize R38 docs status and bounded SEO payload"
          git push origin HEAD:main
