name: JUNCA Docs Status Language R38 Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-docs-status-language-r38-repair.yml"

permissions:
  contents: write

concurrency:
  group: junca-docs-status-language-r38-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply CEO-directed R38 repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import base64
          import hashlib
          import zlib

          payload = (
              "eNrtPctyG0lyd3xFqUcxBGaABkXNzsigSAUEQhJmKYADgPJqRS3QABpkS41uTHeDEpfgZ/iwDvvmgy++7vrgCEfst2x4/RnOzHp09QsEOd6ddYR1EIHuzKys"
              "Rz4rq/DFg/oqDOoTx6vb3iVbXkUXvve4NA/8BVta0YXrTJizWPpBxE7ga0l8DuxSqd/rDdkBPS4bM38a1iN7euE5U8utBfbcDmxvahuV0vPTzvERABJ8nRnh"
              "NHCWUVifrBx3Zi4+hEbph2bO+x8t/rLb679uHnd+3c6BCSMrWoU11/LOV9a5XfP8YGG5zm9tjto67ffb3WEOYrDyImdh16arAPiMakgog94/7Q47rxPtBtO6"
              "61zaNYFvIthJ77jTeqtBDYbN4elgdNzsvjxtvmyPOIC5mBmlQbd5MnjVS7DkWcvwwo+MUmlmz2Fol641tUeB/ePKCexZObI/Rw0WRkGV+e5MfPLsT+KTa01s"
              "lz5XWO0Q/zZKDP45cwRnnh8xx2NEhJ7jv8ByQpsNrsLIXrQ/O1F5bvRFc9i+5QTM8qYXfsAWThg63nmDXVM7NzCfRMCOVgGnagqGy9Aa8VUplb5gj0zWsjyf"
              "VgMTg8Vsb7b0HQ96M4OmphFrf166fmAHbO4EYVRll3bgzB1gIrRgbvzAOQfWl4H/+YrNLdedWNOPppwV81PgRPYIWSgHOzs75XKFHRyya+Bv6nthxPrtF/32"
              ""
          )
          source = zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          expected = "962c7db9c16e47c167753056f72bd2d328267a69d549d686adcd7a053df7f774"
          actual = hashlib.sha256(source.encode("utf-8")).hexdigest()
          if actual != expected:
              raise SystemExit(f"Repair payload digest mismatch: {actual}")
          exec(compile(source, "junca_docs_status_language_r38_repair.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Validate JavaScript and build generators
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/technical-reference/src/live-runtime.js
          node --check docs/technical-reference/scripts/status-language-normalize.mjs
          node --check docs/technical-reference/scripts/runtime-current-state-normalize.mjs
          node --check docs/technical-reference/scripts/build.mjs
          node --check docs/technical-reference/scripts/qa.mjs

      - name: Commit exact repair to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juncaGlobal"
          git config user.email "juncajapan.inc@gmail.com"
          git add             docs/technical-reference/STATUS_LANGUAGE_POLICY.md             docs/technical-reference/src/live-runtime.js             docs/technical-reference/scripts/status-language-normalize.mjs             docs/technical-reference/scripts/runtime-current-state-normalize.mjs             docs/technical-reference/scripts/build.mjs             docs/technical-reference/scripts/qa.mjs             docs/technical-reference/snapshot
          if git diff --cached --quiet; then
            echo "Exact R38 source already applied."
            exit 0
          fi
          git commit -m "fix: repair docs status language and canonical runtime binding"
          git push origin HEAD:main
