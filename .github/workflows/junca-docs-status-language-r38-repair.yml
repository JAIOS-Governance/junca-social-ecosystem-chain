name: JUNCA Docs Status Language R38 Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-docs-status-language-r38-repair.yml"

permissions:
  contents: write

concurrency:
  group: junca-docs-status-language-r38-repair
  cancel-in-progress: false

env:
  RECOVERY_REVISION: R38.6

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate recovery patch programs
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovery revision: ${RECOVERY_REVISION}"
          python -m py_compile \
            .github/patches/junca-docs-r38-live-parity.py \
            .github/patches/junca-docs-r38-post-patch.py \
            .github/patches/junca-docs-r38-assert.py

      - name: Apply base R38 repair only when absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'REGISTRY-CONTROLLED DISCLOSURE' docs/technical-reference/scripts/build.mjs && \
             grep -q 'runtime_evidence_endpoint' docs/technical-reference/scripts/build.mjs && \
             grep -q 'CANONICAL_EXPLORER_URL' docs/technical-reference/src/live-runtime.js; then
            echo "Base R38 repair already present; preserving verified source."
          else
            python <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          encoded = Path(".github/patches/junca-docs-r38-repair.py.zlib.b64").read_text(encoding="utf-8").strip()
          source = zlib.decompress(base64.b64decode(encoded))
          expected = "2338051127fc9b86fbf9379d0f88af9fea8e2384e0f53fc8d7a4678b4bf14e8a"
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected:
              raise SystemExit(f"Repair payload digest mismatch: {actual}")
          exec(compile(source, "junca_docs_status_language_r38_repair.py", "exec"), {"__name__": "__main__"})
          PY
          fi

      - name: Apply post-patch normalization, semantic no-value removal and endpoint corroboration
        run: python .github/patches/junca-docs-r38-post-patch.py

      - name: Run full eight-route build and QA
        working-directory: docs/technical-reference
        run: npm test

      - name: Run independent rendered-language, no-value and endpoint assertion
        run: python .github/patches/junca-docs-r38-assert.py

      - name: Commit verified repair to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juncaGlobal"
          git config user.email "juncajapan.inc@gmail.com"
          git add \
            docs/technical-reference/STATUS_LANGUAGE_POLICY.md \
            docs/technical-reference/scripts/build.mjs \
            docs/technical-reference/scripts/status-language-normalize.mjs \
            docs/technical-reference/scripts/runtime-current-state-normalize.mjs \
            docs/technical-reference/scripts/qa.mjs
          if git diff --cached --quiet; then
            echo "R38 production repair already applied."
            exit 0
          fi
          git commit -m "fix: remove prohibited docs language and semantic no-value wording"
          git push origin HEAD:main
