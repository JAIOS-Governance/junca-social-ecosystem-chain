name: JUNCA Chain Domain Direct Recovery via Docs Role

on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read

concurrency:
  group: junca-chain-domain-direct-docs-role
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
      DOMAIN: chain.jaios-governance.org
    steps:
      - name: Configure canonical production role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: chain-domain-direct-${{ github.run_id }}
          disable-retry: true

      - name: Verify AWS boundary and preservation targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."
          docs_count="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='docs.jaios-governance.org.'] | length(@)" --output text)"
          test "$docs_count" -ge 1
          explorer_count="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='explorer.jaios-governance.org.'] | length(@)" --output text)"
          test "$explorer_count" = "0"

      - name: Apply Sites-issued chain custom-domain records
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/change-batch.json <<'JSON'
          {
            "Comment": "Bind chain.jaios-governance.org to the existing Sites project",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "chain.jaios-governance.org.",
                  "Type": "CNAME",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "custom-domains.chatgpt.site."}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_openai-site-verification.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM\""}]
                }
              },
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "_cf-custom-hostname.chain.jaios-governance.org.",
                  "Type": "TXT",
                  "TTL": 300,
                  "ResourceRecords": [{"Value": "\"0ff4e945-6380-45d2-a7fc-79e43e99da79\""}]
                }
              }
            ]
          }
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change-batch.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"

      - name: Exact Route 53 readback and preservation QA
        shell: bash
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='chain.jaios-governance.org.' || Name=='_openai-site-verification.chain.jaios-governance.org.' || Name=='_cf-custom-hostname.chain.jaios-governance.org.']" --output json)"
          RECORDS="$records" python3 - <<'PY'
          import json, os
          records = json.loads(os.environ['RECORDS'])
          by_name = {r['Name']: r for r in records}
          expected = {
            'chain.jaios-governance.org.': ('CNAME', 300, 'custom-domains.chatgpt.site.'),
            '_openai-site-verification.chain.jaios-governance.org.': ('TXT', 300, 'openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM'),
            '_cf-custom-hostname.chain.jaios-governance.org.': ('TXT', 300, '0ff4e945-6380-45d2-a7fc-79e43e99da79')
          }
          assert set(by_name) == set(expected), (by_name, expected)
          for name, (rtype, ttl, value) in expected.items():
              record = by_name[name]
              assert record['Type'] == rtype
              assert record['TTL'] == ttl
              assert value in record['ResourceRecords'][0]['Value']
          PY
          docs_count="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='docs.jaios-governance.org.'] | length(@)" --output text)"
          test "$docs_count" -ge 1
          explorer_count="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='explorer.jaios-governance.org.'] | length(@)" --output text)"
          test "$explorer_count" = "0"

      - name: DNS and HTTPS acceptance
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            cname="$(dig +short "$DOMAIN" CNAME | tail -1)"
            openai_txt="$(dig +short "_openai-site-verification.$DOMAIN" TXT | tr -d '"')"
            cf_txt="$(dig +short "_cf-custom-hostname.$DOMAIN" TXT | tr -d '"')"
            if [ "$cname" = "custom-domains.chatgpt.site." ] && \
               printf '%s' "$openai_txt" | grep -Fq 'openai-site-verification=5kMAXWPTYm6FQ3E_bVHIUdoo4AvNv3hNwXpkUBCP9LM' && \
               printf '%s' "$cf_txt" | grep -Fq '0ff4e945-6380-45d2-a7fc-79e43e99da79'; then
              break
            fi
            sleep 10
          done
          test "$(dig +short "$DOMAIN" CNAME | tail -1)" = "custom-domains.chatgpt.site."
          status="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' --max-redirs 10 --connect-timeout 20 --max-time 60 "https://$DOMAIN/")"
          case "$status" in 2*|3*) ;; *) echo "Unexpected HTTP status: $status"; exit 1;; esac
          final_url="$(curl -sS -L -o /dev/null -w '%{url_effective}' --max-redirs 10 "https://$DOMAIN/")"
          printf '%s\n' "$status" > /tmp/http-status.txt
          printf '%s\n' "$final_url" > /tmp/final-url.txt
          openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName >/tmp/certificate.txt
          grep -Fq "DNS:$DOMAIN" /tmp/certificate.txt
          grep -Eqi 'JUNCA Social Ecosystem Chain|JUNCA' /tmp/home.html
          {
            echo "### JUNCA Chain Custom Domain Production Readback"
            echo "- AWS Account: $AWS_ACCOUNT_ID"
            echo "- Hosted Zone: $HOSTED_ZONE_ID"
            echo "- Route 53 Change: ${{ steps.dns.outputs.change_id }}"
            echo "- Route 53 Status: INSYNC"
            echo "- Production URL: https://$DOMAIN/"
            echo "- HTTP Status: $status"
            echo "- Final URL: $final_url"
            echo "- docs preserved: true"
            echo "- explorer created: false"
          } >> "$GITHUB_STEP_SUMMARY"
