name: JUNCA Validator Runtime Recovery

on:
  push:
    branches: [main]
    paths:
      - infra/aws/public-testnet/main.tf
      - infra/aws/public-testnet/templates/validator-user-data.sh.tftpl
      - .github/workflows/junca-validator-runtime-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false

jobs:
  recover-and-accept:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 30
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      STATE_BUCKET_NAME: junca-social-ecosystem-chain-tfstate-595710543956-us-east-1
      DOMAIN_NAME: jaios-governance.org
      ROUTE53_ZONE_ID: Z0336017285464TX0NT1G
      AVAILABILITY_ZONES_JSON: '["us-east-1a","us-east-1b","us-east-1c"]'
      NODE_AMI_ID: ami-082dba06cd958e646
      NODE_ARTIFACT_SHA256: 968e12cddbc17fbc5c17deb9a6af643c6747367d13b0680ae950866eaf0fc49f
      GENESIS_SHA256: 285f1aa2610ec98fba598aa3c8e721b54daeeddf2047b7f809f57c63db98dc95
      SOURCE_COMMIT: 45f5d906f26763a3632c4631e62f682308bd5971
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-validator-recovery-${{ github.run_id }}

      - name: Reconcile canonical Terraform without replacement
        run: |
          set -euo pipefail
          bash scripts/junca_public_testnet_foundation.sh foundation-plan
          jq -e '
            ([.resource_changes[]? | select(.change.actions | index("delete"))] | length) == 0
          ' artifacts/foundation-plan.json
          bash scripts/junca_public_testnet_foundation.sh foundation-apply

      - name: Recover exact validator set and require healthy RPC
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t instances < <(jq -r '.validator_instance_ids.value[]' artifacts/foundation-outputs.json)
          test "${#instances[@]}" = 3
          printf '%s\n' "${instances[@]}" > artifacts/validator-instance-ids.txt
          jq -n '{commands: [
            "set -euo pipefail",
            "grep -q '^AWS_REGION=' /etc/junca/runtime.env || printf '\''AWS_REGION=us-east-1\\nAWS_DEFAULT_REGION=us-east-1\\n'\'' >> /etc/junca/runtime.env",
            "systemctl daemon-reload",
            "timeout 20s systemctl stop junca-validator.service || systemctl kill --kill-who=all --signal=KILL junca-validator.service || true",
            "systemctl reset-failed junca-validator.service || true",
            "systemctl start --no-block junca-validator.service",
            "for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health && exit 0; sleep 2; done; journalctl -u junca-validator.service --no-pager -n 100; exit 1"
          ]}' > artifacts/ssm-recovery.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file://artifacts/ssm-recovery.json \
            --comment "JUNCA Public Testnet Runtime Recovery" \
            --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" || true
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/recovery-${instance}.json"
            jq -e '.Status == "Success"' "artifacts/recovery-${instance}.json"
          done

      - name: Drive real three-validator finalization
        run: |
          set -euo pipefail
          mapfile -t instances < artifacts/validator-instance-ids.txt
          jq -n '{commands: [
            "set -euo pipefail",
            "curl -fsS -H Content-Type:application/json --data '\''{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"junca_broadcastVote\",\"params\":[]}'\'' http://127.0.0.1:8545/"
          ]}' > artifacts/ssm-broadcast.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file://artifacts/ssm-broadcast.json \
            --comment "JUNCA Public Testnet Runtime Acceptance" \
            --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" || true
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/broadcast-${instance}.json"
            jq -e '.Status == "Success"' "artifacts/broadcast-${instance}.json"
            jq -er .StandardOutputContent "artifacts/broadcast-${instance}.json" \
              > "artifacts/broadcast-result-${instance}.json"
            jq -e '.error == null and .result.status == "BROADCAST" and .result.height >= 1' \
              "artifacts/broadcast-result-${instance}.json"
          done
          jq -s -e 'length == 3 and (map(.result.height) | unique | length) == 1' \
            artifacts/broadcast-result-i-*.json

      - name: Public Testnet Runtime Acceptance
        run: |
          set -euo pipefail
          mapfile -t instances < artifacts/validator-instance-ids.txt
          health_poll='for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8545/health > /tmp/junca-health.json && jq -e '"'"'.head_height >= 1 and (.consensus.last_certificate_hash | type) == "string"'"'"' /tmp/junca-health.json >/dev/null && cat /tmp/junca-health.json && exit 0; sleep 2; done; exit 1'
          jq -n --arg command "$health_poll" '{commands: [$command]}' > artifacts/ssm-health.json
          command_id="$(aws ssm send-command \
            --instance-ids "${instances[@]}" \
            --document-name AWS-RunShellScript \
            --parameters file://artifacts/ssm-health.json \
            --comment "JUNCA Public Testnet Runtime Readback" \
            --query Command.CommandId --output text)"
          for instance in "${instances[@]}"; do
            aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" || true
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              > "artifacts/health-command-${instance}.json"
            jq -e '.Status == "Success"' "artifacts/health-command-${instance}.json"
            jq -er .StandardOutputContent "artifacts/health-command-${instance}.json" \
              > "artifacts/health-${instance}.json"
          done
          jq -s -e '
            length == 3 and
            (map(.status) | unique) == ["healthy"] and
            (map(.head_height) | min) >= 1 and
            (map(.head_height) | unique | length) == 1 and
            (map(.head_hash) | unique | length) == 1 and
            (map(.consensus.last_certificate_hash) | unique | length) == 1 and
            (map(.consensus.last_certificate | tojson) | unique | length) == 1 and
            all(.consensus.last_certificate.finality_status == "FINALIZED") and
            all(.consensus.last_certificate.signed_power == 3) and
            all(.consensus.last_certificate.total_power == 3) and
            all(.consensus.last_certificate.validator_ids == ["validator-01","validator-02","validator-03"]) and
            all(.consensus.authenticated_vote_count == 3) and
            all(.consensus.required_vote_count == 3) and
            all(.private_key_material_accepted == false) and
            all(.mainnet_changed == false) and
            all(.assets_moved == false) and
            all(.bridge_activated == false)
          ' artifacts/health-i-*.json
          jq -s '{
            schema_version: "junca-public-testnet-runtime-acceptance/v1",
            result: "PASS",
            validators: .,
            mainnet_changed: false,
            assets_moved: false,
            bridge_activated: false
          }' artifacts/health-i-*.json > artifacts/public-testnet-runtime-acceptance.json
          sha256sum artifacts/public-testnet-runtime-acceptance.json \
            > artifacts/public-testnet-runtime-acceptance.json.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junca-validator-runtime-recovery-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
