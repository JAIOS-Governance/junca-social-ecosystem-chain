name: Chain Official Permission Recovery Trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chain-official-permission-recovery-trigger.yml"
  workflow_dispatch:

permissions:
  id-token: write
  actions: write
  contents: read

concurrency:
  group: chain-official-permission-recovery-trigger
  cancel-in-progress: false

jobs:
  recover-and-dispatch:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 20
    env:
      AWS_ACCOUNT_ID: "595710543956"
      AWS_REGION: us-east-1
      TARGET_ROLE_NAME: JuncaChainPublicTestnetDeployment
      TARGET_POLICY_NAME: ChainOfficialDistributionUpdate
      TARGET_RESOURCE: arn:aws:cloudfront::595710543956:distribution/E19R4RMVAZRYHJ
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -Eeuo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json" >/tmp/oidc-token
          test -s /tmp/oidc-token

      - name: Install and verify exact Chain distribution permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=''
          for role in \
            arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment \
            arn:aws:iam::595710543956:role/JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
          do
            if aws sts assume-role-with-web-identity \
              --role-arn "$role" \
              --role-session-name "chain-official-recovery-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/oidc-token)" \
              --duration-seconds 1200 >/tmp/assume.json 2>/tmp/assume.err; then
              selected="$role"
              export AWS_ACCESS_KEY_ID="$(jq -r '.Credentials.AccessKeyId' /tmp/assume.json)"
              export AWS_SECRET_ACCESS_KEY="$(jq -r '.Credentials.SecretAccessKey' /tmp/assume.json)"
              export AWS_SESSION_TOKEN="$(jq -r '.Credentials.SessionToken' /tmp/assume.json)"
              break
            fi
          done
          test -n "$selected"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          cat >/tmp/policy.json <<JSON
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Sid":"ChainOfficialDistributionUpdate",
              "Effect":"Allow",
              "Action":[
                "cloudfront:UpdateDistribution",
                "cloudfront:CreateInvalidation"
              ],
              "Resource":"${TARGET_RESOURCE}"
            }]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" \
            --policy-document file:///tmp/policy.json
          aws iam get-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" >/tmp/readback.json
          jq -e \
            --arg resource "$TARGET_RESOURCE" \
            '.PolicyDocument.Version=="2012-10-17" and
             (.PolicyDocument.Statement|length)==1 and
             .PolicyDocument.Statement[0].Sid=="ChainOfficialDistributionUpdate" and
             .PolicyDocument.Statement[0].Effect=="Allow" and
             (.PolicyDocument.Statement[0].Action|type)=="array" and
             (.PolicyDocument.Statement[0].Action|length)==2 and
             (.PolicyDocument.Statement[0].Action|sort)==(["cloudfront:CreateInvalidation","cloudfront:UpdateDistribution"]|sort) and
             .PolicyDocument.Statement[0].Resource==$resource and
             (.PolicyDocument.Statement[0]|has("Condition")|not)' /tmp/readback.json
          {
            echo '### Exact Chain permission recovery'
            echo "- Bootstrap identity: ${selected}"
            echo "- Target role: ${TARGET_ROLE_NAME}"
            echo '- Actions: cloudfront:UpdateDistribution, cloudfront:CreateInvalidation'
            echo "- Resource: ${TARGET_RESOURCE}"
            echo '- Exact readback: PASS'
            echo '- Broad IAM grant: false'
            echo '- Mainnet Changed: false'
            echo '- Assets Moved: false'
            echo '- Bridge Activated: false'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Dispatch Chain-only final production acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          status="$(curl --fail-with-body --silent --show-error \
            -o /tmp/dispatch-response.txt \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/official-chain-final-acceptance.yml/dispatches" \
            --data '{"ref":"main"}')"
          test "$status" = '204'

