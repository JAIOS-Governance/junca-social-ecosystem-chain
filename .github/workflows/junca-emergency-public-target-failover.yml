name: JUNCA Emergency Public Target Failover
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: junca-public-testnet-aws-foundation
  cancel-in-progress: false
jobs:
  failover:
    runs-on: ubuntu-24.04
    environment: public-testnet
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
          aws-region: us-east-1
          role-session-name: junca-public-failover-${{ github.run_id }}
      - name: Route public readback to certified target
        run: |
          set -euo pipefail
          explorer='arn:aws:elasticloadbalancing:us-east-1:595710543956:targetgroup/junca-testnet-explorer/6be62899db298ed0'
          rpc='arn:aws:elasticloadbalancing:us-east-1:595710543956:targetgroup/junca-testnet-rpc/f73d122c59c17130'
          aws elbv2 deregister-targets --target-group-arn "$explorer" --targets Id=i-055763640261c47df,Port=3000 Id=i-054811d49cce9017b,Port=3000
          aws elbv2 deregister-targets --target-group-arn "$rpc" --targets Id=i-055763640261c47df,Port=8546 Id=i-054811d49cce9017b,Port=8546
          aws elbv2 wait target-deregistered --target-group-arn "$explorer" --targets Id=i-055763640261c47df,Port=3000 Id=i-054811d49cce9017b,Port=3000
          aws elbv2 wait target-deregistered --target-group-arn "$rpc" --targets Id=i-055763640261c47df,Port=8546 Id=i-054811d49cce9017b,Port=8546
          aws elbv2 describe-target-health --target-group-arn "$explorer"
          aws elbv2 describe-target-health --target-group-arn "$rpc"
      - name: Verify production recovery
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            x="$(curl -sS -o /tmp/x -w '%{http_code}' https://explorer.jaios-governance.org/explorer.json || true)"; h="$(curl -sS -o /tmp/h -w '%{http_code}' https://health.jaios-governance.org/health || true)"; r="$(curl -sS -o /tmp/r -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' https://rpc.jaios-governance.org/ || true)"
            if [[ "$x" == 200 && "$h" == 200 && "$r" == 200 ]]; then jq -e '.status=="ready" and .head.signed_power==3 and .mainnet_changed==false and .assets_moved==false and .bridge_activated==false' /tmp/x; jq -e '.status=="healthy" and .consensus.last_certificate.signed_power==3' /tmp/h; jq -e '.result=="0x1352f63"' /tmp/r; exit 0; fi
            test "$attempt" -lt 60; sleep 5
          done
