name: JUNCA POINT MEMBER Domain IAM Recovery 20260726

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junca-point-member-domain-iam-recovery
  cancel-in-progress: false

jobs:
  set-standard-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set AWS-compatible standard GitHub OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location --request PUT --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10" "$endpoint" --data '{"use_default":true}'

  publish-member-domain:
    needs: set-standard-oidc
    runs-on: ubuntu-latest
    environment: public-testnet
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      BOOTSTRAP_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainPublicTestnetDeployment
      DOCS_ROLE_NAME: JuncaChainDocsProductionDeployment
      HOSTED_ZONE_ID: Z0336017285464TX0NT1G
    steps:
      - name: Configure canonical AWS bootstrap identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-member-domain-recovery-${{ github.run_id }}
          disable-retry: true

      - name: Verify exact AWS boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$(aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" --query HostedZone.Name --output text)" = "jaios-governance.org."

      - name: Apply minimum member-domain IAM policy
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/member-domain-policy.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"MemberCustomDomainDnsWrite",
                "Effect":"Allow",
                "Action":"route53:ChangeResourceRecordSets",
                "Resource":"arn:aws:route53:::hostedzone/Z0336017285464TX0NT1G",
                "Condition":{
                  "ForAllValues:StringEquals":{
                    "route53:ChangeResourceRecordSetsNormalizedRecordNames":["member.jaios-governance.org","_openai-site-verification.member.jaios-governance.org","_cf-custom-hostname.member.jaios-governance.org"],
                    "route53:ChangeResourceRecordSetsRecordTypes":["CNAME","TXT"],
                    "route53:ChangeResourceRecordSetsActions":["UPSERT"]
                  },
                  "Null":{
                    "route53:ChangeResourceRecordSetsNormalizedRecordNames":"false",
                    "route53:ChangeResourceRecordSetsRecordTypes":"false",
                    "route53:ChangeResourceRecordSetsActions":"false"
                  }
                }
              },
              {"Sid":"Route53ChangeReadback","Effect":"Allow","Action":"route53:GetChange","Resource":"arn:aws:route53:::change/*"}
            ]
          }
          JSON
          aws iam put-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name JuncaPointMemberCustomDomainDns --policy-document file:///tmp/member-domain-policy.json
          aws iam get-role-policy --role-name "$DOCS_ROLE_NAME" --policy-name JuncaPointMemberCustomDomainDns >/tmp/iam-readback.json

      - name: Apply Sites-issued member records
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/change.json <<'JSON'
          {"Comment":"CEO-authorized JUNCA POINT MEMBER Sites custom-domain publication","Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"member.jaios-governance.org.","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"custom-domains.chatgpt.site."}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_openai-site-verification.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"openai-site-verification=5HgL7ZV4WE4kuhT9OKEJZ4anM4cXQgaX4PcQrAyflGE\""}]}},{"Action":"UPSERT","ResourceRecordSet":{"Name":"_cf-custom-hostname.member.jaios-governance.org.","Type":"TXT","TTL":300,"ResourceRecords":[{"Value":"\"5747a89e-d114-42d8-b33b-b4eaae61c958\""}]}}]}
          JSON
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/change.json --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "$change_id"
          test "$(aws route53 get-change --id "$change_id" --query ChangeInfo.Status --output text)" = "INSYNC"
          echo "change_id=$change_id" >>"$GITHUB_OUTPUT"

      - name: Read back exact DNS state
        shell: bash
        run: |
          set -euo pipefail
          records="$(aws route53 list-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --query "ResourceRecordSets[?Name=='member.jaios-governance.org.' || Name=='_openai-site-verification.member.jaios-governance.org.' || Name=='_cf-custom-hostname.member.jaios-governance.org.']" --output json)"
          RECORDS="$records" python3 - <<'PY'
          import json, os
          rows={r['Name']:r for r in json.loads(os.environ['RECORDS'])}
          assert rows['member.jaios-governance.org.']['ResourceRecords'][0]['Value']=='custom-domains.chatgpt.site.'
          assert 'openai-site-verification=5HgL7ZV4WE4kuhT9OKEJZ4anM4cXQgaX4PcQrAyflGE' in rows['_openai-site-verification.member.jaios-governance.org.']['ResourceRecords'][0]['Value']
          assert '5747a89e-d114-42d8-b33b-b4eaae61c958' in rows['_cf-custom-hostname.member.jaios-governance.org.']['ResourceRecords'][0]['Value']
          PY
          {
            echo "### JUNCA POINT MEMBER main-domain publication"
            echo "- URL: https://member.jaios-governance.org/"
            echo "- Route 53 Change: ${{ steps.dns.outputs.change_id }}"
            echo "- Route 53 Status: INSYNC"
            echo "- DNS Readback: PASS"
            echo "- Existing Sites project and restricted access preserved"
          } >>"$GITHUB_STEP_SUMMARY"

  restore-canonical-oidc:
    if: always()
    needs: [set-standard-oidc, publish-member-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore canonical repository context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          curl --silent --show-error --fail-with-body --location --request PUT --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10" "$endpoint" --data '{"use_default":false,"include_claim_keys":["repo","context"],"use_immutable_subject":false}'
