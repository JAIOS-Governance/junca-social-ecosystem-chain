name: JUNCA Public Testnet OIDC Trust Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/public-testnet-oidc-trust-recovery-20260726
    paths:
      - .github/workflows/junca-public-testnet-oidc-trust-recovery.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: junca-public-testnet-oidc-trust-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    environment: junca-chain-docs-production
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      RECOVERY_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      OIDC_PROVIDER_ARN: arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com
      REQUIRED_SUBJECT: repo:JAIOS-Governance@308604370/junca-social-ecosystem-chain@1310568313:environment:public-testnet
    steps:
      - uses: actions/checkout@v4

      - name: Configure verified recovery role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.RECOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: public-testnet-trust-recovery-${{ github.run_id }}
          disable-retry: true

      - name: Verify canonical AWS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test "$OIDC_PROVIDER_ARN" = "arn:aws:iam::595710543956:oidc-provider/token.actions.githubusercontent.com"

      - name: Preserve and repair Public Testnet trust policies
        shell: bash
        run: |
          set -euo pipefail
          roles=(
            JUNCA-Social-Ecosystem-Chain-Testnet-Deployment
            JuncaChainPublicTestnetDeployment
          )
          for role in "${roles[@]}"; do
            aws iam get-role --role-name "$role" --query 'Role.AssumeRolePolicyDocument' --output json > "/tmp/${role}.before.json"
            ROLE="$role" OIDC_PROVIDER_ARN="$OIDC_PROVIDER_ARN" REQUIRED_SUBJECT="$REQUIRED_SUBJECT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          role = os.environ["ROLE"]
          provider = os.environ["OIDC_PROVIDER_ARN"]
          subject = os.environ["REQUIRED_SUBJECT"]
          before = Path(f"/tmp/{role}.before.json")
          policy = json.loads(before.read_text(encoding="utf-8"))
          statements = policy.get("Statement", [])
          if isinstance(statements, dict):
              statements = [statements]
          sid = "GitHubActionsPublicTestnetOIDC"
          replacement = {
              "Sid": sid,
              "Effect": "Allow",
              "Principal": {"Federated": provider},
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                  "StringEquals": {
                      "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                      "token.actions.githubusercontent.com:sub": subject,
                  }
              },
          }
          statements = [s for s in statements if s.get("Sid") != sid]
          statements.append(replacement)
          policy["Statement"] = statements
          Path(f"/tmp/{role}.after.json").write_text(
              json.dumps(policy, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            aws iam update-assume-role-policy --role-name "$role" --policy-document "file:///tmp/${role}.after.json"
            aws iam get-role --role-name "$role" --query 'Role.AssumeRolePolicyDocument' --output json > "/tmp/${role}.readback.json"
            ROLE="$role" REQUIRED_SUBJECT="$REQUIRED_SUBJECT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          role = os.environ["ROLE"]
          subject = os.environ["REQUIRED_SUBJECT"]
          policy = json.loads(Path(f"/tmp/{role}.readback.json").read_text(encoding="utf-8"))
          statements = policy.get("Statement", [])
          if isinstance(statements, dict):
              statements = [statements]
          matches = [s for s in statements if s.get("Sid") == "GitHubActionsPublicTestnetOIDC"]
          assert len(matches) == 1
          statement = matches[0]
          assert statement["Effect"] == "Allow"
          assert statement["Action"] == "sts:AssumeRoleWithWebIdentity"
          conditions = statement["Condition"]["StringEquals"]
          assert conditions["token.actions.githubusercontent.com:aud"] == "sts.amazonaws.com"
          assert conditions["token.actions.githubusercontent.com:sub"] == subject
          PY
          done

      - name: Verify exact public-testnet OIDC assumption
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")"
          actual_subject="$(TOKEN="$token" python3 - <<'PY'
          import base64
          import json
          import os
          segment = os.environ["TOKEN"].split(".")[1]
          segment += "=" * (-len(segment) % 4)
          print(json.loads(base64.urlsafe_b64decode(segment))["sub"])
          PY
          )"
          test "$actual_subject" = "$REQUIRED_SUBJECT"
          for role in JUNCA-Social-Ecosystem-Chain-Testnet-Deployment JuncaChainPublicTestnetDeployment; do
            aws sts assume-role-with-web-identity               --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${role}"               --role-session-name "public-testnet-trust-verify-${GITHUB_RUN_ID}"               --web-identity-token "$token"               --duration-seconds 900               --query 'SubjectFromWebIdentityToken'               --output text | grep -Fx "$REQUIRED_SUBJECT"
          done

      - name: Record non-secret recovery summary
        shell: bash
        run: |
          {
            echo "### JUNCA Public Testnet OIDC Trust Recovery"
            echo "- AWS Account: $AWS_ACCOUNT_ID"
            echo "- Region: $AWS_REGION"
            echo "- Recovery Role: $RECOVERY_ROLE_ARN"
            echo "- OIDC Provider: $OIDC_PROVIDER_ARN"
            echo "- Subject: $REQUIRED_SUBJECT"
            echo "- Target Roles: 2"
            echo "- Trust Readback: PASS"
            echo "- AssumeRoleWithWebIdentity: 2/2 PASS"
            echo "- Mainnet Changed=false"
            echo "- Assets Moved=false"
            echo "- Bridge Activated=false"
            echo "- AWS Infrastructure Apply Executed=false"
          } >> "$GITHUB_STEP_SUMMARY"
