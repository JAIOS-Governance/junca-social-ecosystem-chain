name: JUNCA POINT MEMBER Migration Key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/junca-point-member-migration-key.yml"

permissions:
  contents: write
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: junca-chain-docs-production
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "595710543956"
      DEPLOYMENT_ROLE_ARN: arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment
      DEPLOYMENT_ROLE_NAME: JuncaChainDocsProductionDeployment
      BOOTSTRAP_ROLE_NAME: JuncaPointMemberMigrationBootstrap
      BOOTSTRAP_FUNCTION_NAME: junca-point-member-migration-bootstrap
      KEY_ALIAS: alias/junca-point-member-migration
      PUBLIC_KEY_PATH: infra/aws/member-portal/migration-public-key.pem
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure canonical AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: junca-member-key-${{ github.run_id }}

      - name: Verify exact AWS account
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Build scoped migration policy
        shell: bash
        run: |
          set -euo pipefail
          cat > member-migration-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "KmsDiscovery",
                "Effect": "Allow",
                "Action": ["kms:ListAliases", "kms:CreateKey"],
                "Resource": "*"
              },
              {
                "Sid": "KmsMemberBundle",
                "Effect": "Allow",
                "Action": [
                  "kms:CreateAlias",
                  "kms:DescribeKey",
                  "kms:GetPublicKey",
                  "kms:Decrypt",
                  "kms:TagResource"
                ],
                "Resource": [
                  "arn:aws:kms:us-east-1:595710543956:key/*",
                  "arn:aws:kms:us-east-1:595710543956:alias/junca-point-member-migration"
                ]
              },
              {
                "Sid": "MemberContainerRegistry",
                "Effect": "Allow",
                "Action": [
                  "ecr:BatchCheckLayerAvailability",
                  "ecr:CompleteLayerUpload",
                  "ecr:CreateRepository",
                  "ecr:DescribeImages",
                  "ecr:DescribeRepositories",
                  "ecr:GetAuthorizationToken",
                  "ecr:GetDownloadUrlForLayer",
                  "ecr:InitiateLayerUpload",
                  "ecr:PutImage",
                  "ecr:PutLifecyclePolicy",
                  "ecr:UploadLayerPart"
                ],
                "Resource": "*"
              },
              {
                "Sid": "MemberInfrastructure",
                "Effect": "Allow",
                "Action": [
                  "acm:AddTagsToCertificate",
                  "acm:DescribeCertificate",
                  "acm:ListCertificates",
                  "acm:RequestCertificate",
                  "cloudformation:CreateChangeSet",
                  "cloudformation:CreateStack",
                  "cloudformation:DeleteChangeSet",
                  "cloudformation:DescribeChangeSet",
                  "cloudformation:DescribeStackEvents",
                  "cloudformation:DescribeStacks",
                  "cloudformation:ExecuteChangeSet",
                  "cloudformation:GetTemplate",
                  "cloudformation:UpdateStack",
                  "cloudfront:CreateDistribution",
                  "cloudfront:GetDistribution",
                  "cloudfront:GetDistributionConfig",
                  "cloudfront:TagResource",
                  "cloudfront:UpdateDistribution",
                  "cloudwatch:PutMetricAlarm",
                  "dynamodb:CreateTable",
                  "dynamodb:DescribeTable",
                  "dynamodb:TagResource",
                  "dynamodb:UpdateTimeToLive",
                  "lambda:AddPermission",
                  "lambda:CreateFunction",
                  "lambda:CreateFunctionUrlConfig",
                  "lambda:DeleteFunction",
                  "lambda:DeleteFunctionUrlConfig",
                  "lambda:GetFunction",
                  "lambda:GetFunctionUrlConfig",
                  "lambda:GetFunctionConfiguration",
                  "lambda:InvokeFunction",
                  "lambda:TagResource",
                  "lambda:UpdateFunctionCode",
                  "lambda:UpdateFunctionConfiguration",
                  "logs:CreateLogGroup",
                  "logs:DescribeLogGroups",
                  "route53:ChangeResourceRecordSets",
                  "route53:GetChange",
                  "route53:ListResourceRecordSets",
                  "secretsmanager:CreateSecret",
                  "secretsmanager:DescribeSecret",
                  "secretsmanager:GetSecretValue",
                  "secretsmanager:PutSecretValue",
                  "secretsmanager:TagResource"
                ],
                "Resource": "*"
              },
              {
                "Sid": "MemberExecutionRoles",
                "Effect": "Allow",
                "Action": [
                  "iam:CreateRole",
                  "iam:DeleteRole",
                  "iam:DeleteRolePolicy",
                  "iam:GetRole",
                  "iam:GetRolePolicy",
                  "iam:PassRole",
                  "iam:PutRolePolicy",
                  "iam:TagRole"
                ],
                "Resource": [
                  "arn:aws:iam::595710543956:role/JuncaPointMember*",
                  "arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment"
                ]
              }
            ]
          }
          JSON
          python3 -m json.tool member-migration-policy.json >/dev/null

      - name: Apply policy through one-time child role
        shell: bash
        run: |
          set -euo pipefail
          cat > bootstrap-trust.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}
          JSON
          if ! aws iam get-role --role-name "$BOOTSTRAP_ROLE_NAME" >/dev/null 2>&1; then
            aws iam create-role \
              --role-name "$BOOTSTRAP_ROLE_NAME" \
              --assume-role-policy-document file://bootstrap-trust.json \
              >/dev/null
          fi
          cat > bootstrap-policy.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Effect":"Allow",
                "Action":"iam:PutRolePolicy",
                "Resource":"arn:aws:iam::595710543956:role/JuncaChainDocsProductionDeployment"
              },
              {
                "Effect":"Allow",
                "Action":["logs:CreateLogGroup","logs:CreateLogStream","logs:PutLogEvents"],
                "Resource":"arn:aws:logs:us-east-1:595710543956:*"
              }
            ]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$BOOTSTRAP_ROLE_NAME" \
            --policy-name OneTimeMemberMigrationBootstrap \
            --policy-document file://bootstrap-policy.json

          mkdir -p bootstrap-package
          cp member-migration-policy.json bootstrap-package/member-migration-policy.json
          cat > bootstrap-package/lambda_function.py <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import boto3

          def lambda_handler(event, context):
              body = json.loads((event or {}).get("body") or "{}")
              expected = os.environ["BOOTSTRAP_TOKEN_HASH"]
              supplied = str(body.get("token") or "")
              if not hmac.compare_digest(hashlib.sha256(supplied.encode()).hexdigest(), expected):
                  return {"statusCode": 403, "body": json.dumps({"ok": False})}
              with open("member-migration-policy.json", encoding="utf-8") as handle:
                  policy = handle.read()
              boto3.client("iam").put_role_policy(
                  RoleName="JuncaChainDocsProductionDeployment",
                  PolicyName="JuncaPointMemberMigrationDeployment",
                  PolicyDocument=policy,
              )
              return {
                  "statusCode": 200,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps({"ok": True}),
              }
          PY
          (cd bootstrap-package && zip -q ../bootstrap.zip lambda_function.py member-migration-policy.json)
          bootstrap_token="$(openssl rand -hex 32)"
          bootstrap_token_hash="$(printf '%s' "$bootstrap_token" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$bootstrap_token"
          role_arn="$(aws iam get-role --role-name "$BOOTSTRAP_ROLE_NAME" --query Role.Arn --output text)"
          for attempt in 1 2 3 4 5 6; do
            if aws lambda get-function --function-name "$BOOTSTRAP_FUNCTION_NAME" >/dev/null 2>&1; then
              aws lambda update-function-code \
                --function-name "$BOOTSTRAP_FUNCTION_NAME" \
                --zip-file fileb://bootstrap.zip >/dev/null
              aws lambda wait function-updated --function-name "$BOOTSTRAP_FUNCTION_NAME"
              aws lambda update-function-configuration \
                --function-name "$BOOTSTRAP_FUNCTION_NAME" \
                --runtime python3.12 \
                --handler lambda_function.lambda_handler \
                --role "$role_arn" \
                --timeout 30 \
                --environment "Variables={BOOTSTRAP_TOKEN_HASH=$bootstrap_token_hash}" >/dev/null
              break
            fi
            if aws lambda create-function \
              --function-name "$BOOTSTRAP_FUNCTION_NAME" \
              --runtime python3.12 \
              --handler lambda_function.lambda_handler \
              --role "$role_arn" \
              --zip-file fileb://bootstrap.zip \
              --timeout 30 \
              --environment "Variables={BOOTSTRAP_TOKEN_HASH=$bootstrap_token_hash}" >/dev/null 2>create-error.txt; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              cat create-error.txt
              exit 1
            fi
            sleep 5
          done
          aws lambda wait function-active-v2 --function-name "$BOOTSTRAP_FUNCTION_NAME"
          if ! aws lambda get-function-url-config --function-name "$BOOTSTRAP_FUNCTION_NAME" > bootstrap-url.json 2>/dev/null; then
            aws lambda create-function-url-config \
              --function-name "$BOOTSTRAP_FUNCTION_NAME" \
              --auth-type NONE > bootstrap-url.json
          fi
          aws lambda add-permission \
            --function-name "$BOOTSTRAP_FUNCTION_NAME" \
            --statement-id MigrationBootstrapFunctionUrl \
            --action lambda:InvokeFunctionUrl \
            --principal '*' \
            --function-url-auth-type NONE >/dev/null 2>&1 || true
          aws lambda add-permission \
            --function-name "$BOOTSTRAP_FUNCTION_NAME" \
            --statement-id MigrationBootstrapInvoke \
            --action lambda:InvokeFunction \
            --principal '*' \
            --invoked-via-function-url >/dev/null 2>&1 || true
          bootstrap_url="$(jq -r .FunctionUrl bootstrap-url.json)"
          curl --silent --show-error --fail-with-body \
            --header "content-type: application/json" \
            --data "{\"token\":\"$bootstrap_token\"}" \
            "$bootstrap_url" > bootstrap-output.json
          test "$(jq -r .ok bootstrap-output.json)" = "true"
          unset bootstrap_token

      - name: Verify scoped policy and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if aws iam get-role-policy \
              --role-name "$DEPLOYMENT_ROLE_NAME" \
              --policy-name JuncaPointMemberMigrationDeployment >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "Scoped migration policy readback failed."
              exit 1
            fi
            sleep 5
          done
          aws lambda delete-function --function-name "$BOOTSTRAP_FUNCTION_NAME"
          aws iam delete-role-policy \
            --role-name "$BOOTSTRAP_ROLE_NAME" \
            --policy-name OneTimeMemberMigrationBootstrap
          aws iam delete-role --role-name "$BOOTSTRAP_ROLE_NAME"

      - name: Create or read migration encryption key
        shell: bash
        run: |
          set -euo pipefail
          key_id="$(aws kms list-aliases \
            --query "Aliases[?AliasName=='${KEY_ALIAS}'].TargetKeyId | [0]" \
            --output text)"
          if [ -z "$key_id" ] || [ "$key_id" = "None" ]; then
            key_id="$(aws kms create-key \
              --description "JUNCA POINT MEMBER encrypted deployment bundle" \
              --key-usage ENCRYPT_DECRYPT \
              --customer-master-key-spec RSA_4096 \
              --origin AWS_KMS \
              --tags TagKey=Project,TagValue=JUNCA-POINT-MEMBER TagKey=Purpose,TagValue=Migration \
              --query KeyMetadata.KeyId \
              --output text)"
            aws kms create-alias --alias-name "$KEY_ALIAS" --target-key-id "$key_id"
          fi
          test "$(aws kms describe-key --key-id "$key_id" --query KeyMetadata.KeySpec --output text)" = "RSA_4096"
          test "$(aws kms describe-key --key-id "$key_id" --query KeyMetadata.KeyUsage --output text)" = "ENCRYPT_DECRYPT"
          echo "KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Export public encryption key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PUBLIC_KEY_PATH")"
          aws kms get-public-key \
            --key-id "$KEY_ID" \
            --query PublicKey \
            --output text |
            base64 --decode > public-key.der
          openssl pkey -pubin -inform DER -in public-key.der -out "$PUBLIC_KEY_PATH"
          openssl pkey -pubin -in "$PUBLIC_KEY_PATH" -text -noout | grep -q "4096 bit"

      - name: Publish public key for encrypted deployments
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$PUBLIC_KEY_PATH" && git ls-files --error-unmatch "$PUBLIC_KEY_PATH" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "JUNCA Deployment Automation"
          git config user.email "desk@junca-global.group"
          git add "$PUBLIC_KEY_PATH"
          git commit -m "Add member portal migration public key"
          git push origin HEAD:main

      - name: Record result
        shell: bash
        run: |
          {
            echo "### JUNCA POINT MEMBER migration key"
            echo "- AWS account: $AWS_ACCOUNT_ID"
            echo "- Alias: $KEY_ALIAS"
            echo "- Public key: $PUBLIC_KEY_PATH"
            echo "- One-time bootstrap role: removed"
            echo "- Private key export: impossible by AWS KMS design"
          } >> "$GITHUB_STEP_SUMMARY"
